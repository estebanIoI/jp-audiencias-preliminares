<script type="application/json" id="contenido">{"lesson": 2, "heading": "Lección 2. Finalidad, principios y garantías que orientan las audiencias preliminares", "scenes": [{"section": 1, "part": 1, "variant": "focus", "object": "balanza", "cards": [{"label": "Las audiencias preliminares corresponden a escenarios procesales", "text": "Las audiencias preliminares corresponden a escenarios procesales propios del sistema penal acusatorio en los que se someten a consideración del juez determinadas actuaciones y decisiones que, por su naturaleza o incidencia en los derechos de los sujetos procesales, requieren intervención judicial."}, {"label": "De esta manera, como expresión concreta de", "text": "De esta manera, como expresión concreta de la función de garantía atribuida al JCG, constituyen un mecanismo fundamental para articular las necesidades propias de la investigación penal con el respeto de las garantías constitucionales, asegurando que las actuaciones de los sujetos procesales se desarrollen dentro de los límites establecidos por la CN y la ley. La función jurisdiccional, exclusiva de los jueces de la República, debe estar guiada por los principios constitucionales que, bajo ciertas generalidades, regulan la administración de justicia."}, {"label": "Las actuaciones ante jueces con función de", "text": "Las actuaciones ante jueces con función de control de garantía, propias de la Ley 906 de 2004, no son la excepción: resulta de vital importancia que el fiscal, al momento de someter sus actuaciones al control judicial, ejerza un examen perspicaz en torno a estos mandatos superiores. Por consiguiente, el fiscal debe encontrarse en la capacidad de explicar, por ejemplo, la legalidad (en sentido amplio) y la proporcionalidad del acto investigativo, con miras a que el juez pueda conceder la respectiva autorización."}, {"label": "En consecuencia, el desarrollo de las audiencias", "text": "En consecuencia, el desarrollo de las audiencias preliminares se encuentra sujeto a un conjunto de principios y garantías que delimitan el ejercicio de las facultades de los sujetos procesales y orientan la actuación del JCG. En este marco, además de aludir a principios derivados del orden constitucional de necesaria aplicación (legalidad, el debido proceso, la dignidad humana, entre otros), es pertinente señalar cuatro principios constitucionales que, para efectos de limitar la facultad de intervención punitiva del Estado (garantías), resultan de especial relevancia."}], "case": false}, {"section": 1, "part": 2, "variant": "focus", "object": "balanza", "cards": [{"label": "El precedente de la Sentencia C-1092 de", "text": "El precedente de la Sentencia C-1092 de 2003 (Corte Constitucional, 2003), reiterado en el precedente C-591 de 2005 (Corte Constitucional, 2005), los aborda de la siguiente forma:"}], "case": false}, {"section": 2, "part": 1, "variant": "grid", "object": "escudo", "cards": [{"label": "Presunción de inocencia:", "text": "1. Presunción de inocencia: Se exige al ente acusador que cuente con los suficientes elementos materiales de prueba que soporten la existencia de una sospecha razonable inicial, a fin de dar inicio a una indagación previa, así como que pueda desvirtuar esta presunción atendiendo al estándar probatorio de más allá de toda duda. 2. Principio de no autoincriminación:"}, {"label": "Es una garantía procesal que impide que", "text": "Es una garantía procesal que impide que una persona esté obligada a declarar contra sí misma o a proporcionar medios de pruebas que le perjudiquen, la cual implica el derecho a guardar silencio, sin que ello signifique una prueba en su contra. Puntualmente, se tiene que, desde la indagación, el ciudadano debe ser informado de esta garantía y, en especial, al momento de la captura, con el fin de que decida si renuncia o hace uso de ella o renuncia y colabora con la administración de justicia."}, {"label": "Como se verá adelante, en otros casos,", "text": "Como se verá adelante, en otros casos, la ley exige la asistencia de un defensor de confianza o de un defensor público [Sentencias C-591/05 (Corte Constitucional, 2005) y C-210/07 (Corte Constitucional, 2007)]. 3. Principio de celeridad: El sistema de administración de justicia debe producir decisiones prontas, sin dilaciones injustificadas. De lo contrario, la falta de definición de situaciones jurídicas resulta en un “acto injusto” (Consejo Superior de la Judicatura, 2008, p. 26)."}], "case": false}, {"section": 3, "part": 1, "variant": "flow", "object": "balanza", "cards": [{"label": "Principio de Proporcionalidad:", "text": "4. Principio de Proporcionalidad: Orienta la ponderación como límite a todas las afectaciones de los derechos fundamentales, teniendo en cuenta que, tanto el juez como el fiscal deben examinar si los actos de investigación adelantados, a través de los cuales se obtuvieron medios cognoscitivos, responden a los fines constitucionales que rigen el proceso penal en Colombia, de manera proporcionada."}, {"label": "Dicho examen de ponderación, a su vez, comprende tres subprincipios:", "text": "Dicho examen de ponderación, a su vez, comprende tres subprincipios: (i) idoneidad o utilidad: contribuir a la obtención de un fin constitucionalmente legítimo (hallazgo de una prueba relevante, por ejemplo); (ii) necesidad: cuando no se pueda acceder a otro medio menos gravoso que permita obtener el mismo resultado, será legítima la intervención; (iii) proporcionalidad (en estricto sentido): busca equilibrar, en sus justas medidas, aquellos intereses de rango constitucional en conflicto: de un lado, la administración de justicia y, del otro, la esfera individual del implicado."}, {"label": "Dentro de los criterios que subyacen a", "text": "Dentro de los criterios que subyacen a este juicio, se encuentran (a) las consecuencias jurídicas de las conductas investigadas, (b) la importancia de la causa que se ventila, en donde no sólo el quántum de la pena no es criterio suficiente, sino también las circunstancias del caso, la intensidad de la actuación del sospechoso, las modalidades en que se cometió el delito y la naturaleza del bien jurídico tutelado;"}, {"label": "Principio de Proporcionalidad · 4", "text": "(c) las exigencias de la política criminal propias del principio de Derecho penal mínimo, a fin de identificar si se trata de conductas que lesionan las condiciones de supervivencia social."}], "case": false}, {"section": 4, "part": 1, "variant": "tabs", "object": "documentos", "cards": [{"label": "No obstante, en cuanto a este último", "text": "No obstante, en cuanto a este último punto, merece la pena indicar que también es posible acudir a criterios para resolver un conflicto entre derechos fundamentales. Al margen del principio de proporcionalidad —método recomendado para aquellos casos en que se hace necesaria la restricción o limitación a un derecho fundamental—, existen otros dos métodos para solucionar tensiones entre bienes o valores constitucionalmente protegidos: ponderación de bienes y juicio de razonabilidad."}, {"label": "El primero, se trata de una actuación", "text": "El primero, se trata de una actuación o un procedimiento propio del intérprete, en busca de la armonización de las normas constitucionales, no tratándose así de un principio de interpretación en sentido estricto (carece de un criterio orientador para efectos de valoración)."}, {"label": "El segundo, en contraste, se relaciona con", "text": "El segundo, en contraste, se relaciona con un método intermedio entre la deducción estricta y la decisión política, y procede en aquellas ocasiones en las que resulta factible sacrificar alguna de las reglas de la racionalidad (respeto íntegro por la lógica formal), para así lograr una argumentación considerada válida en Derecho."}, {"label": "Por supuesto, existen supuestos en los que,", "text": "Por supuesto, existen supuestos en los que, con la aplicación directa de la racionalidad, es posible llegar a soluciones no deseables, manifiestamente injustas o contrarias a los valores que preserva el Derecho objetivo; eventos que pretenden ser evitados con el juicio de razonabilidad."}], "case": false}, {"section": 5, "part": 1, "variant": "case", "object": "telefono", "cards": [{"label": "Aplicación al expediente del curso En el", "text": "Aplicación al expediente del curso En el caso de Beatriz Elena Morales, la Fiscalía considera pertinente solicitar información relacionada con el número telefónico desde el cual se enviaron los mensajes. ¿Qué criterios debe valorar para justificar esta actuación? Responda a esta cuestión a través de la ventana emergente de respuesta (máximo 500 palabras). Adicionalmente, tenga presente su respuesta para efectos de contrastar su respuesta con el apartado de retroalimentación."}], "case": true}]}</script>
