<script type="application/json" id="contenido">{"lesson": 2, "heading": "Lección 2. Finalidad, principios y garantías que orientan las audiencias preliminares", "scenes": [{"section": 1, "part": 1, "variant": "focus", "object": "balanza", "case": false, "layout": "fichas", "segmentos": ["Las audiencias preliminares corresponden a escenarios procesales propios del sistema penal acusatorio en los que se someten a consideración del juez determinadas actuaciones y decisiones que, por su naturaleza o incidencia en los derechos de los sujetos procesales, requieren intervención judicial.", "De esta manera, como expresión concreta de la función de garantía atribuida al JCG, constituyen un mecanismo fundamental para articular las necesidades propias de la investigación penal con el respeto de las garantías constitucionales, asegurando que las actuaciones de los sujetos procesales se desarrollen dentro de los límites establecidos por la CN y la ley.", "La función jurisdiccional, exclusiva de los jueces de la República, debe estar guiada por los principios constitucionales que, bajo ciertas generalidades, regulan la administración de justicia.", "Las actuaciones ante jueces con función de control de garantía, propias de la Ley 906 de 2004, no son la excepción: resulta de vital importancia que el fiscal, al momento de someter sus actuaciones al control judicial, ejerza un examen perspicaz en torno a estos mandatos superiores.", "Por consiguiente, el fiscal debe encontrarse en la capacidad de explicar, por ejemplo, la legalidad (en sentido amplio) y la proporcionalidad del acto investigativo, con miras a que el juez pueda conceder la respectiva autorización.", "En consecuencia, el desarrollo de las audiencias preliminares se encuentra sujeto a un conjunto de principios y garantías que delimitan el ejercicio de las facultades de los sujetos procesales y orientan la actuación del JCG.", "En este marco, además de aludir a principios derivados del orden constitucional de necesaria aplicación (legalidad, el debido proceso, la dignidad humana, entre otros), es pertinente señalar cuatro principios constitucionales que, para efectos de limitar la facultad de intervención punitiva del Estado (garantías), resultan de especial relevancia."], "lead": [0], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "función de garantía", "obj": "escudo", "segs": [1]}, {"label": "función jurisdiccional", "obj": "tribunal", "segs": [2]}, {"label": "examen perspicaz", "obj": "lupa", "segs": [3, 4]}, {"label": "principios y garantías", "obj": "documento", "segs": [5]}, {"label": "cuatro principios constitucionales", "obj": "libros", "segs": [6]}]}], "rotulo": "Escenarios procesales", "intencion": "Relación: qué son las audiencias preliminares y cómo concretan la función de garantía y los principios.", "mediacion": "Idea visible y fichas que despliegan cada componente.", "rotulos": ["función de garantía", "función jurisdiccional", "examen perspicaz", "principios y garantías", "cuatro principios constitucionales"]}, {"section": 1, "part": 2, "variant": "focus", "object": "balanza", "case": false, "layout": "lamina", "segmentos": ["El precedente de la Sentencia C-1092 de 2003 (Corte Constitucional, 2003),", "reiterado en el precedente C-591 de 2005 (Corte Constitucional, 2005),", "los aborda de la siguiente forma:"], "lead": [], "titulo": [], "tail": [2], "chips": ["Presunción de inocencia", "Principio de no autoincriminación", "Principio de celeridad", "Principio de Proporcionalidad"], "bloques": [{"tipo": "lamina", "items": [{"label": "Sentencia C-1092 de 2003", "obj": "libros", "segs": [0]}, {"label": "C-591 de 2005", "obj": "libros", "segs": [1]}]}], "rotulo": null, "intencion": "Fuente: los precedentes que desarrollan los cuatro principios que siguen.", "mediacion": "Biblioteca de sentencias con puntos y presentación animada de los cuatro principios.", "rotulos": ["Sentencia C-1092 de 2003", "C-591 de 2005"]}, {"section": 2, "part": 1, "variant": "grid", "object": "escudo", "case": false, "layout": "empareja", "segmentos": ["1. Presunción de inocencia:", "Se exige al ente acusador que cuente con los suficientes elementos materiales de prueba que soporten la existencia de una sospecha razonable inicial, a fin de dar inicio a una indagación previa, así como que pueda desvirtuar esta presunción atendiendo al estándar probatorio de más allá de toda duda.", "2. Principio de no autoincriminación:", "Es una garantía procesal que impide que una persona esté obligada a declarar contra sí misma o a proporcionar medios de pruebas que le perjudiquen, la cual implica el derecho a guardar silencio, sin que ello signifique una prueba en su contra. Puntualmente, se tiene que, desde la indagación, el ciudadano debe ser informado de esta garantía y, en especial, al momento de la captura, con el fin de que decida si renuncia o hace uso de ella o renuncia y colabora con la administración de justicia.", "Como se verá adelante, en otros casos, la ley exige la asistencia de un defensor de confianza o de un defensor público [Sentencias C-591/05 (Corte Constitucional, 2005) y C-210/07 (Corte Constitucional, 2007)].", "3. Principio de celeridad:", "El sistema de administración de justicia debe producir decisiones prontas, sin dilaciones injustificadas. De lo contrario, la falta de definición de situaciones jurídicas resulta en un “acto injusto” (Consejo Superior de la Judicatura, 2008, p. 26)."], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "empareja", "items": [{"label": "Presunción de inocencia", "obj": "escudo", "segs": [1], "nombre": 0}, {"label": "no autoincriminación", "obj": "documento", "segs": [3, 4], "nombre": 2}, {"label": "Principio de celeridad", "obj": "reloj", "segs": [6], "nombre": 5}]}], "rotulo": null, "intencion": "Comprobación: tres principios y su contenido.", "mediacion": "Emparejar cada principio con su descripción; al acertar se revela el texto completo.", "rotulos": ["Presunción de inocencia", "no autoincriminación", "Principio de celeridad"]}, {"section": 3, "part": 1, "variant": "flow", "object": "balanza", "case": false, "layout": "empareja", "segmentos": ["4. Principio de Proporcionalidad:", "Orienta la ponderación como límite a todas las afectaciones de los derechos fundamentales, teniendo en cuenta que, tanto el juez como el fiscal deben examinar si los actos de investigación adelantados, a través de los cuales se obtuvieron medios cognoscitivos, responden a los fines constitucionales que rigen el proceso penal en Colombia, de manera proporcionada.", "Dicho examen de ponderación, a su vez, comprende tres subprincipios:", "(i) idoneidad o utilidad:", "contribuir a la obtención de un fin constitucionalmente legítimo (hallazgo de una prueba relevante, por ejemplo);", "(ii) necesidad:", "cuando no se pueda acceder a otro medio menos gravoso que permita obtener el mismo resultado, será legítima la intervención;", "(iii) proporcionalidad (en estricto sentido):", "busca equilibrar, en sus justas medidas, aquellos intereses de rango constitucional en conflicto: de un lado, la administración de justicia y, del otro, la esfera individual del implicado.", "Dentro de los criterios que subyacen a este juicio, se encuentran", "(a) las consecuencias jurídicas de las conductas investigadas,", "(b) la importancia de la causa que se ventila, en donde no sólo el quántum de la pena no es criterio suficiente, sino también las circunstancias del caso, la intensidad de la actuación del sospechoso, las modalidades en que se cometió el delito y la naturaleza del bien jurídico tutelado;", "(c) las exigencias de la política criminal propias del principio de Derecho penal mínimo, a fin de identificar si se trata de conductas que lesionan las condiciones de supervivencia social."], "lead": [0, 1], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "empareja", "titulo": [2], "items": [{"label": "idoneidad o utilidad", "obj": "escalones", "segs": [4], "nombre": 3}, {"label": "necesidad", "obj": "lupa", "segs": [6], "nombre": 5}, {"label": "proporcionalidad", "obj": "carpetas", "segs": [8], "nombre": 7}]}, {"tipo": "giro", "titulo": [9], "compacto": true, "items": [{"label": "consecuencias jurídicas", "obj": "documento", "segs": [10]}, {"label": "importancia de la causa", "obj": "expediente", "segs": [11]}, {"label": "Derecho penal mínimo", "obj": "libros", "segs": [12]}]}], "rotulo": null, "intencion": "Proceso y comprobación: proporcionalidad, sus tres subprincipios y los criterios del juicio.", "mediacion": "Emparejar subprincipios con su definición y descubrir los criterios (a), (b) y (c).", "rotulos": ["idoneidad o utilidad", "necesidad", "proporcionalidad", "consecuencias jurídicas", "importancia de la causa", "Derecho penal mínimo"]}, {"section": 4, "part": 1, "variant": "tabs", "object": "documentos", "case": false, "layout": "empareja", "segmentos": ["No obstante, en cuanto a este último punto, merece la pena indicar que también es posible acudir a criterios para resolver un conflicto entre derechos fundamentales.", "Al margen del principio de proporcionalidad —método recomendado para aquellos casos en que se hace necesaria la restricción o limitación a un derecho fundamental—, existen otros dos métodos para solucionar tensiones entre bienes o valores constitucionalmente protegidos: ponderación de bienes y juicio de razonabilidad.", "El primero, se trata de una actuación o un procedimiento propio del intérprete, en busca de la armonización de las normas constitucionales, no tratándose así de un principio de interpretación en sentido estricto (carece de un criterio orientador para efectos de valoración).", "El segundo, en contraste, se relaciona con un método intermedio entre la deducción estricta y la decisión política, y procede en aquellas ocasiones en las que resulta factible sacrificar alguna de las reglas de la racionalidad (respeto íntegro por la lógica formal), para así lograr una argumentación considerada válida en Derecho.", "Por supuesto, existen supuestos en los que, con la aplicación directa de la racionalidad, es posible llegar a soluciones no deseables, manifiestamente injustas o contrarias a los valores que preserva el Derecho objetivo; eventos que pretenden ser evitados con el juicio de razonabilidad."], "lead": [0, 1], "titulo": [], "tail": [4], "chips": [], "bloques": [{"tipo": "empareja", "items": [{"label": "ponderación de bienes", "obj": "carpetas", "segs": [2], "chip": true}, {"label": "juicio de razonabilidad", "obj": "escalones", "segs": [3], "chip": true}]}], "rotulo": "Criterios para resolver un conflicto entre derechos fundamentales", "intencion": "Comparación: otros métodos para resolver tensiones entre derechos.", "mediacion": "Emparejar cada método con su descripción y cierre con la idea clave.", "rotulos": ["ponderación de bienes", "juicio de razonabilidad"]}, {"section": 5, "part": 1, "variant": "case", "object": "telefono", "case": true, "layout": "caso", "segmentos": ["Aplicación al expediente del curso En el caso de Beatriz Elena Morales,", "la Fiscalía considera pertinente solicitar información relacionada con el número telefónico desde el cual se enviaron los mensajes.", "¿Qué criterios debe valorar para justificar esta actuación?", "Responda a esta cuestión a través de la ventana emergente de respuesta (máximo 500 palabras).", "Adicionalmente, tenga presente su respuesta para efectos de contrastar su respuesta con el apartado de retroalimentación."], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "caso", "roles": {"titulo": 0, "hecho": 1, "pregunta": 2, "instruccion": 3, "nota": 4}, "obj": "telefono", "items": []}], "rotulo": null, "intencion": "Aplicación al expediente: criterios para solicitar información del número telefónico.", "mediacion": "Expediente del caso con pregunta, respuesta y nota de retroalimentación.", "rotulos": ["Aplicación al expediente del curso En el caso de Beatriz
