<script type="application/json" id="contenido">{"lesson": 3, "heading": "Lección 3. Clasificación de las audiencias preliminares nominadas y competencias del juez de control de garantías", "scenes": [{"section": 1, "part": 1, "variant": "focus", "object": "tribunal", "cards": [{"label": "Igualdad material:", "text": "3.1. Igualdad material: el fundamento constitucional Como punto de partida, conviene precisar que la función del JCG no se limita a verificar el cumplimiento de las formalidades previstas en la ley, sino que comprende un riguroso examen de constitucionalidad y legalidad sobre aquellas actuaciones ejercidas por la FGN y la Policía Judicial, que podrían limitar o, incluso, vulnerar derechos fundamentales."}, {"label": "De allí que la función de control", "text": "De allí que la función de control de garantías presenta serias discrepancias, tanto en términos de forma (ejecución de sus actuaciones) como de fondo (naturaleza de sus competencias), con respecto al rol del juez con función de conocimiento. La figura del juez con funciones de control de garantías es propia del sistema penal acusatorio, la cual cumple un papel fundamental en el correcto desarrollo de los procedimientos penales, en tanto es garante de los derechos fundamentales de todas las partes involucradas en la causa [Sentencia T-643/16 (Corte Constitucional, 2016)]."}, {"label": "En palabras de la Corte Constitucional, una", "text": "En palabras de la Corte Constitucional, una formulación coherente con la estructura de un proceso penal de tendencia acusatoria, como el que configura la Ley 906 de 2004, “exige que las discusiones relacionadas con la afectación de los derechos fundamentales del imputado, se resuelvan en el ámbito jurisdiccional” [Sentencia C- 979 de 2005 [(Corte Constitucional, 2005)]."}, {"label": "Así pues, la salvaguarda de los derechos", "text": "Así pues, la salvaguarda de los derechos fundamentales del investigado, como función prioritaria adscrita al JCG, atiende a un necesario equilibrio con relación a la eficacia y funcionalidad de la administración de justicia penal (Sentencia C-591/05)."}], "case": false}, {"section": 1, "part": 2, "variant": "focus", "object": "tribunal", "cards": [{"label": "En específico, la Corte Constitucional (2014) en", "text": "En específico, la Corte Constitucional (2014) en Sentencia C-591 de 2014 concluyó que el Constituyente tuvo la voluntad de: (i) radicar en cabeza de los jueces de control de garantías la adopción de las medidas necesarias para asegurar la comparecencia de los imputados al proceso penal, de manera excepcional y previa regulación legal que incluya los límite y eventos en que procede, para que la Fiscalía proceda con la captura; (ii) facultar directamente a la Fiscalía para adelantar registros, allanamientos, incautaciones e interceptación de comunicaciones, bajo el control posterior del JCG;"}, {"label": "juez de control de garantías · 6", "text": "(iii) disponer un control previo por parte del JCG para todos los demás eventos en que, para el aseguramiento de los elementos materiales probatorios, se requiera medidas adicionales que impliquen afectación de derechos fundamentales."}, {"label": "En suma, el control judicial ejercido por", "text": "En suma, el control judicial ejercido por parte del JCG supone valorar la suficiencia de los elementos materiales probatorios, evidencia física e información legalmente obtenida que sustentan la solicitud elevada por la Fiscalía, al igual que la concurrencia de los presupuestos constitucionales y legales de procedencia, atendiendo a los estándares de justificación preestablecidos para cada tipo de audiencia."}], "case": false}, {"section": 2, "part": 1, "variant": "grid", "object": "documentos", "cards": [{"label": "Precisamente, la diversidad de escenarios que pueden", "text": "Precisamente, la diversidad de escenarios que pueden presentarse durante la investigación penal, así como la variedad de actuaciones que requieren un determinado control judicial, permite clasificar las audiencias preliminares en distintas categorías."}, {"label": "Desde esta perspectiva, y lejos de la", "text": "Desde esta perspectiva, y lejos de la enunciación preliminar del artículo 154 del CPP, es posible clasificar este tipo de actos judiciales en, al menos, cuatro grandes grupos: (i) audiencias relacionadas con la libertad personal y la vinculación al proceso, (ii) audiencias para la autorización y control de técnicas de investigación, (iii) audiencias relacionadas con medidas cautelares reales y (iv) audiencias para la protección de derechos y el desarrollo de la investigación."}, {"label": "Por un lado, las audiencias relacionadas con", "text": "Por un lado, las audiencias relacionadas con la libertad personal y la vinculación al proceso comprenden, principalmente, aquellas reguladas en los artículos 286 a 318 de la Ley 906 de 2004, referidas a la formulación de imputación, la captura, la legalización de la captura, la imposición, sustitución, revocatoria y solicitud de libertad derivada de las medidas de aseguramiento."}, {"label": "Por otro lado, las audiencias orientadas a", "text": "Por otro lado, las audiencias orientadas a la autorización y control judicial de técnicas de investigación encuentran fundamento en las disposiciones que regulan los actos investigativos que afectan derechos fundamentales, esto es, los artículos 213 a 245 y demás normas concordantes del CPP, relativas al registro y allanamiento, la retención de correspondencia, la interceptación de comunicaciones, la recuperación de información producto de la transmisión de datos, la búsqueda selectiva en bases de datos, la vigilancia y seguimiento de personas y otras técnicas de investigación."}], "case": false}, {"section": 2, "part": 2, "variant": "grid", "object": "documentos", "cards": [{"label": "A su turno, las audiencias asociadas con", "text": "A su turno, las audiencias asociadas con medidas cautelares reales se encuentran reguladas en los artículos 82 a 101 de la Ley 906 de 2004, y tienen como propósito garantizar la reparación integral de las víctimas, el comiso de bienes y la eficacia de las decisiones judiciales."}, {"label": "Finalmente, las audiencias para la protección de", "text": "Finalmente, las audiencias para la protección de derechos y el desarrollo de la investigación comprenden aquellas actuaciones judiciales previstas para la salvaguarda de los derechos de las partes e intervinientes, así como para el adecuado desarrollo del proceso penal, como ocurre, entre otras, con la práctica de prueba anticipada prevista en el artículo 284 del CPP y las demás actuaciones cuya competencia se atribuye al JCG."}], "case": false}, {"section": 3, "part": 1, "variant": "flow", "object": "expediente", "cards": [{"label": "En relación con la intervención del fiscal", "text": "En relación con la intervención del fiscal en las audiencias preliminares, esta clasificación permite advertir que sus principales tareas pueden sintetizarse en dos: (i) determinar el objeto central de la audiencia, y (ii) identificar los problemas jurídicos que en ella deben ser abordados. La resolución de estas cuestiones atinentes a la respectiva audiencia pende, en buena medida, de la claridad y precisión con la que la Fiscalía formule y sustente sus planteamientos."}, {"label": "Para ello, deberá considerar de manera articulada", "text": "Para ello, deberá considerar de manera articulada los aspectos fácticos, probatorios y jurídicos relevantes del caso, a efectos de fundamentar adecuadamente sus actuaciones y solicitudes."}], "case": false}, {"section": 4, "part": 1, "variant": "timeline", "object": "puerta", "cards": [{"label": "Articulación entre las comisarías de familia y", "text": "3.1 Articulación entre las comisarías de familia y la jurisdicción penal Sobre este punto, es menester indicar que la investigación penal de los delitos relacionados con actos de violencia en el contexto familiar exige una actuación coordinada e interinstitucional entre las autoridades administrativas de protección (Comisarías de Familia) y las autoridades judiciales (Fiscalía General de la Nación y Jueces de Control de Garantías)."}, {"label": "Con ocasión de la Ley 2126 de", "text": "Con ocasión de la Ley 2126 de 2021, se reorganizó el funcionamiento de las Comisarías de Familia y se fijaron reglas claras de competencia y articulación, garantizando a las víctimas un acceso inmediato a medidas de protección, sin que los trámites administrativos o las discusiones en torno a la competencia supongan barreras de acceso a la justicia ni incrementen el riesgo para su vida e integridad personal."}, {"label": "El artículo 20 de la Ley 2126", "text": "El artículo 20 de la Ley 2126 de 2021 establece que toda persona víctima de violencia en el contexto familiar —sin perjuicio de las denuncias penales a que hubiere lugar— puede acudir ante cualquier Comisaría de Familia para solicitar de manera inmediata una medida de protección que ponga fin a la agresión o la evite en casos de riesgo inminente."}, {"label": "No obstante, el ámbito de protección de", "text": "No obstante, el ámbito de protección de la norma no se circunscribe a las actuaciones ante las Comisarías de Familia, pues contempla la adopción provisional e inmediata de medidas de protección por parte de las autoridades judiciales que conozcan de los delitos relacionados con este tipo de violencia. En particular, los jueces con función de control de garantías pueden adoptar las medidas de protección previstas en el artículo 17 de la Ley 1257 de 2009, que modificó el artículo 5.º de la Ley 294 de 1996, cuando estas sean solicitadas por el fiscal o por la víctima."}], "case": false}, {"section": 4, "part": 2, "variant": "timeline", "object": "puerta", "cards": [{"label": "A su vez, la norma bajo estudio", "text": "A su vez, la norma bajo estudio faculta a la Fiscalía General de la Nación para solicitar al comisario o comisaria de familia la adopción inmediata de medidas de protección en favor de la víctima, cuando, de manera debidamente justificada, “considere que es la vía más expedita”."}, {"label": "En efecto, el artículo 17 de la", "text": "En efecto, el artículo 17 de la Ley 1257 de 2008, que modificó el artículo 5.º de la Ley 294 de 1996, establece ciertas medidas de protección susceptibles de adopción por parte de la autoridad competente, en consideración a las situaciones de violencia intrafamiliar; las cuales proporcionan, entre otros, elementos fácticos y probatorios determinantes al momento de sustentar la necesidad de una medida de aseguramiento."}, {"label": "Entre ellas se encuentran, por ejemplo, la", "text": "Entre ellas se encuentran, por ejemplo, la prohibición al agresor de aproximarse a la víctima, el desalojo del agresor de la casa de habitación que comparte con la víctima, el tratamiento reeducativo y terapéutico en una institución pública o privada a costa del agresor, el acompañamiento especial de la víctima por parte de las autoridades de policía y cualquier otra medida necesaria para alcanzar los objetivos de protección previstos por la ley."}], "case": false}, {"section": 5, "part": 1, "variant": "focus", "object": "balanza", "cards": [{"label": "enfoque de género · 1", "text": "3.2 aplicación del enfoque de género en las audiencias preliminares La adecuada comprensión e interpretación de las audiencias preliminares y, en general, de las actuaciones de los jueces y fiscales exige aproximarse a un marco conceptual diferenciado en torno a las dinámicas de violencia y discriminación al interior del proceso judicial. Este andamiaje teórico permite identificar las asimetrías de poder, visibilizar a los sujetos de especial protección constitucional y articular las distintas medidas de prevención y protección, desde una perspectiva garantista e incluyente."}, {"label": "A continuación, se definen los enfoques conceptuales", "text": "A continuación, se definen los enfoques conceptuales fundamentales que orientan la actuación institucional, de conformidad con la resolución No. 0-0057 del 06 de marzo del 2025 y el Protocolo para la Prevención y Atención de Casos de Acoso y Violencia Sexual, Violencia Basada en Género y/o Discriminación el Ámbito Laboral de la Fiscalía General de la Nación (2025, pp. 9-10): -"}], "case": false}, {"section": 6, "part": 1, "variant": "tabs", "object": "escudo", "cards": [{"label": "Enfoque de Género:", "text": "Enfoque de Género: Está orientado a observar, estudiar y transformar las diferencias culturales, sociales, económicas y políticas en la construcción de la condición y posición de hombres y mujeres, que generan desigualdades y se expresan en situaciones de violencia, discriminación y exclusión social."}, {"label": "Las autoridades deben trabajar para modificar los", "text": "Las autoridades deben trabajar para modificar los patrones que normalizan esta violencia y desafiar las estructuras de poder asimétricas basadas en el sexo o género. - Enfoque de Discapacidad: Se centra en reconocer y visibilizar las necesidades y derechos de las personas con discapacidad, así como en desarrollar acciones afirmativas que promuevan su inclusión y la garantía de sus derechos. - Enfoque Interseccional: Destaca cómo la violencia se cruza con diversas formas de discriminación relacionadas con el género, afectando a grupos históricamente marginalizados. - Enfoque Diferencial:"}, {"label": "Desarrolla el principio de igualdad al tratar", "text": "Desarrolla el principio de igualdad al tratar de manera diferenciada a quienes están en situación de vulnerabilidad, buscando garantizar una verdadera igualdad y justicia. Este enfoque incluye el enfoque étnico, que aborda la diversidad cultural y étnica, brindando protección diferenciada a comunidades como indígenas, afrodescendientes, raizales, y Rrom, tomando en cuenta las desigualdades históricas que han enfrentado."}, {"label": "Se busca asegurar los principios de equidad,", "text": "Se busca asegurar los principios de equidad, inclusión y diversidad. - Enfoque Étnico con Perspectiva Antirracial: El enfoque étnico se basa en el reconocimiento que la Constitución Política de 1991 hace de Colombia un país pluriétnico y multicultural, que protege los derechos fundamentales a la diversidad cultural y lingüística, la identidad, la participación, la autonomía y el gobierno propio de los pueblos étnicos."}], "case": false}, {"section": 6, "part": 2, "variant": "tabs", "object": "escudo", "cards": [{"label": "La aplicación del enfoque étnico-racial implica la", "text": "La aplicación del enfoque étnico-racial implica la realización de un análisis diferenciado de las situaciones de violencia basada en género, dirigido a identificar si el mismo se ejerció en razón de la pertenencia a un determinado pueblo étnico- racial, de manera que pueda constituir discriminación racional, y a establecer medidas diferenciales, de prevención y erradicación de estas conductas en el ámbito del trabajo. - Enfoque de Curso de Vida:"}, {"label": "Constituye una perspectiva que permite reconocer en", "text": "Constituye una perspectiva que permite reconocer en los distintos momentos de vida, la trayectoria, suceso, transiciones, ventas de oportunidad y efectos acumulativos que inciden en la vida cotidiana de los sujetos en el marco de sus relaciones y desarrollo. Este enfoque se orienta desde el reconocimiento del proceso continuo de desarrollo a lo largo de la vida."}], "case": false}, {"section": 7, "part": 1, "variant": "compare", "object": "tribunal", "cards": [{"label": "Particularmente, la actuación de la FGN en", "text": "Particularmente, la actuación de la FGN en el marco del enfoque de género exige el cumplimiento riguroso del deber de debida diligencia reforzada y oficiosidad, entendiendo que la investigación y judicialización de la violencia sexual y de las violencias basadas en género (VBG) constituyen una obligación imperativa del Estado que debe activarse de oficio, de manera seria e imparcial, sin condicionarse la investigación a impulsos externos (Fiscalía General de la Nación, Directiva 001 de 2026)."}, {"label": "Asimismo, la dirección de las audiencias preliminares", "text": "Asimismo, la dirección de las audiencias preliminares y la valoración probatoria deben estar estrictamente exentas de prejuicios, precomprensiones y estereotipos de género, proscribiendo cualquier descalificación fundada en la vida personal o sexual de la víctima, su conducta o la oportunidad en que formuló la denuncia (Fiscalía General de la Nación, 2022)."}, {"label": "En este contexto, se garantiza la centralidad", "text": "En este contexto, se garantiza la centralidad de sus derechos y la prevención de la victimización secundaria mediante un trato digno que evite interrogatorios invasivos, moralizantes o confrontaciones innecesarias, otorgando credibilidad a su relato bajo el principio de buena fe y adelantando las labores técnicas de corroboración probatoria de forma proporcional, rigurosa y razonable para prevenir actuaciones arbitrarias (Fiscalía General de la Nación, Directiva 001 de 2026)."}], "case": false}, {"section": 8, "part": 1, "variant": "case", "object": "expediente", "cards": [{"label": "Aplicación al expediente del curso La denunciante", "text": "Aplicación al expediente del curso La denunciante del expediente es mujer y lideresa social, por desempeñarse dentro del sector empresarial. Esta misma comunica hechos ocurridos en un municipio con presencia de actores armados. ¿Qué factores deben considerarse para analizar su situación desde los enfoques de género, diferencial e interseccional? Explique qué obligaciones impone cada uno a la Fiscalía en materia de investigación, valoración del riesgo y protección de sus derechos, sin recurrir a estereotipos ni generar victimización secundaria."}, {"label": "Responda a esta cuestión a través de", "text": "Responda a esta cuestión a través de la ventana emergente de respuesta (máximo 500 palabras). Adicionalmente, tenga presente su respuesta para efectos de contrastar sus respuestas con el apartado de retroalimentación."}], "case": true}]}</script>
