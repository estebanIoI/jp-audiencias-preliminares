<script type="application/json" id="contenido">{"lesson": 3, "heading": "Lección 3. Clasificación de las audiencias preliminares nominadas y competencias del juez de control de garantías", "scenes": [{"section": 1, "part": 1, "variant": "focus", "object": "tribunal", "case": false, "layout": "mapa", "segmentos": ["3.1. Igualdad material: el fundamento constitucional", "Como punto de partida, conviene precisar que la función del JCG no se limita a verificar el cumplimiento de las formalidades previstas en la ley, sino que comprende un riguroso examen de constitucionalidad y legalidad sobre aquellas actuaciones ejercidas por la FGN y la Policía Judicial, que podrían limitar o, incluso, vulnerar derechos fundamentales.", "De allí que la función de control de garantías presenta serias discrepancias, tanto en términos de forma (ejecución de sus actuaciones) como de fondo (naturaleza de sus competencias), con respecto al rol del juez con función de conocimiento.", "La figura del juez con funciones de control de garantías es propia del sistema penal acusatorio, la cual cumple un papel fundamental en el correcto desarrollo de los procedimientos penales, en tanto es garante de los derechos fundamentales de todas las partes involucradas en la causa [Sentencia T-643/16 (Corte Constitucional, 2016)].", "En palabras de la Corte Constitucional, una formulación coherente con la estructura de un proceso penal de tendencia acusatoria, como el que configura la Ley 906 de 2004, “exige que las discusiones relacionadas con la afectación de los derechos fundamentales del imputado, se resuelvan en el ámbito jurisdiccional” [Sentencia C- 979 de 2005 [(Corte Constitucional, 2005)].", "Así pues, la salvaguarda de los derechos fundamentales del investigado, como función prioritaria adscrita al JCG, atiende a un necesario equilibrio con relación a la eficacia y funcionalidad de la administración de justicia penal (Sentencia C-591/05)."], "lead": [], "titulo": [0], "tail": [], "chips": [], "bloques": [{"tipo": "mapa", "items": [{"label": "funciones de control de garantías", "obj": "tribunal", "segs": [3], "centro": true}, {"label": "riguroso examen", "obj": "lupa", "segs": [1]}, {"label": "juez con función de conocimiento", "obj": "expediente", "segs": [2]}, {"label": "ámbito jurisdiccional", "obj": "libros", "segs": [4]}, {"label": "necesario equilibrio", "obj": "escudo", "segs": [5]}]}], "rotulo": null, "intencion": "Relación: la función del JCG y su fundamento constitucional.", "mediacion": "Mapa conceptual con el JCG en el centro.", "rotulos": ["funciones de control de garantías", "riguroso examen", "juez con función de conocimiento", "ámbito jurisdiccional", "necesario equilibrio"]}, {"section": 1, "part": 2, "variant": "focus", "object": "tribunal", "case": false, "layout": "ruta", "segmentos": ["En específico, la Corte Constitucional (2014) en Sentencia C-591 de 2014 concluyó que el Constituyente tuvo la voluntad de:", "(i) radicar en cabeza de los jueces de control de garantías la adopción de las medidas necesarias para asegurar la comparecencia de los imputados al proceso penal, de manera excepcional y previa regulación legal que incluya los límite y eventos en que procede, para que la Fiscalía proceda con la captura;", "(ii) facultar directamente a la Fiscalía para adelantar registros, allanamientos, incautaciones e interceptación de comunicaciones, bajo el control posterior del JCG;", "(iii) disponer un control previo por parte del JCG para todos los demás eventos en que, para el aseguramiento de los elementos materiales probatorios, se requiera medidas adicionales que impliquen afectación de derechos fundamentales.", "En suma, el control judicial ejercido por parte del JCG supone valorar la suficiencia de los elementos materiales probatorios, evidencia física e información legalmente obtenida que sustentan la solicitud elevada por la Fiscalía, al igual que la concurrencia de los presupuestos constitucionales y legales de procedencia, atendiendo a los estándares de justificación preestablecidos para cada tipo de audiencia."], "lead": [0], "titulo": [], "tail": [4], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "comparecencia de los imputados", "obj": "puertaAbierta", "segs": [1]}, {"label": "control posterior del JCG", "obj": "reloj", "segs": [2]}, {"label": "control previo", "obj": "lupa", "segs": [3]}]}], "rotulo": "Corte Constitucional · Sentencia C-591 de 2014", "intencion": "Proceso: lo que el Constituyente radicó en el JCG (C-591/2014) y en qué consiste el control.", "mediacion": "Ruta en tres pasos y conclusión destacada.", "rotulos": ["comparecencia de los imputados", "control posterior del JCG", "control previo"]}, {"section": 2, "part": 1, "variant": "grid", "object": "documentos", "case": false, "layout": "giro", "segmentos": ["Precisamente, la diversidad de escenarios que pueden presentarse durante la investigación penal, así como la variedad de actuaciones que requieren un determinado control judicial, permite clasificar las audiencias preliminares en distintas categorías.", "Desde esta perspectiva, y lejos de la enunciación preliminar del artículo 154 del CPP, es posible clasificar este tipo de actos judiciales en, al menos, cuatro grandes grupos:", "(i) audiencias relacionadas con la libertad personal y la vinculación al proceso,", "(ii) audiencias para la autorización y control de técnicas de investigación,", "(iii) audiencias relacionadas con medidas cautelares reales y", "(iv) audiencias para la protección de derechos y el desarrollo de la investigación.", "Por un lado, las audiencias relacionadas con la libertad personal y la vinculación al proceso comprenden, principalmente, aquellas reguladas en los artículos 286 a 318 de la Ley 906 de 2004, referidas a la formulación de imputación, la captura, la legalización de la captura, la imposición, sustitución, revocatoria y solicitud de libertad derivada de las medidas de aseguramiento.", "Por otro lado, las audiencias orientadas a la autorización y control judicial de técnicas de investigación encuentran fundamento en las disposiciones que regulan los actos investigativos que afectan derechos fundamentales, esto es, los artículos 213 a 245 y demás normas concordantes del CPP, relativas al registro y allanamiento, la retención de correspondencia, la interceptación de comunicaciones, la recuperación de información producto de la transmisión de datos, la búsqueda selectiva en bases de datos, la vigilancia y seguimiento de personas y otras técnicas de investigación."], "lead": [0], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "titulo": [1], "rotulo": "Artículo 154 del CPP", "items": [{"label": "libertad personal", "obj": "puertaAbierta", "segs": [2, 6]}, {"label": "técnicas de investigación", "obj": "lupa", "segs": [3, 7]}, {"label": "medidas cautelares reales", "obj": "casa", "segs": [4]}, {"label": "protección de derechos", "obj": "escudo", "segs": [5]}]}], "rotulo": "Distintas categorías", "intencion": "Clasificación: cuatro grandes grupos de audiencias preliminares.", "mediacion": "Cuatro carpetas que giran; las dos primeras incluyen su desarrollo.", "rotulos": ["libertad personal", "técnicas de investigación", "medidas cautelares reales", "protección de derechos"]}, {"section": 2, "part": 2, "variant": "grid", "object": "documentos", "case": false, "layout": "lamina", "segmentos": ["A su turno, las audiencias asociadas con medidas cautelares reales se encuentran reguladas en los artículos 82 a 101 de la Ley 906 de 2004, y tienen como propósito garantizar la reparación integral de las víctimas, el comiso de bienes y la eficacia de las decisiones judiciales.", "Finalmente, las audiencias para la protección de derechos y el desarrollo de la investigación comprenden aquellas actuaciones judiciales previstas para la salvaguarda de los derechos de las partes e intervinientes, así como para el adecuado desarrollo del proceso penal, como ocurre, entre otras, con la práctica de prueba anticipada prevista en el artículo 284 del CPP y las demás actuaciones cuya competencia se atribuye al JCG."], "lead": [], "titulo": [], "tail": [], "chips": ["reparación integral de las víctimas", "comiso de bienes", "eficacia de las decisiones judiciales", "prueba anticipada"], "bloques": [{"tipo": "lamina", "items": [{"label": "medidas cautelares reales", "obj": "casa", "segs": [0]}, {"label": "protección de derechos", "obj": "escudo", "segs": [1]}]}], "rotulo": null, "intencion": "Clasificación (continuación): grupos (iii) y (iv) con su propósito.", "mediacion": "Lámina con puntos y propósitos destacados.", "rotulos": ["medidas cautelares reales", "protección de derechos"]}, {"section": 3, "part": 1, "variant": "flow", "object": "expediente", "case": false, "layout": "ruta", "segmentos": ["En relación con la intervención del fiscal en las audiencias preliminares, esta clasificación permite advertir que sus principales tareas pueden sintetizarse en dos:", "(i) determinar el objeto central de la audiencia, y", "(ii) identificar los problemas jurídicos que en ella deben ser abordados.", "La resolución de estas cuestiones atinentes a la respectiva audiencia pende, en buena medida, de la claridad y precisión con la que la Fiscalía formule y sustente sus planteamientos.", "Para ello, deberá considerar de manera articulada los aspectos fácticos, probatorios y jurídicos relevantes del caso, a efectos de fundamentar adecuadamente sus actuaciones y solicitudes."], "lead": [0], "titulo": [], "tail": [], "chips": ["aspectos fácticos", "probatorios", "jurídicos"], "bloques": [{"tipo": "ruta", "items": [{"label": "objeto central de la audiencia", "obj": "documento", "segs": [1]}, {"label": "problemas jurídicos", "obj": "lupa", "segs": [2]}, {"label": "claridad y precisión", "obj": "expediente", "segs": [3]}, {"label": "de manera articulada", "obj": "personas", "segs": [4]}]}], "rotulo": "Principales tareas", "intencion": "Proceso: tareas del fiscal en las audiencias preliminares.", "mediacion": "Ruta en cuatro pasos.", "rotulos": ["objeto central de la audiencia", "problemas jurídicos", "claridad y precisión", "de manera articulada"]}, {"section": 4, "part": 1, "variant": "timeline", "object": "puerta", "case": false, "layout": "mapa", "segmentos": ["3.1 Articulación entre las comisarías de familia y la jurisdicción penal", "Sobre este punto, es menester indicar que la investigación penal de los delitos relacionados con actos de violencia en el contexto familiar exige una actuación coordinada e interinstitucional entre las autoridades administrativas de protección (Comisarías de Familia) y las autoridades judiciales (Fiscalía General de la Nación y Jueces de Control de Garantías).", "Con ocasión de la Ley 2126 de 2021, se reorganizó el funcionamiento de las Comisarías de Familia y se fijaron reglas claras de competencia y articulación, garantizando a las víctimas un acceso inmediato a medidas de protección, sin que los trámites administrativos o las discusiones en torno a la competencia supongan barreras de acceso a la justicia ni incrementen el riesgo para su vida e integridad personal.", "El artículo 20 de la Ley 2126 de 2021 establece que toda persona víctima de violencia en el contexto familiar —sin perjuicio de las denuncias penales a que hubiere lugar— puede acudir ante cualquier Comisaría de Familia para solicitar de manera inmediata una medida de protección que ponga fin a la agresión o la evite en casos de riesgo inminente.", "No obstante, el ámbito de protección de la norma no se circunscribe a las actuaciones ante las Comisarías de Familia, pues contempla la adopción provisional e inmediata de medidas de protección por parte de las autoridades judiciales que conozcan de los delitos relacionados con este tipo de violencia.", "En particular, los jueces con función de control de garantías pueden adoptar las medidas de protección previstas en el artículo 17 de la Ley 1257 de 2009, que modificó el artículo 5.º de la Ley 294 de 1996, cuando estas sean solicitadas por el fiscal o por la víctima."], "lead": [], "titulo": [0], "tail": [], "chips": [], "bloques": [{"tipo": "mapa", "items": [{"label": "actuación coordinada e interinstitucional", "obj": "personas", "segs": [1], "centro": true}, {"label": "Ley 2126 de 2021", "obj": "comisaria", "segs": [2]}, {"label": "artículo 20", "obj": "casa", "segs": [3]}, {"label": "autoridades judiciales", "obj": "tribunal", "segs": [4]}, {"label": "artículo 17 de la Ley 1257", "obj": "documento", "segs": [5]}]}], "rotulo": null, "intencion": "Relación interinstitucional: comisarías de familia y jurisdicción penal.", "mediacion": "Mapa de actores con la articulación en el centro.", "rotulos": ["actuación coordinada e interinstitucional", "Ley 2126 de 2021", "artículo 20", "autoridades judiciales", "artículo 17 de la Ley 1257"]}, {"section": 4, "part": 2, "variant": "timeline", "object": "puerta", "case": false, "layout": "giro", "segmentos": ["A su vez, la norma bajo estudio faculta a la Fiscalía General de la Nación para solicitar al comisario o comisaria de familia la adopción inmediata de medidas de protección en favor de la víctima, cuando, de manera debidamente justificada, “considere que es la vía más expedita”.", "En efecto, el artículo 17 de la Ley 1257 de 2008, que modificó el artículo 5.º de la Ley 294 de 1996, establece ciertas medidas de protección susceptibles de adopción por parte de la autoridad competente, en consideración a las situaciones de violencia intrafamiliar; las cuales proporcionan, entre otros, elementos fácticos y probatorios determinantes al momento de sustentar la necesidad de una medida de aseguramiento.", "Entre ellas se encuentran, por ejemplo,", "la prohibición al agresor de aproximarse a la víctima,", "el desalojo del agresor de la casa de habitación que comparte con la víctima,", "el tratamiento reeducativo y terapéutico en una institución pública o privada a costa del agresor,", "el acompañamiento especial de la víctima por parte de las autoridades de policía", "y cualquier otra medida necesaria para alcanzar los objetivos de protección previstos por la ley."], "lead": [0], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "compacto": true, "items": [{"label": "artículo 17 de la Ley 1257", "obj": "libros", "segs": [1]}]}, {"tipo": "giro", "titulo": [2], "items": [{"label": "aproximarse a la víctima", "obj": "escudo", "segs": [3]}, {"label": "desalojo del agresor", "obj": "casa", "segs": [4]}, {"label": "tratamiento reeducativo", "obj": "corazon", "segs": [5]}, {"label": "acompañamiento especial", "obj": "comisaria", "segs": [6]}, {"label": "cualquier otra medida", "obj": "documento", "segs": [7]}]}], "rotulo": "Medidas de protección en favor de la víctima", "intencion": "Aplicación: medidas de protección que puede pedir la FGN y ejemplos del artículo 17.", "mediacion": "Idea visible y tarjetas que giran con cada medida.", "rotulos": ["artículo 17 de la Ley 1257", "aproximarse a la víctima", "desalojo del agresor", "tratamiento reeducativo", "acompañamiento especial", "cualquier otra medida"]}, {"section": 5, "part": 1, "variant": "focus", "object": "balanza", "case": false, "layout": "giro", "segmentos": ["3.2 aplicación del enfoque de género en las audiencias preliminares", "La adecuada comprensión e interpretación de las audiencias preliminares y, en general, de las actuaciones de los jueces y fiscales exige aproximarse a un marco conceptual diferenciado en torno a las dinámicas de violencia y discriminación al interior del proceso judicial.", "Este andamiaje teórico permite identificar las asimetrías de poder,", "visibilizar a los sujetos de especial protección constitucional", "y articular las distintas medidas de prevención y protección, desde una perspectiva garantista e incluyente.", "A continuación, se definen los enfoques conceptuales fundamentales que orientan la actuación institucional, de conformidad con la resolución No. 0-0057 del 06 de marzo del 2025 y el Protocolo para la Prevención y Atención de Casos de Acoso y Violencia Sexual, Violencia Basada en Género y/o Discriminación el Ámbito Laboral de la Fiscalía General de la Nación (2025, pp. 9-10): -"], "lead": [1], "titulo": [0], "tail": [5], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "asimetrías de poder", "obj": "escalones", "segs": [2]}, {"label": "sujetos de especial protección constitucional", "obj": "personas", "segs": [3]}, {"label": "medidas de prevención y protección", "obj": "escudo", "segs": [4]}]}], "rotulo": "Marco conceptual diferenciado", "intencion": "Fundamento: por qué un marco conceptual diferenciado; tres cosas que permite.", "mediacion": "Idea visible, tres tarjetas y nota de la fuente normativa.", "rotulos": ["asimetrías de poder", "sujetos de especial protección constitucional", "medidas de prevención y protección"]}, {"section": 6, "part": 1, "variant": "tabs", "object": "escudo", "case": false, "layout": "empareja", "segmentos": ["Enfoque de Género:", "Está orientado a observar, estudiar y transformar las diferencias culturales, sociales, económicas y políticas en la construcción de la condición y posición de hombres y mujeres, que generan desigualdades y se expresan en situaciones de violencia, discriminación y exclusión social.", "Las autoridades deben trabajar para modificar los patrones que normalizan esta violencia y desafiar las estructuras de poder asimétricas basadas en el sexo o género.", "- Enfoque de Discapacidad:", "Se centra en reconocer y visibilizar las necesidades y derechos de las personas con discapacidad, así como en desarrollar acciones afirmativas que promuevan su inclusión y la garantía de sus derechos.", "- Enfoque Interseccional:", "Destaca cómo la violencia se cruza con diversas formas de discriminación relacionadas con el género, afectando a grupos históricamente marginalizados.", "- Enfoque Diferencial:", "Desarrolla el principio de igualdad al tratar de manera diferenciada a quienes están en situación de vulnerabilidad, buscando garantizar una verdadera igualdad y justicia.", "Este enfoque incluye el enfoque étnico, que aborda la diversidad cultural y étnica, brindando protección diferenciada a comunidades como indígenas, afrodescendientes, raizales, y Rrom, tomando en cuenta las desigualdades históricas que han enfrentado.", "Se busca asegurar los principios de equidad, inclusión y diversidad.", "- Enfoque Étnico con Perspectiva Antirracial:", "El enfoque étnico se basa en el reconocimiento que la Constitución Política de 1991 hace de Colombia un país pluriétnico y multicultural, que protege los derechos fundamentales a la diversidad cultural y lingüística, la identidad, la participación, la autonomía y el gobierno propio de los pueblos étnicos."], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "empareja", "items": [{"label": "Enfoque de Género", "obj": "escudo", "segs": [1, 2], "nombre": 0}, {"label": "Enfoque de Discapacidad", "obj": "corazon", "segs": [4], "nombre": 3}, {"label": "Enfoque Interseccional", "obj": "personas", "segs": [6], "nombre": 5}, {"label": "Enfoque Diferencial", "obj": "escalones", "segs": [8, 9, 10], "nombre": 7}, {"label": "Enfoque Étnico con Perspectiva Antirracial", "obj": "libros", "segs": [12], "nombre": 11}]}], "rotulo": null, "intencion": "Comprobación: enfoques conceptuales y su definición.", "mediacion": "Emparejar cada enfoque con su descripción; al acertar se revela el texto completo.", "rotulos": ["Enfoque de Género", "Enfoque de Discapacidad", "Enfoque Interseccional", "Enfoque Diferencial", "Enfoque Étnico con Perspectiva Antirracial"]}, {"section": 6, "part": 2, "variant": "tabs", "object": "escudo", "case": false, "layout": "lamina", "segmentos": ["La aplicación del enfoque étnico-racial implica la realización de un análisis diferenciado de las situaciones de violencia basada en género, dirigido a identificar si el mismo se ejerció en razón de la pertenencia a un determinado pueblo étnico- racial, de manera que pueda constituir discriminación racional, y a establecer medidas diferenciales, de prevención y erradicación de estas conductas en el ámbito del trabajo.", "- Enfoque de Curso de Vida:", "Constituye una perspectiva que permite reconocer en los distintos momentos de vida, la trayectoria, suceso, transiciones, ventas de oportunidad y efectos acumulativos que inciden en la vida cotidiana de los sujetos en el marco de sus relaciones y desarrollo.", "Este enfoque se orienta desde el reconocimiento del proceso continuo de desarrollo a lo largo de la vida."], "lead": [], "titulo": [], "tail": [], "chips": ["trayectoria", "transiciones", "efectos acumulativos"], "bloques": [{"tipo": "lamina", "items": [{"label": "enfoque étnico-racial", "obj": "personas", "segs": [0]}, {"label": "momentos de vida", "obj": "reloj", "segs": [1, 2, 3]}]}], "rotulo": null, "intencion": "Definición: enfoque étnico-racial aplicado y enfoque de curso de vida.", "mediacion": "Lámina con dos puntos y conceptos clave del curso de vida.", "rotulos": ["enfoque étnico-racial", "momentos de vida"]}, {"section": 7, "part": 1, "variant": "compare", "object": "tribunal", "case": false, "layout": "ruta", "segmentos": ["Particularmente, la actuación de la FGN en el marco del enfoque de género exige el cumplimiento riguroso del deber de debida diligencia reforzada y oficiosidad, entendiendo que la investigación y judicialización de la violencia sexual y de las violencias basadas en género (VBG) constituyen una obligación imperativa del Estado que debe activarse de oficio, de manera seria e imparcial, sin condicionarse la investigación a impulsos externos (Fiscalía General de la Nación, Directiva 001 de 2026).", "Asimismo, la dirección de las audiencias preliminares y la valoración probatoria deben estar estrictamente exentas de prejuicios, precomprensiones y estereotipos de género, proscribiendo cualquier descalificación fundada en la vida personal o sexual de la víctima, su conducta o la oportunidad en que formuló la denuncia (Fiscalía General de la Nación, 2022).", "En este contexto, se garantiza la centralidad de sus derechos y la prevención de la victimización secundaria mediante un trato digno que evite interrogatorios invasivos, moralizantes o confrontaciones innecesarias, otorgando credibilidad a su relato bajo el principio de buena fe y adelantando las labores técnicas de corroboración probatoria de forma proporcional, rigurosa y razonable para prevenir actuaciones arbitrarias (Fiscalía General de la Nación, Directiva 001 de 2026)."], "lead": [], "titulo": [], "tail": [], "chips": ["trato digno", "principio de buena fe", "centralidad de sus derechos"], "bloques": [{"tipo": "ruta", "items": [{"label": "debida diligencia reforzada", "obj": "lupa", "segs": [0]}, {"label": "estereotipos de género", "obj": "personas", "segs": [1]}, {"label": "victimización secundaria", "obj": "corazon", "segs": [2]}]}], "rotulo": null, "intencion": "Proceso: deberes de la FGN con enfoque de género en las audiencias.", "mediacion": "Ruta en tres pasos y garantías destacadas.", "rotulos": ["debida diligencia reforzada", "estereotipos de género", "victimización secundaria"]}, {"section": 8, "part": 1, "variant": "case", "object": "expediente", "case": true, "layout": "caso", "segmentos": ["Aplicación al expediente del curso", "La denunciante del expediente es mujer y lideresa social, por desempeñarse dentro del sector empresarial. Esta misma comunica hechos ocurridos en un municipio con presencia de actores armados.", "¿Qué factores deben considerarse para analizar su situación desde los enfoques de género, diferencial e interseccional?", "Explique qué obligaciones impone cada uno a la Fiscalía en materia de investigación, valoración del riesgo y protección de sus derechos, sin recurrir a estereotipos ni generar victimización secundaria.", "Responda a esta cuestión a través de la ventana emergente de respuesta (máximo 500 palabras).", "Adicionalmente, tenga presente su respuesta para efectos de contrastar sus respuestas con el apartado de retroalimentación."], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "caso", "roles": {"titulo": 0, "hecho": 1, "pregunta": 2, "pista": 3, "instruccion": 4, "nota": 5}, "obj": "expediente", "items": []}], "rotulo": null, "intencion": "Aplicación al expediente: lideresa social; enfoques de género, diferencial e interseccional.", "mediacion": "Expediente del caso con hechos, pregunta, pista, respuesta y nota.", "rotulos": ["Aplicación al expediente del curso"]}]}</script>
