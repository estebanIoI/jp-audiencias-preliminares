eticiones y decisiones que no deben ordenarse, resolverse o adoptarse en audiencia de formulación de acusación, preparatoria o juicio oral; y, a diferencia de estas últimas, le corresponden siempre a un juez con funciones de control de garantías (Art. 153), durante la fase de indagación e investigación (Fiscalía General de la Nación, 2005, p.61).", "Por excepción, estas pueden tener lugar en la fase de juzgamiento, como ocurre en los casos de solicitud de prueba anticipada o de legalización de captura producida con posterioridad a la presentación del escrito de acusación.", "A partir de la lectura del artículo 154 del CPP, es posible concluir que existe una lista enunciativa, mas no taxativa, de aquellos asuntos susceptibles de ser resueltos al interior de audiencias preliminares.", "Entre ellos, la norma menciona el control posterior a los allanamientos, los registros e interceptaciones de comunicaciones, la petición de una medida de aseguramiento o de medidas cautelares, entre otros.", "Sin embargo, el numeral octavo de la norma referida amplía el espectro de audiencias preliminares, al señalar que “... se resolverán en audiencia asuntos similares a los anteriores”.", "Estos asuntos corresponden a aquellos actos de investigación y momentos procesales a los que se refiere el CPP —especialmente en el título de la indagación y la investigación— y que no aparecen en el artículo 154 ídem."], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "audiencias preliminares", "segs": [0], "obj": "escudo", "ilus": "investigacion-lupa.webp"}, {"label": "fase de juzgamiento", "segs": [1], "obj": "puertaCerrada", "ilus": "captura-detenido.webp"}, {"label": "lista enunciativa", "segs": [2], "obj": "tribunal", "ilus": "sustentacion-audiencia.webp"}, {"label": "control posterior a los allanamientos", "segs": [3], "obj": "telefono", "ilus": "fundamento-documento.webp"}, {"label": "numeral octavo", "segs": [4], "obj": "documento", "ilus": "terminos-reloj.webp"}, {"label": "actos de investigación", "segs": [5], "obj": "lupa", "ilus": "entrega-carpeta.webp"}]}], "rotulo": null, "intencion": "Relación: definición de audiencia preliminar y lo que comprende (excepción, art. 154, numeral octavo, actos de investigación).", "mediacion": "Rejilla en collage: ventanas con ilustración que llenan el marco; cada una abre su texto completo.", "rotulos": ["audiencias preliminares", "fase de juzgamiento", "lista enunciativa", "control posterior a los allanamientos", "numeral octavo", "actos de investigación"], "parrafo": [0, 2], "vineta": [], "encabezados": [], "ilustracion": "clasificacion-carpetas.webp", "relleno": "revisan-documento.webp", "titulo_genially": "Audiencias preliminares", "seccion": "Audiencias preliminares"}, {"section": 2, "part": 1, "variant": "flow", "object": "balanza", "case": false, "layout": "esquema", "segmentos": ["En cualquier caso, uno de los aspectos relevantes de las audiencias preliminares radica en que las instituciones jurídico procesales restan atribuciones a la Fiscalía General de la Nación (a partir de ahora, FGN), al someter a control y autorización judicial aquellas actuaciones que puedan derivar en restricciones o vulneraciones a derechos fundamentales.", "Por ello, conforme a lo dispuesto en el artículo 250 de la CN, la intervención del juez de control de garantías (en lo sucesivo, JCG) opera, por regla general, de manera previa frente a las actuaciones que comprometan tales derechos.", "El control posterior constituye, por tanto, una excepción a dicha regla; reduciéndose su procedencia únicamente a los eventos expresamente previstos por la CN y la ley, entre ellos, los contemplados en el numeral 2º del artículo 250 superior.", "Bajo ese entendido, la labor del juez de garantías supone determinar si las medidas de intervención en el ejercicio de los derechos fundamentales, llevadas a cabo o solicitadas por la FGN, se adecúan a la ley (aspecto formal) y, además, si resultan ser idóneas, necesarias y proporcionales (aspecto material).", "Para estos efectos, se prevén dos oportunidades procesales de control judicial, cuyas consignas y casos de aplicación serán objeto de posterior análisis: el control previo y el control posterior."], "lead": [], "titulo": [], "tail": [], "chips": ["aspecto formal", "aspecto material", "control previo", "control posterior"], "bloques": [{"tipo": "esquema", "items": [{"label": "restan atribuciones", "segs": [0], "obj": "escudo"}, {"label": "de manera previa", "segs": [1], "obj": "tribunal"}, {"label": "una excepción", "segs": [2], "obj": "documento"}, {"label": "idóneas, necesarias y proporcionales", "segs": [3], "obj": "carpetas"}, {"label": "dos oportunidades", "segs": [4], "obj": "lupa"}]}], "rotulo": null, "intencion": "Proceso: regla (control previo) y excepción (control posterior); qué examina el juez (formal y material).", "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["restan atribuciones", "de manera previa", "una excepción", "idóneas, necesarias y proporcionales", "dos oportunidades"], "parrafo": [0, 3], "vineta": [], "encabezados": [], "ilustracion": "revisan-documento.webp", "relleno": "dialogo-carpeta.webp", "arte": {"img": "revisan-documento.webp", "pos": "fondo"}, "titulo_genially": "El control previo y el control posterior", "seccion": "El control previo y el control posterior"}, {"section": 3, "part": 1, "variant": "compare", "object": "puerta", "case": false, "layout": "puntos", "segmentos": ["Ahora bien, el artículo 155 del CPP, en aras de salvaguardar el principio de publicidad, prevé que las audiencias preliminares deben realizarse con la presencia del imputado o de su defensor, siendo facultativa la asistencia del Ministerio Público.", "A su vez, estipula el carácter reservado de ciertos tipos de audiencias preliminares:", "(i) procedimientos en caso de lesionados o de víctimas de agresiones sexuales,", "(ii) control judicial sobre allanamientos, registros, interceptación de comunicaciones, vigilancia y seguimiento de personas y de cosas;", "(iii) autorización judicial previa en torno a inspección corporal, obtención de muestras que involucren al imputado;", "y (iv) audiencias relativas a la imposición de medidas cautelares."], "lead": [0, 1], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "víctimas de agresiones sexuales", "segs": [2], "obj": "escudo"}, {"label": "interceptación de comunicaciones", "segs": [3], "obj": "telefono"}, {"label": "inspección corporal", "segs": [4], "obj": "huella"}, {"label": "medidas cautelares", "segs": [5], "obj": "tribunal"}]}], "rotulo": "Artículo 155 del CPP", "intencion": "Comparación: regla de publicidad (art. 155) frente a las cuatro audiencias de carácter reservado.", "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["víctimas de agresiones sexuales", "interceptación de comunicaciones", "inspección corporal", "medidas cautelares"], "parrafo": [0], "vineta": [], "encabezados": [], "ilustracion": "clasificacion-carpetas.webp", "relleno": "dialogo-carpeta.webp", "titulo_genially": "Principio de publicidad", "seccion": "Principio de publicidad"}, {"section": 4, "part": 1, "variant": "timeline", "object": "tribunal", "case": false, "layout": "esquema", "segmentos": ["Sobre este punto, en alguna oportunidad, se interpuso una acción de tutela contra un juzgado que había ordenado la reserva de unas audiencias preliminares (legalización de allanamiento y de captura, formulación de imputación, imposición de medida de aseguramiento, entre otras), adelantadas dentro de un proceso penal seguido contra el exdirector de la cárcel La Modelo de Bogotá y otras personas, por los delitos de concusión, concierto para delinquir y enriquecimiento ilícito.", "Los accionantes —varios periodistas interesados en acceder a dichas actuaciones— consideraron que la decisión vulneraba sus derechos fundamentales a la libertad de expresión, información y prensa, así como el debido proceso y el trabajo.", "En este contexto, los recurrentes sostuvieron que la reserva no se encontraba debidamente sustentada, por no haber concurrido alguna excepción legalmente establecida al principio de publicidad.", "En efecto, este es el caso de la Sentencia SU-141/20 (Corte Constitucional, 2020), lejos de evaluar si la autoridad judicial accionada incurrió en alguno de los defectos específicos al declarar la reserva de las audiencias preliminares concretas, se dispuso a estimar el alcance de la publicidad de las actuaciones penales.", "De manera puntual, el alto tribunal señaló que, si bien la publicidad de las actuaciones judiciales permite el control ciudadano con respecto a la administración de justicia, al igual que promueve debates sobre asuntos de interés público; esta misma puede ser limitada con el fin de proteger otros principios y derechos fundamentales, tales como el derecho a la vida, a la integridad y seguridad personal, a la intimidad, los derechos de los menores, el derecho a un juicio justo, o para asegurar la correcta administración de justicia, entre otros."], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "acción de tutela", "segs": [0], "obj": "puertaCerrada"}, {"label": "periodistas", "segs": [1], "obj": "puertaAbierta"}, {"label": "excepción legalmente establecida", "segs": [2], "obj": "escudo"}, {"label": "Sentencia SU-141/20", "segs": [3], "obj": "libros"}, {"label": "puede ser limitada", "segs": [4], "obj": "tribunal"}]}], "rotulo": null, "intencion": "Cronología de un caso: tutela de periodistas contra la reserva y respuesta de la Corte (SU-141/20).", "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["acción de tutela", "periodistas", "excepción legalmente establecida", "Sentencia SU-141/20", "puede ser limitada"], "parrafo": [0, 3], "vineta": [], "encabezados": [], "ilustracion": "p-alto-documento.webp", "relleno": "dialogo-carpeta.webp", "arte": {"img": "p-alto-documento.webp", "pos": "izq"}, "titulo_genially": "Sentencia SU-141/20", "seccion": "Sentencia SU-141/20"}, {"section": 4, "part": 2, "variant": "timeline", "object": "tribunal", "case": false, "layout": "fichas", "segmentos": ["Al compás de lo establecido en el artículo 155, la Corte Constitucional concluyó que era posible limitar la libertad de expresión que ejercen los medios de comunicación, en tanto se someta a reserva —de oficio o a petición de la fiscalía— una audiencia preliminar.", "Esto, siempre y cuando se realice un juicio sesudo a nivel constitucional, en que se contemple, a saber:", "(i) la legalidad,", "(ii) la razonabilidad,", "(iii) la necesidad y", "(iv) la proporcionalidad de esta medida."], "lead": [0, 1], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "legalidad", "segs": [2], "obj": "documento"}, {"label": "razonabilidad", "segs": [3], "obj": "carpetas"}, {"label": "necesidad", "segs": [4], "obj": "lupa"}, {"label": "proporcionalidad", "segs": [5], "obj": "expediente"}]}], "rotulo": "Artículo 155 · Corte Constitucional", "intencion": "Aplicación de criterios: el juicio constitucional que permite reservar una audiencia (cuatro criterios).", "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["legalidad", "razonabilidad", "necesidad", "proporcionalidad"], "parrafo": [0], "vineta": [], "encabezados": [], "ilustracion": "lee-libro-explica.webp", "relleno": "alto-documento.webp", "arte": {"img": "lee-libro-explica.webp", "pos": "izq"}, "titulo_genially": "Juicio sesudo a nivel constitucional", "seccion": "Juicio sesudo a nivel constitucional"}, {"section": 5, "part": 1, "variant": "case", "object": "expediente", "case": true, "layout": "caso", "segmentos": ["Aplicación al expediente del curso En la indagación acerca del caso de Beatriz Elena Morales,", "¿qué actuaciones requieren la intervención del Juez de Control de Garantías y en qué momento debe producirse?", "A partir de este caso, examine cómo la intervención del juez busca garantizar que las medidas investigativas se ajusten a la ley y respeten los derechos fundamentales de las personas involucradas.", "Responda a esta cuestión a través de la ventana emergente de respuesta (máximo 500 palabras).", "Adicionalmente, tenga presente su respuesta para efectos de contrastar su respuesta con el apartado de retroalimentación."], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "caso", "roles": {"titulo": 0, "pregunta": 1, "pista": 2, "instruccion": 3, "nota": 4}, "obj": "expediente", "items": []}], "rotulo": null, "intencion": "Aplicación al expediente: intervención del JCG en el caso de Beatriz Elena Morales.", "mediacion": "Expediente del caso con espacio de respuesta.", "rotulos": ["Aplicación al expediente del curso En la indagación acerca d"], "parrafo": [0, 3], "vineta": [], "ilustracion": "dialogo-carpeta.webp", "relleno": "explica-brazos.webp", "titulo_genially": "Aplicación al expediente del curso", "seccion": "Aplicación al expediente del curso"}]}</script>
