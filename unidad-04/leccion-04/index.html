<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-audiencias", "paleta": {"marino": "#003F5E", "teal": "#569689", "oxido": "#003F5E", "coral": "#EF767F", "crema": "#FBDCDE", "niebla": "#E2F4F0", "hielo": "#F0F9F7", "celeste": "#C5E9E2", "madera": "#569689", "piso": "#C5E9E2", "gris": "#C5E9E2", "amarillo": "#EF767F"}, "anclas": {"fundamento-documento.webp": {"r": 1.1613, "p": [[50, 15], [52, 37], [19, 41], [72, 34]]}, "clasificacion-carpetas.webp": {"r": 1.5177, "p": [[15, 80], [30, 80], [45, 80], [41, 47], [85, 58]]}, "captura-detenido.webp": {"r": 1.2894, "p": [[37, 28], [80, 32], [50, 84], [52, 57]]}, "terminos-reloj.webp": {"r": 1.833, "p": [[45, 60], [55, 12], [37, 23]]}, "investigacion-lupa.webp": {"r": 1.4019, "p": [[40, 12], [88, 14], [78, 32], [55, 72], [14, 82]]}, "sustentacion-audiencia.webp": {"r": 1.4241, "p": [[22, 22], [40, 32], [55, 65], [80, 45], [70, 24]]}, "entrega-carpeta.webp": {"r": 1.8293, "p": [[60, 22], [78, 30]]}, "revisan-documento.webp": {"r": 1.0896, "p": [[64, 30], [52, 34]]}, "dialogo-carpeta.webp": {"r": 1.1719, "p": [[78, 35], [50, 30]]}, "lee-libro-explica.webp": {"r": 1.1321, "p": [[30, 27], [46, 17], [73, 30]]}, "explica-brazos.webp": {"r": 1.3373, "p": [[78, 30], [54, 22], [12, 32]]}, "alto-documento.webp": {"r": 1.2987, "p": [[63, 25], [50, 17]]}, "trio-dialogo.webp": {"r": 1.4706, "p": [[82, 30], [38, 22], [55, 30]]}, "corren-carpetas.webp": {"r": 1.6854, "p": [[30, 25], [73, 27]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "leccion_rotulo": "Lección 4", "unit": 4, "lesson": 4, "heading": "Lección 4. Técnicas de argumentación jurídica y construcción de teoría del caso para audiencias preliminares", "scenes": [{"layout": "puntos", "segmentos": ["La depuración de las falencias tanto de concreción, precisión y determinabilidad como de contradicción en la génesis de los motivos fundados para la decisión de una medida investigativa, encuentra en el control por parte del JCG a las actuaciones propias de la FGN y de la Policía Judicial uno de los filtros más importantes. De esta manera, la supervisión judicial de las medidas investigativas y, con ello, de la construcción de motivos fundados, permite asegurar la mínima afectación de derechos fundamentales del investigado (Esta ha sido una reiterada posición de la CConst.", "Al respecto, véase sentencias C-025 de 2009, Consideraciones; C-185 de 2008, Consideraciones; C-186 de 2008, Consideraciones; C-740 de 2008, Consideraciones; A-089 de 2007, Consideraciones; C-336 de 2007; C-396 de 2007, Consideraciones; C-789 de 2006, Consideraciones; C-673 de 2005, Consideraciones; C-822 de 2005, Consideraciones; C-1260 de 2005, Consideraciones; C-1092 de 2003, Consideraciones).", "En ese sentido, el control del JCG funcionaría como un recurso primario de salvaguarda, especialmente de derechos tan susceptibles de intervención durante la investigación penal, como la libertad personal y aquellos vinculados al ámbito de las comunicaciones privadas, la correspondencia y el domicilio."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "génesis de los motivos fundados", "segs": [0, 1], "obj": "lupa"}, {"label": "control del JCG", "segs": [2], "obj": "puertaAbierta"}]}], "rotulo": null, "seccion": "Lección 4. Técnicas de argumentación jurídica y construcción de teoría del caso para audiencias preliminares", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["génesis de los motivos fundados", "control del JCG"], "titulo_genially": "Técnicas de argumentación jurídica y construcción de teoría del caso para audiencias preliminares", "ilustracion": "sustentacion-audiencia.webp", "relleno": "dialogo-carpeta.webp"}, {"layout": "esquema", "segmentos": ["La capacidad de control del JCG a los motivos fundados y, de esta manera, la realizabilidad de los parámetros jurisprudenciales de motivación a medidas de investigación, viene siendo subrogada por aspectos relativos tanto a la estructura de formación subyacente al concepto motivos fundados como también a deficiencias estructurales de la función de control de garantías como ámbito de verificación. Por un lado, se trata de una noción jurídica indeterminada con un reducido potencial de control que, como se anotó, es tratada de manera diferenciada en la sistemática del CPP.", "Adicional a ello, su concreción supone fundamentalmente un ejercicio discrecional del fiscal que toma cuerpo especialmente en el juicio de probabilidad que va implícito en la determinación de cada inferencia razonable.", "Por otro lado, desde el punto de vista de la estructura de control, las competencias reservadas al JCG para la efectiva protección judicial de derechos fundamentales en la etapa de la investigación penal se ven reducidas, además, por los siguientes factores: Primero, por la orientación preventiva y de carácter policial, en especial de la etapa de indagación preliminar, a partir de la cual el monopolio penal y judicial del uso de la fuerza se ve desplazado a las fuerzas de Policía. Segundo, por cuestiones relativas a los presupuestos y a la metodología de control sobre los actos de investigación por parte de la FGN y la Policía Judicial", "Un deficiente control judicial de los motivos fundados para la autorización o confirmación de la legalidad de una medida investigativa supone la limitación de la protección judicial de derechos fundamentales. A pesar de que son claros los costos de un limitado ejercicio de verificación a la motivación de este tipo de medidas, pareciera que en el proceso penal colombiano se concibiera esto no como un escenario de rupturas, sino que con la relajación de los presupuestos de verificación judicial a las diligencias de investigación penal se proyecta un recurso compensatorio y cierta unidad frente a la insuficiencia de fundamentación.", "A ello contribuye la estructura del proceso penal derivada del Acto Legislativo 03 de 2002, si se tienen en cuenta las continuas reformas que viene delimitando un escenario de tendencia inquisitiva en materia de protección a derechos fundamentales del investigado (Zuluaga, 2011, pp. 23 ss.) y que arroja sobre el JCG una cultura muy punitivista, para hacerlo complaciente con un espíritu poco democrático y, en esa medida, incoherente con la idea fundamental que inspira la figura del JCG o “de las libertades” al servicio de los derechos de los procesados y de la indemnidad de los mismos de cara a cualquier arbitrariedad."], "parrafo": [0, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "realizabilidad de los parámetros jurisprudenciales", "segs": [0, 1], "obj": "libros"}, {"label": "competencias reservadas al JCG", "segs": [2], "obj": "escudo"}, {"label": "deficiente control judicial de los motivos fundados", "segs": [3], "obj": "tribunal"}, {"label": "Acto Legislativo 03 de 2002", "segs": [4], "obj": "documento"}]}], "rotulo": null, "seccion": "4.1. Desarrollo", "grupo": "Anotación preliminar", "titulos_fuente": ["4.1. Desarrollo", "Anotación preliminar"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["realizabilidad de los parámetros jurisprudenciales", "competencias reservadas al JCG", "deficiente control judicial de los motivos fundados", "Acto Legislativo 03 de 2002"], "titulo_genially": "Anotación preliminar", "ilustracion": "revisan-documento.webp", "relleno": "dialogo-carpeta.webp", "arte": {"img": "revisan-documento.webp", "pos": "fondo"}}, {"layout": "rejilla", "segmentos": ["De la estructura conceptual vinculada a los motivos fundados se destacan dos elementos nucleares para la determinación de los mismos. En primer lugar, la referencia a un conjunto articulado de hechos (situación objetiva) de cuyo análisis se desprende, en segundo lugar, una inferencia razonable o conclusión objetiva. Este ejercicio de conclusión objetiva a partir de una base fáctica corresponde, más concretamente, a lo que una parte mayoritaria de la doctrina reconoce como un juicio de probabilidad[^17].", "Como examen de probabilidad, con la determinación de un motivo fundado se evalúa una determinada circunstancia y la modalidad de su ocurrencia, es decir, responde a la pregunta sobre cómo y si es probable que una persona haya participado en un hecho punible y que éste haya sucedido de una determinada manera.", "[^17] Así se menciona en la misma sentencia C-024 de 1994, num. II 7.2., donde se dice que “más allá de la simple sospecha, la detención debe estar entonces basada en situaciones objetivas que permitan concluir con cierta probabilidad y plausibilidad que la persona está vinculada a actividades criminales”.", "La probabilidad a la que conduce el tratamiento de los motivos fundados en el CPP es una deducción basada en un ejercicio de valoración de hechos que permite concluir la ocurrencia de una situación. El análisis circunstancial y modal que se ve implicado en un juicio de probabilidad sobre un hecho cierto que supuestamente constituye un delito, replica la estructura de un pronóstico. Este tipo de juicios lógico-predictivos propio de los pronósticos no son extraños al derecho penal colombiano.", "Como ejemplos se pueden mencionar el Art. 63 num. 3 Código Penal (en adelante “CP”) para los casos en que se debe valorar el comportamiento futuro de una persona para decidir sobre la suspensión de la ejecución de la pena, es decir, si los antecedentes personales, sociales y familiares del sentenciado resultan indicativos de que no existe necesidad de ejecución de la pena.", "El Art. 300 num. 2 que incorpora “la probabilidad fundada de alterar los medios probatorios” como una de las causales de la captura excepcional por orden de la Fiscalía. Asimismo, el Art. 308 num. 3 CPP que incorpora como requisito de la medida de aseguramiento que resulte probable que el imputado no comparecerá al proceso o que no cumplirá la sentencia. Lo que caracteriza este tipo de pronóstico es que sobre la base de presupuestos fácticos y normativos conocidos se ha de derivar un hecho desconocido."], "parrafo": [0, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "estructura conceptual vinculada a los motivos fundados", "segs": [0, 1, 2], "obj": "lupa", "ilus": "lee-libro-explica.webp"}, {"label": "juicio de probabilidad", "segs": [3, 4], "obj": "documento", "ilus": "corren-carpetas.webp"}, {"label": "Art. 300 num. 2", "segs": [5], "obj": "puertaCerrada", "ilus": "captura-detenido.webp"}]}], "rotulo": null, "seccion": "4.1. Desarrollo", "grupo": "Del control de un concepto jurídico indeterminado", "titulos_fuente": ["4.1. Desarrollo", "Del control de un concepto jurídico indeterminado"], "encabezados": [], "mediacion": "Rejilla en collage: ventanas con ilustración que llenan el marco; cada una abre su texto completo.", "rotulos": ["estructura conceptual vinculada a los motivos fundados", "juicio de probabilidad", "Art. 300 num. 2"], "titulo_genially": "Del control de un concepto jurídico indeterminado (1 de 3)", "ilustracion": "p-alto-documento-2.webp", "relleno": "revisan-documento.webp"}, {"layout": "giro", "segmentos": ["A diferencia de los ejemplos anteriores, la concreción de probabilidad circunscrita a los motivos fundados posee unas características especiales. Un motivo fundado debe estar vinculado a una base fáctica determinada, es decir, debe hacer referencia a una persona y a un hecho concreto, razón por la cual se explica también que – en principio – esté excluida la posibilidad de establecer un motivo fundado y ejecutar medidas de investigación penal contra personas indeterminadas. Este elemento, como ya se ha visto, es recogido por la doctrina de la Corte Constitucional como parte del concepto motivos fundados.", "A pesar de que es asumido como un componente esencial, la base fáctica objetiva viene condicionada por dos asuntos adicionales y distintivos del proceso de determinación de un motivo fundado. Por un lado, a partir de una situación fáctica objetiva no se intenta deducir un hecho futuro incierto, sino que se discute si un determinado asunto tuvo lugar en el pasado.", "Por otro lado, este ejercicio lógico deductivo ocurre no al final de la investigación penal, sino que es paralelo a los resultados de investigación. Por lo tanto, el pronóstico que se vincula al ejercicio de establecer un motivo fundado no es el de una predicción, sino que se trata de una deducción a partir de un conjunto articulado de hechos. No es una manifestación predictiva sobre un determinado suceso, sino que es una expresión de probabilidad de un suceso o circunstancia del pasado. Por esta razón, la delimitación de la probabilidad se representa como un pronóstico retrospectivo.", "En ese sentido, se puede decir que la comprensión de un motivo fundado se basa en tres presupuestos concretos. Por un lado, se trata de un análisis que está vinculado a un ámbito subjetivo determinado y/o una base fáctica concreta. Por otro lado, se trata de un juicio de probabilidad que responde a la pregunta sobre cómo y si es probable que un determinado hecho punible haya sucedido de una determinada manera. Finalmente, el planteamiento circunstancial y modal que se ve implicado en un juicio de probabilidad sobre un hecho cierto que supuestamente constituye un delito replica la estructura de un pronóstico.", "Concretamente, con la determinación de un motivo fundado se lleva a cabo un pronóstico retrospectivo, es decir, es una expresión de probabilidad de un suceso o circunstancia del pasado. En síntesis, el concepto motivo fundado representa, en ese sentido, un pronóstico retrospectivo sobre la probabilidad de autoría o participación.", "Esto es notorio, por ejemplo, en los Arts. 233, 234, 235 CPP que para los casos de intervención en las comunicaciones exigen que se infiera que existe información útil o relevante para la investigación. Asimismo, el Art. 236 CPP que conduce a inferir un hecho cierto como la transmisión de datos. En tanto juicios lógico-deductivos en torno a la probabilidad de participación en un hecho punible, a la determinación de un motivo fundado en todos estos casos le es inherente un margen de discrecionalidad que canaliza cada operador judicial en la concreción de las respectivas inferencias razonables."], "parrafo": [0, 3, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "concreción de probabilidad circunscrita", "segs": [0, 1], "obj": "lupa"}, {"label": "ejercicio lógico deductivo", "segs": [2], "obj": "documento"}, {"label": "comprensión de un motivo fundado", "segs": [3, 4], "obj": "carpetas"}, {"label": "Arts. 233, 234, 235 CPP", "segs": [5], "obj": "telefono"}]}], "rotulo": null, "seccion": "4.1. Desarrollo", "grupo": "Del control de un concepto jurídico indeterminado", "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["concreción de probabilidad circunscrita", "ejercicio lógico deductivo", "comprensión de un motivo fundado", "Arts. 233, 234, 235 CPP"], "titulo_genially": "Del control de un concepto jurídico indeterminado (2 de 3)", "ilustracion": "p-explica-brazos.webp", "relleno": "fundamento-documento.webp", "arte": {"img": "p-explica-brazos.webp", "pos": "izq"}}, {"layout": "fichas", "segmentos": ["Dicho margen de discrecionalidad se concreta no sólo ante la ausencia de un desarrollo legal que delimite la estructura y aplicación judicial del pronóstico requerido por cada artículo, sino, también, en tanto no es claro cuáles factores deben analizarse para determinar la probabilidad aludida, es decir, cuáles elementos para la determinación de un motivo fundado deben y pueden ser incorporados en la probabilidad.", "Este punto es ampliamente discutido a nivel comparativo en la doctrina análoga a la de los motivos fundados, donde se reconoce que independientemente de los elementos que soportan la determinación de probabilidad, el único componente ineludible es la incertidumbre.", "El dilema de la indeterminación inherente a la estructura de definición de un motivo fundado no logra ser resuelto a partir de planteamientos de la Corte Constitucional acerca de la exigencia de concreción y precisión de la motivación de una injerencia en derechos fundamentales durante la fase de investigación. La exigencia de concreción, precisión y determinación que se deriva del Art. 250 CN (Véase CConst., C-185 de 2008, num. V. 5.), desde la cual la Corte evalúa el Art. 300 CPP, no es discutida frente a los rezagos de discrecionalidad que están vinculados a los pronósticos retrospectivos que supone la determinación de un motivo fundado.", "En ese sentido, se podría hablar de dos niveles divergentes de definición de un motivo fundado. Por un lado, uno enlazado al juicio de determinación del motivo que tiene que resolver los dilemas de probabilidad sin que exista una estructura lógico-deductiva que oriente tal juicio de probabilidad.", "Por otro lado, el escenario “correctivo” que a partir de la contradicción entre partes en la audiencia de control busca supervisar las falencias de la motivación de una medida.", "En segundo lugar, ante la ausencia de un procedimiento que permita deducir a partir de claves lógicas y sistemáticas un motivo fundado, los dilemas de probabilidad encuentran un escenario correctivo en la confrontación propia de las audiencias de control judicial. Si bien esta confrontación tampoco se orienta por criterios objetivos o sustanciales para la determinación de una probabilidad, el proceso de argumentación jurídica permite reducir el margen de discrecionalidad inherente al primer nivel de formación."], "parrafo": [2, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "margen de discrecionalidad", "segs": [0, 1], "obj": "documento"}, {"label": "dilema de la indeterminación inherente", "segs": [2, 3], "obj": "libros"}, {"label": "escenario “correctivo”", "segs": [4], "obj": "tribunal"}, {"label": "dilemas de probabilidad", "segs": [5], "obj": "escalones"}]}], "rotulo": null, "seccion": "4.1. Desarrollo", "grupo": "Del control de un concepto jurídico indeterminado", "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["margen de discrecionalidad", "dilema de la indeterminación inherente", "escenario “correctivo”", "dilemas de probabilidad"], "titulo_genially": "Del control de un concepto jurídico indeterminado (3 de 3)", "ilustracion": "alto-documento.webp", "relleno": "lee-libro-explica.webp", "arte": {"img": "alto-documento.webp", "pos": "izq"}}]}</script>
