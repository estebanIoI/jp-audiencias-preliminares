<script type="application/json" id="contenido">{"unit": 4, "lesson": 3, "heading": "Lección 3. Construcción de inferencias razonables de autoría y participación", "scenes": [{"layout": "mapa", "segmentos": ["El artículo 308 de la Ley 906 de 2004 exige, como punto de partida, que de los elementos materiales probatorios, la evidencia física y la información legalmente obtenida se pueda inferir razonablemente que el imputado puede ser autor o partícipe de la conducta que se investiga. La inferencia razonable es un estado de conocimiento intermedio: más que una sospecha o una mera plausibilidad, menos que la certeza. No es un pronóstico de condena. Se construye con tres piezas:", "1. Hechos indicadores. Datos del expediente que constan en un elemento de conocimiento concreto: un acta de captura, un informe técnico, una entrevista, una extracción de datos con control judicial.", "2. Regla de conexión. Una máxima de la experiencia, una regla de la lógica o un principio técnico que permite pasar del hecho indicador al hecho que se quiere probar.", "3. Hecho indicado. El hecho jurídicamente relevante de la hipótesis de autoría o participación, formulado frente a un delito concreto, porque la procedencia de la detención preventiva depende del delito (artículo 313).", "La inferencia es más sólida cuando varios hechos indicadores independientes convergen en una sola explicación razonable. Y tiene una exigencia procesal propia: a diferencia de la imputación, la solicitud de medida obliga a presentar y explicar en audiencia los elementos de conocimiento que soportan cada hecho, porque es el juez quien determina si la inferencia es razonable, atendiendo los fundamentos de la petición y la evidencia que la respalda (Corte Suprema de Justicia, Sala de Casación Penal, STP9521-2021, 29 de junio de 2021). Un informe que se menciona, pero no se expone no cumple la carga."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mapa", "items": [{"label": "artículo 308 de la Ley 906 de 2004", "segs": [0, 1], "obj": "libros", "centro": true}, {"label": "Regla de conexión", "segs": [2], "obj": "documento"}, {"label": "Hecho indicado", "segs": [3], "obj": "puertaCerrada"}, {"label": "STP9521-2021", "segs": [4], "obj": "tribunal"}]}], "rotulo": null, "seccion": "Lección 3. Construcción de inferencias razonables de autoría y participación", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: el primer contenido en el centro y las ramas se exploran una a una.", "rotulos": ["artículo 308 de la Ley 906 de 2004", "Regla de conexión", "Hecho indicado", "STP9521-2021"], "titulo_genially": "Construcción de inferencias razonables de autoría y participación"}, {"layout": "giro", "segmentos": ["Las inferencias razonables implican una construcción que está atada a interpretación restrictiva de sus componentes. Una interpretación restrictiva debe considerar tres niveles de análisis: primero, debe vincularse a una inferencia inculpatoria que delimite materialmente los presupuestos de una medida coercitiva. Segundo, si se trata de una inferencia de hallazgo probatorio, debe valorar la utilidad de la información a recolectar en concordancia con el Art. 375 CPP que define los parámetros para considerar pertinente o conducente un elemento material probatorio. La utilidad de los medios de conocimiento se pre-determina en el programa metodológico de investigación, donde se establecen las hipótesis normativas y procesales sobre las que se desarrolla la investigación. Tercero, tanto los análisis inferenciales inculpatorios como los relativos a la pertinencia de los medios de conocimiento deben someterse a una contradicción estricta.", "En la fase de indagación deben considerarse esquemas procesales compensatorios ante el déficit de contradicción que se concreta en las audiencias sin presencia de la defensa."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "inferencias razonables", "segs": [0], "obj": "lupa"}, {"label": "considerarse esquemas procesales compensatorios ante el déficit", "segs": [1], "obj": "tribunal"}]}], "rotulo": null, "seccion": "Lección 3. Construcción de inferencias razonables de autoría y participación", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["inferencias razonables", "considerarse esquemas procesales compensatorios ante el déficit"], "titulo_genially": "Construcción de inferencias razonables de autoría y participación"}, {"layout": "fichas", "segmentos": ["La inferencia razonable es uno de los componentes esenciales de los motivos fundados con los que se fundamentan las diferentes medidas investigativas reguladas por el Código Procesal Penal (CPP) colombiano (Guerrero, 2007, pp. 168, 342 ss.). No sólo es el elemento de cierre en el proceso judicial de determinación de los motivos fundados, sino, además, es un fundamento especial para la decisión judicial que autoriza o convalida una medida investigativa en el proceso penal. Como elemento de cierre, la inferencia razonable representa una conclusión del proceso de análisis (deductivo o inductivo) de la situación fáctica-objetiva que debe estar respaldada probatoriamente en alguno de los elementos de conocimiento autorizados por el CPP.", "Este tipo de conclusiones da cuenta de diferentes niveles de probabilidad (Acerca de los grados de conocimiento en las diferentes etapas del proceso penal véase Suarez, 2012, pp. 307 ss.), dependiendo de la fase del proceso en que se realicen, de la medida investigativa que se trate de autorizar o convalidar y de la intensidad en la injerencia del derecho fundamental afectado con la misma. Como fundamento especial de algunas decisiones judiciales, la inferencia razonable exige unas conclusiones especiales dependiendo de si se trata de autorizar una medida investigativa, formular imputación o de fundamentar la presentación del escrito de acusación. En el caso de la autorización a medidas investigativas, el régimen de inferencias razonables incorporado por el CPP es heterogéneo.", "Adicional a la inferencia de autoría o participación del investigado en un hecho punible, el CPP prevé otro tipo de inferencias dirigidas a fundamentar el descubrimiento de información útil para la investigación o, incluso, a fundamentar la mera intervención sobre la ocurrencia de un hecho punible a los fines neutralizar el mismo.", "Estos tres niveles de inferencias razonables que se incorporan en el marco de los fundamentos de autorización o convalidación de medidas investigativas, adicionalmente, predisponen el aparato de investigación penal a objetivos extra-procesales. No se trata únicamente de la injerencia en derechos fundamentales por medio de medidas investigativas a presuntos autores o participes en un delito, sino, también, de la utilización con un carácter eminentemente táctico de medidas investigativas como instrumentos de reacción penal frente a la comisión de delitos. Esta conducción de las medidas investigativas es notoria en las actividades de investigación encubiertas reguladas por el CPP como la vigilancia y seguimiento de personas (Art. 239), vigilancia de cosas (Art. 240), análisis e infiltración de organización criminal (Art. 241), la actuación de agentes encubiertos (Art. 242) y la entrega vigilada (Art. 243)."], "parrafo": [0, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "inferencia razonable", "segs": [0], "obj": "libros"}, {"label": "diferentes niveles de probabilidad", "segs": [1], "obj": "escalones"}, {"label": "Adicional a la inferencia", "segs": [2], "obj": "lupa"}, {"label": "incorporan en el marco de los fundamentos", "segs": [3], "obj": "escudo"}]}], "rotulo": null, "seccion": "3.1. Desarrollo conceptual y dogmático", "grupo": null, "titulos_fuente": ["3.1. Desarrollo conceptual y dogmático"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["inferencia razonable", "diferentes niveles de probabilidad", "Adicional a la inferencia", "incorporan en el marco de los fundamentos"], "titulo_genially": "Desarrollo conceptual y dogmático"}, {"layout": "lamina", "segmentos": ["Estas medidas suponen una intervención policial ante-iudicium a los fines de neutralizar organizaciones criminales o la comisión de hechos punibles (Sobre la cuestión prejudicial del proceso penal véase Zuluaga, 2007, p. 142 con mas referencias).", "El hecho de que estas diligencias investigativas sean puestas al servicio de objetivos extra-procesales tiene diferentes consecuencias tanto en el rol de la policía judicial como en los rendimientos del Juez de Control de Garantías (JCG) en el control a las actividades de investigación. Por un lado, se trata de escenarios en los que la policía puede intervenir con un amplio margen de discrecionalidad, es decir, donde el ente investigador no está sometido a unas precisas reglas de supervisión por parte de la Fiscalía General de la Nación (FGN). Por otro lado, al tratarse - en todos los casos citados - de medidas que tienen control posterior por el JCG y de audiencias de control donde no es obligatoria la presencia de la defensa, el control material de las diligencias está llamado a ser deficiente.", "El problema de este tipo de inferencias se encontraría en la apertura de competencias ante o extra-iudicium a la policía judicial y el condicionamiento del sistema de control de garantías a la justificación de intervenciones extra-procesales no basadas estrictamente en una inferencia inculpatoria de autoría o participación en el hecho punible por parte del investigado. A continuación, describiremos estos niveles de inferencias razonables, distinguiendo entre aquellas con fines de intervención en hechos punibles y las que exigen la existencia de información útil a la investigación."], "parrafo": [1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Estas medidas suponen una intervención policial ante-iudicium", "segs": [0], "obj": "documento"}, {"label": "diligencias investigativas", "segs": [1], "obj": "escudo"}, {"label": "problema de este tipo de inferencias", "segs": [2], "obj": "lupa"}]}], "rotulo": null, "seccion": "3.1. Desarrollo conceptual y dogmático", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Estas medidas suponen una intervención policial ante-iudicium", "diligencias investigativas", "problema de este tipo de inferencias"], "titulo_genially": "Desarrollo conceptual y dogmático"}, {"layout": "mapa", "segmentos": ["En el CPP no se encuentra ninguna clasificación de las inferencias razonables, pero la regulación de cada medida investigativa incorpora una mención expresa de las mismas. Más allá de la inferencia inculpatoria[^10], el CPP prevé inferencias que sólo están vinculadas a expectativas de hallazgo probatorio[^11]. En otras medidas el tipo de inferencia no exige que el investigado sea autor o partícipe de un hecho punible o que exista información útil para la investigación, sino que el CPP plantea inferencias como la pertenencia a una organización criminal, la intervención en un hecho punible o el uso de algunos elementos para la comisión de hechos punibles[^12]. En estos tipos de inferencias razonables se exige una conclusión sobre la ocurrencia de un hecho punible y sólo a partir de dicha conclusión, es decir, de la inferencia razonable, se determina el fin de cada medida, que en la mayoría de los casos consiste en encontrar información útil para la investigación.", "En ese sentido, el descubrimiento probatorio a través de una medida investigativa se plantea en unos casos como el resultado de la inferencia razonable y, en otros casos, como el fin de la medida de investigación. Este tipo de inferencias conllevan a la realización de juicios de probabilidad, ya no de carácter retrospectivo, como en la inferencia inculpatoria, sino fundamentalmente prospectivo (Sobre los juicios de probabilidad como condición para la determinación de motivos fundados véase Zuluaga, 2015, pp. 189 ss.). El carácter prospectivo del juicio de probabilidad se realiza básicamente sobre la utilidad de la información que se recolecta como consecuencia de la ejecución de una medida investigativa. A continuación, analizaremos estos dos niveles de inferencia razonable.", "[^10] Este tipo de inferencia es propia de los registros y allanamientos (Art. 220 CPP), así como de las condiciones para formular imputación (Art. 287 CPP).", "[^11] Así en la retención de correspondencia (art. 233 CPP), donde directamente se exige inferir que exista información útil para la investigación, como también en la regulación a la vigilancia y seguimiento de personas (Art. 239 CPP).", "[^12] Es el caso de la recuperación de información producto de la transmisión de datos (Art. 236 CPP), la vigilancia de cosas (Art. 240 CPP), el análisis e infiltración de organización criminal (Art. 241 CPP), la actuación de agentes encubiertos (Art. 242 CPP), la entrega vigilada (Art. 243 CPP) y la búsqueda selectiva en bases de datos (Art. 244 CPP)."], "parrafo": [0, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mapa", "items": [{"label": "ninguna clasificación de las inferencias razonables", "segs": [0], "obj": "lupa", "centro": true}, {"label": "descubrimiento probatorio a través", "segs": [1, 2], "obj": "documento"}, {"label": "Así en la retención de correspondencia", "segs": [3, 4], "obj": "camara"}]}], "rotulo": null, "seccion": "3.1. Desarrollo conceptual y dogmático", "grupo": "Inferencias vinculadas a expectativas de hallazgo probatorio", "titulos_fuente": ["3.1. Desarrollo conceptual y dogmático", "Inferencias vinculadas a expectativas de hallazgo probatorio"], "encabezados": [], "mediacion": "Mapa conceptual: el primer contenido en el centro y las ramas se exploran una a una.", "rotulos": ["ninguna clasificación de las inferencias razonables", "descubrimiento probatorio a través", "Así en la retención de correspondencia"], "titulo_genially": "Inferencias vinculadas a expectativas de hallazgo probatorio"}, {"layout": "giro", "segmentos": ["En el CPP se destacan cinco medidas en las cuales se incorporan inferencias con las que se exige establecer la comisión (actual y continua) de un hecho punible: respecto a la recuperación de información producto de la transmisión de datos a través de las redes de comunicaciones (el Art. 236 CPP), para la vigilancia de cosas (Art. 240 CPP), el análisis e infiltración de organización criminal (Art. 241 CPP), la actuación de agentes encubiertos (Art. 242 CPP) y la entrega vigilada (Art. 243 CPP). Estas inferencias van más allá de la probabilidad de autoría o participación en el hecho punible y exigen que las conclusiones que se deriven del análisis del conjunto articulado de hechos (situación objetiva) conduzcan a establecer que el indiciado o imputado pertenece a una organización criminal, interviene en un hecho punible o que algunos elementos o materiales se usan para la comisión de hechos punibles.", "Estas son las inferencias a partir de las cuales se fundamentan las intervenciones más intensas en derechos fundamentales por medio de la investigación encubierta. Al tenor de una interpretación literal de los artículos que regulan estas medidas, el fundamento para legitimar este tipo de actuaciones sería la conclusión sobre la pertenencia a una organización criminal y la intervención en la comisión de un hecho punible[^13]. El fin de las medidas es encontrar información útil, incluso, sin que sea necesaria una confirmación previa sobre la existencia de la misma (En ese sentido Bernal/ Montealegre, 2013, T. II., p. 275 ss.; Guerrero, 2007, p. 394 s.).", "[^13] Si bien una parte de la doctrina considera que una inferencia inculpatoria (de autoría o participación) constituye un límite material de dichas injerencias (véase sobre límites a la investigación encubierta Bernal/ Montealegre, 2013, T. II., p. 273), máxime si ya se ha formulado imputación, lo cierto es que una interpretación exegética de las regulaciones a dichas medidas en el CPP excluye de la inferencia razonable algún juicio de probabilidad sobre la autoría o participación del indiciado o imputado.", "El asunto central de las inferencias razonables que fundamentan la orden de este tipo de medidas es la conclusión de que el indiciado o imputado continúa desarrollando una actividad criminal o, en el caso de la vigilancia de cosas, que un elemento se usa en la comisión de dicha actividad. A pesar de que se crítica en tanto la reacción lógica tratándose de la comisión de un delito debería ser la captura, imputación y solicitud de medida de aseguramiento o acusación (En ese sentido Bernal/ Montealegre, 2013, T. II., p. 274; Guerrero, 2007, p. 344), una parte de la doctrina opina que cuando el CPP hace referencia al desarrollo de una actividad criminal quiere decir que el legislador permite que sea así, pues el objeto de las medidas es recolectar información útil a la investigación (éxito de la investigación)."], "parrafo": [0, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "cinco medidas", "segs": [0], "obj": "telefono"}, {"label": "inferencias a partir de las cuales", "segs": [1], "obj": "escudo"}, {"label": "inferencia inculpatoria", "segs": [2], "obj": "libros"}, {"label": "asunto central de las inferencias razonables", "segs": [3], "obj": "camara"}]}], "rotulo": null, "seccion": "3.1. Desarrollo conceptual y dogmático", "grupo": "Inferencias razonables acerca de la realización de hechos punibles", "titulos_fuente": ["3.1. Desarrollo conceptual y dogmático", "Inferencias razonables acerca de la realización de hechos punibles"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["cinco medidas", "inferencias a partir de las cuales", "inferencia inculpatoria", "asunto central de las inferencias razonables"], "titulo_genially": "Inferencias razonables acerca de la realización de hechos punibles"}, {"layout": "mapa", "segmentos": ["Las críticas a este tipo de finalidades de investigación señalan que el éxito de la investigación es el ámbito de incumbencia más reducido de las diligencias de investigación encubierta, pues el propósito central de estas medidas es la desarticulación de organizaciones criminales y no la contención de la intervención del indiciado o imputado en dicha organización o en la realización de una actividad criminal concreta (Guerrero, 2007, p. 395).", "En la medida que las injerencias razonables planteadas en los artículos que regulan las diligencias encubiertas hacen énfasis en el éxito de la investigación, pero sin vincular un juicio de probabilidad sobre la autoría o participación del investigado, una parte de la doctrina ha intentado determinar algunos los límites materiales de dichas diligencias. En ese sentido se ha hecho énfasis en el principio de proporcionalidad como marco limitativo de dichas medidas, especialmente para sostener que la razonabilidad de la inferencia debe soportarse, también, en una evaluación a la idoneidad de la medida (Guerrero, 2007, p. 395). Para los análisis de idoneidad, las evaluaciones de probabilidad sobre el éxito de la medida, es decir, los análisis que lleven a determinar la viabilidad de la diligencia en la consecución de información útil, deben involucrar la evaluación de los planes de ejecución de las diligencias (Bernal/ Montealegre, 2013, T. II., p. 276).", "En desarrollo del programa metodológico, la planificación de estas medidas debe motivar la duración de la ejecución, las facultades de los investigadores infiltrados o encubiertos y la intensidad de las injerencias que se desarrollaran en la ejecución de las mismas (Bernal/ Montealegre, 2013, T. II., p. 278).", "La viabilidad de la diligencia está condicionada, además, por el seguimiento que se haga a las reglas de la cadena de custodia, con lo que se determina el valor probatorio de la información recogida por los agentes encubiertos[^14]. De esto se deduce que la información obtenida durante la investigación encubierta no puede tener cualquier uso. Más concretamente dicho, sin la verificación de autenticidad y su aseguramiento por medio de cadena de custodia, dicha información no puede considerarse introducida al proceso, es decir, no representa un medio de conocimiento, sólo se trataría de una fuente de actividad investigativa, es decir, una información extra-procesal a partir de la cual se puede programar diligencias investigativas[^15]."], "parrafo": [1, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mapa", "items": [{"label": "críticas a este tipo de finalidades", "segs": [0], "obj": "lupa", "centro": true}, {"label": "injerencias razonables planteadas en los artículos", "segs": [1], "obj": "libros"}, {"label": "planificación de estas medidas", "segs": [2], "obj": "reloj"}, {"label": "viabilidad de la diligencia", "segs": [3], "obj": "camara"}]}], "rotulo": null, "seccion": "3.1. Desarrollo conceptual y dogmático", "grupo": "Inferencias razonables acerca de la realización de hechos punibles", "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: el primer contenido en el centro y las ramas se exploran una a una.", "rotulos": ["críticas a este tipo de finalidades", "injerencias razonables planteadas en los artículos", "planificación de estas medidas", "viabilidad de la diligencia"], "titulo_genially": "Inferencias razonables acerca de la realización de hechos punibles"}, {"layout": "fichas", "segmentos": ["Estos elementos materiales probatorios o evidencia física tendrían valor probatorio sólo en la medida que su recolección e incorporación procesal se adecuen a los requisitos de legalidad y ello sido verificado por el JCG (En ese sentido y con un análisis crítico de los requisitos de autorización véase Morales, 2009, p. 247. Sobre los requisitos de incorporación procesal previstos entre los Arts. 254 a 266 CPP véase Fiscalía General de la Nación, 2010, pp. 23 ss.).", "[^14] En términos del Artículo 279 CPP, “el elemento material probatorio y evidencia física, recogidos por agente encubierto o agente infiltrado, en desarrollo de operación legalmente programada, sólo podrá ser utilizado como fuente de actividad investigativa. Pero establecida su autenticidad y sometido a cadena de custodia, tiene el valor de cualquier otro elemento material probatorio y evidencia física”.", "[^15] Según el Art. 435 CPP, “los elementos materiales probatorios y la evidencia física son auténticos cuando han sido detectados, fijados, recogidos y embalados técnicamente, y sometidos a las reglas de cadena de custodia”."], "parrafo": [1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "valor probatorio sólo en la medida", "segs": [0, 1], "obj": "lupa"}, {"label": "Art. 435 CPP", "segs": [2], "obj": "expediente"}]}], "rotulo": null, "seccion": "3.1. Desarrollo conceptual y dogmático", "grupo": "Inferencias razonables acerca de la realización de hechos punibles", "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["valor probatorio sólo en la medida", "Art. 435 CPP"], "titulo_genially": "Inferencias razonables acerca de la realización de hechos punibles"}, {"layout": "giro", "segmentos": ["El hallazgo de información útil es un propósito transversal al régimen de medidas investigativas del CPP. Por un lado, la recolección de información útil es el fin mismo de las medidas de investigación. Tanto en la interceptación de comunicaciones (Art. 235), como en la recuperación de información producto de la transmisión de datos (Art. 236) y en las diligencias de investigación encubiertas (Arts. 239-243), el propósito de la medida es “obtener elementos materiales probatorios y evidencia física” o “conseguir información útil para la investigación”. Por otro lado, de manera más estricta, el CPP establece que, para la autorización de algunas diligencias de investigación, la inferencia razonable que se debe desprender de los motivos fundados debe ser la existencia de información útil para la investigación (Guerrero, 2007, p. 373).", "En estas medidas se incorpora la existencia de información útil, no ya como el fin de la medida, sino como la inferencia razonable misma que se debe desprender de los motivos fundados.", "Sin embargo, como se ha mencionado, el tratamiento dado por el CPP a este tipo de inferencias y, en general, al propósito de obtener información útil para la investigación es problemático. Como inferencia razonable, la existencia de información útil es tratada en dos niveles diferentes. Primero, como sucede en la regulación a la retención de correspondencia (Art. 233), la inferencia razonable conduciría a una conclusión retrospectiva, es decir, una confirmación ex ante de que existe dicha información. Segundo, tal como se presenta en la regulación a la vigilancia y seguimiento de personas (Art. 239), la inferencia razonable exige una conclusión prospectiva acerca de que el indiciado o el imputado pudiere conducirlo a conseguir información útil. En este caso, no es la confirmación sobre la existencia de información útil sino una proyección sobre la información que se podría recolectar con la vigilancia y seguimiento del indiciado o imputado.", "Estos niveles de inferencias razonables establecen dos visiones diferentes sobre la recolección de información y plantean algunas dificultades para la comprensión de dicha actividad ya sea como inferencia razonable o como objeto de las medidas mismas.", "Las críticas más relevantes se plantean frente al tratamiento que hace el CPP a la recolección de información como objeto de las medidas de investigación, exactamente a los problemas que genera una interpretación exegética del Art. 239 CPP. Algunos consideran que incorporar la búsqueda de elementos materiales probatorios como propósito de la medida o inferencia que se desprende de los motivos fundados, es un fin restringido (Guerrero, 2007, p. 373). En este sentido, la diligencia investigativa sólo será un medio para llegar a un elemento material probatorio, sin embargo, las normas que regulan estas diligencias no son claras sobre la aptitud probatoria de los elementos de conocimiento."], "parrafo": [0, 2, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "hallazgo de información útil", "segs": [0, 1], "obj": "telefono"}, {"label": "tratamiento dado por el CPP", "segs": [2], "obj": "lupa"}, {"label": "dos visiones diferentes sobre la recolección", "segs": [3], "obj": "escalones"}, {"label": "críticas más relevantes", "segs": [4], "obj": "expediente"}]}], "rotulo": null, "seccion": "3.1. Desarrollo conceptual y dogmático", "grupo": "Inferencias razonables sobre la existencia de información útil", "titulos_fuente": ["3.1. Desarrollo conceptual y dogmático", "Inferencias razonables sobre la existencia de información útil"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["hallazgo de información útil", "tratamiento dado por el CPP", "dos visiones diferentes sobre la recolección", "críticas más relevantes"], "titulo_genially": "Inferencias razonables sobre la existencia de información útil"}, {"layout": "lamina", "segmentos": ["Además, la vaguedad de la expresión “útil para la investigación” introduce un amplio espectro de posibilidades sobre el uso de los elementos materiales probatorios o evidencia física recolectada, los cuales pueden ser útiles a diferentes propósitos, ya sea para soportar o fundamentar una imputación o acusación o simplemente para fundamentar otra noticia criminis. El problema central radica en que la ambigüedad del término “información útil” conduce a que el juicio sobre la utilidad pueda concretarse por la misma[^16].", "[^16] Este último problema ha estado vinculado a diferentes regulaciones relativas al seguimiento pasivo de personas, como es el caso, también, del Art. 243 de la Ley 600 de 2000 (anterior CPP) que reguló lo relativo al aseguramiento de pruebas por medio del seguimiento pasivo sobre actividades sospechosas. Esto fue incluso objeto de una demanda constitucional, a partir de la que la Corte Constitucional resolvió “se requiere la existencia de circunstancias objetivas, externas, que constituyan indicios concretos sobre el particular o la existencia de a lo menos un principio de prueba”. (CConst., C-431 de 2003, , núm. 3.3.)."], "parrafo": [1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "vaguedad de la expresión", "segs": [0], "obj": "lupa"}, {"label": "Ley 600 de 2000", "segs": [1], "obj": "camara"}]}], "rotulo": null, "seccion": "3.1. Desarrollo conceptual y dogmático", "grupo": "Inferencias razonables sobre la existencia de información útil", "titulos_fuente": [], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["vaguedad de la expresión", "Ley 600 de 2000"], "titulo_genially": "Inferencias razonables sobre la existencia de información útil"}]}</script>
