<script type="application/json" id="contenido">{"unit": 4, "lesson": 1, "heading": "Lección 1. Los motivos fundados y audiencias preliminares", "scenes": [{"layout": "mapa", "segmentos": ["Todas las diligencias de afectación a derechos fundamentales en la fase de investigación del proceso penal colombiano deben estar respaldadas en motivos fundados (Sobre la exigencia de motivación como condición para la injerencia en derechos fundamentales en Colombia véase sumariamente Guerrero, 2007, pp. 168, 342 ss.). La exigencia de motivación de las órdenes a dichas intervenciones tiene un doble fundamento normativo. En un primer nivel, el Art. 250 inc. 1 de la Constitución Nacional (en adelante “CN”) indica que el ejercicio de la investigación penal requiere que medien suficientes motivos y circunstancias fácticas que conduzcan a establecer la posible existencia de un delito.", "Con tal requerimiento lo que se propuso el legislador fue que “las razones que motivaron al fiscal para adoptar alguna de estas medidas durante la investigación, se encuentren apoyadas por motivos razonables, y no simples sospechas” (Véase Gaceta del Congreso 134 (2002), V D). 3.; Para una evaluación de los antecedentes del Acto Legislativo 03 de 2002 véase Corte Constitucional, Sentencia C-1092 de 2003, num. 4.1.1.1.). En un segundo nivel, el Código Procesal Penal (en adelante “CPP”) incorpora la exigencia de motivos fundados frente a todas las medidas reguladas por los artículos 213 a 250 CPP.", "Adicionalmente, dicha motivación también se exige como fundamento para decretar medidas cautelares reales (Arts. 83 inc. 2, 91 inc. 1 y 101 inc. 1) (al respecto Restrepo, 2007, p. 73; para la diferencia del comiso frente a la extinción de dominio, la expropiación y el decomiso administrativo pp. 30 ss.) y personales (Arts. 297, 308-311 CPP), así como para adelantar interrogatorios en la investigación preliminar (Art. 282), para realizar pruebas anticipadas (Art. 284 num. 3 CPP) (Sobre el carácter excepcional de dicha medida, CConst, Sentencias C-591 de 2005, C-1154 de 2005, también Corte Suprema de Justicia, Sala Penal, Rad. 25920, sentencia del 21.02.2007, Consideraciones) y para la práctica de testimonio a menor de 12 años (Art. 383 inc. 2)."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mapa", "items": [{"label": "Todas las diligencias de afectación a derechos", "segs": [0], "obj": "escudo", "centro": true}, {"label": "Sentencia C-1092 de 2003", "segs": [1], "obj": "libros"}, {"label": "fundamento para decretar medidas", "segs": [2], "obj": "personas"}]}], "rotulo": null, "seccion": "Lección 1. Los motivos fundados y audiencias preliminares", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: el primer contenido en el centro y las ramas se exploran una a una.", "rotulos": ["Todas las diligencias de afectación a derechos", "Sentencia C-1092 de 2003", "fundamento para decretar medidas"], "titulo_genially": "Los motivos fundados y audiencias preliminares"}, {"layout": "giro", "segmentos": ["Tratándose de la afectación a derechos fundamentales en la fase de investigación, el requisito de motivación responde a una doble lógica. Primero, como fundamento de autorización (Acerca del control previo a medidas de investigación véase Aponte, 2006, p. 23; Bernal/Montealegre, 2013, p. 291 s. y Tomo II, p. 204; CSJ, 2005, p. 21; Guerrero, , 2006, p. 30; Guerrero, 2007, p. 187 s., 199 ss.) por el Juez de Control de Garantías (en adelante “JCG”) de las medidas reguladas por los Artículos 245[^0] a 250 CPP, es decir, todas las diligencias investigativas que requieren autorización judicial previa. En estos casos, el JCG deberá siempre basarse en la existencia de motivos razonables para autorizar la decisión de intervención (Al respecto véase Aponte, 2006, p. 23; Bernal/Montealegre, 2013, p. 291 s. y T. II p. 204; CSJ, 2005, p. 21; Guerrero, 2006, p. 30; Guerrero, 2007, p. 187 s., p. 199 ss.).", "Segundo, los motivos fundados deben respaldar la activación de la competencia excepcional de la Fiscalía General de la Nación (en adelante “FGN”) para ordenar todas aquellas medidas reguladas entre los artículos 213 a 244 CPP. Frente a estas diligencias, los motivos fundados son, a la vez, un fundamento de confirmación en razón del control posterior realizado por el JCG (Sobre el control posterior de medidas de investigación en el proceso penal colombiano véase Zapata, 2007, p. 133 ss.). Este esquema da cuenta de la existencia de un modelo mixto de autorización judicial a la afectación de derechos fundamentales. De un lado, por medio del JCG en la audiencia de control de legalidad - previo - a las medidas de investigación y, de otro lado, a través del fiscal a la hora de ordenar una medida en el marco de sus competencias excepcionales. La exigencia de motivación se hace extensiva a ambos momentos de decisión sobre las mencionadas afectaciones durante la investigación penal.", "[^0] Respecto de los exámenes de ADN regulados por el Art. 245 CPP, si bien esta medida figura entre aquellas que no requieren autorización judicial previa, la Corte Constitucional condicionó la misma en el sentido de que la revisión de legalidad que corresponde al juez de garantías, debe hacerse de manera previa. Corte Constitucional, Sentencia C-334 de 2010, num. VII. Decisión.", "A pesar de ser una noción central en el proceso penal y elemento de la mayor trascendencia en el engranaje diseñado por el CPP para decretar múltiples medidas de investigación, no es posible determinar en la sistemática procesal penal desarrollada a partir de la Ley 906 de 2004 qué significa la noción motivos fundados. Adicional a la indeterminación conceptual, el CPP no establece reglas para su determinación o construcción procesal y, además, incorpora serias restricciones en el ámbito de su control judicial. Por un lado, tanto en el Art. 250 CN como en el CPP se encuentran diferentes expresiones y términos para referirse a la exigencia de motivos fundados de las que no resulta posible una conceptualización clara y precisa sobre el significado de dicha expresión (véase infra 1.1.)."], "parrafo": [0, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "afectación a derechos fundamentales en la fase de investigación", "segs": [0], "obj": "escudo"}, {"label": "motivos fundados", "segs": [1], "obj": "lupa"}, {"label": "Respecto de los exámenes de ADN regulados", "segs": [2], "obj": "libros"}, {"label": "Ley 906 de 2004", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "1.1. La relevancia de los motivos fundados", "grupo": null, "titulos_fuente": ["1.1. La relevancia de los motivos fundados"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["afectación a derechos fundamentales en la fase de investigación", "motivos fundados", "Respecto de los exámenes de ADN regulados", "Ley 906 de 2004"], "titulo_genially": "La relevancia de los motivos fundados"}, {"layout": "fichas", "segmentos": ["Por otro lado, las referencias al umbral probatorio que debe respaldar los motivos fundados, a partir de los cuales, también, se decide sobre la afectación a derechos fundamentales, son insuficientemente desarrolladas en la sistemática del CPP (En ese sentido Guerrero, 2007, p. 166 s.; Sobre el régimen probatorio y de contradicción en el proceso penal colombiano véase Bernal/Montealegre, 2013, p. 255 s.). Con ello se relativiza, a su vez, el alcance del control judicial por parte del JCG, aspecto que se ve agravado por las restricciones a principios como el de contradicción, publicidad, oralidad e inmediación en las audiencias de control de legalidad reguladas por los Arts. 155 y 237 CPP (De la misma opinión, Calle, 2005, pp. 167, 169; también Zuluaga, 2007, p. 140).", "En estas audiencias se incorpora el secreto pre-sumarial como elemento definitorio de la dinámica de control judicial, restringiendo el derecho de defensa y, con ello, la verificación de la génesis de los motivos fundados por medio de los ejercicios de contradicción que supone un sistema procesal penal acusatorio.", "La deficiente delimitación normativa de los niveles de fundamentación a las medidas de investigación y la complicidad sistemática con restringidos ejercicios de control y verificación judicial de los motivos fundados, dan cuenta de un concepto altamente disponible como parámetro de control a la activación de las competencias de la FGN y la policía judicial. A ello se suma la asignación de funciones extraprocesales incorporadas en el régimen de finalidades de las inferencias razonables, que resultan siendo justificadas, también, por los motivos fundados. Dichas finalidades parecen convertir los motivos fundados, por un lado, en una bisagra entre la protección de expectativas de seguridad con el deber de fundamentación de medidas procesales penales y, por otro lado, parecen asignarle a los motivos fundados una función de igualación entre sospecha y culpa.", "Ante la inexistencia de una sistemática estricta desde la cual se restrinja la arbitrariedad fiscal, se abre camino a la relativización de la protección judicial de derechos fundamentales en la fase de investigación penal.", "En el marco de las problemáticas enunciadas, en este artículo se discutirán dos aspectos concretos: Primero, se hará una aproximación al concepto de motivos fundados. En este punto se busca determinar qué se entiende por tal noción, a partir del tratamiento dado tanto en el Art. 250 inc. 1 CN, como en el desarrollo a la exigencia de motivación de medidas de investigación en el CPP. Segundo, se discutirán los diferentes problemas de verificación judicial a los motivos fundados por parte del JCG en las audiencias de control a las actividades de la FGN y policía judicial. Este acercamiento al significado y los problemas fundamentales de la noción motivos fundados permite identificar los parámetros reales de justiciabilidad de las afectaciones a derechos fundamentales en la fase de investigación penal."], "parrafo": [2, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "referencias al umbral probatorio", "segs": [0], "obj": "escudo"}, {"label": "incorpora el secreto pre-sumarial como elemento definitorio", "segs": [1], "obj": "tribunal"}, {"label": "deficiente delimitación normativa de los niveles", "segs": [2], "obj": "lupa"}, {"label": "Ante la inexistencia de una sistemática estricta", "segs": [3], "obj": "escalones"}, {"label": "problemáticas enunciadas", "segs": [4], "obj": "documento"}]}], "rotulo": null, "seccion": "1.1. La relevancia de los motivos fundados", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["referencias al umbral probatorio", "incorpora el secreto pre-sumarial como elemento definitorio", "deficiente delimitación normativa de los niveles", "Ante la inexistencia de una sistemática estricta", "problemáticas enunciadas"], "titulo_genially": "La relevancia de los motivos fundados"}, {"layout": "mapa", "segmentos": ["El tratamiento dado en el CPP a la exigencia de motivación para la orden y ejecución de medidas de investigación penal, no es homogéneo. El CPP acoge diferentes formulaciones y expresiones para referirse a la exigencia de motivos fundados. Así, por ejemplo, habla de “motivos previamente definidos en la Ley” en alusión a las razones que pueden determinar la restricción de la libertad[^1] y a la afectación del derecho a la intimidad[^2]. En otros apartes, pero también con el fin de asegurar la motivación de las medidas, el CPP utiliza de forma más concreta el término “motivos fundados”[^3]. En el mismo sentido, pero añadiendo un adverbio de modo, el CPP usa la expresión “motivos razonablemente fundados”, tanto respecto de las medidas de investigación que no requieren autorización judicial previa como de las que sí precisan dicha autorización[^4][6].", "Junto a esto, también hay formulaciones que no incorporan la expresión “fundados”, pero hacen alusión a ello bajo la referencia “motivos razonables”[^5][7]. En otros casos, se hace una simple remisión a “motivos graves”[^6][8] o “motivos serios”[^7][9]. Finalmente, en el Art. 308 CPP se desarrolla una formulación que no contiene expresamente el término motivos fundados, pero sí incorpora la exigencia de motivación, al punto de indicar, incluso, la “inferencia razonable” que se debe desprender de dicha fundamentación[^8][10].", "[^1] Art. 2 inc. 1 CPP: “Libertad. (…). Nadie podrá ser molestado en su persona ni privado de su libertad sino en virtud de mandamiento escrito de autoridad judicial competente, emitido con las formalidades legales y por motivos previamente definidos en la ley”. (énfasis fuera de texto).", "[^2] Art. 14 inc. 2 CPP:, “No podrán hacerse registros, allanamientos ni incautaciones en domicilio, residencia, o lugar de trabajo, sino en virtud de orden escrita del Fiscal General de la Nación o su delegado, con arreglo de las formalidades y motivos previamente definidos en este código. (…)”. (énfasis fuera de texto).", "[^3] Así para las medidas cautelares sobre bienes susceptibles de comiso (Art 83 inc. 2), para la suspensión y cancelación de la personería jurídica (Art. 91 inc. 1), para la suspensión y cancelación de registros obtenidos fraudulentamente (Art. 101 inc. 1), respecto del respaldo probatorio para los motivos fundados (Art. 221 inc. 1 y 3), para la prórroga de la medida de interceptación de comunicaciones (Art. 235 inc. 3), para la práctica de interrogatorio a indiciado (Art. 282), de prueba anticipada (Art. 284) y en la determinación del “peligro para la víctima” como requisito para decretar medida de aseguramiento (Art. 311)."], "parrafo": [0, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mapa", "items": [{"label": "tratamiento dado en el CPP", "segs": [0], "obj": "puertaAbierta", "centro": true}, {"label": "formulaciones que no incorporan la expresión “fundados”", "segs": [1, 2], "obj": "reloj"}, {"label": "hacerse registros", "segs": [3], "obj": "casa"}, {"label": "Así para las medidas cautelares sobre bienes", "segs": [4], "obj": "telefono"}]}], "rotulo": null, "seccion": "1.3. Una aproximación al concepto “motivos fundados”", "grupo": null, "titulos_fuente": ["1.3. Una aproximación al concepto “motivos fundados”"], "encabezados": [], "mediacion": "Mapa conceptual: el primer contenido en el centro y las ramas se exploran una a una.", "rotulos": ["tratamiento dado en el CPP", "formulaciones que no incorporan la expresión “fundados”", "hacerse registros", "Así para las medidas cautelares sobre bienes"], "titulo_genially": "Una aproximación al concepto “motivos fundados”"}, {"layout": "giro", "segmentos": ["[^4] En concreto respecto al fundamento para la orden de registro y allanamiento (Art. 220), para la orden de medidas como la retención de correspondencia (Art. 233), la recuperación de información producto de la transmisión de datos a través de las redes de comunicaciones (Art. 236 inc. 1), la vigilancia y seguimiento de personas (Art. 239 inc. 1), la vigilancia de cosas (Art. 240 inc. 1), el análisis e infiltración de organización criminal (Art. 241 inc. 1), la actuación de agentes encubiertos (Art. 242), la entrega vigilada (Art. 243), la inspección corporal (Art. 247), el registro personal (Art. 248 inc. 1) y como fundamento de la orden de captura (Art. 297 inc. 1).", "[^5] Véase Art. 298 parág. 2 CPP: “Cuando existan motivos razonables para sospechar que una nave está siendo utilizada para el tráfico ilícito de estupefacientes y sustancias sicotrópicas”; también el Art. 383 inc. 2: “El juez, con fundamento en motivos razonables, podrá practicar el testimonio del menor fuera de la sala de audiencia, de acuerdo con lo previsto en el numeral 5º del artículo 146 de este código.” (énfasis fuera de texto).", "[^6] Art. 309 CPP: “Obstrucción de la justicia. Se entenderá que la imposición de la medida de aseguramiento es indispensable para evitar la obstrucción de la justicia, cuando existan motivos graves y fundados que permitan inferir que el imputado podrá destruir, modificar, dirigir, impedir, ocultar o falsificar elementos de prueba; (…)”(énfasis fuera de texto).", "[^7] Art. 300 CPP: “Captura excepcional por orden de la Fiscalía. (…), cuando por motivos serios y de fuerza mayor no se encuentre disponible un juez que pueda ordenarla”. (énfasis fuera de texto). Valga anotar que la expresión “motivos serios” fue declarada inexequible por la Corte Constitucional en sentencia C-185 de 2008, M.P. Manuel José Cepeda Espinosa, Decisión.", "[^8] Art. 308 CPP: “Requisitos. El juez de control de garantías, a petición del Fiscal General de la Nación o de su delegado, decretará la medida de aseguramiento cuando de los elementos materiales probatorios y evidencia física recogidos y asegurados o de la información obtenidos legalmente, se pueda inferir razonablemente que el imputado puede ser autor o partícipe de la conducta delictiva que se investiga, (…).”(énfasis fuera de texto).", "Esta variopinta apropiación de la exigencia de motivación indica, por un lado, la implementación dada por el CPP a la exigencia de un umbral de motivos o razones establecida por el Art. 250 CN (Como se desprende de la exposición de motivos del Acto Legislativo 03 de 2002, véase Gaceta del Congreso 134 de 2002), para decidir u ordenar medidas procesales penales que en muchos casos implican la restricción de derechos fundamentales del investigado. Por otro lado, la utilización de diferentes expresiones en referencia a la exigencia de motivación pareciera indicar que la sistemática del CPP acoge niveles diferenciados de motivación procesal. Sin embargo, el CPP no contiene en ningún aparte una definición del concepto “motivos fundados”, asunto frente al que no contribuye tampoco el tratamiento diferenciado de dicha noción."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "En concreto respecto al fundamento", "segs": [0], "obj": "telefono"}, {"label": "Véase Art", "segs": [1, 2], "obj": "tribunal"}, {"label": "Art. 300 CPP: “Captura excepcional", "segs": [3, 4], "obj": "puertaCerrada"}, {"label": "variopinta apropiación de la exigencia de motivación", "segs": [5], "obj": "lupa"}]}], "rotulo": null, "seccion": "1.3. Una aproximación al concepto “motivos fundados”", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["En concreto respecto al fundamento", "Véase Art", "Art. 300 CPP: “Captura excepcional", "variopinta apropiación de la exigencia de motivación"], "titulo_genially": "Una aproximación al concepto “motivos fundados”"}, {"layout": "mapa", "segmentos": ["Esta última cuestión ni siquiera ha sido abordada y discutida en la reducida literatura procesal penal colombiana, a partir de la cual cualquier intento descriptivo enseñaría inmensos vacíos a la hora de determinar un posible significado del término. A pesar del limitado manejo dogmático y doctrinal, un acercamiento al tema y un intento de definición puede encontrarse en la jurisprudencia de la Corte Constitucional. En la discusión a múltiples demandas contra el Acto Legislativo 03 de 2002 y contra la Ley 906 de 2004, esta corporación ha recogido un concepto de motivos fundados que continúa siendo invocado en la comprensión del problema, sin que hasta el momento se haya presentado un cambio de precedente jurisprudencial en la interpretación de dicha noción.", "El tratamiento de la Corte Constitucional a la noción “motivos fundados” se ha dado en diferentes niveles. En un primer nivel, a raíz de la evaluación de constitucionalidad del Acto Legislativo 03 de 2002 (El Acto Legislativo 03 de 2002 ha sido reiteradamente evaluado por la Corte Constitucional. Entre otras, véase las sentencias C-1039 de 2004; C-1092 de 2003; C-970 de 2004; C-334 de 2005; C-013 de 2004), la Corte ha determinado la trascendencia de la motivación para la investigación de los hechos. El primer pronunciamiento en el que la Corte confirma la incorporación de un umbral de motivación como límite esencial de las órdenes de medidas de investigación fue mediante la sentencia C-1092 de 2003. En este fallo se analizó el Art. 250 num. 2 CN y encontró que el examen de las razones que motiven las medidas de investigación es parte de la configuración de un control amplio e integral por parte del JCG (CConst., C-1092 de 2003, num. 5.1.).", "La Corte indagó la discusión legislativa que condujo a la redacción original del Art. 250 CN y, sobre la base de una interpretación teleológica, determinó que la finalidad buscada por parte del legislador fue que todas las diligencias de investigación estuvieran fundadas en motivos suficientes (CConst., C-1092 de 2003, num. 4.1.1.1.).", "Esta doctrina sobre el alcance del control judicial a las medidas de investigación en el proceso penal, que se expuso en la evaluación del Art. 250 num. 2 CN, tiene como antecedente jurisprudencial inmediato la sentencia C-805 de 2002 (CConst., Sentencia C-805 de 2002, VI. Consideraciones y Fundamentos). En este fallo se analizó la constitucionalidad del Art. 392 de la Ley 600 de 2000 (antiguo CPP) relativo al control de legalidad de medidas cautelares por parte de la FGN. En esa oportunidad, sobre la base de la delimitación que instala el Art. 28 inc. 1 CN[^9][11] para cualquier restricción a la libertad, la Corte planteó la existencia de “un criterio material de orden probatorio” (CConst., C-805 de 2002, num. VI. 17) a partir del cual pueden proceder las intervenciones en derechos fundamentales durante la investigación penal."], "parrafo": [1, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mapa", "items": [{"label": "Ley 906 de 2004", "segs": [0], "obj": "libros", "centro": true}, {"label": "tratamiento de la Corte Constitucional", "segs": [1], "obj": "lupa"}, {"label": "discusión legislativa", "segs": [2], "obj": "carpetas"}, {"label": "Sentencia C-805 de 2002", "segs": [3], "obj": "tribunal"}]}], "rotulo": null, "seccion": "1.3. Una aproximación al concepto “motivos fundados”", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: el primer contenido en el centro y las ramas se exploran una a una.", "rotulos": ["Ley 906 de 2004", "tratamiento de la Corte Constitucional", "discusión legislativa", "Sentencia C-805 de 2002"], "titulo_genially": "Una aproximación al concepto “motivos fundados”"}, {"layout": "fichas", "segmentos": ["Esta línea jurisprudencial, desde la cual se insiste en la necesidad de un estándar probatorio suficiente para diligencias de investigación, a su vez, tiene su antecedente fundacional en la sentencia C-024 de 1994 (sentencia hito). En dicha sentencia se resolvió una demanda contra el Decreto 1.355 de 1970 (Código Nacional de Policía) que permitía la llamada captura administrativa (CConst., Sentencia C-024 de 1994, II. Fundamento Jurídico; En relación con la “Captura administrativa” y con un recuento de las facultades policiales vigentes en materia de libertad véase Bernal/Montealegre, 2013, T. II, pp. 493 ss.; Para una valoración desde el punto de vista del principio de proporcionalidad véase Prieto, 2006, p. 47 s.; Discutiendo las posiciones en torno a la vigencia de la captura administrativa, Aponte, 2006, p. 53 ss.; Sobre el sentido y alcance de la captura administrativa, Sánchez, 2003, p. 7).", "En el intento de precisar qué y cuáles son los motivos de la captura, la Corte hizo un primer acercamiento a lo que se debería entender por la noción motivos fundados.", "[^9] Art. 28 inc. 1: “Toda persona es libre. Nadie puede ser molestado en su persona o familia, ni reducido a prisión o arresto, ni detenido, ni su domicilio registrado, sino en virtud de mandamiento escrito de autoridad judicial competente, con las formalidades legales y por motivo previamente definido en la ley.” (énfasis fuera del texto).", "En tres niveles de argumentación la Corte desarrolla la conceptualización del término motivos fundados. Primero, la Corte afirma que por motivos fundados se debe entender “hechos, situaciones fácticas, que si bien no tienen la inmediatez de los casos de flagrancia sino una relación mediata con el momento de la aprehensión material, deben ser suficientemente claros y urgentes para justificar la detención” (CConst., C-024 de 1994, num. II. 7.2.). Con ello se alude a una situación objetiva y constatable fácticamente. Segundo, afirma que “el motivo fundado que justifica una aprehensión material es entonces un conjunto articulado de hechos que permitan inferir de manera objetiva que la persona que va a ser aprehendida es probablemente autora de una infracción o partícipe de ella” (CConst., C-024 de 1994, num. II. 7.2.). De esta manera, vincula a los hechos o situaciones fácticas la exigencia de una conclusión objetiva o inferencia razonable.", "Tercero, estableció que “por consiguiente, la mera sospecha o la simple convicción del agente policial no constituye motivo fundado” (CConst., C-024 de 1994, num. II. 7.2.). En ese sentido, diferencia los motivos fundados de la mera sospecha o la simple convicción y, con ello, los somete a un alto estándar de razonabilidad."], "parrafo": [2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Sentencia C-024 de 1994", "segs": [0], "obj": "puertaCerrada"}, {"label": "En el intento de precisar qué", "segs": [1, 2], "obj": "casa"}, {"label": "conceptualización del término motivos fundados", "segs": [3], "obj": "libros"}, {"label": "estableció", "segs": [4], "obj": "lupa"}]}], "rotulo": null, "seccion": "1.3. Una aproximación al concepto “motivos fundados”", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Sentencia C-024 de 1994", "En el intento de precisar qué", "conceptualización del término motivos fundados", "estableció"], "titulo_genially": "Una aproximación al concepto “motivos fundados”"}, {"layout": "giro", "segmentos": ["Según la Corte, esta definición tiene un doble fundamento constitucional. Primero, en el Art. 28 inc. 1 a partir del cual se exige una motivación concreta para las injerencias en derechos fundamentales, específicamente la libertad personal ( CConst., C-024 de 1994, num. II. 6; también sentencia C-580 de 2002, num. 3.2. Artículo 7; C-805 de 2002, num. VI. 6 ss.).", "Segundo, en el Art. 29 que consagra como derecho fundamental el debido proceso, especialmente el inc. 3 que establece el derecho de defensa y el inc. 4 que define la nulidad de las pruebas obtenidas con violación del debido proceso (CConst., C-805 de 2002, num. VI. 30; también CConst., Sentencia T-508 de 2011; C-592 de 2005; Sobre el debido proceso como derecho fundamental véase Bernal/Montealegre, 2013, T. I, pp. 81 ss.; Calle, 2000, pp. 59 ss.; Para un panorama del desarrollo legal del debido proceso en el ordenamiento colombiano véase Camargo, 2002, p. 105 ss.; Una descripción de los sub-principios vinculados al debido proceso véase en Molina, 2002, p. 295 ss.; Suárez, , 2001, p. 220 ss.; sobre la nulidad de las pruebas obtenidas con violación del debido proceso véase Molina, 2012, p. 370).", "Esta posición y conceptualización de la Corte Constitucional, que es confirmada en múltiples sentencias posteriores (La posición sobre los Arts. 28 y 29 CN como límites de las disposiciones y prácticas relativas a la restricción de la libertad ha sido confirmada en reiteradas sentencias de la CConst, entre otras, las sentencias C-179 de 1994; C-327 de 1997; C-251 de 2002; C-580 de 2002, num 3.2.;", "C-025 de 2009 y C-127 de 2011. Sobre la captura administrativa se presentó un cambio de posición con la sentencia C-176 de 2007 en la cual la Corte Constitucional volvió a evaluar la constitucionalidad de dicha forma de captura regulada por el Decreto 1355 de 1970. Al respecto véase Cuellar/Montealegre, 2013, T. II, p. 493 s.), también es recogida en el análisis a la reforma del Art. 250. En la evaluación del inc. 1 y num. 2 de dicho Artículo, como ya se anotó, la Corte reitera los argumentos presentados en la exposición de motivos del Acto Legislativo 03 de 2002, desde el cual se estableció la necesidad de una motivación razonable, diferente a la sospecha, a la hora de adoptar medidas de investigación (CConst., Sentencia C-1092 de 2003, num. 4.1.1.1.).", "Sobre la base de los fundamentos constitucionales y la posición tomada por la Corte Constitucional desde la sentencia C-024 de 1994, se podría concluir que motivo fundado es 1) un conjunto articulado de hechos (situación objetiva), 2) respaldados en elementos materiales probatorios (respaldo probatorio), 3) de los que se concluye objetivamente (inferencia razonable), 4) la probabilidad de autoría o participación en un hecho punible, 5) no equivalentes a la mera sospecha o simple convicción del agente policial (alto estándar de razonabilidad). Adicional a los elementos que se desprenden de la definición dada por la Corte Constitucional, debe decirse que en el marco del Acto Legislativo 03 de 2002 la determinación sobre lo que es un motivo fundado también pasa por la verificación ex ante o ex post por el JCG (control judicial), naturalmente, en lo que corresponde a sus competencias como juez de libertades y de garantías."], "parrafo": [0, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Artículo 7", "segs": [0], "obj": "puertaAbierta"}, {"label": "Sentencia T-508 de 2011", "segs": [1], "obj": "libros"}, {"label": "conceptualización de la Corte Constitucional", "segs": [2], "obj": "documento"}, {"label": "C-025 de 2009 y C-127 de 2011", "segs": [3], "obj": "puertaCerrada"}, {"label": "Sobre la base de los fundamentos constitucionales", "segs": [4], "obj": "lupa"}]}], "rotulo": null, "seccion": "1.3. Una aproximación al concepto “motivos fundados”", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Artículo 7", "Sentencia T-508 de 2011", "conceptualización de la Corte Constitucional", "C-025 de 2009 y C-127 de 2011", "Sobre la base de los fundamentos constitucionales"], "titulo_genially": "Una aproximación al concepto “motivos fundados”"}]}</script>
