a y contusiones en zonas íntimas.", "En los actos urgentes, el informe inicial de la policía judicial concluye preliminarmente que el hecho obedeció a un \"crimen pasional\" o \"violencia intrafamiliar\", recomendando dirigir las primeras órdenes de trabajo a indagar sobre los hábitos personales y relaciones afectivas de la víctima. Paralelamente, los investigadores descartan pedir apoyo de intérpretes en lengua nativa para entrevistarse con la comunidad, aduciendo que \"varios comuneros entienden algo de español\" y que \"las costumbres indígenas complican el trámite del expediente\"."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compara", "items": [{"label": "Considere la siguiente situación hipotética", "segs": [0, 1], "obj": "corazon"}, {"label": "informe inicial", "segs": [2], "obj": "escudo"}]}], "rotulo": null, "seccion": "1. Para comenzar: ¿qué tiene que ver el enfoque diferencial con la construcción del programa metodológico y la validez de las hipótesis delictivas?", "grupo": null, "titulos_fuente": ["1. Para comenzar: ¿qué tiene que ver el enfoque diferencial con la construcción del programa metodológico y la validez de las hipótesis delictivas?"], "encabezados": [], "mediacion": "Comparador: columnas lado a lado; la que se toca se ensancha con su texto completo.", "rotulos": ["Considere la siguiente situación hipotética", "informe inicial"], "titulo_genially": "Para comenzar: ¿qué tiene que ver el enfoque diferencial con la construcción del programa metodológico y la validez de las hipótesis delictivas? (1 de 2)", "complemento_genially": "", "apartado": "1. Para comenzar: ¿qué tiene que ver el enfoque diferencial con la construcción del programa metodológico y la validez de las hipótesis delictivas?", "ilustracion": "archivo-ddhh.webp", "arte": {"img": "archivo-ddhh.webp", "pos": "fondo"}, "relleno": "p-enfoques-diferenciales.webp", "bloques_fuente": [139, 141]}, {"layout": "actividad", "s daje de agresiones contra comunidades étnicas, personas LGBTI, niños, niñas y adolescentes, y personas defensoras de derechos humanos[4].", "Idea Clave: El enfoque diferencial no es una concesión discrecional del investigador ni un adorno retórico en el expediente; es una metodología de análisis probatorio obligatoria diseñada para superar las barreras de acceso a la justicia y esclarecer los móviles delictivos complejos."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Corte Interamericana de Derechos Humanos", "segs": [0], "obj": "libros"}, {"label": "En la sentencia del Caso González", "segs": [1], "obj": "escudo"}, {"label": "Idea Clave", "segs": [2], "obj": "lupa"}]}], "rotulo": null, "seccion": "2. Fundamento y finalidad de los enfoques diferenciales en la investigación de graves violaciones a los derechos humanos", "grupo": "2.2. La debida diligencia reforzada como estándar obligatorio", "titulos_fuente": ["2. Fundamento y finalidad de los enfoques diferenciales en la investigación de graves violaciones a los derechos humanos", "2.2. La debida diligencia reforzada como estándar obligatorio"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Corte Interamericana de Derechos Humanos", "En la sentencia del Caso González", "Idea Clave"], "titulo_genially": "La debida diligencia reforzada como estándar obligatorio", "complemento_genially": "", "apartado": "2. Fundamento y finalidad de los enfoques diferenciales en la investigación de graves violaciones a los derechos humanos", "ilustracion": "p-argumentacion-juridica.webp", "arte": {"img": "p-argumentacion-juridica.webp", "pos": "izq"}, "relleno": "lupa-mapa.webp", "bloques_fuente": [158, 160]}, {"layout": "puntos", "segmentos": ["Para incorporar de forma rigurosa el enfoque diferencial, el fiscal y su equipo de policía judicial deben mapear las variables estructurales que rodean la comisión del delito y la posición de la víctima dentro de su entorno social y territorial.", "Las graves violaciones a los derechos humanos no ocurren en el vacío. Con frecuencia obedecen a patrones sistemáticos o políticas de violencia dirigidas contra sectores específicos. Entre los factores clave a identificar se destacan:", "Relaciones asimétricas de poder: Dominación ejercida por el agresor basada en el control de las armas, la subordinación económica, el estatus institucional o los mandatos de género.", "Marginación socioeconómica y geográfica: La condición de pobreza o ubicación en zonas rurales apartadas profundiza el impacto de la agresión y limita la capacidad de denuncia previa.", "Móviles discriminatorios o de prejuicio: Delitos perpetrados como \"castigo\" o \"represalia\" frente a personas que desafían roles tradicionales de género, defienden el territorio o ejercen una sexualidad diversa.", "Discriminación histórica e institucional preexistente.", "Impacto diferenciado de los repertorios de violencia.", "Asimetrías de poder entre agresores y víctimas.", "Uso de prejuicios para legitimar o invisibilizar el crimen."], "parrafo": [0, 1, 2, 3, 4, 5, 6, 7, 8], "vineta": [2, 3, 4, 5, 6, 7, 8], "lead": [0], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "3.1. Factores de vulnerabilidad y patrones de violencia estructural", "segs": [1, 2, 3, 4], "obj": "documento"}, {"label": "FACTORES ESTRUCTURALES EN LA EVALUACIÓN DEL CASO", "segs": [5, 6, 7, 8], "obj": "escudo"}]}], "rotulo": "Identificación de condiciones de vulnerabilidad, discriminación, desigualdad o afectación diferenciada", "seccion": "3. Identificación de condiciones de vulnerabilidad, discriminación, desigualdad o afectación diferenciada", "grupo": null, "titulos_fuente": ["3. Identificación de condiciones de vulnerabilidad, discriminación, desigualdad o afectación diferenciada"], "encabezados": [
