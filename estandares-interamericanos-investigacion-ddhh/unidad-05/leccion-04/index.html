cción 5.4"}, "leccion_rotulo": "Lección 5.4", "unit": 5, "lesson": 4, "heading": "Lección 5.4. Aportes del enfoque restaurativo a la participación y a la interacción con las víctimas en investigaciones por graves violaciones a los derechos humanos", "scenes": [{"layout": "lamina", "segmentos": ["Al finalizar esta lección, usted estará en capacidad de comprender los conceptos, principios y límites del enfoque restaurativo en la investigación penal de graves violaciones a los derechos humanos, diferenciando sus metodologías de la justicia retributiva ordinaria y aplicando salvaguardas estrictas de voluntariedad, seguridad, no revictimización y proporcionalidad, en armonía con las directivas de la Fiscalía General de la Nación, los manuales de Naciones Unidas y los estándares del Sistema Interamericano."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Objetivo de aprendizaje", "segs": [0], "obj": "lupa", "acomp": ["documento", "carpetas"]}]}], "rotulo": null, "seccion": "Lección 5.4. Aportes del enfoque restaurativo a la participación y a la interacción con las víctimas en investigaciones por graves violaciones a los derechos humanos", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Objetivo de aprendizaje"], "titulo_genially": "Objetivo de aprendizaje", "complemento_genially": "", "apartado": "", "ilustracion": "america-latina.webp", "arte": {"img": "america-latina.webp", "pos": "izq"}, "relleno": "p-enfoque-restaurativo.webp", "bloques_fuente": [393, 393]}, {"layout": "esquema", "segmentos": ["Considere la siguiente situación hipotética de la práctica judicial:", "Escenario de estudio: En el trámite de una investigación por la masacre de ocho pobladores cometida por una estructura paramilitar en connivencia con agentes estatales, varias víctimas sobrevivientes y familiares expresan ante el fiscal del caso que la eventual condena de cárcel para los ejecutores materiales resulta insuficiente para aliviar su sufrimiento. Manifiestan que necesitan espacios de escucha pública, el esclarecimiento de la verdad de los hechos, actos simbólicos de reconocimiento de responsabilidad e iniciativas que reparen el buen nombre de sus seres queridos, quienes fueron falsamente señalados como \"colaboradores de la guerrilla\".", "> Paralelamente, la defensa técnica de uno de los procesados presenta un escrito ante el despacho fiscal solicitando \"tramitar una mediación restaurativa directa con las víctimas para pactar una indemnización económica y ordenar la preclusión e invalidez de la acción penal de inmediato\", argumentando que la justicia restaurativa prima sobre el juicio penal."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Considere la siguiente situación hipotética", "segs": [0, 1], "obj": "puertaCerrada"}, {"label": "> Paralelamente", "segs": [2], "obj": "escudo"}]}], "rotulo": null, "seccion": "1. Para comenzar: ¿qué tiene que ver el enfoque restaurativo con la persecución penal de graves violaciones a los derechos humanos?", "grupo": null, "titulos_fuente": ["1. Para comenzar: ¿qué tiene que ver el enfoque restaurativo con la persecución penal de graves violaciones a los derechos humanos?"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Considere la siguiente situación hipotética", "> Paralelamente"], "titulo_genially": "Para comenzar: ¿qué tiene que ver el enfoque restaurativo con la persecución penal de graves violaciones a los derechos humanos? (1 de 2)", "complemento_genially": "", "apartado": "1. Para comenzar: ¿qué tiene que ver el enfoque restaurativo con la persecución penal de graves violaciones a los derechos humanos?", "ilustracion": "archivo-ddhh.webp", "arte": {"img": "archivo-ddhh.webp", "pos": "fondo"}, "relleno": "p-enfoque-restaurativo.webp", "bloques_fuente": [395, 397]}, {"layout": "actividad", "segmentos": ["Reflexión inicial", "Frente a esta solicitud, ¿cuál de las siguientes actuaciones refleja la aplicación correcta del enfoque restaurativo y sus límites en investigaciones por graves violaciones a los derechos humanos?", "Opción A: Aprobar la solicitud de la defensa y remitir el caso a mediación para precluir la investigación, sosteniendo que la justicia restaurativa permite sustituir las penas de prisión por arreglos económicos privados en cualquier tipo de delito.", "Opción B: Rechazar de plano las inquietudes de las víctimas señalando que el proceso penal acusatorio se limita de forma exclusiva a probar la culpabilidad y fijar la sanción retributiva, sin que la Fiscalía deba ocuparse de expectativas simbólicas, psicosociales o de memoria histórica.", "Opción C: Desestimar la solicitud de preclusión por mediación en razón a los límites normativos y convencionales que prohíben la impunidad o extinción de la acción penal en crímenes internacionales; y al mismo tiempo, incorporar el enfoque restaurativo en la interacción con las víctimas para promover espacios de esclarecimiento de verdad, dignificación y preparación de actos de reconocimiento de responsabilidad dentro del marco del proceso penal.", "Respuesta correcta: Opción C. Retroalimentación pedagógica: De acuerdo con los Principios Básicos del ECOSOC/ONU (2002/12), el Manual de Justicia Restaurativa de la FGN y el Manual de la UNODC, la justicia restaurativa no es un mecanismo de evasión de la responsabilidad ni sustituye la obligación internacional del Estado de investigar, juzgar y sancionar las graves violaciones a los derechos humanos. No obstante, sus principios orientan la actuación fiscal para satisfacer las necesidades de verdad, dignificación, reparación de la reputación y restauración del tejido social de las víctimas."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "actividad", "modo": "preguntas", "intro": [{"tipo": "rot", "segs": [0]}], "preguntas": [{"contexto": [], "cab": null, "enunciado": [1], "respuesta": 5, "retro": [], "fuente": [], "opciones": [{"seg": 2, "letra": "A", "marcada": true, "ok": false, "meme": {"img": "memes/10_U5_L5_4_perdon_no_archiva.webp", "alt": "¡No tan rápido! ¿El perdón cierra el caso? ¡Restaurar no es borrar el deber estatal! El perdón o un acuerdo restaurativo no extinguen automáticamente la obligación de investigar, juzgar y sancionar graves violaciones. Las medidas restaurativas deben respetar la voluntad y los derechos de las víctimas."}}, {"seg": 3, "letra": "B", "marcada": true, "ok": false}, {"seg": 4, "letra": "C", "marcada": true, "ok": true}]}], "items": [{"label": "Pregunta 1", "segs": [1, 2, 3, 4, 5], "obj": "documento"}], "cierre": []}], "rotulo": null, "seccion": "1. Para comenzar: ¿qué tiene que ver el enfoque restaurativo con la persecución penal de graves violaciones a los derechos humanos?", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Actividad con retroalimentación: se elige una opción; si no es la correcta, se lee la retroalimentación y se vuelve a intentar; la correcta deja pasar a la siguiente.", "rotulos": ["Pregunta 1"], "titulo_genially": "Para comenzar: ¿qué tiene que ver el enfoque restaurativo con la persecución penal de graves violaciones a los derechos humanos? (2 de 2)", "complemento_genially": "", "apartado": "1. Para comenzar: ¿qué tiene que ver el enfoque restaurativo con la persecución penal de graves violaciones a los derechos humanos?", "ilustracion": "p-enfoque-restaurativo.webp", "relleno": "reunion-justicia.webp", "bloques_fuente": [398, 403]}, {"layout": "esquema", "segmentos": ["La justicia restaurativa constituye una visión evolutiva del tratamiento de la delincuencia y del conflicto punible. A diferencia del modelo penal tradicional enfocado primordialmente en la infracción de la norma legal y el castigo del infractor, el enfoque restaurativo concibe el delito como un acto que inflige un daño real a las personas, a sus familias y a las comunidades.", "El Consejo Económico y Social de las Naciones Unidas (ECOSOC), en sus Principios básicos sobre la utilización de programas de justicia restitutiva en materia penal (Resolución 2002/12), define el programa de justicia restaurativa como todo programa que utiliza procesos restaurativos para lograr resultados de sanación, reparación y reintegración. Por su parte, el artículo 518 de la Ley 906 de 2004 y el Manual de Justicia Restaurativa de la FGN la conceptualizan como:", "Todo proceso en el que la víctima y el imputado, acusado o sentenciado participan conjuntamente de forma activa en la resolución de cuestiones derivadas del delito en busca de un resultado restaurativo, con o sin la participación de un facilitador\"."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "justicia restaurativa", "segs": [0], "obj": "reloj"}, {"label": "Consejo Económico y Social", "segs": [1, 2], "obj": "libros"}]}], "rotulo": null, "seccion": "2. Concepto, principios y límites del enfoque restaurativo en contextos de graves violaciones a los derechos humanos", "grupo": "2.1. Definición y marco conceptual del enfoque restaurativo", "titulos_fuente": ["2. Concepto, principios y límites del enfoque restaurativo en contextos de graves violaciones a los derechos humanos", "2.1. Definición y marco conceptual del enfoque restaurativo"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["justicia restaurativa", "Consejo Económico y Social"], "titulo_genially": "Definición y marco conceptual del enfoque restaurativo", "complemento_genially": "", "apartado": "2. Concepto, principios y límites UNODC y los Principios Básicos de la ONU, la práctica restaurativa se sostiene sobre cinco pilares:", "Reconocimiento del daño: Colocar las necesidades materiales, emocionales y comunitarias de la víctima en el centro de la respuesta judicial.", "Responsabilización activa: Motivar al infractor a comprender las causas y consecuencias de su conducta delictiva y asumir un compromiso genuino de reparación.", "Participación voluntaria e informada: Garantizar que todas las partes ingresen y se mantengan en el proceso por decisión libre, sin presiones ni coacciones.", "Restauración del tejido social: Favorecer la reintegración comunitaria tanto de la víctima como del ofensor, previniendo la reincidencia.", "Flexibilidad y adecuación cultural: Adaptar las dinámicas de diálogo a los contextos locales, las costumbres indígenas y las tradiciones comunitarias."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [1, 2, 3, 4, 5], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Según el Manual sobre programas de justicia", "segs": [0, 1], "obj": "reloj"}, {"label": "Responsabilización activa", "segs": [2], "obj": "documento"}, {"label": "Participación voluntaria e informada", "segs": [3], "obj": "escudo"}, {"label": "Restauración del tejido social", "segs": [4], "obj": "carpetas"}, {"label": "Flexibilidad y adecuación cultural", "segs": [5], "obj": "lupa"}]}], "rotulo": null, "seccion": "2. Concepto, principios y límites del enfoque restaurativo en contextos de graves violaciones a los derechos humanos", "grupo": "2.2. Principios rectores del enfoque restaurativo", "titulos_fuente": ["2. Concepto, principios y límites del enfoque restaurativo en contextos de graves violaciones a los derechos humanos", "2.2. Principios rectores del enfoque restaurativo"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Según el Manual sobre programas de justicia", "Responsabilización activa", "Participación voluntaria e informada", "Restauración del tejido social", "Flexibilidad y adecuación cultural"], "titulo_genially": "Principios rectores del enfoque restaurativo", "complemento_genially": "", "apartado": "2. Concepto, principios y límites del enfoque restaurativo en contextos de graves violaciones a los derechos humanos", "ilustracion": "p-revision-digital.webp", "arte": {"img": "p-revision-digital.webp", "pos": "der"}, "relleno": "ascenso-equipo.webp", "bloques_fuente": [416, 421]}, {"layout": "rejilla", "segmentos": ["El enfoque restaurativo en el ámbito de las graves violaciones a los derechos humanos y del Derecho Internacional Humanitario encuentra límites normativos e infranqueables:", "Inoponibilidad de la extinción de la acción penal: En el ordenamiento jurídico colombiano (Ley 906 de 2004, arts. 521 y 524) y según la sentencia C-979 de 2005 de la Corte Constitucional, la mediación solo produce la extinción de la acción penal en delitos querellables o de baja lesividad con pena mínima inferior a 5 años que afecten bienes jurídicos exclusivamente individuales.", "Prohibición de amnistías e impunidad encubierta: Frente a crímenes de lesa humanidad, ejecuciones extrajudiciales, tortura, desaparición forzada o violencia sexual sistemática, los mecanismos restaurativos jamás pueden utilizarse para sustituir la pena, ocultar la verdad o extinguir la acción penal del Estado.", "Prevalencia del jus puniendi internacional: Los Principios Básicos de la ONU establecen expresamente en su preámbulo y cláusula de salvaguardia que el uso de metodologías restaurativas *\"no menoscaba el derecho ni el deber de los Estados de perseguir penalmente a los presuntos delincuentes\"."], "parrafo": [0, 1, 2, 3], "vineta": [1, 2, 3], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "enfoque restaurativo en el ámbito", "segs": [0, 1], "obj": "libros", "ilus": "p-enfoque-restaurativo.webp"}, {"label": "Prohibición de amnistía umática ante una autoridad imparcial que escucha con respeto y calidez tiene un efecto catártico y reparador por sí mismo. La escucha activa en el proceso penal permite a las víctimas:", "Reconstruir su proyecto de vida y superar la condición de agravio permanente.", "Descongelar el marco de negación e invisibilidad al que fueron sometidas por los perpetradores.", "Manifestar sus necesidades específicas de reparación simbólica y colectiva (monumentos, libros de memoria, solicitudes de perdón)."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [3, 4, 5], "lead": [0, 1], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "La dignificación de la víctima a través de la escucha y la palabra", "segs": [2, 3, 4, 5], "obj": "escudo", "acomp": ["documento", "carpetas"]}]}], "rotulo": "Diferencias entre participación restaurativa, reparación, mediación y mecanismos ordinarios de justicia penal", "seccion": "3. Diferencias entre participación restaurativa, reparación, mediación y mecanismos ordinarios de justicia penal", "grupo": null, "titulos_fuente": ["3. Diferencias entre participación restaurativa, reparación, mediación y mecanismos ordinarios de justicia penal"], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["La dignificación de la víctima a través de la escucha y la palabra"], "titulo_genially": "Diferencias entre participación restaurativa, reparación, mediación y mecanismos ordinarios de justicia penal", "complemento_genially": "", "apartado": "3. Diferencias entre participación restaurativa, reparación, mediación y mecanismos ordinarios de justicia penal", "ilustracion": "reunion-justicia.webp", "relleno": "america-latina.webp", "bloques_fuente": [428, 434]}, {"layout": "puntos", "segmentos": ["Los actos de reconocimiento público de responsabilidad y solicitud de disculpas —ordenados de manera constante por la Corte IDH (Cantoral Benavides, Campo Algodonero, Masacre de La Rochela, Bedoya Lima)— constituyen la manifestación restaurativa por excelencia en el ámbito del Derecho Internacional de los Derechos Humanos:", "Expresión de responsabilidad explícita: La autoridad competente debe nombrar a los perpetradores o a la institución implicada, reconociendo que los hechos constituyeron violaciones graves e injustificables.", "Reivindicación de la honra de las víctimas: Desagraviar públicamente a quienes fueron calificados como \"terroristas\" o \"delincuentes\", devolviéndoles su dignidad ante la sociedad.", "Negociación y diseño participativo: El acto de reconocimiento no debe ser un evento burocrático unilateral. Debe negociarse previamente con las víctimas y sus representantes en cuanto a fecha, lugar, lenguaje y participantes.", "Jurisprudencia Relevante: \"El reconocimiento público de responsabilidad satisface una dimensión reparadora fundamental para las víctimas y sus familiares, en tanto representa una ruptura explícita con el pasado de impunidad, restituye el buen nombre de los agraviados y reafirma el compromiso Solemne del Estado con las garantías de no repetición\" (Corte IDH, Caso Mujeres Víctimas de Tortura Sexual en Atenco vs. México, Sentencia de 2018, párrs. 347-350)."], "parrafo": [0, 1, 2, 3, 4], "vineta": [1, 2, 3], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "actos de reconocimiento público de responsabilidad", "segs": [0, 1], "obj": "libros"}, {"label": "Reivindicación de la honra de las víctimas", "segs": [2], "obj": "escudo"}, {"label": "Negociación y diseño participativo", "segs": [3], "obj": "documento"}, {"label": "Jurisprudencia Relevante", "segs": [4], "obj": "carpetas"}]}], "rotulo": null, "seccion": "3. Diferencias entre participación restaurativa, reparación, mediación y mecanismos ordinarios de justicia penal", "grupo": "Los actos de reconocimiento público de responsabilidad como hito restaurativo", "titulos_fuente": ["3. Diferencias entre participación restaurativa, reparación, mediación y mecanismos ordinarios de justicia penal", "Los actos de reconocimiento público de responsabilidad como hito restaurativo"], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["actos de reconocimiento público de responsabilidad", "Reivindicación de la honra de las víctimas", "Negociación y diseño participativo", "Jurisprudencia Relevante"], "titulo_genially": "Los actos de reconocimiento público de responsabilidad como hito restaurativo", "complemento_genially": "", "apartado": "3. Diferencias entre participación restaurativa, reparación, mediación y mecanismos ordinarios de justicia penal", "ilustracion": "analisis-colaborativo.webp", "relleno": "p-enfoque-restaurativo.webp", "bloques_fuente": [436, 440]}, {"layout": "esquema", "segmentos": ["De acuerdo con el párrafo 13 de los Principios Básicos de la ONU y el Manual de Justicia Restaurativa de la FGN, ni la víctima ni el procesado pueden ser coaccionados, engañados o inducidos por medios desleales a participar en un proceso restaurativo o aceptar un acuerdo. El consentimiento debe ser previo, escrito y revocable sin consecuencias negativas para la marcha de la investigación penal.", "Prohibición de confrontación en escenarios de asimetría de poder y Violencia Basada en Género (VBG)", "Un error recurrente en la gestión judicial es intentar forzar reuniones cara a cara entre víctimas y agresores en casos de violencias complejas.", "Reflexión para el Fiscal: ¿Proceden las reuniones conjuntas en casos de violencia intra-familiar, violencia sexual o tortura? El Manual de Justicia Restaurativa de la FGN (pág. 29) y el Protocolo de Violencia Sexual prohíben taxativamente la confrontación directa cuando exista un alto riesgo de revictimización o una asimetría extrema de poder. En estos eventos, si existe interés en un intercambio restaurativo, el facilitador debe emplear exclusivamente metodologías de mediación indirecta o diálogo itinerante (intercambio de notas, videos o mensajes a través del mediador)."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "De acuerdo con el párrafo 13", "segs": [0], "obj": "escudo"}, {"label": "Prohibición de confrontación en escenarios", "segs": [1], "obj": "documento"}, {"label": "error recurrente en la gestión judicial", "segs": [2], "obj": "carpetas"}, {"label": "Reflexión para el Fiscal", "segs": [3], "obj": "lupa"}]}], "rotulo": null, "seccion": "4. Condiciones de voluntariedad, seguridad, no revictimización y ausencia de coerción en prácticas de carácter restaurativo", "grupo": "Consentimiento informado y revocabilidad", "titulos_fuente": ["4. Condiciones de voluntariedad, seguridad, no revictimización y ausencia de coerción en prácticas de carácter restaurativo", "Consentimiento informado y revocabilidad"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["De acuerdo con el párrafo 13", "Prohibición de confrontación en escenarios", "error recurrente en la gestión judicial", "Reflexión para el Fiscal"], "titulo_genially": "Consentimiento informado y revocabilidad", "complemento_genially": "", "apartado": "4. Condiciones de voluntariedad, seguridad, no revictimización y ausencia de coerción en prácticas de carácter restaurativo", "ilustracion": "p-enfoque-restaurativo.webp", "arte": {"img": "p-enfoque-restaurativo.webp", "pos": "izq"}, "relleno": "p-enfoques-diferenciales.webp", "bloques_fuente": [443, 446]}, {"layout": "rejilla", "segmentos": ["Ámbitos de aplicación legítima en el proceso penal ordinario (Ley 906 de 2004)", "Aunque la mediación no extinga la acción penal en delitos graves, el fiscal de conocimiento puede valorar el desarrollo exitoso de un proceso restaurativo voluntario en los siguientes momentos procesales[:", "En la solicitud y evaluación de medidas de aseguramiento: La disposición sincera del procesado de reparar el daño y participar en procesos restaurativos debe valorarse como un indicador positivo al evaluar el riesgo de no comparecencia o fuga (art. 312 C.P.P.).", "En la negociación de Preacuerdos y Principio de Oportunidad: La conducta restaurativa del imputado puede servir de fundamento para concertar degradaciones en la participación o eliminación de agravantes dentro del margen de discrecionalidad legal.", "En la dosificación punitiva y cumplimiento de la pena: Al momento de dictar sentencia o durante la ejecución de la pena ante el Juez de Ejecución de Penas, el cumplimiento de acuerdos restaurativos es un requisito determinante para conceder la prisión domiciliaria o la libertad condicional (C.P. arts. 38B y 64)."], "parrafo": [0, 1, 2, 3, 4], "vineta": [2, 3, 4], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "Ámbitos de aplicación legítima en el proceso", "segs": [0], "obj": "libros", "ilus": "lupa-mapa.webp"}, {"label": "Aunque la mediación no extinga la acción", "segs": [1, 2], "obj": "reloj", "ilus": "ascenso-equipo.webp"}, {"label": "En la negociación de Preacuerdos y Principio", "segs": [3], "obj": "personas", "ilus": "p-argumentacion-juridica.webp"}, {"label": "En la dosificación punitiva y cumplimiento", "segs": [4], "obj": "puertaAbierta", "ilus": "documento-colectivo.webp"}]}], "rotulo": null, "seccion": "5. Posibilidades y límites de incorporación de prácticas restaurativas en la actuación de la Fiscalía y su relación con otros mecanismos de justicia", "grupo": null, "titulos_fuente": ["5. Posibilidades y límites de incorporación de prácticas restaurativas en la actuación de la Fiscalía y su relación con otros mecanismos de justicia"], "encabezados": [], "mediacion": "Rejilla en collage: ventanas con ilustración que llenan el marco; cada una abre su texto completo.", "rotulos": ["Ámbitos de aplicación legítima en e
