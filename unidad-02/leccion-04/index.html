ción; al acertar se lee el texto completo.", "rotulos": ["Duplicación de términos", "Exclusión de términos", "Restablecimiento"], "titulo_genially": "Duplicación y excepciones"}, {"layout": "ruta", "segmentos": ["- Radicación de la petición: La solicitud de libertad por vencimiento de términos se solicita formalmente de manera oral o escrita ante el Juez de Control de Garantías (o el juez de conocimiento según la etapa procesal).", "- Legitimación: Puede ser presentada por la defensa, el mismo procesado, o impulsada por la Fiscalía o el Ministerio Púbico (Procuraduría).", "- Pruebas y soporte probatorio: Se deben aportar los documentos que acrediten el conteo de los días, tales como las copias de las actas de las audiencias anteriores (incluyendo las aplazadas o fallidas) y la constancia del historial del proceso en el Centro de Servicios Judiciales.", "- Audiencia pública: El juez convoca a una audiencia donde la defensa sustenta el conteo objetivo de los plazos, la Fiscalía y las víctimas se pronuncian, y el juez decide si decreta la libertad inmediata (que puede ser pura y simple o acompañada de medidas de aseguramiento no privativas de la libertad)."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "Radicación de la petición", "segs": [0], "obj": "puertaAbierta"}, {"label": "Legitimación", "segs": [1], "obj": "personas"}, {"label": "Pruebas y soporte probatorio", "segs": [2], "obj": "reloj"}, {"label": "Audiencia pública", "segs": [3], "obj": "puertaCerrada"}]}], "rotulo": null, "seccion": "4.4. Trámite de la solicitud", "grupo": null, "titulos_fuente": ["4.4. Trámite de la solicitud"], "encabezados": [], "mediacion": "Ruta paso a paso con ficha que avanza.", "rotulos": ["Radicación de la petición", "Legitimación", "Pruebas y soporte probatorio", "Audiencia pública"], "titulo_genially": "Trámite de la solicitud"}]}</script>
