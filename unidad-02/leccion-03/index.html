aves y fundados para considerar que se puede: a. Destruir, modificar, dirigir, impedir, ocultar o falsificar elementos de prueba. b. Inducir a coimputados testigos, peritos o terceros para que informen falsamente o se comporten de manera desleal o reticente. c. Cuando impida o dificulte la realización de la diligencia o de la labor de los funcionarios y demás intervinientes en la actuación.", "- Peligro para la comunidad (art. 308 num. 2.° y 310 del CPP)144 145 1.4.2.1. Peligro futuro, gravedad, modalidad de la conducta punible y la pena imponible; Continuación de la actividad delictiva o su probable vinculación con organizaciones criminales; El número de delitos que se le imputan y la naturaleza de estos; El hecho de estar disfrutando un mecanismo sustitutivo de la pena privativa de la libertad, por delito doloso o preterintencional; La existencia de sentencias condenatorias vigentes por delito doloso o preterintencional; Cuando se utilicen armas de fuego; armas convencionales; armas de fuego hechizas o artesanales; armas, elementos y dispositivos menos letales; o armas blancas; Cuando el punible sea por abuso sexual con menor de catorce (14) años; Cuando haga parte o pertenezca a un grupo de delincuencia organizada;", "Las autoridades judiciales deberán tener en cuenta, al momento de realizar la valoración autónoma del peligro para la comunidad, si la persona fue o ha sido imputada por delitos violentos, ha suscrito preacuerdo, aceptado cargos u otorgado principio de oportunidad en los últimos tres (3) años por la comisión de delitos contra la vida y la integridad personal o contra el patrimonio económico.", "- Peligro para la víctima (art. 308 num. 2.° y 311 del CPP). Existencia de motivos graves y fundados de atentar contra la vida e integridad personal de la víctima, sus familiares o sus bienes."], "parrafo": [0, 1, 2, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mapa", "items": [{"label": "hechos jurídicamente rele
