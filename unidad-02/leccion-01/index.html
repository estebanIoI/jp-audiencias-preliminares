l que infieran autoría o participación en el delito.", "Individualización: Plena identificación de la persona requerida (nombre, documentos, características) y especificación de la conducta punible investigada.", "Delito susceptible: Que se investigue una conducta que permita medida privativa de la libertad."], "parrafo": [0, 1, 2, 3], "vineta": [0, 1, 2, 3], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "empareja", "items": [{"label": "Orden escrita", "segs": [0], "obj": "escudo", "nombre_texto": "Orden escrita"}, {"label": "Motivos razonablemente fundados", "segs": [1], "obj": "lupa", "nombre_texto": "Motivos razonablemente fundados"}, {"label": "Individualización", "segs": [2], "obj": "personas", "nombre_texto": "Individualización"}, {"label": "Delito susceptible", "segs": [3], "obj": "puertaCerrada", "nombre_texto": "Delito susceptible"}]}], "rotulo": null, "seccion": "1.2. Requisitos", "grupo": null, "titulos_fuente": ["1.2. Requisitos"], "encabezados": [], "mediacion": "Emparejar término y descripción; al acertar se lee el texto completo.", "rotulos": ["Orden escrita", "Motivos razonablemente fundados", "Individualización", "Delito susceptible"], "titulo_genially": "Requisitos"}, {"layout": "ruta", "segmentos": ["El fiscal asignado solicita de manera motivada y, por regla general, en audiencia reservada, la expedición de la orden. El fiscal debe identificar o individualizar al indiciado; Indicar que el delito por el que se hace la solicitud tiene prevista medida de aseguramiento privativa de la libertad (art. 313 del CPP); Acreditar los hechos jurídicamente relevantes; Argumentar por qué se infiere que el indiciado es autor o participe del delito investigado (art. 221 del CPP); Realizar juicio de proporcionalidad; Señalar el término de vigencia de la orden de captura (art. 298 del CPP); Sustentar la necesidad o no, de que la orden sea divulgada por la Policía Judicial a través de los medios de comunicación.", "El juez evalúa la necesi
