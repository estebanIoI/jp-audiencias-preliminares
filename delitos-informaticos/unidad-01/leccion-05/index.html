p": {"r": 1.0791, "p": [[72, 17], [40, 36], [73, 60], [43, 82]]}, "evidencia-nube.webp": {"r": 1.1399, "p": [[53, 18], [34, 59], [81, 66]]}, "llamada-ingenieria.webp": {"r": 1.2162, "p": [[54, 48], [69, 25]]}, "doble-extorsion.webp": {"r": 1.1555, "p": [[76, 9], [82, 26], [52, 48], [82, 50]]}, "rastreo-criptoactivos.webp": {"r": 1.1796, "p": [[46, 19], [70, 37], [54, 63], [70, 14]]}, "triada-cid.webp": {"r": 1.1719, "p": [[20, 25], [50, 20], [78, 25]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "retro": {"reacciones": ["p-phishing.webp", "p-ransomware.webp", "p-conectividad-ip.webp", "p-botnets.webp", "p-memoria-disco.webp", "p-hardware-software.webp"], "frases": ["¿En serio?", "¿Cómo así?", "¡Falta algo!", "¡Ojo con eso!", "¡Mira más allá!", "¿Y la prueba?", "¡Revisa eso!", "¡Un momento!", "¡No tan rápido!"], "acierto": ["p-senalando.webp", "p-caso-fasttrack.webp", "p-tic-ciberespacio.webp", "p-evidencia-digital.webp"], "rotulo": "Unidad 1 · Lección 5"}, "leccion_rotulo": "Lección 5", "unit": 1, "lesson": 5, "heading": "Lección 5: Conceptos básicos y terminología técnica asociada a los tipos penales de delitos informáticos", "scenes": [{"layout": "esquema", "segmentos": ["Para que un programa metodológico funcione, el fiscal y el ingeniero investigador deben hablar el mismo idioma. La adecuada subsunción jurídica bajo la Ley 1273 de 2009 requiere precisión léxica. Esta lección cierra la Unidad 1 y sirve de puente hacia la Unidad 2. Las lecciones anteriores explicaron cómo funcionan los sistemas, las redes y las modalidades delictivas. Esta enseña a nombrar esos fenómenos con exactitud, porque de esa exactitud depende el tipo penal que se impute.", "La imprecisión tiene un costo concreto. Si fiscales o investigadores no entienden la diferencia entre un daño informático y un simple virus, o cómo se oculta una dirección IP, no podrán estructurar una imputación sólida ni dar a tiempo órdenes de policía judicial que protejan la evidencia. La palabra «hackeo», por ejemplo, no describe ninguna conducta típica: puede referirse a un acceso abusivo, a un daño informático, a una interceptación o a una transferencia no consentida. Esta lección se cumple cuando el participante deja de traducir la palabra «hackeo» por cualquier artículo del Título VII BIS. Nombrar con precisión el fenómeno es lo que permite encuadrarlo en el tipo correcto.", "Hay que tener presente una advertencia de método. El término técnico no sustituye el análisis del tipo penal. Un concepto técnico describe lo que ocurrió en el sistema. El tipo penal exige verificar además sus elementos objetivos, normativos y subjetivos, que se estudiarán en la Unidad 2. La terminología orienta la adecuación típica, pero no la reemplaza."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Hablar el mismo idioma", "segs": [0], "obj": "libros"}, {"label": "La imprecisión tiene un costo concreto", "segs": [1], "obj": "reloj"}, {"label": "Una advertencia de método", "segs": [2], "obj": "lupa"}]}], "rotulo": null, "seccion": "5.1. Por qué la precisión léxica es una exigencia jurídica", "grupo": null, "titulos_fuente": ["5.1. Por qué la precisión léxica es una exigencia jurídica"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Hablar el mismo idioma", "La imprecisión tiene un costo concreto", "Una advertencia de método"], "titulo_genially": "Por qué la precisión léxica es una exigencia jurídica", "complemento_genially": "", "apartado": "5.1. Por qué la precisión léxica es una exigencia jurídica", "ilustracion": "ip-puertos.webp", "arte": {"img": "ip-puertos.webp", "pos": "fondo"}, "relleno": "p-botnets.webp", "bloques_fuente": [421, 423]}, {"layout": "giro", "segmentos": ["Antes de los términos asociados a cada delito, conviene fijar los dos conceptos sobre los que se construye todo el Título VII BIS. Ambos provienen del Convenio de Budapest:", "Sistema informático: todo dispositivo aislado o conjunto de dispositivos interconectados que aseguran el tratamiento automatizado de datos.", "Dato informático: la representación de hechos, información o conceptos en una forma adecuada para su tratamiento en un sistema informático.", "Estos conceptos son elementos descriptivos de los tipos penales: delimitan el medio tecnológico sobre el que recae la conducta. Su alcance es amplio. Un teléfono, un reloj inteligente o un enrutador pueden ser sistemas informáticos. Sobre ellos opera el bien jurídico autónomo de la Ley 1273 de 2009: la confidencialidad, la integridad y la disponibilidad de los datos y sistemas informáticos."], "parrafo": [0, 1, 2, 3], "vineta": [1, 2], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Antes de los términos asociados a cada", "segs": [0, 1], "obj": "computador"}, {"label": "Dato informático", "segs": [2], "obj": "carpetas"}, {"label": "Ley 1273 de 2009", "segs": [3], "obj": "libros"}]}], "rotulo": null, "seccion": "5.2. Dos conceptos de partida: sistema informático y dato informático", "grupo": null, "titulos_fuente": ["5.2. Dos conceptos de partida: sistema informático y dato informático"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Antes de los términos asociados a cada", "Dato informático", "Ley 1273 de 2009"], "titulo_genially": "Dos conceptos de partida: sistema informático y dato informático", "complemento_genially": "", "apartado": "5.2. Dos conceptos de partida: sistema informático y dato informático", "ilustracion": "p-senalando.webp", "arte": {"img": "p-senalando.webp", "pos": "izq"}, "relleno": "triada-cid.webp", "bloques_fuente": [425, 428]}, {"layout": "rejilla", "segmentos": ["Vulnerabilidad. Es un fallo de seguridad en un sistema. Aprovecharla para ingresar sin autorización es una de las formas más frecuentes de acceso abusivo a un sistema informático (art. 269A). Pero conviene precisar el alcance de esta relación. El acceso abusivo es un delito de mera conducta que sanciona el ingreso o la permanencia no autorizados en un sistema informático, protegido o no con una medida de seguridad. Su elemento central es la falta de autorización, no la existencia de una vulnerabilidad. Por eso, también hay acceso abusivo cuando alguien usa credenciales que debían estar revocadas, como el exempleado del caso de la Unidad 2. El tipo incluye además la modalidad de mantenerse dentro del sistema contra la voluntad de quien tiene el derecho legítimo de excluirlo.", "Dos precisiones refuerzan la idea. Primera: que el sistema esté o no protegido con una medida de seguridad es indiferente para la tipicidad, porque es un elemento descriptivo y no un requisito. Segunda: el elemento normativo «sin autorización» indica qué debe probarse primero, la ausencia de facultad, y su verificación temprana puede cerrar el caso por atipicidad antes de comprometer recursos periciales. Así ocurre, por ejemplo, con las pruebas de penetración o el ethical hacking autorizados.", "Credencial. Es el dato que permite autenticarse en un sistema, como un usuario, una contraseña o un código de un solo uso. Su relevancia penal depende del contexto. Usar una credencial revocada o ajena configura acceso abusivo. Obtenerla engañando a su titular es el inicio de una cadena que puede terminar en estafa o en transferencia no consentida, según quién ejecute después el acto de disposición, como se vio en la Lección 4.", "Interceptación. Es la captura de información en tránsito dentro de una red o sistema de telecomunicaciones, y corresponde a la interceptación de datos informáticos (art. 269C). Su objeto es el tráfico, el contenedor más efímero, que solo existe mientras circula. Cuando la autoridad quiere capturar ese tráfico en tiempo real, afecta el secreto de las comunicaciones y necesita autorización previa del juez. El mismo concepto técnico describe así una conducta delictiva o una actuación investigativa, según exista o no autorización legítima.", "Exfiltración. Es la extracción no autorizada de información desde un sistema hacia el exterior. Cuando recae sobre bases de datos personales, puede configurar la violación de datos personales (art. 269F), que sanciona la sustracción, venta o compilación no autorizada de bases de datos. En los casos de ransomware, verificar la exfiltración es determinante, porque prueba la doble extorsión."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "Vulnerabilidad", "segs": [0], "obj": "computador", "ilus": "computador-abierto.webp"}, {"label": "Dos precisiones refuerzan la idea", "segs": [1], "obj": "escalones", "ilus": "escudo-datos.webp"}, {"label": "Credencial", "segs": [2], "obj": "libros", "ilus": "p-hardware-software.webp"}, {"label": "Interceptación", "segs": [3], "obj": "puertaCerrada", "ilus": "hardware-software.webp"}, {"label": "Exfiltración", "segs": [4], "obj": "expediente", "ilus": "fasttrack-bodega.webp"}]}], "rotulo": null, "seccion": "5.3. Términos asociados a los delitos contra la confidencialidad", "grupo": null, "titulos_fuente": ["5.3. Términos asociados a los delitos contra la confidencialidad"], "encabezados": [], "mediacion": "Rejilla en collage: ventanas con ilustración que llenan el marco; cada una abre su texto completo.", "rotulos": ["Vulnerabilidad", "Dos precisiones refuerzan la idea", "Credencial", "Interceptación", "Exfiltración"], "titulo_genially": "Términos asociados a los delitos contra la confidencialidad", "complemento_genially": "", "apartado": "5.3. Términos asociados a los delitos contra la confidencialidad", "ilustracion": "triada-cid.webp", "relleno": "flujo-datos.webp", "bloques_fuente": [430, 434]}, {"layout": "esquema", "segmentos": ["Cifrado (criptografía). Es la alteración lógica de los datos para que sean ilegibles. El cifrado es neutro: el titular legítimo lo usa para proteger su información. Usado de forma ilegítima contra los datos de su titular, materializa el daño informático (art. 269D). Este tipo sanciona la alteración, destrucción, borrado o inutilización de datos o sistemas lógicos. Lo que se protege es la integridad, entendida como la conservación del estado original de los datos. En el ransomware, cifrar los archivos los altera, los inutiliza e impide el acceso a ellos.", "El cifrado tiene además una segunda relevancia, esta vez probatoria. Un volumen cifrado, una vez apagado, puede volverse inaccesible aunque esté en poder de la autoridad. Por eso, identificar el cifrado es una tarea de la escena y no del laboratorio.", "Borrado de copias de respaldo. Es una conducta frecuente para impedir la recuperación o eliminar el rastro. Eliminar las copias de seguridad configura daño informático (art. 269D). En el ransomware, los registros de ese borrado son uno de los rastros característicos de la modalidad.", "Malware. Es el término general para el software malicioso, como virus, troyanos o ransomware. Técnicamente, es el software diseñado para interrumpir, dañar o acceder sin autorización a un sistema informático. Su relación con el uso de software malicioso (art. 269E) es directa. Este tipo sanciona a quien, sin estar facultado para ello, produzca, trafique, adquiera, distribuya, venda, envíe, introduzca o extraiga del territorio nacional software malicioso. El malware casi nunca aparece solo. Suele ser el instrumento de otros delitos: el acceso que permite, el daño que causa o la transferencia que ordena. Por eso, encontrarlo debe llevar a preguntar qué hizo, no solo a calificar su presencia.", "Hash o huella digital. Es una función matemática que transforma cualquier volumen de datos en una cadena de longitud fija que lo identifica de manera única. No es un elemento de ningún tipo penal, pero es indispensable para probar la integridad. Acredita que el elemento no se alteró entre dos momentos, aunque no prueba su autenticidad ni la licitud de su origen. Es una condición necesaria del valor probatorio, no suficiente. Se estudiará a fondo en la Unidad 4."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Cifrado (criptografía)", "segs": [0], "obj": "reloj"}, {"label": "Una segunda relevancia, esta vez probatoria", "segs": [1], "obj": "documento"}, {"label": "Borrado de copias de respaldo", "segs": [2], "obj": "carpetas"}, {"label": "Malware", "segs": [3], "obj": "computador"}, {"label": "Hash o huella digital", "segs": [4], "obj": "huella"}]}], "rotulo": null, "seccion": "5.4. Términos asociados a los delitos contra la integridad", "grupo": null, "titulos_fuente": ["5.4. Términos asociados a los delitos contra la integridad"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Cifrado (criptografía)", "Una segunda relevancia, esta vez probatoria", "Borrado de copias de respaldo", "Malware", "Hash o huella digital"], "titulo_genially": "Términos asociados a los delitos contra la integridad", "complemento_genially": "", "apartado": "5.4. Términos asociados a los delitos contra la integridad", "ilustracion": "p-botnets.webp", "arte": {"img": "p-botnets.webp", "pos": "der"}, "relleno": "triada-cid.webp", "bloques_fuente": [436, 440]}, {"layout": "rejilla", "segmentos": ["Denegación de servicio (DDoS). Es la saturación de una red o un sistema hasta dejarlo fuera de servicio, y corresponde a la obstaculización ilegítima (art. 269B). Este tipo sanciona los ataques contra la disponibilidad de redes o sistemas. La disponibilidad es el acceso oportuno y permanente a los sistemas informáticos.", "Botnet o red zombi. Es un conjunto de equipos infectados y controlados a distancia por un tercero para ejecutar ataques masivos. El término tiene una consecuencia de imputación: los titulares de esos equipos suelen ser también víctimas de un acceso abusivo previo. Por eso, la imputación exige probar el control de la infraestructura y no la simple participación del equipo.", "Servidor de mando y control. Es la infraestructura desde la que el atacante da instrucciones a los equipos que ha comprometido. Identificarlo permite probar el control de la operación, que es lo que sostiene la imputación de autoría.", "La tríada de confidencialidad, integridad y disponibilidad funciona, en la práctica, como un filtro para descartar. Si la conducta no impidió el acceso legítimo al sistema, no hay obstaculización. Si no alteró el estado del dato, no hay daño informático. Identificar la dimensión afectada es el primer filtro de la adecuación típica, antes de discutir los verbos rectores."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "Denegación de servicio (DDoS)", "segs": [0], "obj": "computador", "ilus": "botnet-equipos.webp"}, {"label": "Botnet o red zombi", "segs": [1], "obj": "reloj", "ilus": "computador-abierto.webp"}, {"label": "Servidor de mando y control", "segs": [2], "obj": "carpetas", "ilus": "anonimato-redes.webp"}, {"label": "integridad y disponibilidad funciona", "segs": [3], "obj": "documento", "ilus": "escudo-datos.webp"}]}], "rotulo": null, "seccion": "5.5. Términos asociados a los delitos contra la disponibilidad", "grupo": null, "titulos_fuente": ["5.5. Términos asociados a los delitos contra la disponibilidad"], "encabezados": [], "mediacion": "Rejilla en collage: ventanas con ilustración que llenan el marco; cada una abre su texto completo.", "rotulos": ["Denegación de servicio (DDoS)", "Botnet o red zombi", "Servidor de mando y control", "integridad y disponibilidad funciona"], "titulo_genially": "Términos asociados a los delitos contra la disponibilidad", "complemento_genially": "", "apartado": "5.5. Términos asociados a los delitos contra la disponibilidad", "ilustracion": "triada-cid.webp", "relleno": "ransomware-bodega.webp", "bloques_fuente": [442, 445]}, {"layout": "giro", "segmentos": ["Phishing. Es una técnica de ingeniería social para engañar a los usuarios y obtener información confidencial, suplantando a una entidad legítima. Como término técnico, describe un método, no un delito. Puede llevar a una estafa (art. 246), a una suplantación de sitios web (art. 269G) o a una transferencia no consentida de activos (art. 269J). La calificación depende de lo que se haga después con la información obtenida y de quién ejecute el acto de disposición.", "Suplantación de sitio web o página espejo. Es la creación de páginas que imitan a una legítima para capturar datos personales de forma fraudulenta. Configura la suplantación de sitios web (art. 269G). Clonar una página de banca en línea y capturar las credenciales que los usuarios digitan es el ejemplo típico.", "Manipulación del procesamiento de datos. Es la alteración de la lógica con la que un sistema procesa una operación, por ejemplo, para cambiar la cuenta destino de un pago. Esta es la base del criterio que separa las defraudaciones informáticas de la estafa. La transferencia no consentida de activos (art. 269J) consiste en alterar el procesamiento de datos para realizar transferencias de activos financieros. El hurto por medios informáticos (art. 269I) es el apoderamiento de una cosa mueble ajena superando o manipulando un sistema informático. En ninguno de los dos se engaña a un ser humano: se vulnera o altera la lógica de una máquina."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Phishing", "segs": [0], "obj": "reloj"}, {"label": "Suplantación de sitio web o página espejo", "segs": [1], "obj": "puertaCerrada"}, {"label": "Manipulación del procesamiento de datos", "segs": [2], "obj": "carpetas"}]}], "rotulo": null, "seccion": "5.6. Términos asociados a las defraudaciones y a la suplantación", "grupo": null, "titulos_fuente": ["5.6. Términos asociados a las defraudaciones y a la suplantación"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Phishing", "Suplantación de sitio web o página espejo", "Manipulación del procesamiento de datos"], "titulo_genially": "Términos asociados a las defraudaciones y a la suplantación", "complemento_genially": "", "apartado": "5.6. Términos asociados a las defraudaciones y a la suplantación", "ilustracion": "p-phishing.webp", "arte": {"img": "p-phishing.webp", "pos": "izq"}, "relleno": "llamada-ingenieria.webp", "bloques_fuente": [447, 449]}, {"layout": "esquema", "segmentos": ["Logs (registros de eventos). Son archivos que guardan el rastro de quién hizo qué y cuándo en un sistema. Son la materia prima de la evidencia digital. Están sujetos a rotación automática, por lo que solicitar su preservación debe ser uno de los primeros actos urgentes de la investigación.", "Conviene precisar el orden. Los logs son urgentes, pero no siempre son lo primero. Si hay un equipo encendido, la adquisición de la memoria volátil va antes que cualquier otra actuación. Y entre los registros remotos, el más frágil suele ser la tabla de asignación CGNAT del proveedor de origen, que rota en horas. La prioridad la fija el orden de volatilidad, no el tipo de fuente. Además, los logs sirven para algo más que identificar al autor: muestran la falta de autorización del acceso, la secuencia de la conducta y, en las defraudaciones, desde qué dispositivo y sesión se ordenó la operación.", "Dirección IP y puerto. La dirección IP es la «dirección de domicilio» digital de un dispositivo conectado, y el puerto es la «puerta» lógica por donde entra y sale la información. Por la técnica CGNAT, una misma IP pública puede corresponder a miles de abonados. Por eso, una solicitud que aporte solo la IP y la fecha es técnicamente inejecutable.", "Metadatos. Son la información que un archivo lleva sobre sí mismo: fechas de creación, modificación y último acceso, autor, aplicación y dispositivo de origen. En la práctica investigativa prueban tanto o más que el propio contenido.", "Orden de preservación. Es el requerimiento a un custodio para que congele determinada información y no la elimine. No autoriza el acceso a su contenido y, por eso, no requiere control judicial previo. Confundirla con una orden de entrega es una de las causas más frecuentes de exclusión probatoria."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Logs (registros de eventos)", "segs": [0], "obj": "escudo"}, {"label": "El orden de volatilidad", "segs": [1], "obj": "reloj"}, {"label": "Dirección IP y puerto", "segs": [2], "obj": "casa"}, {"label": "Metadatos", "segs": [3], "obj": "expediente"}, {"label": "Orden de preservación", "segs": [4], "obj": "tribunal"}]}], "rotulo": null, "seccion": "5.7. Términos asociados a la evidencia y a la investigación", "grupo": null, "titulos_fuente": ["5.7. Términos asociados a la evidencia y a la investigación"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Logs (registros de eventos)", "El orden de volatilidad", "Dirección IP y puerto", "Metadatos", "Orden de preservación"], "titulo_genially": "Términos asociados a la evidencia y a la investigación", "complemento_genially": "", "apartado": "5.7. Términos asociados a la evidencia y a la investigación", "ilustracion": "archivos-servidor.webp", "arte": {"img": "archivos-servidor.webp", "pos": "fondo"}, "relleno": "p-evidencia-digital.webp", "bloques_fuente": [451, 455]}, {"layout": "tabla", "segmentos": ["Término técnico", "Dimensión del bien jurídico", "Tipo penal asociado", "Precisión necesaria",  el acceso a los datos de su titular: daño informático (art. 269D).", "Ejecución del ransomware: uso de software malicioso (art. 269E).", "Exigencia de pago bajo amenaza de pérdida de la información: posible extorsión (art. 244) en concurso."], "parrafo": [0, 1, 2, 3, 4], "vineta": [1, 2, 3, 4], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "reporte del ingeniero de FastTrack S.A.S", "segs": [0, 1], "obj": "personas"}, {"label": "Cifrado de los archivos", "segs": [2], "obj": "reloj"}, {"label": "Ejecución del ransomware", "segs": [3], "obj": "documento"}, {"label": "Exigencia de pago bajo amenaza de pérdida", "segs": [4], "obj": "carpetas"}]}], "rotulo": null, "seccion": "5.10. Proyección sobre el caso de la unidad", "grupo": null, "titulos_fuente": ["5.10. Proyección sobre el caso de la unidad"], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["reporte del ingeniero de FastTrack S.A.S", "Cifrado de los archivos", "Ejecución del ransomware", "Exigencia de pago bajo amenaza de pérdida"], "titulo_genially": "Proyección sobre el caso de la unidad (1 de 2)", "complemento_genially": "", "apartado": "5.10. Proyección sobre el caso de la unidad", "ilustracion": "registros-retencion.webp", "relleno": "fasttrack-bodega.webp", "bloques_fuente": [462, 466]}, {"layout": "acordeon", "segmentos": ["Registros de conexión: su preservación urgente ante el proveedor de internet es uno de los primeros actos de la investigación.", "Así, el reporte técnico se convierte en una narración jurídicamente relevante. Se reporta un acceso no autorizado a los sistemas de la empresa, mediante el cual se ejecutó un software malicioso que alteró y cifró su base de datos y la dejó sin operar. El atacante actuó desde una dirección IP extranjera o con técnicas para ocultar su red, y exigió un pago bajo la amenaza de que la información se perdiera para siempre."], "parrafo": [0, 1], "vineta": [0], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "acordeon", "items": [{"label": "Registros de conexión", "segs": [0], "obj": "escudo"}, {"label": "reporte técnico", "segs": [1], "obj": "computador"}]}], "rotulo": null, "seccion": "5.10. Proyección sobre el caso de la unidad", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Acordeón: cada apartado se despliega con su texto completo.", "rotulos": ["Registros de conexión", "reporte técnico"], "titulo_genially": "Proyección sobre el caso de la unidad (2 de 2)", "complemento_genially": "", "apartado": "5.10. Proyección sobre el caso de la unidad", "ilustracion": "p-caso-fasttrack.webp", "arte": {"img": "p-caso-fasttrack.webp", "pos": "izq"}, "relleno": "fasttrack-bodega.webp", "bloques_fuente": [467, 468]}, {"layout": "esquema", "segmentos": ["El fiscal y el ingeniero deben hablar el mismo idioma; la subsunción jurídica exige precisión léxica.", "«Hackeo» no es una conducta típica. Nombrar con precisión el fenómeno es lo que permite encuadrarlo en el tipo correcto.", "El acceso abusivo se define por la falta de autorización, no por la vulnerabilidad aprovechada.", "El cifrado es neutro: solo materializa un daño informático cuando es ilegítimo.", "Los logs son la materia prima de la evidencia, pero el orden de volatilidad fija qué se asegura primero.", "La tríada de confidencialidad, integridad y disponibilidad es el primer filtro de la adecuación típica.", "En la imputación, el dato técnico se traduce al lenguaje de la teoría del delito; no se transcribe."], "parrafo": [0, 1, 2, 3, 4, 5, 6], "vineta": [0, 1, 2, 3, 4, 5, 6], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Hablar el mismo idioma", "segs": [0, 1, 2], "obj": "documento"}, {"label": "El cifrado es neutro", "segs": [3, 4, 5, 6], "obj": "reloj"}]}], "rotulo": null, "seccion": "Ideas clave de la lección", "grupo": null, "titulos_fuente": ["Ideas clave de la lección"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Hablar el mismo idioma", "El cifrado es neutro"], "titulo_genially": "Ideas clave de la lección", "complemento_genially": "", "apartado": "Ideas clave de la lección", "ilustracion": "ransomware-bodega.webp", "arte": {"img": "ransomware-bodega.webp", "pos": "fondo"}, "relleno": "triada-cid.webp", "bloques_fuente": [470, 476]}, {"layout": "actividad", "segmentos": ["Pregunta 1", "Un exfuncionario de una entidad pública utilizó sus credenciales institucionales tres días después de haber sido notificado de la cancelación de su contrato para ingresar al sistema de información y consultar registros reservados. La defensa alega atipicidad porque el sistema no contaba con un bloqueo técnico automático activado.", "Frente a este argumento, la adecuación típica de la conducta en el delito de acceso abusivo a sistema informático (art. 269A) se fundamenta en que...", "A. la falta de una medida de seguridad técnica convierte la conducta en un hecho atípico.", "B. el elemento central del tipo es la ausencia de autorización o el exceso de lo acordado, siendo indiferente que el sistema esté protegido o no.", "C. se requiere obligatoriamente la destrucción física del servidor para consumar el delito.", "D. la conducta solo es punible si el sujeto activo demuestra haber utilizado un software malicioso.", "Retroalimentación", "A es Incorrecta: La medida de seguridad es un elemento descriptivo; su ausencia no excluye la tipicidad si falta la autorización.", "B es Correcta (Clave): El art. 269A sanciona ingresar o mantenerse sin autorización o por fuera de lo acordado, en sistemas protegidos o no.", "C es Incorrecta: El art. 269A es un delito de mera conducta que se consuma con el ingreso no autorizado.", "D es Incorrecta: El acceso abusivo se configura con o sin el uso de herramientas maliciosas.", "Pregunta 2", "Un atacante cibernético ejecutó una rutina que alteró lógicamente la estructura de los datos de contabilidad de una empresa, volviéndolos ilegibles para sus usuarios mediante un cifrado no autorizado.", "Desde la perspectiva de la terminología técnica aplicada a la Ley 1273 de 2009, la acción de cifrar ilegítimamente datos informáticos materializa el delito de...", "A. interceptación de datos informáticos (art. 269C), porque se capturó información en tránsito.", "B. obstaculización ilegítima de sistema (art. 269B), por tratarse de un ataque exclusivo contra la infraestructura física.", "C. daño informático (art. 269D), al alterarse, inutilizarse e impedirse el acceso a los datos de su titular.", "D. suplantación de sitios web (art. 269G), al crearse una página espejo para engañar al usuario.", "Retroalimentación", "A es Incorrecta: La interceptación se aplica a la captura de información en tránsito en redes de telecomunicación.", "B es Incorrecta: La obstaculización afecta la disponibilidad del sistema sin alterar el estado intrínseco del dato.", "C es Correcta (Clave): El cifrado ilegítimo altera e inutiliza los datos, lesionando la dimensión de integridad del art. 269D.", "D es Incorrecta: La suplantación de sitios web sanciona la creación de páginas espejo para capturar credenciales.", "Pregunta 3", "El informe de laboratorio forense entregado al fiscal indica: \"En la IP 190.16.2.4 se registró una autenticación exitosa mediante exploit sobre el hash MD5 de la base de datos de nómina a las 02:15 UTC\".", "Al estructurar la formulación de imputación (art. 288 CPP) respetando el principio de congruencia y el derecho de defensa, el fiscal debe...", "A. transcribir textual y literalmente los comandos y hashes del informe técnico dentro del relato fáctico.", "B. traducir el hallazgo técnico a un relato de conducta humana comprensible, expresando que el imputado ingresó sin autorización al sistema informático.", "C. omitir la mención de la conducta humana y limit
