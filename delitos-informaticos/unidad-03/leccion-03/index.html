p": {"r": 1.0791, "p": [[72, 17], [40, 36], [73, 60], [43, 82]]}, "evidencia-nube.webp": {"r": 1.1399, "p": [[53, 18], [34, 59], [81, 66]]}, "llamada-ingenieria.webp": {"r": 1.2162, "p": [[54, 48], [69, 25]]}, "doble-extorsion.webp": {"r": 1.1555, "p": [[76, 9], [82, 26], [52, 48], [82, 50]]}, "rastreo-criptoactivos.webp": {"r": 1.1796, "p": [[46, 19], [70, 37], [54, 63], [70, 14]]}, "triada-cid.webp": {"r": 1.1719, "p": [[20, 25], [50, 20], [78, 25]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "retro": {"reacciones": ["p-phishing.webp", "p-ransomware.webp", "p-conectividad-ip.webp", "p-botnets.webp", "p-memoria-disco.webp", "p-hardware-software.webp"], "frases": ["¿En serio?", "¿Cómo así?", "¡Falta algo!", "¡Ojo con eso!", "¡Mira más allá!", "¿Y la prueba?", "¡Revisa eso!", "¡Un momento!", "¡No tan rápido!"], "acierto": ["p-senalando.webp", "p-caso-fasttrack.webp", "p-tic-ciberespacio.webp", "p-evidencia-digital.webp"], "rotulo": "Unidad 3 · Lección 3"}, "leccion_rotulo": "Lección 3", "unit": 3, "lesson": 3, "heading": "Lección 3: Los actos urgentes en delitos informáticos", "scenes": [{"layout": "esquema", "segmentos": ["La aplicación del Artículo 205 del Código de Procedimiento Penal. La extrema volatilidad de la prueba digital exige que los actos urgentes (inspección al lugar de los hechos digital, entrevistas, aseguramiento de servidores) se ejecuten bajo el principio de inmediatez. El fiscal debe garantizar que las primeras órdenes de investigación delimiten claramente el objeto de protección para evitar alegaciones de registro indiscriminado o violaciones a la expectativa razonable de intimidad.", "El acto urgente en un delito informático no se define por la gravedad de la conducta sino por la vida útil de la evidencia. Mientras el Artículo 205 del CPP fija el marco de la inmediatez, la ingeniería forense define qué es lo que efectivamente se está perdiendo mientras se decide: la memoria volátil de un servidor se desvanece al apagarlo, las tablas de asignación del proveedor rotan en horas y un dispositivo móvil que se reinicia puede volverse inaccesible. El protocolo de primera respuesta traduce esa urgencia en una secuencia de pasos verificables y reproducibles.", "Acordonamiento lógico de la escena digital. A diferencia de la escena física, aquí acordonar significa impedir que el entorno siga cambiando: suspender el uso de los equipos comprometidos, prohibir que el personal técnico “revise” o “arregle” el sistema, detener las tareas programadas de borrado y respaldo, y documentar quién tuvo acceso desde el hecho hasta la llegada de la Policía Judicial. La primera contaminación de una escena digital casi siempre la produce el propio administrador de la víctima, actuando de buena fe.", "Registro del estado inicial. Fotografía de las pantallas encendidas, de las conexiones físicas, de los seriales y de la disposición de los equipos; y anotación de la hora que marca cada sistema frente a la hora legal colombiana, porque esa diferencia es lo que después permite normalizar la línea de tiempo. Nada se manipula antes de completar este registro."], "parrafo": [0, 1, 2, 3], "vineta": [0, 1, 2, 3], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "aplicación del Artículo 205 del Código", "segs": [0], "obj": "libros"}, {"label": "acto urgente en un delito informático", "segs": [1], "obj": "reloj"}, {"label": "Acordonamiento lógico de la escena digital", "segs": [2], "obj": "personas"}, {"label": "Registro del estado inicial", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 3: Los actos urgentes en delitos informáticos", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["aplicación del Artículo 205 del Código", "acto urgente en un delito informático", "Acordonamiento lógico de la escena digital", "Registro del estado inicial"], "titulo_genially": "Los actos urgentes en delitos informáticos (1 de 3)", "complemento_genially": "", "apartado": "", "ilustracion": "memoria-volatil.webp", "arte": {"img": "memoria-volatil.webp", "pos": "fondo"}, "relleno": "p-memoria-disco.webp", "bloques_fuente": [133, 136]}, {"layout": "rejilla", "segmentos": ["Decisión sobre el estado de encendido. Es la decisión de mayor impacto probatorio de toda la diligencia y debe tomarse con criterio técnico, no por costumbre. La antigua regla del “desconecte y traslade” quedó superada por dos hechos: la generalización del cifrado de disco, que puede volver irrecuperables los datos una vez apagado el equipo, y la existencia de servicios en producción cuya interrupción afecta a terceros ajenos a la investigación. La Figura 4 sistematiza esta decisión.", "Congelamiento de la memoria volátil (RAM). Cuando el equipo está encendido, la adquisición de memoria precede a cualquier otra actividad. Se ejecuta con herramienta validada, lanzada desde un medio externo estéril y con salida hacia otro medio externo, nunca hacia el disco del equipo intervenido. Debe registrarse herramienta y versión, hora de inicio y de finalización, tamaño del volcado y hash resultante. La RAM entrega procesos en ejecución, conexiones activas, sesiones abiertas, claves de cifrado en memoria y artefactos de código malicioso que nunca llegaron a escribirse en disco.", "Adquisición de los contenedores no volátiles. Imagen forense bit a bit sobre bloqueador de escritura por hardware, con hash calculado antes y después de la copia y verificación expresa de coincidencia. Cuando la imagen completa es inviable por volumen de datos o por continuidad del servicio, se practica una adquisición lógica selectiva y se documenta tanto la razón como el alcance exacto de lo adquirido.", "Aislamiento de dispositivos móviles. Modo avión y bolsa de Faraday de manera inmediata, manteniendo alimentación permanente: un móvil sin aislar puede recibir una orden de borrado remoto en cualquier momento, y un móvil que se apaga por batería agotada pierde el estado AFU y con él las claves de cifrado en memoria. Se recolectan además cargador, cable, tarjeta SIM, tarjetas de memoria y los dispositivos vinculados (relojes inteligentes y tabletas), que replican buena parte de la misma información y en ocasiones la conservan cuando el teléfono ya fue depurado."], "parrafo": [0, 1, 2, 3], "vineta": [0, 1, 2, 3], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "Decisión sobre el estado de encendido", "segs": [0], "obj": "carpetas", "ilus": "p-memoria-disco.webp"}, {"label": "Congelamiento de la memoria volátil (RAM)", "segs": [1], "obj": "reloj", "ilus": "p-conectividad-ip.webp"}, {"label": "Adquisición de los contenedores no volátiles", "segs": [2], "obj": "camara", "ilus": "p-evidencia-digital.webp"}, {"label": "Aislamiento de dispositivos móviles", "segs": [3], "obj": "documento", "ilus": "archivos-metadatos.webp"}]}], "rotulo": null, "seccion": "Lección 3: Los actos urgentes en delitos informáticos", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Rejilla en collage: ventanas con ilustración que llenan el marco; cada una abre su texto completo.", "rotulos": ["Decisión sobre el estado de encendido", "Congelamiento de la memoria volátil (RAM)", "Adquisición de los contenedores no volátiles", "Aislamiento de dispositivos móviles"], "titulo_genially": "Los actos urgentes en delitos informáticos (2 de 3)", "complemento_genially": "", "apartado": "", "ilustracion": "dispositivos-red.webp", "relleno": "memoria-volatil.webp", "bloques_fuente": [137, 140]}, {"layout": "puntos", "segmentos": ["Embalaje, rotulado y traslado. Cada contenedor se embala individualmente en material antiestático, no en bolsas plásticas comunes, que generan electricidad estática y retienen humedad. El rótulo consigna identificador único, descripción del elemento, lugar, fecha y hora de recolección y servidor responsable, de modo que la trazabilidad pueda reconstruirse sin abrir el paquete. Se protege de campos magnéticos, temperatura extrema y golpes durante todo el traslado.", "Cierre documental del acto urgente. El informe de primera respuesta debe consignar lo que se hizo, lo que no se hizo y por qué. Las omisiones justificadas técnicamente son defendibles ante el juez; las omisiones silenciadas se convierten, en el juicio oral, en dudas razonables sobre la integridad de toda la cadena de custodia.", "Figura 4. Árbol de decisión en escena digital: actuación de primera respuesta según el estado de encendido del dispositivo. Fuente: elaboración propia (Garavito, Y., 2026), con base en ISO/IEC 27037, RFC 3227, NIST SP 800-86 y ACPO Good Practice Guide for Digital Evidence."], "parrafo": [0, 1, 2], "vineta": [0, 1], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "Embalaje, rotulado y traslado", "segs": [0], "obj": "paquete"}, {"label": "Cierre documental del acto urgente", "segs": [1], "obj": "tribunal"}, {"label": "Figura 4", "segs": [2], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 3: Los actos urgentes en delitos informáticos", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["Embalaje, rotulado y traslado", "Cierre documental del acto urgente", "Figura 4"], "titulo_genially": "Los actos urgentes en delitos informáticos (3 de 3)", "complemento_genially": "", "apartado": "", "ilustracion": "memoria-volatil.webp", "relleno": "escudo-datos.webp", "bloques_fuente": [141, 143]}, {"layout": "linea", "segmentos": ["La secuencia que sigue corresponde a una diligencia en las instalaciones de una entidad que reporta intrusión en su servidor de facturación. Las horas son indicativas y lo que importa es el orden, que está determinado por la vida útil de cada fuente y no por la comodidad operativa.", "Hora 0 a 0:30. Acordonamiento lógico. Se suspende el uso de los equipos comprometidos, se prohíbe que el personal técnico intente reparar el sistema, se detienen las tareas programadas de borrado y respaldo, y se registra quién tuvo acceso desde el hecho hasta la llegada de la Policía Judicial.", "Hora 0:30 a 1:00. Registro del estado inicial. Fotografía de pantallas encendidas, conexiones físicas, seriales y disposición de los equipos. Se anota la hora que marca cada sistema frente a la hora legal colombiana, que es lo que después permite normalizar la línea de tiempo.", "Hora 1:00 a 2:00. Adquisición de memoria del servidor, que continúa encendido. Se ejecuta desde medio externo estéril y con salida hacia otro medio externo. Se consigna herramienta, versión, hora de inicio y fin, tamaño del volcado y resumen criptográfico.", "Hora 2:00 a 3:00. Salida de las órdenes de preservación. Al proveedor de internet de la entidad y, si en los registros del perímetro ya aparece una dirección pública de origen, al proveedor de esa dirección. Esta actuación no espera al peritaje: la asignación en el extremo de la cadena es la fuente más frágil.", "Hora 3:00 a 5:00. Exportación de los registros del aplicativo y del perímetro, con resumen criptográfico de cada archivo, y adquisición de los contenedores no volátiles sobre bloqueador de escritura.", "Hora 5:00 a 6:00. Embalaje individual, rotulado y cierre documental. El informe consigna lo que se hizo, lo que no se hizo y la razón técnica de cada omisión."], "parrafo": [0, 1, 2, 3, 4, 5, 6], "vineta": [0, 1, 2, 3, 4, 5, 6], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "linea", "items": [{"label": "Una diligencia en las instalaciones", "segs": [0], "obj": "reloj"}, {"label": "Hora 0 a 0:30", "segs": [1], "obj": "personas"}, {"label": "Hora 0:30 a 1:00", "segs": [2], "obj": "carpetas"}, {"label": "Hora 1:00 a 2:00", "segs": [3], "obj": "documento"}, {"label": "Hora 2:0
