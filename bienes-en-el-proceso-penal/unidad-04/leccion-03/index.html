<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-bienes", "paleta": {"marino": "#07415C", "teal": "#24635B", "oxido": "#FF6936", "coral": "#8AC4B8", "crema": "#E2F3F5", "niebla": "#ECEFF1", "hielo": "#E2F3F5", "celeste": "#8AC4B8", "madera": "#24635B", "piso": "#E2F3F5", "gris": "#D9D6D6", "amarillo": "#8AC4B8"}, "unit": 4, "lesson": 3, "heading": "Lección 3. Procedimiento para la imposición de medidas cautelares con fines de extinción del derecho de dominio", "scenes": [{"layout": "ruta", "segmentos": ["La imposición de medidas cautelares en el procedimiento de extinción de dominio constituye una actuación de especial relevancia para garantizar la eficacia de la intervención patrimonial del Estado. Su desarrollo exige que la Fiscalía General de la Nación identifique los bienes probablemente vinculados con alguna de las causales legales, reúna los elementos de conocimiento que sustenten su afectación y determine las medidas necesarias para evitar su disposición, ocultamiento, deterioro o utilización ilícita. En consecuencia, la intervención cautelar no se limita a la expedición de una providencia, sino que comprende un conjunto de actuaciones investigativas, jurídicas y operativas que deben ejecutarse de manera coordinada y con observancia de las garantías constitucionales.", "En esta lección se estudiará el procedimiento aplicable a la identificación e individualización de los bienes, el decreto y la materialización de las medidas cautelares, los mecanismos de control judicial de legalidad y las actuaciones necesarias para su puesta a disposición y administración. Se examinarán las competencias de los fiscales especializados, las funciones de los servidores de policía judicial y los mecanismos de articulación institucional con la Sociedad de Activos Especiales (SAE), en su condición de administradora del Fondo para la Rehabilitación, Inversión Social y Lucha contra el Crimen Organizado (FRISCO). Estos contenidos permitirán comprender que la eficacia de las medidas cautelares depende tanto de su fundamentación jurídica como de su ejecución oportuna y de la conservación de los bienes durante el procedimiento."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "imposición de medidas cautelares", "segs": [0], "obj": "escudo"}, {"label": "procedimiento aplicable a la identificación", "segs": [1], "obj": "tribunal"}]}], "rotulo": null, "seccion": "Lección 3. Procedimiento para la imposición de medidas cautelares con fines de extinción del derecho de dominio", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Ruta paso a paso con ficha que avanza.", "rotulos": ["imposición de medidas cautelares", "procedimiento aplicable a la identificación"], "titulo_genially": "Procedimiento para la imposición de medidas cautelares con fines de extinción del derecho de dominio", "complemento_genially": "", "apartado": "", "ilustracion": "archivo.webp", "paginas_pdf": [40, 40]}, {"layout": "giro", "segmentos": ["La identificación, ubicación e individualización de los bienes constituye la primera fase operativa de la intervención cautelar en el procedimiento de extinción de dominio. Esta actividad tiene por finalidad establecer cuáles activos pueden encontrarse comprendidos en alguna de las causales previstas en el artículo 16 de la Ley 1708 de 2014, determinar sus características jurídicas y económicas y reunir la información necesaria para sustentar una eventual medida cautelar. La afectación patrimonial debe recaer sobre bienes determinados o determinables conforme a las exigencias legales, evitando decisiones genéricas que dificulten su ejecución o comprometan derechos ajenos a la actuación.", "La investigación patrimonial debe orientarse a establecer la relación entre el activo y la causal de extinción de dominio que se pretende acreditar, mediante la reconstrucción de su origen, adquisición, utilización, destinación o transformación económica. Para ello, los servidores de policía judicial desarrollan las actividades legalmente autorizadas bajo la dirección de la Fiscalía, mediante la consulta de registros públicos, el análisis de documentación financiera y comercial, la verificación de información societaria y la identificación de operaciones que permitan establecer la trayectoria patrimonial del bien. La información obtenida debe ser organizada de manera que permita distinguir los hechos objetivamente verificados de las hipótesis investigativas y de las inferencias derivadas de su análisis."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "primera fase operativa", "segs": [0], "obj": "libros"}, {"label": "relación entre el activo y la causal", "segs": [1], "obj": "lupa"}]}], "rotulo": null, "seccion": "Lección 3.1. Identificación, ubicación e individualización de bienes: Actividades de investigación patrimonial y recolección de elementos de conocimiento previas a la afectación cautelar.", "grupo": null, "titulos_fuente": ["Lección 3.1. Identificación, ubicación e individualización de bienes: Actividades de investigación patrimonial y recolección de elementos de conocimiento previas a la afectación cautelar."], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["primera fase operativa", "relación entre el activo y la causal"], "titulo_genially": "3.1. Identificación, ubicación e individualización de bienes", "complemento_genially": "Actividades de investigación patrimonial y recolección de elementos de conocimiento previas a la afectación cautelar.", "apartado": "3.1. Identificación, ubicación e individualización de bienes", "ilustracion": "bienes-afectados.webp", "paginas_pdf": [41, 41]}, {"layout": "fichas", "segmentos": ["La identificación jurídica consiste en determinar la naturaleza del activo, su titularidad conocida, las limitaciones que recaen sobre él y los antecedentes que permitan reconstruir su situación patrimonial. Tratándose de inmuebles, resulta necesario verificar la matrícula inmobiliaria, la ubicación, la descripción del predio, los titulares inscritos y los gravámenes o medidas cautelares existentes. En el caso de vehículos, deben examinarse los datos de identificación, el registro correspondiente y los antecedentes de propiedad. Cuando se investiguen participaciones societarias, establecimientos de comercio o productos financieros, la individualización deberá atender a sus características específicas y a los mecanismos legales de registro o reconocimiento de derechos.", "La identificación económica comprende el análisis del valor del activo, las condiciones de adquisición, las fuentes de financiación y las operaciones mediante las cuales pudo incorporarse al patrimonio investigado. Esta actividad permite establecer si existen elementos que relacionen el bien con alguna causal de extinción de dominio y contribuye a determinar los riesgos que podrían justificar su afectación cautelar. Sin embargo, las diferencias entre el valor de un activo y los ingresos conocidos de su titular no constituyen, por sí mismas, una demostración de ilicitud, por lo que deben examinarse conjuntamente con los demás elementos de conocimiento obtenidos durante la investigación."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "identificación jurídica", "segs": [0], "obj": "casa"}, {"label": "identificación económica", "segs": [1], "obj": "lupa"}]}], "rotulo": null, "seccion": "Lección 3.1. Identificación, ubicación e individualización de bienes: Actividades de investigación patrimonial y recolección de elementos de conocimiento previas a la afectación cautelar.", "grupo": "Identificación jurídica y económica del bien", "titulos_fuente": ["Lección 3.1. Identificación, ubicación e individualización de bienes: Actividades de investigación patrimonial y recolección de elementos de conocimiento previas a la afectación cautelar.", "Identificación jurídica y económica del bien"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["identificación jurídica", "identificación económica"], "titulo_genially": "Identificación jurídica y económica del bien", "complemento_genially": "", "apartado": "3.1. Identificación, ubicación e individualización de bienes", "ilustracion": "analisis-financiero.webp", "paginas_pdf": [41, 42]}, {"layout": "lamina", "segmentos": ["La ubicación de los bienes tiene como propósito establecer dónde se encuentran y cuáles son las condiciones necesarias para ejecutar eficazmente una eventual medida cautelar. Esta actividad adquiere especial importancia respecto de activos susceptibles de desplazamiento, ocultamiento, deterioro o transformación, como vehículos, maquinaria, mercancías y otros bienes muebles. Su desarrollo puede comprender actuaciones de verificación física, documentación de características, identificación de lugares de almacenamiento y recopilación de información sobre las personas que ejercen su tenencia o administración, siempre dentro de las competencias y autorizaciones legalmente previstas.", "La verificación material debe complementarse con la documentación de las condiciones de conservación y utilización de los bienes, especialmente cuando se trate de activos productivos o sujetos a riesgos de deterioro. Esta información resulta relevante para determinar si la suspensión del poder dispositivo es suficiente para asegurar el patrimonio o si existen circunstancias que justifican medidas adicionales, como el secuestro o la toma de posesión. Asimismo, permite anticipar necesidades de custodia, transporte, almacenamiento o administración que deberán coordinarse con las entidades competentes una vez se materialice la afectación cautelar."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "ubicación de los bienes", "segs": [0], "obj": "paquete"}, {"label": "verificación material", "segs": [1], "obj": "personas"}]}], "rotulo": null, "seccion": "Lección 3.1. Identificación, ubicación e individualización de bienes: Actividades de investigación patrimonial y recolección de elementos de conocimiento previas a la afectación cautelar.", "grupo": "Ubicación y verificación material de los activos", "titulos_fuente": ["Lección 3.1. Identificación, ubicación e individualización de bienes: Actividades de investigación patrimonial y recolección de elementos de conocimiento previas a la afectación cautelar.", "Ubicación y verificación material de los activos"], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["ubicación de los bienes", "verificación material"], "titulo_genially": "Ubicación y verificación material de los activos", "complemento_genially": "", "apartado": "3.1. Identificación, ubicación e individualización de bienes", "ilustracion": "investigacion-activos.webp", "paginas_pdf": [42, 42]}, {"layout": "giro", "segmentos": ["La investigación patrimonial debe comprender la identificación de las personas naturales o jurídicas que ostentan derechos sobre los activos, así como de aquellas que puedan resultar afectadas por las medidas cautelares. Esta actividad exige examinar la titularidad registral, las relaciones contractuales, los derechos de garantía, las situaciones de copropiedad y las demás circunstancias jurídicas que permitan establecer la existencia de intereses patrimoniales legítimos. Su finalidad consiste en delimitar adecuadamente el alcance de la intervención y facilitar el ejercicio de los derechos de contradicción y defensa reconocidos por el Código de Extinción de Dominio.", "La identificación de terceros también permite advertir situaciones en las cuales la titularidad formal del bien no coincide necesariamente con las personas que ejercen su control económico o reciben los beneficios derivados de su utilización. En estos casos, la investigación debe examinar las relaciones societarias, fiduciarias o contractuales relevantes, sin presumir que la existencia de estructuras jurídicas complejas constituye automáticamente una actividad de ocultamiento patrimonial. La determinación de la titularidad real exige elementos objetivos que permitan establecer relaciones verificables entre personas, activos y operaciones económicas."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "personas naturales o jurídicas", "segs": [0], "obj": "escudo"}, {"label": "identificación de terceros", "segs": [1], "obj": "lupa"}]}], "rotulo": null, "seccion": "Lección 3.1. Identificación, ubicación e individualización de bienes: Actividades de investigación patrimonial y recolección de elementos de conocimiento previas a la afectación cautelar.", "grupo": "Individualización de titulares y terceros con derechos sobre los bienes", "titulos_fuente": ["Lección 3.1. Identificación, ubicación e individualización de bienes: Actividades de investigación patrimonial y recolección de elementos de conocimiento previas a la afectación cautelar.", "Individualización de titulares y terceros con derechos sobre los bienes"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["personas naturales o jurídicas", "identificación de terceros"], "titulo_genially": "Individualización de titulares y terceros con derechos sobre los bienes", "complemento_genially": "", "apartado": "3.1. Identificación, ubicación e individualización de bienes", "ilustracion": "verificacion-registral.webp", "paginas_pdf": [42, 43]}, {"layout": "fichas", "segmentos": ["Una vez identificados los bienes y recopilada la información patrimonial, corresponde organizar los elementos de conocimiento que permitan establecer su probable vinculación con alguna causal de extinción de dominio. El artículo 88 de la Ley 1708 de 2014 exige elementos de juicio suficientes para considerar dicha vinculación, razón por la cual la investigación debe proporcionar una explicación concreta sobre la relación entre el activo y los hechos jurídicamente relevantes. La información registral, financiera, comercial y documental debe integrarse en una hipótesis patrimonial que permita comprender por qué el bien podría encontrarse comprendido en una causal legal y cuáles son los riesgos que justifican su aseguramiento.", "Para facilitar la actuación de la Fiscalía, la información previa a la afectación cautelar debe permitir establecer, como mínimo, la identificación del bien, su ubicación, la titularidad conocida, la causal presuntamente aplicable, los elementos de conocimiento que sustentan la probable vinculación y las circunstancias que puedan justificar la imposición de medidas adicionales. Esta organización permite que el fiscal valore la suficiencia de la información, determine la procedencia jurídica de la intervención y adopte decisiones motivadas. Asimismo, contribuye a que los servidores de policía judicial cuenten con datos precisos para ejecutar las órdenes correspondientes y documentar sus resultados."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "organizar los elementos de conocimiento", "segs": [0], "obj": "libros"}, {"label": "información previa a la afectación cautelar", "segs": [1], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 3.1. Identificación, ubicación e individualización de bienes: Actividades de investigación patrimonial y recolección de elementos de conocimiento previas a la afectación cautelar.", "grupo": "Construcción del soporte probatorio previo a la afectación", "titulos_fuente": ["Lección 3.1. Identificación, ubicación e individualización de bienes: Actividades de investigación patrimonial y recolección de elementos de conocimiento previas a la afectación cautelar.", "Construcción del soporte probatorio previo a la afectación"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["organizar los elementos de conocimiento", "información previa a la afectación cautelar"], "titulo_genially": "Construcción del soporte probatorio previo a la afectación", "complemento_genially": "", "apartado": "3.1. Identificación, ubicación e individualización de bienes", "ilustracion": "examen-bienes.webp", "paginas_pdf": [43, 44]}, {"layout": "lamina", "segmentos": ["Durante una investigación patrimonial, la Fiscalía identifica que una sociedad comercial adquirió varios inmuebles y vehículos mediante operaciones financiadas por personas presuntamente relacionadas con actividades ilícitas. Los servidores de policía judicial verifican las matrículas inmobiliarias, los registros automotores, la composición societaria y los documentos que soportan las operaciones de adquisición. Posteriormente, reconstruyen los movimientos financieros relevantes y establecen cuáles activos podrían encontrarse comprendidos en una causal de extinción de dominio. Con fundamento en esta información, el fiscal deberá determinar si existen elementos de juicio suficientes para considerar su probable vinculación y establecer las medidas cautelares jurídicamente procedentes.", "La identificación, ubicación e individualización de los bienes constituye, una condición esencial para desarrollar una intervención cautelar eficaz y respetuosa del debido proceso. La calidad de la investigación patrimonial determina la precisión de las órdenes, facilita su materialización y contribuye a proteger los derechos de los afectados. Una vez establecidos los activos y reunidos los elementos de conocimiento pertinentes, corresponde examinar el procedimiento mediante el cual el fiscal especializado decreta las medidas cautelares y dispone las actuaciones necesarias para su ejecución."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "sociedad comercial", "segs": [0], "obj": "casa"}, {"label": "condición esencial", "segs": [1], "obj": "lupa"}]}], "rotulo": null, "seccion": "Lección 3.1. Identificación, ubicación e individualización de bienes: Actividades de investigación patrimonial y recolección de elementos de conocimiento previas a la afectación cautelar.", "grupo": "Ejemplo práctico", "titulos_fuente": ["Lección 3.1. Identificación, ubicación e individualización de bienes: Actividades de investigación patrimonial y recolección de elementos de conocimiento previas a la afectación cautelar.", "Ejemplo práctico"], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["sociedad comercial", "condición esencial"], "titulo_genially": "Ejemplo práctico", "complemento_genially": "", "apartado": "3.1. Identificación, ubicación e individualización de bienes", "ilustracion": "documento-inmueble.webp", "paginas_pdf": [44, 44]}, {"layout": "ruta", "segmentos": ["El control judicial de legalidad constituye un mecanismo de protección de los derechos fundamentales frente a las medidas cautelares decretadas por la Fiscalía General de la Nación en el procedimiento de extinción de dominio. Su finalidad consiste en verificar que la afectación patrimonial cumpla los presupuestos legales, se encuentre respaldada por elementos de conocimiento suficientes y responda a criterios de necesidad, razonabilidad y proporcionalidad. Las medidas cautelares pueden restringir las facultades de disposición, tenencia o administración de los bienes antes de que exista una sentencia definitiva, circunstancia que exige mecanismos judiciales para examinar la legitimidad de la intervención estatal.", "Los artículos 111 a 113 de la Ley 1708 de 2014 establecen un procedimiento especial de control de legalidad que permite someter las medidas cautelares decretadas por el fiscal al examen de los jueces especializados en extinción de dominio. Este mecanismo no constituye una nueva oportunidad para resolver anticipadamente la procedencia definitiva de la extinción, sino un escenario destinado a verificar la legalidad formal y material de la afectación provisional. En consecuencia, la intervención judicial debe concentrarse en los presupuestos de la medida cautelar y en las causales específicas previstas por el legislador, sin sustituir el debate probatorio que corresponde a la etapa de juzgamiento."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "control judicial de legalidad", "segs": [0], "obj": "escudo"}, {"label": "artículos 111 a 113", "segs": [1], "obj": "libros"}]}], "rotulo": null, "seccion": "Lección 3.2. Decreto y materialización de las medidas cautelares: Competencia del fiscal especializado, providencia motivada, determinación de la medida procedente y ejecución registral o material.", "grupo": null, "titulos_fuente": ["Lección 3.2. Decreto y materialización de las medidas cautelares: Competencia del fiscal especializado, providencia motivada, determinación de la medida procedente y ejecución registral o material."], "encabezados": [], "mediacion": "Ruta paso a paso con ficha que avanza.", "rotulos": ["control judicial de legalidad", "artículos 111 a 113"], "titulo_genially": "3.2. Decreto y materialización de las medidas cautelares", "complemento_genially": "Competencia del fiscal especializado, providencia motivada, determinación de la medida procedente y ejecución registral o material.", "apartado": "3.2. Decreto y materialización de las medidas cautelares", "ilustracion": "gestion-activos.webp", "paginas_pdf": [44, 45]}, {"layout": "mapa", "segmentos": ["El artículo 111 de la Ley 1708 de 2014 establece que las medidas cautelares decretadas por el Fiscal General de la Nación o sus delegados no son susceptibles de los recursos de reposición ni apelación. Sin embargo, estas decisiones pueden someterse a un control judicial posterior mediante solicitud motivada del afectado, del Ministerio Público o del Ministerio de Justicia y del Derecho. El legislador estableció un mecanismo autónomo de revisión judicial, distinto de los recursos ordinarios contra las providencias de la Fiscalía, con el propósito de garantizar que las restricciones patrimoniales puedan ser examinadas por una autoridad jurisdiccional independiente.", "El control judicial posterior debe distinguirse de la intervención del juez cuando resulta necesario adoptar una medida cautelar durante la etapa de juzgamiento. En este último supuesto, el artículo 111 dispone que el Fiscal General de la Nación o su delegado debe solicitar la medida al juez competente, quien resolverá conforme a las disposiciones del Código de Extinción de Dominio. Por tanto, el régimen legal diferencia las medidas decretadas por la Fiscalía durante la fase correspondiente, sometidas a control posterior, de aquellas cuya adopción debe ser decidida judicialmente cuando la actuación se encuentra en la etapa de juzgamiento.", "La Corte Constitucional, destacó que el régimen de medidas cautelares incorpora mecanismos de control destinados a proteger los derechos de los afectados, incluso cuando las medidas se adoptan excepcionalmente antes de presentar la demanda de extinción de dominio (Corte Constitucional, 2023). Esta garantía debe interpretarse conjuntamente con el derecho de acceso a la actuación y de contradicción reconocido en el artículo 13 de la Ley 1708 de 2014, de manera que el afectado pueda conocer los fundamentos de la restricción y ejercer los mecanismos procesales correspondientes."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mapa", "items": [{"label": "artículo 111 de la Ley 1708", "segs": [0], "obj": "libros", "centro": true}, {"label": "control judicial posterior", "segs": [1], "obj": "tribunal"}, {"label": "mecanismos de control", "segs": [2], "obj": "escudo"}]}], "rotulo": null, "seccion": "Lección 3.2. Decreto y materialización de las medidas cautelares: Competencia del fiscal especializado, providencia motivada, determinación de la medida procedente y ejecución registral o material.", "grupo": "Procedencia y legitimación para solicitar el control de legalidad", "titulos_fuente": ["Lección 3.2. Decreto y materialización de las medidas cautelares: Competencia del fiscal especializado, providencia motivada, determinación de la medida procedente y ejecución registral o material.", "Procedencia y legitimación para solicitar el control de legalidad"], "encabezados": [], "mediacion": "Mapa conceptual: el primer contenido en el centro y las ramas se exploran una a una.", "rotulos": ["artículo 111 de la Ley 1708", "control judicial posterior", "mecanismos de control"], "titulo_genially": "Procedencia y legitimación para solicitar el control de legalidad", "complemento_genially": "", "apartado": "3.2. Decreto y materialización de las medidas cautelares", "ilustracion": "revision-documentos.webp", "paginas_pdf": [45, 46]}, {"layout": "giro", "segmentos": ["El artículo 112 de la Ley 1708 de 2014 establece cuatro circunstancias que permiten declarar la ilegalidad de una medida cautelar. Estas causales delimitan el objeto del control judicial y exigen que la controversia se concentre en los presupuestos jurídicos y probatorios de la afectación, evitando convertir este mecanismo en un juicio anticipado sobre la pretensión definitiva de extinción de dominio, veamos:", "Insuficiencia de elementos de juicio sobre la probable vinculación del bien. Esta causal se configura cuando no existen elementos mínimos suficientes para considerar que el activo afectado probablemente se encuentra relacionado con alguna causal de extinción de dominio. Su examen exige verificar la correspondencia entre los hechos investigados, los elementos de conocimiento disponibles y el supuesto legal invocado por la Fiscalía. En consecuencia, no resulta suficiente que el bien pertenezca a una persona investigada penalmente o que existan afirmaciones generales sobre su patrimonio, pues debe identificarse una relación objetiva que permita justificar la intervención cautelar.", "Ausencia de necesidad, razonabilidad o proporcionalidad. Esta causal permite cuestionar la materialización de una medida cautelar cuando no se encuentra justificada frente a las finalidades que pretende cumplir. Su análisis exige determinar si la restricción impuesta resulta adecuada para neutralizar el riesgo patrimonial identificado y si su intensidad guarda correspondencia con las circunstancias del caso. Por ejemplo, cuando la suspensión del poder dispositivo resulta suficiente para impedir la transferencia de un inmueble, la imposición adicional de una medida material debe encontrarse respaldada por razones específicas que permitan explicar su necesidad.", "Falta de motivación de la decisión. La motivación constituye una exigencia esencial de las providencias que restringen derechos patrimoniales, puesto que permite conocer las razones por las cuales la Fiscalía considera procedente la afectación. Esta causal se configura cuando la decisión carece de una fundamentación que permita identificar los hechos relevantes, la relación del bien con la causal investigada y las razones que justifican la medida. La simple reproducción de disposiciones legales, sin establecer su conexión con las circunstancias particulares del activo, puede resultar insuficiente para satisfacer esta exigencia."], "parrafo": [0, 1, 2, 3], "vineta": [1, 2, 3], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "artículo 112 de la Ley 1708", "segs": [0], "obj": "libros"}, {"label": "Insuficiencia de elementos de juicio", "segs": [1], "obj": "lupa"}, {"label": "Ausencia de necesidad", "segs": [2], "obj": "carpetas"}, {"label": "Falta de motivación de la decisión", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 3.2. Decreto y materialización de las medidas cautelares: Competencia del fiscal especializado, providencia motivada, determinación de la medida procedente y ejecución registral o material.", "grupo": "Causales de ilegalidad de las medidas cautelares", "titulos_fuente": ["Lección 3.2. Decreto y materialización de las medidas cautelares: Competencia del fiscal especializado, providencia motivada, determinación de la medida procedente y ejecución registral o material.", "Causales de ilegalidad de las medidas cautelares"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["artículo 112 de la Ley 1708", "Insuficiencia de elementos de juicio", "Ausencia de necesidad", "Falta de motivación de la decisión"], "titulo_genially": "Causales de ilegalidad de las medidas cautelares (1 de 2)", "complemento_genially": "", "apartado": "3.2. Decreto y materialización de las medidas cautelares", "ilustracion": "inspector-documento.webp", "paginas_pdf": [46, 47]}, {"layout": "ruta", "segmentos": ["Fundamentación en pruebas ilícitamente obtenidas. La cuarta causal se relaciona con la utilización de elementos probatorios obtenidos mediante actuaciones contrarias a las garantías constitucionales y legales aplicables. Su finalidad consiste en impedir que una restricción patrimonial se sustente en información obtenida con vulneración de derechos fundamentales. En consecuencia, la Fiscalía debe verificar que los elementos de conocimiento utilizados para fundamentar la medida hayan sido obtenidos mediante procedimientos legalmente autorizados y que las actuaciones de investigación respeten las exigencias correspondientes a cada fuente de información.", "Precisa la norma en análisis:", "El control de legalidad tendrá como finalidad revisar la legalidad formal y material de la medida cautelar, y el juez competente solo declarará la ilegalidad de la misma cuando concurra alguna de las siguientes circunstancias: 1. Cuando no existan los elementos mínimos de juicio suficientes para considerar que probablemente los bienes afectados con la medida tengan vínculo con alguna causal de extinción de dominio. 2. Cuando la materialización de la medida cautelar no se muestre como necesaria, razonable y proporcional para el cumplimiento de sus fines. 3. Cuando la decisión de imponer la medida cautelar no haya sido motivada. 4. Cuando la decisión de imponer la medida cautelar esté fundamentada en pruebas ilícitamente obtenidas."], "parrafo": [0, 1, 2], "vineta": [0], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "Fundamentación en pruebas ilícitamente obtenidas", "segs": [0], "obj": "escudo"}, {"label": "legalidad formal y material", "segs": [1, 2], "obj": "tribunal"}]}], "rotulo": null, "seccion": "Lección 3.2. Decreto y materialización de las medidas cautelares: Competencia del fiscal especializado, providencia motivada, determinación de la medida procedente y ejecución registral o material.", "grupo": "Causales de ilegalidad de las medidas cautelares", "titulos_fuente": [], "encabezados": [], "mediacion": "Ruta paso a paso con ficha que avanza.", "rotulos": ["Fundamentación en pruebas ilícitamente obtenidas", "legalidad formal y material"], "titulo_genially": "Causales de ilegalidad de las medidas cautelares (2 de 2)", "complemento_genially": "", "apartado": "3.2. Decreto y materialización de las medidas cautelares", "ilustracion": "archivo.webp", "paginas_pdf": [47, 47]}, {"layout": "fichas", "segmentos": ["El artículo 113 de la Ley 1708 de 2014 establece un trámite específico que se inicia mediante solicitud fundamentada en alguna de las causales previstas en el artículo 112. El afectado debe identificar claramente los hechos que sustentan su petición y demostrar objetivamente la concurrencia de la circunstancia alegada. La solicitud se presenta ante el Fiscal General de la Nación o su delegado, quien debe remitir copia de la carpeta al juez especializado de extinción de dominio competente, determinado mediante reparto. Este procedimiento permite que la autoridad judicial examine los fundamentos de la medida y los argumentos presentados por quien solicita el control.", "Recibida la actuación, el juez debe realizar un examen inicial de fundamentación. Si considera que la solicitud es infundada, podrá rechazarla de plano; en caso contrario, la admitirá y dispondrá un traslado común a los demás sujetos procesales por el término de cinco días. Vencido este traslado, el juez deberá decidir dentro de los cinco días siguientes, conforme a las reglas establecidas en el artículo 113. La disposición también establece que la presentación y tramitación de la solicitud no suspenden el cumplimiento de la medida cautelar ni el desarrollo de la actuación procesal, circunstancia que preserva la eficacia de la intervención mientras se resuelve su legalidad."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "artículo 113 de la Ley 1708", "segs": [0], "obj": "libros"}, {"label": "examen inicial de fundamentación", "segs": [1], "obj": "reloj"}]}], "rotulo": null, "seccion": "Lección 3.2. Decreto y materialización de las medidas cautelares: Competencia del fiscal especializado, providencia motivada, determinación de la medida procedente y ejecución registral o material.", "grupo": "Procedimiento para el control judicial de legalidad", "titulos_fuente": ["Lección 3.2. Decreto y materialización de las medidas cautelares: Competencia del fiscal especializado, providencia motivada, determinación de la medida procedente y ejecución registral o material.", "Procedimiento para el control judicial de legalidad"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["artículo 113 de la Ley 1708", "examen inicial de fundamentación"], "titulo_genially": "Procedimiento para el control judicial de legalidad", "complemento_genially": "", "apartado": "3.2. Decreto y materialización de las medidas cautelares", "ilustracion": "casa-lupa.webp", "paginas_pdf": [47, 48]}, {"layout": "lamina", "segmentos": ["El control judicial de legalidad constituye un mecanismo de protección de los derechos fundamentales frente a las medidas cautelares decretadas por la Fiscalía General de la Nación en el procedimiento de extinción de dominio. Su finalidad consiste en verificar que la afectación patrimonial cumpla los presupuestos legales, se encuentre respaldada por elementos de conocimiento suficientes y responda a criterios de necesidad, razonabilidad y proporcionalidad. En este control las medidas cautelares pueden restringir las facultades de disposición, tenencia o administración de los bienes antes de que exista una sentencia definitiva, circunstancia que exige mecanismos judiciales para examinar la legitimidad de la intervención estatal.", "Los artículos 111 a 113 de la Ley 1708 de 2014 establecen un procedimiento especial de control de legalidad que permite someter las medidas cautelares decretadas por el fiscal al examen de los jueces especializados en extinción de dominio. Este mecanismo no constituye una nueva oportunidad para resolver anticipadamente la procedencia definitiva de la extinción, sino un escenario destinado a verificar la legalidad formal y material de la afectación provisional. La intervención judicial debe concentrarse en los presupuestos de la medida cautelar y en las causales específicas previstas por el legislador, sin sustituir el debate probatorio que corresponde a la etapa de juzgamiento."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "control judicial de legalidad", "segs": [0], "obj": "escudo"}, {"label": "artículos 111 a 113", "segs": [1], "obj": "libros"}]}], "rotulo": nu s establecidas en el artículo 113. La disposición también establece que la presentación y tramitación de la solicitud no suspenden el cumplimiento de la medida cautelar ni el desarrollo de la actuación procesal, circunstancia que preserva la eficacia de la intervención mientras se resuelve su legalidad."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "artículo 113 de la Ley 1708", "segs": [0], "obj": "libros"}, {"label": "examen inicial de fundamentación", "segs": [1], "obj": "reloj"}]}], "rotulo": null, "seccion": "Lección 3.3. Control judicial de legalidad de las medidas cautelares: Procedencia, causales, trámite y recursos conforme a los artículos 111 a 113 de la Ley 1708 de 2014.", "grupo": "Procedimiento para el control judicial de legalidad", "titulos_fuente": ["Lección 3.3. Control judicial de legalidad de las medidas cautelares: Procedencia, causales, trámite y recursos conforme a los artículos 111 a 113 de la Ley 1708 de 2014.", "Procedimiento para el control judicial de legalidad"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["artículo 113 de la Ley 1708", "examen inicial de fundamentación"], "titulo_genially": "Procedimiento para el control judicial de legalidad", "complemento_genially": "", "apartado": "3.3. Control judicial de legalidad de las medidas cautelares", "ilustracion": "documento-inmueble.webp", "paginas_pdf": [50, 51]}, {"layout": "ruta", "segmentos": ["El régimen de impugnación debe diferenciar entre la providencia cautelar expedida por la Fiscalía y las decisiones judiciales adoptadas durante el control de legalidad. Conforme al artículo 111, la primera no admite recursos de reposición ni apelación, sin perjuicio de la posibilidad de solicitar el control judicial posterior. En cambio, el artículo 113 establece expresamente que las decisiones del juez proferidas en desarrollo de este procedimiento son susceptibles del recurso de apelación. Esta diferenciación permite reconocer que el control judicial constituye el mecanismo específico previsto para controvertir la legalidad de la medida decretada por la Fiscalía.", "Cuando el juez declara la ilegalidad de una medida cautelar, corresponde adoptar las actuaciones necesarias para cumplir la decisión y determinar sus efectos sobre la afectación patrimonial, conforme al alcance de la providencia judicial. Si la medida había sido inscrita en un registro, su levantamiento o modificación deberá ejecutarse mediante las comunicaciones correspondientes; si se había materializado mediante intervención física o administrativa, será necesario coordinar las actuaciones que permitan dar cumplimiento a lo resuelto. En todo caso, la decisión sobre la legalidad de la medida no equivale necesariamente a una sentencia definitiva sobre la procedencia de la extinción de dominio, pues ambas controversias poseen objetos procesales diferenciados."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "régimen de impugnación", "segs": [0], "obj": "tribunal"}, {"label": "declara la ilegalidad", "segs": [1], "obj": "telefono"}]}], "rotulo": null, "seccion": "Lección 3.3. Control judicial de legalidad de las medidas cautelares: Procedencia, causales, trámite y recursos conforme a los artículos 111 a 113 de la Ley 1708 de 2014.", "grupo": "Recursos y efectos de la decisión judicial", "titulos_fuente": ["Lección 3.3. Control judicial de legalidad de las medidas cautelares: Procedencia, causales, trámite y recursos conforme a los artículos 111 a 113 de la Ley 1708 de 2014.", "Recursos y efectos de la decisión judicial"], "encabezados": [], "mediacion": "Ruta paso a paso con ficha que avanza.", "rotulos": ["régimen de impugnación", "declara la ilegalidad"], "titulo_genially": "Recursos y efectos de la decisión judicial", "complemento_genially": "", "apartado": "3.3. Control judicial de legalidad de las medidas cautelares", "ilustracion": "inspector-documento.webp", "paginas_pdf": [51, 51]}, {"layout": "fichas", "segmentos": ["La Fiscalía decreta la suspensión del poder dispositivo y el secuestro de un inmueble presuntamente vinculado con actividades ilícitas. El afectado solicita el control de legalidad y argumenta que la providencia no explica por qué resulta necesario intervenir materialmente el bien, cuando la restricción registral impediría su transferencia. El juez deberá examinar la fundamentación de las medidas y establecer si la materialización del secuestro cumple las exigencias de necesidad, razonabilidad y proporcionalidad previstas en el artículo 112. Su decisión deberá concentrarse en la legalidad de la afectación cautelar, sin anticipar el juicio definitivo sobre la causal de extinción de dominio.", "Para la Fiscalía General de la Nación, el control judicial de legalidad constituye una garantía que exige especial rigor en la construcción y documentación de las decisiones cautelares. La adecuada identificación de los bienes, la valoración de los elementos de juicio, la motivación de las providencias y la justificación de las medidas adicionales permiten fortalecer la legalidad de la intervención y facilitar su examen judicial. Asimismo, los fiscales y servidores de policía judicial deben conservar y organizar la información que sustenta las actuaciones, de manera que pueda ser presentada oportunamente ante el juez competente cuando se promueva el control previsto en los artículos 111 a 113 del Código de Extinción de Dominio."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "suspensión del poder dispositivo y el secuestro", "segs": [0], "obj": "casa"}, {"label": "especial rigor", "segs": [1], "obj": "escudo"}]}], "rotulo": null, "seccion": "Lección 3.3. Control judicial de legalidad de las medidas cautelares: Procedencia, causales, trámite y recursos conforme a los artículos 111 a 113 de la Ley 1708 de 2014.", "grupo": "Ejemplo práctico", "titulos_fuente": ["Lección 3.3. Control judicial de legalidad de las medidas cautelares: Procedencia, causales, trámite y recursos conforme a los artículos 111 a 113 de la Ley 1708 de 2014.", "Ejemplo práctico"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["suspensión del poder dispositivo y el secuestro", "especial rigor"], "titulo_genially": "Ejemplo práctico", "complemento_genially": "", "apartado": "3.3. Control judicial de legalidad de las medidas cautelares", "ilustracion": "inspeccion-propiedad.webp", "paginas_pdf": [51, 52]}, {"layout": "lamina", "segmentos": ["La imposición de medidas cautelares con fines de extinción de dominio puede generar la necesidad de someter los bienes afectados a mecanismos especiales de custodia, conservación y administración, con el propósito de preservar su integridad y evitar que la intervención estatal produzca pérdidas patrimoniales injustificadas. Esta fase adquiere especial importancia cuando las medidas decretadas implican secuestro, toma de posesión o intervención sobre activos que requieren una gestión económica especializada. En consecuencia, la actuación de la Fiscalía General de la Nación debe articularse con las entidades legalmente competentes para administrar los bienes, garantizando que la ejecución de las medidas cautelares permita conservar su valor y asegurar su disponibilidad durante el procedimiento.", "El artículo 90 de la Ley 1708 de 2014 establece que el Fondo para la Rehabilitación, Inversión Social y Lucha contra el Crimen Organizado (FRISCO) constituye una cuenta especial sin personería jurídica, administrada por la Sociedad de Activos Especiales S. A. S. (SAE), sociedad de economía mixta del orden nacional. Esta disposición determina el marco institucional de administración de los activos sometidos al régimen especial de extinción de dominio y permite diferenciar las funciones de investigación y afectación patrimonial, atribuidas a la Fiscalía, de las actividades de administración que corresponden a la entidad encargada del Fondo."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "someter los bienes afectados", "segs": [0], "obj": "escudo"}, {"label": "artículo 90 de la Ley 1708", "segs": [1], "obj": "libros"}]}], "rotulo": null, "seccion": "Lección 3.4. Puesta a disposición y administración de bienes afectados: Articulación con la SAE como administradora del FRISCO, entrega de activos, preservación patrimonial y seguimiento institucional.", "grupo": null, "titulos_fuente": ["Lección 3.4. Puesta a disposición y administración de bienes afectados: Articulación con la SAE como administradora del FRISCO, entrega de activos, preservación patrimonial y seguimiento institucional."], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["someter los bienes afectados", "artículo 90 de la Ley 1708"], "titulo_genially": "3.4. Puesta a disposición y administración de bienes afectados", "complemento_genially": "Articulación con la SAE como administradora del FRISCO, entrega de activos, preservación patrimonial y seguimiento institucional.", "apartado": "3.4. Puesta a disposición y administración de bienes afectados", "ilustracion": "equipo-torre.webp", "paginas_pdf": [52, 53]}, {"layout": "giro", "segmentos": ["La articulación institucional comienza con la identificación de los bienes y la determinación de las medidas cautelares que pueden exigir su puesta a disposición del FRISCO. El parágrafo segundo del artículo 88 de la Ley 1708 de 2014 establece que la entidad administradora del Fondo tendrá la calidad de secuestre de los bienes sometidos a las medidas cautelares correspondientes, los cuales quedarán a disposición de dicho Fondo en los términos de la disposición. Esta regla permite comprender que la administración patrimonial no corresponde de manera general a los servidores de policía judicial ni al fiscal que dirige la investigación, aunque estos deben desarrollar las actuaciones necesarias para ejecutar las medidas y facilitar la entrega de los activos.", "Para garantizar una adecuada coordinación, la Fiscalía debe suministrar información suficiente sobre la identificación de los bienes, la naturaleza de las medidas decretadas, las condiciones jurídicas relevantes y las circunstancias que puedan afectar su conservación. Cuando se trate de inmuebles, resulta pertinente verificar su ubicación, ocupación y estado material; respecto de vehículos o maquinaria, deben documentarse sus características y condiciones de funcionamiento; y en el caso de establecimientos de comercio o sociedades, será necesario identificar los activos, documentos y relaciones económicas indispensables para comprender su funcionamiento. Estas actuaciones permiten que la entidad administradora cuente con información inicial verificable y pueda desarrollar sus competencias conforme al régimen aplicable."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "articulación institucional", "segs": [0], "obj": "libros"}, {"label": "adecuada coordinación", "segs": [1], "obj": "casa"}]}], "rotulo": null, "seccion": "Lección 3.4. Puesta a disposición y administración de bienes afectados: Articulación con la SAE como administradora del FRISCO, entrega de activos, preservación patrimonial y seguimiento institucional.", "grupo": "Articulación institucional entre la Fiscalía General de la Nación y la SAE", "titulos_fuente": ["Lección 3.4. Puesta a disposición y administración de bienes afectados: Articulación con la SAE como administradora del FRISCO, entrega de activos, preservación patrimonial y seguimiento institucional.", "Articulación institucional entre la Fiscalía General de la Nación y la SAE"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["articulación institucional", "adecuada coordinación"], "titulo_genially": "Articulación institucional entre la Fiscalía General de la Nación y la SAE", "complemento_genially": "", "apartado": "3.4. Puesta a disposición y administración de bienes afectados", "ilustracion": "investigacion-activos.webp", "paginas_pdf": [53, 53]}, {"layout": "mapa", "segmentos": ["La entrega de bienes afectados debe realizarse mediante actuaciones que permitan verificar su identidad, estado y condiciones de conservación al momento de la intervención. La documentación de estas circunstancias resulta indispensable para establecer responsabilidades, prevenir controversias y facilitar el seguimiento de la administración patrimonial. Por ello, cuando la medida implique una entrega material, los servidores que participen en su ejecución deben procurar que los inventarios, actas y demás documentos reflejen de manera precisa las características del activo y las circunstancias relevantes de su puesta a disposición.", "La documentación debe atender a la naturaleza del bien. En el caso de inmuebles, pueden resultar relevantes las condiciones físicas, la ocupación, los servicios asociados y la existencia de bienes muebles vinculados a su utilización. Respecto de vehículos, maquinaria o equipos, deben registrarse los datos de identificación y el estado general de conservación. Cuando se intervengan sociedades o establecimientos de comercio, adquieren especial importancia los libros de contabilidad, estados financieros, documentos societarios y demás soportes necesarios para establecer la composición patrimonial y las condiciones de funcionamiento de la unidad económica.", "El artículo 103 de la Ley 1708 de 2014 establece reglas específicas para la materialización de medidas cautelares sobre sociedades, establecimientos de comercio y unidades de explotación económica. La disposición diferencia la inscripción registral del embargo y de la suspensión del poder dispositivo, de la entrega física de los haberes y documentos de la sociedad cuando se decreten el secuestro o la toma de posesión. Esta regulación evidencia que la ejecución de las medidas cautelares debe ajustarse a la naturaleza del activo y que la intervención de una estructura empresarial exige actuaciones diferentes de aquellas aplicables a un inmueble o vehículo individualmente considerado."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mapa", "items": [{"label": "entrega de bienes afectados", "segs": [0], "obj": "camara", "centro": true}, {"label": "documentación", "segs": [1], "obj": "casa"}, {"label": "artículo 103 de la Ley 1708", "segs": [2], "obj": "libros"}]}], "rotulo": null, "seccion": "Lección 3.4. Puesta a disposición y administración de bienes afectados: Articulación con la SAE como administradora del FRISCO, entrega de activos, preservación patrimonial y seguimiento institucional.", "grupo": "Entrega material y documentación de los activos", "titulos_fuente": ["Lección 3.4. Puesta a disposición y administración de bienes afectados: Articulación con la SAE como administradora del FRISCO, entrega de activos, preservación patrimonial y seguimiento institucional.", "Entrega material y documentación de los activos"], "encabezados": [], "mediacion": "Mapa conceptual: el primer contenido en el centro y las ramas se exploran una a una.", "rotulos": ["entrega de bienes afectados", "documentación", "artículo 103 de la Ley 1708"], "titulo_genially": "Entrega material y documentación de los activos", "complemento_genially": "", "apartado": "3.4. Puesta a disposición y administración de bienes afectados", "ilustracion": "investigacion-inmueble.webp", "paginas_pdf": [53, 54]}, {"layout": "fichas", "segmentos": ["La administración de bienes afectados debe orientarse a conservar su integridad y utilidad económica, teniendo en cuenta que la imposición de una medida cautelar no equivale a una declaración definitiva de extinción del derecho de dominio. En consecuencia, la gestión de los activos debe procurar que las restricciones patrimoniales no generen deterioros injustificados ni comprometan innecesariamente su capacidad productiva. Esta finalidad requiere atenciòn frente a bienes que requieren mantenimiento permanente, establecimientos comerciales en funcionamiento o unidades económicas cuya paralización puede ocasionar pérdidas significativas.", "El artículo 92 de la Ley 1708 de 2014 contempla distintos mecanismos para facilitar la administración de bienes afectados con medidas cautelares o respecto de los cuales se haya declarado la extinción de dominio. Entre ellos se encuentran la enajenación, la contratación, la destinación provisional, el depósito provisional, la destrucción o chatarrización y la donación entre entidades públicas, conforme a los presupuestos y procedimientos legalmente establecidos. La selección de estos mecanismos corresponde a la entidad administradora dentro del ámbito de sus competencias y debe atender a la naturaleza del activo, sus condiciones económicas y las reglas especiales aplicables a cada modalidad.", "La preservación patrimonial no implica necesariamente mantener todos los bienes inmovilizados durante la totalidad del procedimiento. El régimen legal contempla mecanismos de administración y disposición que pueden resultar procedentes cuando concurran los requisitos correspondientes, particularmente en situaciones en las cuales el deterioro, la pérdida de valor o los costos de conservación hagan necesario adoptar decisiones especializadas. Sin embargo, estas facultades deben ejercerse dentro de los límites legales y no pueden confundirse con una declaración judicial anticipada de extinción de dominio. La Fiscalía debe reconocer esta diferenciación funcional y mantener una coordinación adecuada con la SAE cuando las decisiones de administración puedan incidir en el desarrollo de la actuación."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "administración de bienes afectados", "segs": [0], "obj": "documento"}, {"label": "artículo 92 de la Ley 1708", "segs": [1], "obj": "libros"}, {"label": "preservación patrimonial", "segs": [2], "obj": "escudo"}]}], "rotulo": null, "seccion": "Lección 3.4. Puesta a disposición y administración de bienes afectados: Articulación con la SAE como administradora del FRISCO, entrega de activos, preservación patrimonial y seguimiento institucional.", "grupo": "Preservación del valor patrimonial y mecanismos de administración", "titulos_fuente": ["Lección 3.4. Puesta a disposición y administración de bienes afectados: Articulación con la SAE como administradora del FRISCO, entrega de activos, preservación patrimonial y seguimiento institucional.", "Preservación del valor patrimonial y mecanismos de administración"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["administración de bienes afectados", "artículo 92 de la Ley 1708", "preservación patrimonial"], "titulo_genially": "Preservación del valor patrimonial y mecanismos de administración", "complemento_genially": "", "apartado": "3.4. Puesta a disposición y administración de bienes afectados", "ilustracion": "inspeccion-propiedad.webp", "paginas_pdf": [54, 55]}, {"layout": "lamina", "segmentos": ["El seguimiento institucional constituye una actividad necesaria para garantizar que las medidas cautelares mantengan correspondencia con las decisiones procesales y con la situación jurídica de los bienes afectados. Para ello, resulta importante conservar información actualizada sobre los activos, las medidas decretadas, las actuaciones de materialización y las comunicaciones remitidas a las entidades competentes. Esta documentación permite verificar el cumplimiento de las órdenes y facilita la adopción de decisiones posteriores relacionadas con la modificación, cancelación o levantamiento de las restricciones patrimoniales.", "La Fiscalía debe mantener atención sobre las circunstancias procesales que puedan modificar la situación jurídica de los bienes, particularmente cuando se profieran decisiones judiciales relacionadas con la legalidad de las medidas cautelares o con la pretensión definitiva de extinción de dominio. En estos casos, la coordinación con la SAE y con las autoridades registrales resulta necesaria para garantizar que las actuaciones administrativas correspondan a las decisiones vigentes. Asimismo, la conservación ordenada de la información facilita la trazabilidad institucional y permite identificar oportunamente situaciones que requieran intervención de las autoridades competentes."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "seguimiento institucional", "segs": [0], "obj": "telefono"}, {"label": "circunstancias procesales", "segs": [1], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 3.4. Puesta a disposición y administración de bienes afectados: Articulación con la SAE como administradora del FRISCO, entrega de activos, preservación patrimonial y seguimiento institucional.", "grupo": "Seguimiento institucional y conservación de la información patrimonial", "titulos_fuente": ["Lección 3.4. Puesta a disposición y administración de bienes afectados: Articulación con la SAE como administradora del FRISCO, entrega de activos, preservación patrimonial y seguimiento institucional.", "Seguimiento institucional y conservación de la información patrimonial"], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["seguimiento institucional", "circunstancias procesales"], "titulo_genially": "Seguimiento institucional y conservación de la información patrimonial", "complemento_genially": "", "apartado": "3.4. Puesta a disposición y administración de bienes afectados", "ilustracion": "equipo-torre.webp", "paginas_pdf": [55, 56]}, {"layout": "mapa", "segmentos": ["Durante una investigación de extinción de dominio, la Fiscalía decreta medidas cautelares sobre un establecimiento de comercio dedicado a actividades industriales, respecto del cual existen elementos de juicio que permiten considerar su probable vinculación con una causal legal.", "La intervención comprende maquinaria, inventarios, documentación contable y contratos relacionados con su funcionamiento. Para materializar las medidas, los servidores de policía judicial deberán verificar los bienes comprendidos en la providencia, documentar su estado y facilitar las actuaciones necesarias para su puesta a disposición del FRISCO. Posteriormente, corresponderá a la SAE determinar los mecanismos de administración legalmente procedentes, procurando preservar el valor económico de los activos y evitar deterioros innecesarios durante el procedimiento.", "La puesta a disposición y administración de bienes afectados constituye, una fase complementaria de la intervención cautelar que exige diferenciar las competencias de investigación, ejecución y administración patrimonial. Mientras la Fiscalía General de la Nación debe asegurar la legalidad de las medidas y desarrollar las actuaciones necesarias para su materialización, la SAE ejerce las funciones de administración atribuidas por el régimen especial del FRISCO. Esta articulación permite que la afectación cautelar cumpla sus finalidades preventivas y asegurativas, sin desconocer que los bienes continúan sometidos a una controversia jurisdiccional cuya decisión definitiva corresponde a los jueces especializados en extinción de dominio."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mapa", "items": [{"label": "establecimiento de comercio", "segs": [0], "obj": "lupa", "centro": true}, {"label": "maquinaria, inventarios, documentación contable", "segs": [1], "obj": "personas"}, {"label": "fase complementaria", "segs": [2], "obj": "escalones"}]}], "rotulo": null, "seccion": "Lección 3.4. Puesta a disposición y administración de bienes afectados: Articulación con la SAE como administradora del FRISCO, entrega de activos, preservación patrimonial y seguimiento institucional.", "grupo": "Ejemplo práctico", "titulos_fuente": ["Lección 3.4. Puesta a disposición y administración de bienes afectados: Articulación con la SAE como administradora del FRISCO, entrega de activos, preservación patrimonial y seguimiento institucional.", "Ejemplo práctico"], "encabezados": [], "mediacion": "Mapa conceptual: el primer contenido en el centro y las ramas se exploran una a una.", "rotulos": ["establecimiento de comercio", "maquinaria, inventarios, documentación contable", "fase complementaria"], "titulo_genially": "Ejemplo práctico", "complemento_genially": "", "apartado": "3.4. Puesta a disposición y administración de bienes afectados", "ilustracion": "casa-lupa.webp", "paginas_pdf": [56, 56]}]}</script>
