<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-bienes", "paleta": {"marino": "#07415C", "teal": "#24635B", "oxido": "#8AC4B8", "coral": "#8AC4B8", "crema": "#E3F2F5", "niebla": "#E3F2F5", "hielo": "#E3F2F5", "celeste": "#8AC4B8", "madera": "#24635B", "piso": "#E3F2F5", "gris": "#8AC4B8", "amarillo": "#24635B"}, "anclas": {"equipo-torre.webp": {"r": 1.178, "p": [[42, 44], [8, 84], [56, 30], [42, 73], [62, 88]]}, "gestion-activos.webp": {"r": 1.3575, "p": [[68, 24], [85, 56], [58, 84], [50, 58], [22, 47]]}, "analisis-financiero.webp": {"r": 1.7717, "p": [[14, 22], [14, 76], [52, 80], [72, 46], [88, 72]]}, "archivo.webp": {"r": 0.8554, "p": [[78, 28], [72, 62], [72, 82], [56, 21]]}, "revision-documentos.webp": {"r": 1.083, "p": [[52, 15], [80, 36], [72, 56], [60, 78], [14, 43]]}, "verificacion-registral.webp": {"r": 1.6453, "p": [[75, 14], [86, 42], [58, 46], [42, 80], [88, 86]]}, "bienes-afectados.webp": {"r": 1.5385, "p": [[62, 40], [47, 82], [68, 76], [87, 72], [18, 43]]}, "investigacion-activos.webp": {"r": 1.6364, "p": [[82, 22], [55, 50], [36, 82], [75, 86], [91, 62]]}, "examen-bienes.webp": {"r": 1.2064, "p": [[72, 38], [48, 66], [83, 83], [40, 89], [26, 38]]}, "documento-inmueble.webp": {"r": 1.495, "p": [[68, 18], [90, 46], [10, 80], [62, 76], [88, 82]]}, "inspector-documento.webp": {"r": 1.2278, "p": [[52, 16], [25, 38], [78, 38], [62, 70], [88, 86]]}, "inspeccion-propiedad.webp": {"r": 1.3373, "p": [[52, 22], [82, 25], [62, 70], [20, 43], [86, 56]]}, "investigacion-inmueble.webp": {"r": 1.3783, "p": [[48, 16], [82, 30], [60, 64], [20, 42], [45, 80]]}, "inspeccion-vivienda.webp": {"r": 1.6043, "p": [[42, 22], [60, 45], [56, 76], [88, 58]]}, "casa-lupa.webp": {"r": 1.1765, "p": [[52, 22], [72, 42], [52, 72], [76, 84]]}}, "respiro": 360, "unit": 4, "lesson": 2, "heading": "Lección 2. Estándares de vinculación de bienes con actividades ilícitas", "scenes": [{"layout": "esquema", "segmentos": ["La procedencia de las medidas cautelares con fines de extinción de dominio exige establecer una relación jurídicamente relevante entre los bienes investigados y alguna de las causales previstas en el artículo 16 de la Ley 1708 de 2014. Esta vinculación no puede fundamentarse exclusivamente en la existencia de una investigación penal, en los antecedentes de su propietario o en sospechas generales sobre la procedencia de su patrimonio, sino que requiere elementos de conocimiento que permitan explicar las circunstancias por las cuales un activo podría encontrarse comprendido en una causal de extinción de dominio. La investigación patrimonial constituye una actividad especializada orientada a reconstruir el origen, la adquisición, la utilización, la transformación y la circulación económica de los bienes, con el propósito de sustentar las decisiones que correspondan.", "En esta lección se estudiarán las causales sustanciales de extinción de dominio, los estándares probatorios aplicables a la imposición de medidas cautelares, la protección de los terceros de buena fe exenta de culpa y las herramientas de investigación patrimonial que permiten establecer la trazabilidad de los activos. El desarrollo de estos contenidos permitirá comprender que la afectación cautelar y la declaración definitiva de extinción de dominio responden a momentos procesales y exigencias probatorias diferenciadas. Asimismo, proporcionará criterios para que fiscales, asistentes de fiscal y servidores de policía judicial orienten sus actuaciones hacia la identificación de bienes, la construcción de hipótesis patrimoniales verificables y la obtención de elementos de conocimiento que permitan adoptar decisiones debidamente fundamentadas."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "relación jurídicamente relevante", "segs": [0], "obj": "libros"}, {"label": "causales sustanciales de extinción de dominio", "segs": [1], "obj": "escudo"}]}], "rotulo": null, "seccion": "Lección 2. Estándares de vinculación de bienes con actividades ilícitas", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["relación jurídicamente relevante", "causales sustanciales de extinción de dominio"], "titulo_genially": "Estándares de vinculación de bienes con actividades ilícitas", "complemento_genially": "", "apartado": "", "ilustracion": "archivo.webp", "paginas_pdf": [23, 24]}, {"layout": "mental", "segmentos": ["El artículo 16 de la Ley 1708 de 2014 establece las causales sustanciales que permiten promover la acción de extinción de dominio sobre bienes relacionados con actividades ilícitas. Estas causales constituyen el fundamento jurídico de la pretensión patrimonial y determinan las circunstancias que deben ser objeto de investigación y acreditación durante el procedimiento. Su identificación resulta indispensable porque la extinción de dominio no procede de manera indiscriminada sobre la totalidad del patrimonio de una persona investigada, sino respecto de bienes cuya situación jurídica y económica pueda relacionarse con alguno de los supuestos expresamente establecidos por el legislador. Señala la norma en cita:", "ARTÍCULO 16. CAUSALES. Se declarará extinguido el dominio sobre los bienes que se encuentren en las siguientes circunstancias: 1. Los que sean producto directo o indirecto de una actividad ilícita. 2. Los que correspondan al objeto material de la actividad ilícita, salvo que la ley disponga su destrucción. 3. Los que provengan de la transformación o conversión parcial o total, física o jurídica del producto, instrumentos u objeto material de actividades ilícitas. 4. Los que formen parte de un incremento patrimonial no justificado, cuando existan elementos de conocimiento que permitan considerar razonablemente que provienen de actividades ilícitas. 5. Los que hayan sido utilizados como medio o instrumento para la ejecución de actividades ilícitas. 6. Los que de acuerdo con las circunstancias en que fueron hallados, o sus características particulares, permitan establecer que están destinados a la ejecución de actividades ilícitas.", "7. Los que constituyan ingresos, rentas, frutos, ganancias y otros beneficios derivados de los anteriores bienes. 8. Los de procedencia lícita, utilizados para ocultar bienes de ilícita 1a procedencia. 9. Los de procedencia lícita, mezclados material o jurídicamente con bienes de ilícita procedencia. 10. \u003cNumeral CONDICIONALMENTE exequible> Los de origen lícito cuyo valor sea equivalente a cualquiera de los bienes descritos en los numerales anteriores, cuando la acción resulte improcedente por el reconocimiento de los derechos de un tercero de buena fe exenta de culpa. 11. \u003cNumeral CONDICIONALMENTE exequible> Los de origen lícito cuyo valor corresponda o sea equivalente al de bienes producto directo o indirecto de una actividad ilícita, cuando no sea posible la localización, identificación o afectación material de estos. PARÁGRAFO.", "También procederá la extinción de dominio respecto de los bienes objeto de sucesión por causa de muerte, cuando en ellos concurra cualquiera de las causales previstas en esta ley.", "Estas causales legales comprenden distintas formas de vinculación patrimonial con actividades ilícitas, entre ellas la procedencia directa o indirecta de recursos, la utilización de bienes como medios o instrumentos, su destinación a actividades contrarias al ordenamiento jurídico, las operaciones de transformación o mezcla y determinados supuestos de equivalencia patrimonial. Estas modalidades responden a la necesidad de reconocer que los beneficios económicos derivados de actividades ilícitas pueden manifestarse mediante operaciones sucesivas, adquisición de nuevos activos, estructuras societarias o mecanismos de sustitución patrimonial. Por ello, la investigación debe establecer no solamente quién aparece como propietario del bien, sino también cuál es su origen económico, cómo fue adquirido y qué relación guarda con la causal que se pretende acreditar."], "parrafo": [0, 1, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mental", "items": [{"label": "artículo 16 de la Ley 1708", "segs": [0], "obj": "libros"}, {"label": "ARTÍCULO 16. CAUSALES", "segs": [1], "obj": "documento"}, {"label": "Los que constituyan ingresos, rentas, frutos", "segs": [2, 3], "obj": "carpetas"}, {"label": "formas de vinculación patrimonial", "segs": [4], "obj": "lupa"}]}], "rotulo": null, "seccion": "Lección 2.1. Causales sustanciales de extinción de dominio (artículo 16 de la Ley 1708 de 2014): Identificación de bienes relacionados con actividades ilícitas por su origen, destinación, utilización, transformación, mezcla o equivalencia.", "grupo": null, "titulos_fuente": ["Lección 2.1. Causales sustanciales de extinción de dominio (artículo 16 de la Ley 1708 de 2014): Identificación de bienes relacionados con actividades ilícitas por su origen, destinación, utilización, transformación, mezcla o equivalencia."], "encabezados": [], "mediacion": "Mapa mental: la idea central y sus ramas; cada rama abre su texto completo.", "rotulos": ["artículo 16 de la Ley 1708", "ARTÍCULO 16. CAUSALES", "Los que constituyan ingresos, rentas, frutos", "formas de vinculación patrimonial"], "titulo_genially": "2.1. Causales sustanciales de extinción de dominio (artículo 16 de la Ley 1708 de 2014)", "complemento_genially": "Identificación de bienes relacionados con actividades ilícitas por su origen, destinación, utilización, transformación, mezcla o equivalencia.", "apartado": "2.1. Causales sustanciales de extinción de dominio (artículo 16 de la Ley 1708 de 2014)", "ilustracion": "gestion-activos.webp", "paginas_pdf": [24, 25]}, {"layout": "rejilla", "segmentos": ["La primera modalidad comprende los bienes que constituyen producto directo o indirecto de actividades ilícitas, así como aquellos cuya adquisición se encuentra relacionada con recursos provenientes de dichas actividades, en los términos del artículo 16. Esta hipótesis exige reconstruir la procedencia económica del activo, identificar las operaciones mediante las cuales ingresó al patrimonio investigado y establecer la relación entre los recursos utilizados para su adquisición y la actividad ilícita correspondiente.", "La investigación puede comprender el examen de ingresos, movimientos bancarios, contratos, declaraciones tributarias, operaciones comerciales y demás documentos que permitan determinar si existe una explicación patrimonial consistente sobre la adquisición del bien.", "Por ejemplo, cuando una persona adquiere varios inmuebles durante un período en el cual sus ingresos lícitos conocidos resultan ostensiblemente inferiores al valor de las operaciones, puede surgir una hipótesis de investigación patrimonial. Sin embargo, la diferencia entre ingresos y adquisiciones no demuestra automáticamente una causal de extinción de dominio, pues corresponde verificar la procedencia de los recursos, las fuentes alternativas de financiación y los elementos que permitan establecer su relación con actividades ilícitas. De esta manera, el análisis financiero constituye un instrumento de corroboración que debe integrarse con otros medios de conocimiento, evitando convertir las inconsistencias patrimoniales en presunciones irrebatibles de ilicitud."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "producto directo o indirecto", "segs": [0], "obj": "reloj", "ilus": "revision-documentos.webp"}, {"label": "movimientos bancarios", "segs": [1], "obj": "lupa", "ilus": "analisis-financiero.webp"}, {"label": "varios inmuebles", "segs": [2], "obj": "casa", "ilus": "bienes-afectados.webp"}]}], "rotulo": null, "seccion": "Lección 2.1. Causales sustanciales de extinción de dominio (artículo 16 de la Ley 1708 de 2014): Identificación de bienes relacionados con actividades ilícitas por su origen, destinación, utilización, transformación, mezcla o equivalencia.", "grupo": "Bienes cuyo origen se encuentra vinculado con actividades ilícitas", "titulos_fuente": ["Lección 2.1. Causales sustanciales de extinción de dominio (artículo 16 de la Ley 1708 de 2014): Identificación de bienes relacionados con actividades ilícitas por su origen, destinación, utilización, transformación, mezcla o equivalencia.", "Bienes cuyo origen se encuentra vinculado con actividades ilícitas"], "encabezados": [], "mediacion": "Rejilla en collage: ventanas con ilustración que llenan el marco; cada una abre su texto completo.", "rotulos": ["producto directo o indirecto", "movimientos bancarios", "varios inmuebles"], "titulo_genially": "Bienes cuyo origen se encuentra vinculado con actividades ilícitas", "complemento_genially": "", "apartado": "2.1. Causales sustanciales de extinción de dominio (artículo 16 de la Ley 1708 de 2014)", "ilustracion": "analisis-financiero.webp", "paginas_pdf": [25, 26]}, {"layout": "puntos", "segmentos": ["Otra modalidad comprende los bienes utilizados como medios o instrumentos para la ejecución de actividades ilícitas, así como aquellos destinados a cumplir esa finalidad, de acuerdo con las hipótesis legalmente previstas. En estos supuestos, la investigación no se concentra exclusivamente en el origen de los recursos empleados para adquirir el activo, puesto que un bien inicialmente obtenido mediante una actividad lícita puede adquirir relevancia para la acción de extinción de dominio debido a su utilización o destinación posterior. Por consiguiente, resulta necesario examinar las circunstancias concretas de uso, la relación funcional del bien con la actividad ilícita y los derechos que puedan corresponder a terceros protegidos por el ordenamiento jurídico.", "Esta modalidad puede presentarse, por ejemplo, cuando un inmueble es acondicionado y utilizado de manera estable para desarrollar una actividad ilícita, o cuando determinados vehículos se destinan al transporte de mercancías relacionadas con operaciones ilegales. No obstante, la sola presencia de un bien en el lugar donde se investiga una actividad ilícita no permite concluir que se encuentre comprendido en una causal de extinción de dominio. La Fiscalía debe establecer la relación material o funcional correspondiente, identificar las circunstancias de utilización y valorar los elementos que permitan diferenciar una vinculación jurídicamente relevante de una relación meramente accidental."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "medios o instrumentos", "segs": [0], "obj": "lupa"}, {"label": "inmueble es acondicionado", "segs": [1], "obj": "paquete"}]}], "rotulo": null, "seccion": "Lección 2.1. Causales sustanciales de extinción de dominio (artículo 16 de la Ley 1708 de 2014): Identificación de bienes relacionados con actividades ilícitas por su origen, destinación, utilización, transformación, mezcla o equivalencia.", "grupo": "Bienes destinados o utilizados para desarrollar actividades ilícitas", "titulos_fuente": ["Lección 2.1. Causales sustanciales de extinción de dominio (artículo 16 de la Ley 1708 de 2014): Identificación de bienes relacionados con actividades ilícitas por su origen, destinación, utilización, transformación, mezcla o equivalencia.", "Bienes destinados o utilizados para desarrollar actividades ilícitas"], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["medios o instrumentos", "inmueble es acondicionado"], "titulo_genially": "Bienes destinados o utilizados para desarrollar actividades ilícitas", "complemento_genially": "", "apartado": "2.1. Causales sustanciales de extinción de dominio (artículo 16 de la Ley 1708 de 2014)", "ilustracion": "equipo-torre.webp", "paginas_pdf": [26, 27]}, {"layout": "fichas", "segmentos": ["La transformación o conversión patrimonial comprende situaciones en las cuales los recursos o activos relacionados con actividades ilícitas son sustituidos por otros bienes mediante operaciones económicas o jurídicas. Esta modalidad permite examinar la continuidad del vínculo patrimonial cuando el producto inicial de una actividad ilícita deja de existir en su forma original y se incorpora a nuevos activos.", "Así, los recursos obtenidos ilícitamente pueden ser utilizados para adquirir inmuebles, vehículos, participaciones societarias o instrumentos financieros, circunstancia que exige reconstruir las operaciones sucesivas para determinar si subsiste una relación jurídicamente relevante con la causal invocada.", "La investigación de estos supuestos requiere establecer una secuencia verificable entre el activo de origen y los bienes posteriormente adquiridos, evitando que la sola existencia de operaciones de compraventa, inversión o transferencia sea interpretada como demostración de ilicitud. Para ello, resulta pertinente examinar documentos contractuales, registros contables, movimientos financieros y operaciones realizadas mediante intermediarios, con el propósito de identificar el flujo económico y los posibles mecanismos de sustitución patrimonial. Esta reconstrucción permite que la acción de extinción de dominio no quede limitada a la identificación física del producto inicial de una actividad ilícita."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "transformación o conversión patrimonial", "segs": [0], "obj": "documento"}, {"label": "recursos obtenidos ilícitamente", "segs": [1], "obj": "casa"}, {"label": "investigación de estos supuestos", "segs": [2], "obj": "lupa"}]}], "rotulo": null, "seccion": "Lección 2.1. Causales sustanciales de extinción de dominio (artículo 16 de la Ley 1708 de 2014): Identificación de bienes relacionados con actividades ilícitas por su origen, destinación, utilización, transformación, mezcla o equivalencia.", "grupo": "Bienes transformados o convertidos", "titulos_fuente": ["Lección 2.1. Causales sustanciales de extinción de dominio (artículo 16 de la Ley 1708 de 2014): Identificación de bienes relacionados con actividades ilícitas por su origen, destinación, utilización, transformación, mezcla o equivalencia.", "Bienes transformados o convertidos"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["transformación o conversión patrimonial", "recursos obtenidos ilícitamente", "investigación de estos supuestos"], "titulo_genially": "Bienes transformados o convertidos", "complemento_genially": "", "apartado": "2.1. Causales sustanciales de extinción de dominio (artículo 16 de la Ley 1708 de 2014)", "ilustracion": "revision-documentos.webp", "paginas_pdf": [27, 27]}, {"layout": "esquema", "segmentos": ["La mezcla patrimonial se presenta cuando recursos o bienes relacionados con actividades ilícitas se incorporan o integran con activos de procedencia lícita, generando situaciones en las cuales resulta necesario establecer el alcance de la afectación patrimonial. Estas operaciones pueden producirse mediante aportes de capital, adquisición conjunta de bienes, inversiones empresariales o incorporación de recursos a estructuras económicas preexistentes. Su análisis exige identificar las fuentes de financiación, determinar la participación de los recursos investigados y examinar las circunstancias de adquisición, transformación o incremento patrimonial, conforme a las causales y límites previstos legalmente.", "En estos casos, la Fiscalía debe prestar especial atención a la protección de los derechos legítimamente adquiridos, puesto que la existencia de recursos ilícitos dentro de una estructura patrimonial no autoriza, por sí sola, a desconocer indiscriminadamente los derechos de quienes acrediten los presupuestos de protección establecidos en la ley. La investigación debe procurar individualizar los activos, identificar las operaciones relevantes y determinar la relación de los recursos investigados con el patrimonio afectado. De esta manera, la trazabilidad financiera y la reconstrucción de la estructura de propiedad adquieren especial importancia para delimitar jurídicamente la pretensión de extinción."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "mezcla patrimonial", "segs": [0], "obj": "documento"}, {"label": "derechos legítimamente adquiridos", "segs": [1], "obj": "escudo"}]}], "rotulo": null, "seccion": "Lección 2.1. Causales sustanciales de extinción de dominio (artículo 16 de la Ley 1708 de 2014): Identificación de bienes relacionados con actividades ilícitas por su origen, destinación, utilización, transformación, mezcla o equivalencia.", "grupo": "Bienes objeto de mezcla patrimonial", "titulos_fuente": ["Lección 2.1. Causales sustanciales de extinción de dominio (artículo 16 de la Ley 1708 de 2014): Identificación de bienes relacionados con actividades ilícitas por su origen, destinación, utilización, transformación, mezcla o equivalencia.", "Bienes objeto de mezcla patrimonial"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["mezcla patrimonial", "derechos legítimamente adquiridos"], "titulo_genially": "Bienes objeto de mezcla patrimonial", "complemento_genially": "", "apartado": "2.1. Causales sustanciales de extinción de dominio (artículo 16 de la Ley 1708 de 2014)", "ilustracion": "bienes-afectados.webp", "paginas_pdf": [27, 28]}, {"layout": "mental", "segmentos": ["Las causales de equivalencia patrimonial permiten examinar determinados bienes lícitos cuando concurren los supuestos específicos previstos en el artículo 16 para la afectación de activos por valor equivalente. Esta figura responde a situaciones en las cuales los bienes directamente vinculados con una actividad ilícita no pueden ser localizados, identificados o afectados en las condiciones establecidas por el legislador. Sin embargo, su aplicación no constituye una autorización general para perseguir cualquier bien del patrimonio de una persona, puesto que exige verificar la causal concreta, sus presupuestos legales y la correspondencia económica que justifica la afectación.", "La investigación patrimonial debe establecer, por tanto, cuáles eran los bienes originalmente relacionados con la actividad ilícita, qué circunstancias impiden su persecución directa y cuáles son los fundamentos jurídicos para considerar la procedencia de una afectación por equivalencia. También resulta necesario documentar los criterios utilizados para determinar el valor de los activos y evitar que la medida se extienda más allá de los límites legalmente autorizados. Esta modalidad exige especial rigor argumentativo, debido a que la relación entre el bien perseguido y la actividad ilícita puede no corresponder a una conexión material directa, sino a una hipótesis de sustitución patrimonial expresamente contemplada por el ordenamiento jurídico."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mental", "items": [{"label": "causales de equivalencia patrimonial", "segs": [0], "obj": "documento"}, {"label": "bienes originalmente relacionados", "segs": [1], "obj": "lupa"}]}], "rotulo": null, "seccion": "Lección 2.1. Causales sustanciales de extinción de dominio (artículo 16 de la Ley 1708 de 2014): Identificación de bienes relacionados con actividades ilícitas por su origen, destinación, utilización, transformación, mezcla o equivalencia.", "grupo": "Bienes de valor equivalente", "titulos_fuente": ["Lección 2.1. Causales sustanciales de extinción de dominio (artículo 16 de la Ley 1708 de 2014): Identificación de bienes relacionados con actividades ilícitas por su origen, destinación, utilización, transformación, mezcla o equivalencia.", "Bienes de valor equivalente"], "encabezados": [], "mediacion": "Mapa mental: la idea central y sus ramas; cada rama abre su texto completo.", "rotulos": ["causales de equivalencia patrimonial", "bienes originalmente relacionados"], "titulo_genially": "Bienes de valor equivalente", "complemento_genially": "", "apartado": "2.1. Causales sustanciales de extinción de dominio (artículo 16 de la Ley 1708 de 2014)", "ilustracion": "investigacion-activos.webp", "paginas_pdf": [28, 28]}, {"layout": "linea", "segmentos": ["Durante una investigación patrimonial, la Fiscalía identifica que una organización presuntamente dedicada a actividades ilícitas obtuvo recursos que fueron utilizados para adquirir maquinaria industrial.", "Posteriormente, parte de esta maquinaria fue vendida y el dinero recibido se incorporó al capital de una sociedad comercial, mientras que otra parte de los recursos fue destinada a la compra de un inmueble.", "La investigación deberá establecer el origen de los fondos, reconstruir las operaciones de adquisición y transferencia, identificar los activos actualmente existentes y determinar las causales del artículo 16 que podrían resultar aplicables.", "En este escenario, la transformación de los recursos y su incorporación a nuevas estructuras patrimoniales no eliminan necesariamente la posibilidad de promover la acción, pero cada vinculación deberá sustentarse mediante elementos de conocimiento verificables."], "parrafo": [0, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "linea", "items": [{"label": "adquirir maquinaria industrial", "segs": [0], "obj": "lupa"}, {"label": "capital de una sociedad comercial", "segs": [1], "obj": "casa"}, {"label": "origen de los fondos", "segs": [2], "obj": "documento"}, {"label": "elementos de conocimiento verificables", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 2.1. Causales sustanciales de extinción de dominio (artículo 16 de la Ley 1708 de 2014): Identificación de bienes relacionados con actividades ilícitas por su origen, destinación, utilización, transformación, mezcla o equivalencia.", "grupo": null, "titulos_fuente": ["Lección 2.1. Causales sustanciales de extinción de dominio (artículo 16 de la Ley 1708 de 2014): Identificación de bienes relacionados con actividades ilícitas por su origen, destinación, utilización, transformación, mezcla o equivalencia."], "encabezados": [], "mediacion": "Línea de tiempo: se avanza momento a momento.", "rotulos": ["adquirir maquinaria industrial", "capital de una sociedad comercial", "origen de los fondos", "elementos de conocimiento verificables"], "titulo_genially": "Ejemplo práctico", "complemento_genially": "", "apartado": "2.1. Causales sustanciales de extinción de dominio (artículo 16 de la Ley 1708 de 2014)", "ilustracion": "examen-bienes.webp", "paginas_pdf": [29, 29]}, {"layout": "esquema", "segmentos": ["La imposición de medidas cautelares con fines de extinción de dominio requiere acreditar una relación probable entre el bien investigado y alguna de las causales previstas en el artículo 16 de la Ley 1708 de 2014. Esta exigencia constituye una garantía frente a intervenciones patrimoniales arbitrarias, puesto que impide que la afectación de los bienes se fundamente exclusivamente en sospechas, afirmaciones generales o antecedentes personales de sus titulares. Corresponde a la Fiscalía identificar los elementos de conocimiento que sustentan la hipótesis patrimonial y explicar de qué manera permiten establecer, con el grado de suficiencia exigido para esta etapa, la probable vinculación del activo con una actividad ilícita.", "El artículo 88 de la Ley 1708 de 2014 establece como presupuesto de la suspensión del poder dispositivo la existencia de elementos de juicio suficientes para considerar la probable vinculación de los bienes con alguna causal de extinción de dominio. Este estándar tiene naturaleza cautelar y, por tanto, no equivale a la demostración definitiva de los presupuestos necesarios para declarar la pérdida del derecho de propiedad. Su función consiste en permitir una intervención provisional cuando la información disponible proporciona un fundamento objetivo para considerar que el bien puede encontrarse comprendido en una causal legal y que resulta necesario asegurar su disponibilidad durante el procedimiento.", "La diferencia entre el estándar cautelar y el requerido para la decisión definitiva radica en el objeto y la intensidad de la valoración probatoria. En la etapa cautelar se examina si los elementos de conocimiento disponibles permiten sostener razonablemente la probable vinculación del activo con una causal de extinción de dominio; en la sentencia, por el contrario, debe resolverse si los presupuestos sustanciales de la pretensión se encuentran acreditados conforme a las reglas probatorias del procedimiento. Esta distinción impide exigir una demostración definitiva para adoptar una medida provisional, pero también prohíbe interpretar el carácter preventivo de la medida como una autorización para afectar bienes sin fundamento suficiente."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "relación probable", "segs": [0], "obj": "libros"}, {"label": "artículo 88 de la Ley 1708", "segs": [1], "obj": "carpetas"}, {"label": "diferencia entre el estándar cautelar", "segs": [2], "obj": "escalones"}]}], "rotulo": null, "seccion": "Lección 2.2. Acreditación del nexo de ilicitud y estándar probatorio cautelar: Elementos de juicio suficientes para establecer la probable vinculación del bien con alguna causal de extinción de dominio.", "grupo": null, "titulos_fuente": ["Lección 2.2. Acreditación del nexo de ilicitud y estándar probatorio cautelar: Elementos de juicio suficientes para establecer la probable vinculación del bien con alguna causal de extinción de dominio."], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["relación probable", "artículo 88 de la Ley 1708", "diferencia entre el estándar cautelar"], "titulo_genially": "2.2. Acreditación del nexo de ilicitud y estándar probatorio cautelar", "complemento_genially": "Elementos de juicio suficientes para establecer la probable vinculación del bien con alguna causal de extinción de dominio.", "apartado": "2.2. Acreditación del nexo de ilicitud y estándar probatorio cautelar", "ilustracion": "verificacion-registral.webp", "paginas_pdf": [29, 30]}, {"layout": "giro", "segmentos": ["El nexo de ilicitud corresponde a la relación jurídicamente relevante entre el bien investigado y las circunstancias que configuran alguna de las causales sustanciales de extinción de dominio. Su acreditación exige determinar cuál es la hipótesis legal aplicable y cuáles son los hechos que permiten vincular el activo con ella. Así, cuando se investiga el origen ilícito de un inmueble, el análisis debe concentrarse en la procedencia de los recursos utilizados para adquirirlo; cuando se examina su utilización como instrumento de una actividad ilícita, la investigación debe establecer las circunstancias de uso y la relación funcional del bien con dicha actividad.", "Para construir este nexo, los fiscales y servidores de policía judicial deben desarrollar una secuencia de análisis que permita identificar el activo, establecer la causal presuntamente aplicable, recopilar elementos de conocimiento y verificar la correspondencia entre los hechos investigados y el presupuesto legal. Esta metodología evita que la investigación patrimonial se limite a elaborar inventarios de bienes pertenecientes a personas vinculadas con actuaciones penales, pues exige construir una hipótesis específica respecto de cada activo o conjunto de bienes jurídicamente relacionados.", "En términos probatorios, el nexo puede sustentarse mediante documentos, información financiera, registros públicos, informes de policía judicial, declaraciones, dictámenes periciales y otros elementos obtenidos conforme a las reglas legales aplicables. La valoración debe atender a la pertinencia y confiabilidad de la información, así como a su capacidad para explicar la relación del bien con la causal invocada. En particular, cuando se utilicen indicios, resulta necesario identificar los hechos indicadores acreditados y explicar las inferencias que permiten relacionarlos con la hipótesis patrimonial, evitando que las conclusiones dependan de conjeturas o asociaciones carentes de corroboración."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "nexo de ilicitud", "segs": [0], "obj": "casa"}, {"label": "secuencia de análisis", "segs": [1], "obj": "lupa"}, {"label": "documentos, información financiera, registros públicos", "segs": [2], "obj": "reloj"}]}], "rotulo": null, "seccion": "Lección 2.2. Acreditación del nexo de ilicitud y estándar probatorio cautelar: Elementos de juicio suficientes para establecer la probable vinculación del bien con alguna causal de extinción de dominio.", "grupo": "Construcción del nexo de ilicitud", "titulos_fuente": ["Lección 2.2. Acreditación del nexo de ilicitud y estándar probatorio cautelar: Elementos de juicio suficientes para establecer la probable vinculación del bien con alguna causal de extinción de dominio.", "Construcción del nexo de ilicitud"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["nexo de ilicitud", "secuencia de análisis", "documentos, información financiera, registros públicos"], "titulo_genially": "Construcción del nexo de ilicitud", "complemento_genially": "", "apartado": "2.2. Acreditación del nexo de ilicitud y estándar probatorio cautelar", "ilustracion": "inspector-documento.webp", "paginas_pdf": [30, 31]}, {"layout": "puntos", "segmentos": ["La suficiencia probatoria no depende exclusivamente de la cantidad de elementos recopilados, sino de su capacidad para sustentar razonablemente la probable vinculación del bien con una causal de extinción de dominio. Por esta razón, una investigación puede contar con numerosos documentos que resulten insuficientes para justificar la medida si no permiten establecer una relación concreta entre el activo y la hipótesis legal. Del mismo modo, un conjunto de elementos convergentes, debidamente obtenidos y analizados, puede proporcionar un fundamento cautelar relevante cuando permite reconstruir de manera consistente las circunstancias de adquisición, utilización o transformación patrimonial.", "La providencia que decreta una medida cautelar debe contener una motivación que permita comprender las razones de la afectación, identificar los bienes comprendidos y establecer la correspondencia entre los elementos de juicio disponibles y la causal invocada. Además, cuando se pretendan imponer medidas adicionales a la suspensión del poder dispositivo, como el embargo, el secuestro o la toma de posesión, corresponde justificar su razonabilidad y necesidad, atendiendo a los riesgos concretos que se busca prevenir. De esta manera, la motivación cumple una doble función: fundamenta la intervención patrimonial y permite que los afectados ejerzan adecuadamente los mecanismos de contradicción y control judicial previstos en la ley."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "suficiencia probatoria", "segs": [0], "obj": "lupa"}, {"label": "providencia que decreta una medida cautelar", "segs": [1], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 2.2. Acreditación del nexo de ilicitud y estándar probatorio cautelar: Elementos de juicio suficientes para establecer la probable vinculación del bien con alguna causal de extinción de dominio.", "grupo": "Suficiencia probatoria y motivación de la medida cautelar", "titulos_fuente": ["Lección 2.2. Acreditación del nexo de ilicitud y estándar probatorio cautelar: Elementos de juicio suficientes para establecer la probable vinculación del bien con alguna causal de extinción de dominio.", "Suficiencia probatoria y motivación de la medida cautelar"], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["suficiencia probatoria", "providencia que decreta una medida cautelar"], "titulo_genially": "Suficiencia probatoria y motivación de la medida cautelar (1 de 2)", "complemento_genially": "", "apartado": "2.2. Acreditación del nexo de ilicitud y estándar probatorio cautelar", "ilustracion": "documento-inmueble.webp", "paginas_pdf": [31, 31]}, {"layout": "ruta", "segmentos": ["La construcción del soporte probatorio cautelar puede organizarse mediante los siguientes pasos:", "Individualizar el bien: determinar su naturaleza, ubicación, identificación registral, características y titularidad conocida.", "Precisar la causal aplicable: identificar el supuesto del artículo 16 que podría fundamentar la acción.", "Establecer los hechos relevantes: describir las circunstancias de adquisición, utilización, destinación, transformación o relación patrimonial que se investigan.", "Relacionar los elementos de conocimiento: identificar las fuentes probatorias que sustentan cada circunstancia relevante.", "Valorar la probable vinculación: explicar por qué la información obtenida permite considerar que el activo podría encontrarse comprendido en la causal invocada.", "Determinar la necesidad cautelar: identificar los riesgos patrimoniales y establecer las medidas jurídicamente procedentes para neutralizarlos.", "Motivar la decisión: expresar las razones fácticas, probatorias y jurídicas que justifican la afectación, delimitando sus efectos sobre los bienes y derechos involucrados."], "parrafo": [0, 1, 2, 3, 4, 5, 6, 7], "vineta": [1, 2, 3, 4, 5, 6, 7], "lead": [], "titulo": [0], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "Individualizar el bien", "segs": [1], "obj": "documento"}, {"label": "Precisar la causal aplicable", "segs": [2], "obj": "carpetas"}, {"label": "Establecer los hechos relevantes", "segs": [3], "obj": "lupa"}, {"label": "Relacionar los elementos de conocimiento", "segs": [4], "obj": "expediente"}, {"label": "Valorar la probable vinculación", "segs": [5], "obj": "libros"}, {"label": "Determinar la necesidad cautelar", "segs": [6], "obj": "escalones"}, {"label": "Motivar la decisión", "segs": [7], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 2.2. Acreditación del nexo de ilicitud y estándar probatorio cautelar: Elementos de juicio suficientes para establecer la probable vinculación del bien con alguna causal de extinción de dominio.", "grupo": "Suficiencia probatoria y motivación de la medida cautelar", "titulos_fuente": [], "encabezados": [], "mediacion": "Ruta paso a paso con ficha que avanza.", "rotulos": ["Individualizar el bien", "Precisar la causal aplicable", "Establecer los hechos relevantes", "Relacionar los elementos de conocimiento", "Valorar la probable vinculación", "Determinar la necesidad cautelar", "Motivar la decisión"], "titulo_genially": "Suficiencia probatoria y motivación de la medida cautelar (2 de 2)", "complemento_genially": "", "apartado": "2.2. Acreditación del nexo de ilicitud y estándar probatorio cautelar", "ilustracion": "casa-lupa.webp", "paginas_pdf": [31, 32]}, {"layout": "linea", "segmentos": ["Durante una investigación patrimonial, la Fiscalía identifica que una persona adquirió un inmueble por un valor considerablemente superior a sus ingresos lícitos conocidos.", "La información bancaria evidencia transferencias provenientes de una sociedad investigada por operaciones relacionadas con actividades ilícitas, mientras que los documentos contractuales presentan inconsistencias respecto de la forma de pago.", "Estos elementos pueden justificar la profundización de la investigación y, valorados conjuntamente, eventualmente sustentar una hipótesis de probable vinculación del inmueble con una causal de extinción de dominio.", "Sin embargo, la imposición de una medida cautelar exige que el fiscal explique la relación entre las operaciones identificadas, los recursos utilizados para la adquisición y la causal legal correspondiente, sin considerar que la diferencia patrimonial constituye por sí sola una demostración definitiva de ilicitud."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "linea", "items": [{"label": "valor considerablemente superior", "segs": [0], "obj": "casa"}, {"label": "información bancaria", "segs": [1], "obj": "expediente"}, {"label": "hipótesis de probable vinculación", "segs": [2], "obj": "lupa"}, {"label": "imposición de una medida cautelar", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 2.2. Acreditación del nexo de ilicitud y estándar probatorio cautelar: Elementos de juicio suficientes para establecer la probable vinculación del bien con alguna causal de extinción de dominio.", "grupo": null, "titulos_fuente": ["Lección 2.2. Acreditación del nexo de ilicitud y estándar probatorio cautelar: Elementos de juicio suficientes para establecer la probable vinculación del bien con alguna causal de extinción de dominio."], "encabezados": [], "mediacion": "Línea de tiempo: se avanza momento a momento.", "rotulos": ["valor considerablemente superior", "información bancaria", "hipótesis de probable vinculación", "imposición de una medida cautelar"], "titulo_genially": "Ejemplo práctico", "complemento_genially": "", "apartado": "2.2. Acreditación del nexo de ilicitud y estándar probatorio cautelar", "ilustracion": "inspeccion-propiedad.webp", "paginas_pdf": [32, 32]}, {"layout": "mental", "segmentos": ["La acción de extinción de dominio debe desarrollarse respetando los derechos de quienes han adquirido bienes de manera legítima y han actuado conforme a los deberes de diligencia exigibles en las relaciones patrimoniales. Aunque esta acción permite perseguir bienes relacionados con actividades ilícitas con independencia de la responsabilidad penal de sus titulares, su ejercicio encuentra límites en las garantías constitucionales de propiedad privada, debido proceso y protección de la buena fe.", "En consecuencia, la investigación patrimonial no puede desconocer automáticamente los derechos de quienes hayan intervenido en operaciones jurídicas sobre los bienes investigados, pues corresponde examinar las circunstancias particulares de adquisición, la posición jurídica de cada afectado y las condiciones que permiten reconocer la protección de la buena fe exenta de culpa.", "El artículo 83 de la Constitución Política establece que las actuaciones de los particulares y de las autoridades públicas deben ceñirse a los postulados de la buena fe, la cual se presume en las gestiones que aquellos adelanten ante las autoridades. En el régimen de extinción de dominio, esta garantía se complementa con la protección de los derechos legítimamente adquiridos y con las disposiciones de la Ley 1708 de 2014 relativas a la buena fe exenta de culpa. Su aplicación exige distinguir entre la simple afirmación de haber actuado sin conocimiento de una irregularidad y la demostración de una conducta diligente frente a las circunstancias objetivas de la operación patrimonial, teniendo en cuenta que la exigencia de diligencia debe interpretarse de manera razonable y proporcionada."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mental", "items": [{"label": "adquirido bienes de manera legítima", "segs": [0], "obj": "documento"}, {"label": "no puede desconocer automáticamente", "segs": [1], "obj": "escudo"}, {"label": "artículo 83 de la Constitución Política", "segs": [2], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 2.3. Buena fe exenta de culpa y cargas probatorias: Protección de terceros, diligencia cualificada y distribución de las cargas probatorias entre la Fiscalía y los afectados.", "grupo": null, "titulos_fuente": ["Lección 2.3. Buena fe exenta de culpa y cargas probatorias: Protección de terceros, diligencia cualificada y distribución de las cargas probatorias entre la Fiscalía y los afectados."], "encabezados": [], "mediacion": "Mapa mental: la idea central y sus ramas; cada rama abre su texto completo.", "rotulos": ["adquirido bienes de manera legítima", "no puede desconocer automáticamente", "artículo 83 de la Constitución Política"], "titulo_genially": "2.3. Buena fe exenta de culpa y cargas probatorias", "complemento_genially": "Protección de terceros, diligencia cualificada y distribución de las cargas probatorias entre la Fiscalía y los afectados.", "apartado": "2.3. Buena fe exenta de culpa y cargas probatorias", "ilustracion": "analisis-financiero.webp", "paginas_pdf": [32, 33]}, {"layout": "rejilla", "segmentos": ["La buena fe simple se relaciona con la convicción subjetiva de actuar conforme a derecho, mientras que la buena fe exenta de culpa incorpora un componente objetivo asociado al comportamiento diligente de quien pretende obtener protección jurídica. Esta última exige examinar si la persona adoptó las precauciones razonablemente esperables para verificar la legitimidad de la operación, atendiendo a las características del bien, las circunstancias de adquisición y las condiciones particulares del negocio jurídico. Por tanto, la buena fe exenta de culpa no puede reducirse a la ausencia de conocimiento efectivo sobre una actividad ilícita, pero tampoco puede convertirse en una obligación ilimitada de investigar antecedentes personales o hechos ajenos al ámbito razonable de verificación del adquirente.", "La Corte Constitucional, precisó límites relevantes a las exigencias que pueden imponerse a terceros adquirentes de bienes. En particular, explicó que la diligencia exigible debe guardar relación con la situación jurídica del activo y las circunstancias de la adquisición, sin imponer a los particulares una obligación general de investigar exhaustivamente la vida personal, los antecedentes judiciales o las eventuales investigaciones de quienes intervienen en las operaciones patrimoniales. (Corte Constitucional, 2020) Esta interpretación busca evitar que la protección de la buena fe exenta de culpa se transforme en una carga imposible de satisfacer y que la acción de extinción de dominio comprometa injustificadamente la seguridad del tráfico jurídico.", "La valoración de la diligencia debe atender a las particularidades de cada operación. En la adquisición de un inmueble, por ejemplo, pueden resultar relevantes el examen de los antecedentes registrales, la verificación de la titularidad, la existencia de limitaciones al dominio y las condiciones económicas de la compraventa. En operaciones societarias o financieras, el análisis puede comprender la documentación contractual, la identificación de las partes, la trazabilidad de los pagos y el cumplimiento de los deberes legales aplicables. Sin embargo, estos criterios no constituyen una lista universal de requisitos cuya ausencia determine automáticamente la mala fe, pues corresponde valorar su pertinencia según el contexto y las posibilidades reales de actuación del tercero."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "buena fe simple", "segs": [0], "obj": "escudo", "ilus": "verificacion-registral.webp"}, {"label": "terceros adquirentes de bienes", "segs": [1], "obj": "libros", "ilus": "documento-inmueble.webp"}, {"label": "valoración de la diligencia", "segs": [2], "obj": "casa", "ilus": "examen-bienes.webp"}]}], "rotulo": null, "seccion": "Lección 2.3. Buena fe exenta de culpa y cargas probatorias: Protección de terceros, diligencia cualificada y distribución de las cargas probatorias entre la Fiscalía y los afectados.", "grupo": "Buena fe simple y buena fe exenta de culpa", "titulos_fuente": ["Lección 2.3. Buena fe exenta de culpa y cargas probatorias: Protección de terceros, diligencia cualificada y distribución de las cargas probatorias entre la Fiscalía y los afectados.", "Buena fe simple y buena fe exenta de culpa"], "encabezados": [], "mediacion": "Rejilla en collage: ventanas con ilustración que llenan el marco; cada una abre su texto completo.", "rotulos": ["buena fe simple", "terceros adquirentes de bienes", "valoración de la diligencia"], "titulo_genially": "Buena fe simple y buena fe exenta de culpa", "complemento_genially": "", "apartado": "2.3. Buena fe exenta de culpa y cargas probatorias", "ilustracion": "archivo.webp", "paginas_pdf": [33, 34]}, {"layout": "fichas", "segmentos": ["La protección de terceros adquiere especial importancia cuando los bienes investigados han sido objeto de transferencias, gravámenes, sucesiones, negocios fiduciarios u otras operaciones que involucran derechos de personas diferentes de aquellas relacionadas con la actividad ilícita. En estos escenarios, la Fiscalía debe identificar a los posibles afectados y examinar la naturaleza de sus derechos, evitando considerar que la vinculación de un bien con una causal de extinción implica necesariamente la inexistencia de intereses patrimoniales legítimos. El procedimiento debe permitir que quienes aleguen derechos sobre los activos conozcan la actuación, ejerzan su defensa, controviertan los elementos probatorios y aporten información relevante para establecer su situación jurídica.", "La Corte Constitucional declaró su exequibilidad condicionada, de los numerales 10 y 11 del artículo 16 del Código de Extinción de Dominio, en el entendido de que la extinción de bienes de origen lícito, bajo esas causales, solamente procede cuando su propietario sea el mismo titular de los bienes cuya extinción no resulta posible, sin perjuicio de los derechos de terceros de buena fe exenta de culpa. (Corte Constitucional, 2020). En consecuencia, la equivalencia patrimonial no permite perseguir indiscriminadamente bienes lícitos transferidos a terceros por la sola circunstancia de haber pertenecido anteriormente a una persona relacionada con actividades ilícitas."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "protección de terceros", "segs": [0], "obj": "escudo"}, {"label": "exequibilidad condicionada", "segs": [1], "obj": "libros"}]}], "rotulo": null, "seccion": "Lección 2.3. Buena fe exenta de culpa y cargas probatorias: Protección de terceros, diligencia cualificada y distribución de las cargas probatorias entre la Fiscalía y los afectados.", "grupo": "Protección de terceros afectados", "titulos_fuente": ["Lección 2.3. Buena fe exenta de culpa y cargas probatorias: Protección de terceros, diligencia cualificada y distribución de las cargas probatorias entre la Fiscalía y los afectados.", "Protección de terceros afectados"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["protección de terceros", "exequibilidad condicionada"], "titulo_genially": "Protección de terceros afectados", "complemento_genially": "", "apartado": "2.3. Buena fe exenta de culpa y cargas probatorias", "ilustracion": "verificacion-registral.webp", "paginas_pdf": [34, 35]}, {"layout": "rejilla", "segmentos": ["El régimen de extinción de dominio contempla una distribución de las cargas probatorias que debe interpretarse conforme a las garantías del debido proceso y a la posición de las partes frente a los hechos objeto de controversia. El artículo 152 de la Ley 1708 de 2014 establece reglas específicas sobre esta materia, que permiten distinguir entre la obligación de la Fiscalía de sustentar la pretensión de extinción y la carga de los afectados de aportar elementos relacionados con las circunstancias que invocan para oponerse a ella. Esta distribución no significa que la Fiscalía pueda limitarse a formular afirmaciones generales y exigir que los titulares demuestren la licitud de todos sus bienes, pues la pretensión estatal debe encontrarse respaldada por elementos probatorios que permitan acreditar sus presupuestos.", "La Fiscalía tiene la responsabilidad de identificar los bienes investigados, establecer los hechos relevantes, determinar las causales aplicables y aportar los elementos que sustenten la vinculación patrimonial con las actividades ilícitas. Por su parte, los afectados pueden encontrarse en mejores condiciones para demostrar determinadas circunstancias relacionadas con la adquisición de los bienes, la procedencia de recursos, la celebración de negocios jurídicos o las actuaciones diligentes que fundamentan su oposición.", "La distribución de las cargas probatorias debe atender a la naturaleza de los hechos discutidos y a la posibilidad razonable de obtener los elementos correspondientes, sin desconocer que la falta de colaboración de un afectado no reemplaza automáticamente la obligación estatal de acreditar la causal de extinción.", "La Corte Constitucional, destacó que corresponde al Estado, a través de la Fiscalía General de la Nación, asumir la carga probatoria y argumentativa necesaria para demostrar los elementos constitutivos de las causales de extinción, especialmente cuando se pretende afectar bienes lícitos por equivalencia (Corte Constitucional, 2020). Esta exigencia comprende la acreditación de las circunstancias que impiden perseguir los activos originalmente relacionados con la actividad ilícita y la justificación de los presupuestos que permiten acudir a bienes diferentes. De esta manera, la protección de la buena fe exenta de culpa y la distribución de las cargas probatorias operan como garantías frente a intervenciones patrimoniales que carezcan de una justificación objetiva y suficiente."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "garantías del debido proceso", "segs": [0], "obj": "libros", "ilus": "archivo.webp"}, {"label": "responsabilidad de identificar los bienes", "segs": [1], "obj": "documento", "ilus": "inspector-documento.webp"}, {"label": "distribución de las cargas probatorias", "segs": [2], "obj": "carpetas", "ilus": "equipo-torre.webp"}, {"label": "carga probatoria y argumentativa", "segs": [3], "obj": "lupa", "ilus": "investigacion-activos.webp"}]}], "rotulo": null, "seccion": "Lección 2.3. Buena fe exenta de culpa y cargas probatorias: Protección de terceros, diligencia cualificada y distribución de las cargas probatorias entre la Fiscalía y los afectados.", "grupo": "Distribución de las cargas probatorias", "titulos_fuente": ["Lección 2.3. Buena fe exenta de culpa y cargas probatorias: Protección de terceros, diligencia cualificada y distribución de las cargas probatorias entre la Fiscalía y los afectados.", "Distribución de las cargas probatorias"], "encabezados": [], "mediacion": "Rejilla en collage: ventanas con ilustración que llenan el marco; cada una abre su texto completo.", "rotulos": ["garantías del debido proceso", "responsabilidad de identificar los bienes", "distribución de las cargas probatorias", "carga probatoria y argumentativa"], "titulo_genially": "Distribución de las cargas probatorias", "complemento_genially": "", "apartado": "2.3. Buena fe exenta de culpa y cargas probatorias", "ilustracion": "casa-lupa.webp", "paginas_pdf": [35, 36]}, {"layout": "linea", "segmentos": ["Durante una investigación de extinción de dominio, la Fiscalía identifica un inmueble que perteneció a una persona presuntamente vinculada con actividades ilícitas y que posteriormente fue vendido a un tercero.", "El comprador afirma haber adquirido el bien mediante escritura pública, después de examinar sus antecedentes registrales y pagar un precio correspondiente a las condiciones del mercado.", "La Fiscalía deberá determinar cuál es la causal de extinción invocada, establecer la relación del inmueble con los hechos investigados y valorar las circunstancias de la transferencia.", "Por su parte, el adquirente podrá aportar los documentos y demás elementos que permitan acreditar su actuación diligente.", "La decisión no puede fundarse exclusivamente en los antecedentes personales del vendedor ni desconocer las garantías que protegen los derechos legítimamente adquiridos."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "linea", "items": [{"label": "vendido a un tercero", "segs": [0], "obj": "casa"}, {"label": "escritura pública", "segs": [1], "obj": "documento"}, {"label": "causal de extinción invocada", "segs": [2], "obj": "carpetas"}, {"label": "actuación diligente", "segs": [3], "obj": "lupa"}, {"label": "derechos legítimamente adquiridos", "segs": [4], "obj": "escudo"}]}], "rotulo": null, "seccion": "Lección 2.3. Buena fe exenta de culpa y cargas probatorias: Protección de terceros, diligencia cualificada y distribución de las cargas probatorias entre la Fiscalía y los afectados.", "grupo": null, "titulos_fuente": ["Lección 2.3. Buena fe exenta de culpa y cargas probatorias: Protección de terceros, diligencia cualificada y distribución de las cargas probatorias entre la Fiscalía y los afectados."], "encabezados": [], "mediacion": "Línea de tiempo: se avanza momento a momento.", "rotulos": ["vendido a un tercero", "escritura pública", "causal de extinción invocada", "actuación diligente", "derechos legítimamente adquiridos"], "titulo_genially": "Ejemplo práctico", "complemento_genially": "", "apartado": "2.3. Buena fe exenta de culpa y cargas probatorias", "ilustracion": "investigacion-inmueble.webp", "paginas_pdf": [36, 36]}, {"layout": "esquema", "segmentos": ["La investigación patrimonial constituye una actividad esencial para establecer la relación entre los bienes y las causales de extinción de dominio, puesto que permite identificar activos, reconstruir operaciones económicas y determinar las circunstancias que explican su adquisición, utilización, transformación o transferencia. A diferencia de una investigación centrada exclusivamente en la identificación de autores o partícipes de una conducta punible, la investigación patrimonial se orienta a examinar la composición, evolución y circulación de los bienes, con el propósito de establecer su situación jurídica y económica. En consecuencia, su desarrollo requiere integrar información registral, financiera, comercial, societaria y documental, mediante actuaciones legalmente autorizadas y orientadas por hipótesis patrimoniales verificables.", "Para la Fiscalía General de la Nación, estas actividades permiten construir el soporte probatorio necesario para sustentar las medidas cautelares y determinar la procedencia de la acción de extinción de dominio. La labor de los servidores de policía judicial debe dirigirse a identificar los activos relacionados con los hechos investigados, verificar su titularidad formal y real, reconstruir los movimientos económicos relevantes y establecer posibles mecanismos de ocultamiento o sustitución patrimonial. Este proceso exige una metodología ordenada que permita conservar la trazabilidad de la información, documentar las fuentes consultadas y establecer relaciones verificables entre personas, bienes, operaciones y actividades ilícitas."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "actividad esencial", "segs": [0], "obj": "lupa"}, {"label": "soporte probatorio", "segs": [1], "obj": "personas"}]}], "rotulo": null, "seccion": "Lección 2.4. Investigación patrimonial y trazabilidad de bienes: Identificación de activos, titularidad real, operaciones financieras y estructuras de ocultamiento patrimonial mediante actividades de policía judicial.", "grupo": null, "titulos_fuente": ["Lección 2.4. Investigación patrimonial y trazabilidad de bienes: Identificación de activos, titularidad real, operaciones financieras y estructuras de ocultamiento patrimonial mediante actividades de policía judicial."], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["actividad esencial", "soporte probatorio"], "titulo_genially": "2.4. Investigación patrimonial y trazabilidad de bienes", "complemento_genially": "Identificación de activos, titularidad real, operaciones financieras y estructuras de ocultamiento patrimonial mediante actividades de policía judicial.", "apartado": "2.4. Investigación patrimonial y trazabilidad de bienes", "ilustracion": "investigacion-activos.webp", "paginas_pdf": [36, 37]}, {"layout": "puntos", "segmentos": ["La identificación patrimonial comprende las actuaciones destinadas a establecer qué bienes integran el patrimonio investigado, dónde se encuentran y cuáles son sus principales características jurídicas y económicas. Esta actividad puede abarcar inmuebles, vehículos, establecimientos de comercio, participaciones societarias, productos financieros, títulos valores, maquinaria y otros derechos de contenido económico. Su desarrollo exige individualizar los activos mediante datos verificables, tales como matrículas inmobiliarias, placas, números de identificación registral, información societaria y demás elementos que permitan diferenciarlos de otros bienes.", "La ubicación de activos debe complementarse con la verificación de su situación jurídica, especialmente en lo relacionado con titularidad, gravámenes, limitaciones al dominio, medidas cautelares previamente inscritas y antecedentes de transferencia. Esta información permite identificar posibles riesgos de disposición patrimonial y establecer si existen derechos de terceros que deban ser considerados antes de promover una afectación cautelar. Asimismo, facilita la ejecución de las medidas decretadas, puesto que una identificación precisa reduce el riesgo de errores registrales, afectaciones sobre bienes distintos de los investigados o dificultades en las actuaciones de administración posterior."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "identificación patrimonial", "segs": [0], "obj": "casa"}, {"label": "ubicación de activos", "segs": [1], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 2.4. Investigación patrimonial y trazabilidad de bienes: Identificación de activos, titularidad real, operaciones financieras y estructuras de ocultamiento patrimonial mediante actividades de policía judicial.", "grupo": "Identificación y ubicación de activos", "titulos_fuente": ["Lección 2.4. Investigación patrimonial y trazabilidad de bienes: Identificación de activos, titularidad real, operaciones financieras y estructuras de ocultamiento patrimonial mediante actividades de policía judicial.", "Identificación y ubicación de activos"], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["identificación patrimonial", "ubicación de activos"], "titulo_genially": "Identificación y ubicación de activos", "complemento_genially": "", "apartado": "2.4. Investigación patrimonial y trazabilidad de bienes", "ilustracion": "inspeccion-vivienda.webp", "paginas_pdf": [37, 37]}, {"layout": "mental", "segmentos": ["La investigación patrimonial no debe limitarse a determinar quién figura formalmente como propietario de un activo, pues en determinadas estructuras económicas pueden existir diferencias entre la titularidad registral y las personas que ejercen control o reciben los beneficios derivados de su utilización. En este contexto, la identificación de beneficiarios finales constituye una herramienta relevante para examinar relaciones societarias, estructuras fiduciarias, cadenas de propiedad y mecanismos de administración que puedan dificultar el reconocimiento de quienes controlan efectivamente los bienes. Esta actividad debe desarrollarse mediante fuentes de información legalmente accesibles y actuaciones autorizadas, respetando las garantías de reserva y protección de datos aplicables.", "El análisis de titularidad real puede comprender la revisión de certificados de existencia y representación legal, composición accionaria, documentos societarios, contratos, registros de beneficiarios finales y operaciones económicas que permitan identificar relaciones de control. Sin embargo, la existencia de sociedades, encargos fiduciarios o estructuras empresariales complejas no constituye, por sí misma, un indicio suficiente de ilicitud, puesto que estas figuras pueden responder a finalidades económicas legítimas. La investigación debe establecer si existen circunstancias objetivas que permitan relacionar la estructura examinada con alguna causal de extinción de dominio y determinar cuáles son los bienes y derechos efectivamente comprendidos en la hipótesis patrimonial."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mental", "items": [{"label": "propietario de un activo", "segs": [0], "obj": "lupa"}, {"label": "análisis de titularidad real", "segs": [1], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 2.4. Investigación patrimonial y trazabilidad de bienes: Identificación de activos, titularidad real, operaciones financieras y estructuras de ocultamiento patrimonial mediante actividades de policía judicial.", "grupo": "Identificación de la titularidad real y beneficiarios finales", "titulos_fuente": ["Lección 2.4. Investigación patrimonial y trazabilidad de bienes: Identificación de activos, titularidad real, operaciones financieras y estructuras de ocultamiento patrimonial mediante actividades de policía judicial.", "Identificación de la titularidad real y beneficiarios finales"], "encabezados": [], "mediacion": "Mapa mental: la idea central y sus ramas; cada rama abre su texto completo.", "rotulos": ["propietario de un activo", "análisis de titularidad real"], "titulo_genially": "Identificación de la titularidad real y beneficiarios finales", "complemento_genially": "", "apartado": "2.4. Investigación patrimonial y trazabilidad de bienes", "ilustracion": "examen-bienes.webp", "paginas_pdf": [37, 38]}, {"layout": "ruta", "segmentos": ["La trazabilidad financiera consiste en reconstruir el recorrido económico de los recursos mediante el examen de operaciones de ingreso, transferencia, inversión, conversión y adquisición de activos. Su finalidad es establecer relaciones verificables entre fuentes de financiación, movimientos patrimoniales y bienes determinados, permitiendo identificar posibles operaciones de transformación, mezcla o sustitución de recursos. Esta actividad puede apoyarse en información bancaria, registros contables, declaraciones tributarias, contratos, comprobantes de pago y demás documentos obtenidos conforme a las competencias y procedimientos legalmente establecidos.", "El análisis debe desarrollarse mediante una reconstrucción cronológica que permita establecer el origen conocido de los recursos, las personas o entidades que intervienen en las operaciones, los activos adquiridos y las circunstancias económicas relevantes. Para ello, resulta útil comparar fechas, valores, beneficiarios, conceptos de transferencia y soportes contractuales, con el propósito de identificar coincidencias, inconsistencias o relaciones que requieran corroboración. No obstante, las operaciones de elevado valor, las transferencias entre sociedades o la utilización de diferentes instrumentos financieros no demuestran automáticamente una actividad ilícita, por lo que las conclusiones deben sustentarse en el examen integral de la información disponible."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "trazabilidad financiera", "segs": [0], "obj": "lupa"}, {"label": "reconstrucción cronológica", "segs": [1], "obj": "personas"}]}], "rotulo": null, "seccion": "Lección 2.4. Investigación patrimonial y trazabilidad de bienes: Identificación de activos, titularidad real, operaciones financieras y estructuras de ocultamiento patrimonial mediante actividades de policía judicial.", "grupo": "Análisis de operaciones financieras y trazabilidad de recursos", "titulos_fuente": ["Lección 2.4. Investigación patrimonial y trazabilidad de bienes: Identificación de activos, titularidad real, operaciones financieras y estructuras de ocultamiento patrimonial mediante actividades de policía judicial.", "Análisis de operaciones financieras y trazabilidad de recursos"], "encabezados": [], "mediacion": "Ruta paso a paso con ficha que avanza.", "rotulos": ["trazabilidad financiera", "reconstrucción cronológica"], "titulo_genially": "Análisis de operaciones financieras y trazabilidad de recursos", "complemento_genially": "", "apartado": "2.4. Investigación patrimonial y trazabilidad de bienes", "ilustracion": "revision-documentos.webp", "paginas_pdf": [38, 39]}, {"layout": "fichas", "segmentos": ["Las estructuras de ocultamiento patrimonial comprenden mecanismos utilizados para dificultar la identificación de los verdaderos titulares, el origen de los recursos o la localización de activos relacionados con actividades ilícitas. Estas modalidades pueden involucrar la interposición de personas, transferencias sucesivas, simulación de negocios jurídicos, utilización instrumental de sociedades o incorporación de recursos a operaciones comerciales destinadas a dificultar su trazabilidad. La investigación debe examinar las circunstancias concretas de estas operaciones, evitando presumir su carácter ilícito únicamente por la complejidad de la estructura jurídica utilizada.", "La identificación de posibles mecanismos de ocultamiento exige analizar las relaciones entre los intervinientes, la capacidad económica de los titulares formales, las condiciones de los negocios jurídicos y la correspondencia entre los movimientos financieros y los activos identificados. También resulta relevante establecer si existen operaciones carentes de una justificación económica verificable, transferencias realizadas en condiciones inusuales o estructuras de propiedad que dificulten determinar quién ejerce el control efectivo de los bienes. Estos hallazgos deben integrarse con otros elementos de conocimiento y valorarse de manera contextual, pues su relevancia probatoria depende de la relación que permitan establecer con las causales legales de extinción de dominio."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "verdaderos titulares", "segs": [0], "obj": "personas"}, {"label": "relaciones entre los intervinientes", "segs": [1], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 2.4. Investigación patrimonial y trazabilidad de bienes: Identificación de activos, titularidad real, operaciones financieras y estructuras de ocultamiento patrimonial mediante actividades de policía judicial.", "grupo": "Identificación de estructuras de ocultamiento patrimonial", "titulos_fuente": ["Lección 2.4. Investigación patrimonial y trazabilidad de bienes: Identificación de activos, titularidad real, operaciones financieras y estructuras de ocultamiento patrimonial mediante actividades de policía judicial.", "Identificación de estructuras de ocultamiento patrimonial"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["verdaderos titulares", "relaciones entre los intervinientes"], "titulo_genially": "Identificación de estructuras de ocultamiento patrimonial", "complemento_genially": "", "apartado": "2.4. Investigación patrimonial y trazabilidad de bienes", "ilustracion": "inspector-documento.webp", "paginas_pdf": [39, 39]}, {"layout": "puntos", "segmentos": ["Durante una investigación por tráfico de estupefacientes, la Fiscalía identifica un vehículo utilizado para transportar sustancias ilícitas y un inmueble adquirido varios años atrás mediante operaciones financieras que presentan indicios de provenir de actividades ilícitas. En el proceso penal, deberá examinarse la procedencia del comiso sobre los bienes comprendidos en los supuestos legales correspondientes. De manera independiente, podrá valorarse la procedencia de la acción de extinción de dominio respecto del inmueble y de otros activos, siempre que existan elementos de conocimiento que permitan establecer su relación con alguna de las causales del artículo 16 de la Ley 1708 de 2014. La existencia de una actuación penal no sustituye el análisis patrimonial ni autoriza a presumir que todos los bienes del investigado son susceptibles de extinción.", "Como se observa, independencia entre el proceso penal y la acción de extinción de dominio exige que los fiscales, asistentes de fiscal y servidores de policía judicial identifiquen oportunamente los bienes relacionados con actividades ilícitas, determinen su posible tratamiento jurídico y articulen las actuaciones necesarias para evitar duplicidades, contradicciones o afectaciones injustificadas. La información patrimonial obtenida durante una investigación penal puede constituir un insumo relevante para el procedimiento de extinción, pero su utilización requiere respetar las competencias, las reglas probatorias y las garantías propias de cada actuación."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "tráfico de estupefacientes", "segs": [0], "obj": "paquete"}, {"label": "independencia entre el proceso penal", "segs": [1], "obj": "personas"}]}], "rotulo": null, "seccion": "Lección 2.4. Investigación patrimonial y trazabilidad de bienes: Identificación de activos, titularidad real, operaciones financieras y estructuras de ocultamiento patrimonial mediante actividades de policía judicial.", "grupo": "Ejemplo práctico", "titulos_fuente": ["Lección 2.4. Investigación patrimonial y trazabilidad de bienes: Identificación de activos, titularidad real, operaciones financieras y estructuras de ocultamiento patrimonial mediante actividades de policía judicial.", "Ejemplo práctico"], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["tráfico de estupefacientes", "independencia entre el proceso penal"], "titulo_genially": "Ejemplo práctico", "complemento_genially": "", "apartado": "2.4. Investigación patrimonial y trazabilidad de bienes", "ilustracion": "inspeccion-propiedad.webp", "paginas_pdf": [39, 40]}]}</script>
