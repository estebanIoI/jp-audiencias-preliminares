tinción de dominio contempla mecanismos que permiten resolver anticipadamente determinadas controversias patrimoniales y reconocer formas de colaboración con la administración de justicia, sin desconocer la naturaleza constitucional, jurisdiccional y autónoma de esta acción. Estos instrumentos responden a la necesidad de fortalecer la eficacia de la intervención patrimonial del Estado, facilitar la identificación y recuperación de bienes relacionados con actividades ilícitas y evitar la prolongación innecesaria de actuaciones cuando concurren los presupuestos legales para adoptar una decisión anticipada. Su aplicación, sin embargo, no supone que la Fiscalía General de la Nación pueda disponer libremente de los derechos patrimoniales comprometidos, puesto que toda negociación debe sujetarse a las condiciones expresamente establecidas por el legislador y a los controles judiciales correspondientes.", "En esta lección se estudiarán los mecanismos de terminación anticipada de la actuación, las posibilidades de colaboración efectiva con la justicia, los presupuestos para obtener una sentencia anticipada de extinción de dominio y las consecuencias patrimoniales derivadas de la decisión judicial definitiva. Asimismo, se examinará la destinación de los bienes cuya titularidad sea declarada a favor del Estado y la articulación institucional necesaria para su incorporación y administración dentro del Fondo para la Rehabilitación, Inversión Social y Lucha contra el Crimen Organizado (FRISCO). Estos contenidos permitirán a fiscales, asistentes de fiscal y servidores de policía judicial diferenciar los instrumentos de resolución anticipada, reconocer sus límites y desarrollar las actuaciones probatorias y administrativas necesarias para su aplicación.", "La comprensión de estos mecanismos exige distinguir entre la colaboración que permite fortalecer una investigación patrimonial, la aceptación de los presupuestos de extinción por parte del afectado y la negociación expresamente autorizada por la ley. Aunque estas figuras pueden contribuir a la terminación anticipada del procedimiento, no comparten necesariamente los mismos requisitos ni producen idénticos efectos. Por ello, su estudio debe partir de la identificación de las disposiciones aplicables, la oportunidad procesal, las competencias de las autoridades y las garantías que protegen a los afectados y a los terceros con derechos legítimamente adquiridos."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "resolver anticipadamente", "segs": [0], "obj": "escalones"}, {"label": "mecanismos de terminación anticipada", "segs": [1], "obj": "libros"}, {"label": "comprensión de estos mecanismos", "segs": [2], "obj": "lupa"}]}], "rotulo": null, "seccion": "Lección 4. Mecanismos de negociación y acuerdos sobre bienes afectados", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["resolver anticipadamente", "mecanismos de terminación anticipada", "comprensión de estos mecanismos"], "titulo_genially": "Mecanismos de negociación y acuerdos sobre bienes afectados", "complemento_genially": "", "apartado": "", "ilustracion": "equipo-torre.webp", "paginas_pdf": [57, 57]}, {"layout": "mental", "segmentos": ["La terminación anticipada del procedimiento de extinción de dominio constituye una alternativa legal que permite obtener una decisión judicial sin agotar necesariamente todas las etapas del trámite ordinario, cuando concurren las condiciones establecidas en el Código de Extinción de Dominio.", "Su fundamento se relaciona con los principios de eficacia, economía procesal y colaboración con la administración de justicia, en la medida en que facilita la resolución de controversias patrimoniales, contribuye a la recuperación de activos y permite concentrar los recursos institucionales en investigaciones que requieren mayor actividad probatoria. No obstante, estos mecanismos no eliminan la naturaleza jurisdiccional de la acción ni sustituyen la obligación de verificar los presupuestos legales que justifican la declaración de extinción del derecho de dominio.", "La Ley 1708 de 2014, modificada por la Ley 1849 de 2017, contempla diferentes instrumentos que permiten reconocer la aceptación de la pretensión extintiva o la colaboración efectiva de los afectados y de otros particulares. Entre ellos se encuentran la sentencia anticipada de extinción de dominio, la negociación patrimonial por colaboración efectiva, la sentencia anticipada por confesión y el régimen de retribución por información eficaz. Aunque estas figuras comparten la finalidad de facilitar la actuación estatal y reconocer determinados beneficios legalmente autorizados, presentan diferencias en cuanto a sus destinatarios, oportunidades procesales, exigencias de colaboración y consecuencias patrimoniales. Por consiguiente, su aplicación requiere identificar el mecanismo concreto y verificar sus condiciones, evitando trasladar indistintamente los requisitos o porcentajes previstos para una modalidad a otra."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mental", "items": [{"label": "alternativa legal", "segs": [0], "obj": "libros"}, {"label": "principios de eficacia", "segs": [1], "obj": "lupa"}, {"label": "diferentes instrumentos", "segs": [2], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 4.1. Mecanismos de terminación anticipada y colaboración con la justicia: fundamentos, modalidades y límites de los instrumentos de justicia premial en extinción de dominio", "grupo": null, "titulos_fuente": ["Lección 4.1. Mecanismos de terminación anticipada y colaboración con la justicia: fundamentos, modalidades y límites de los instrumentos de justicia premial en extinción de dominio"], "encabezados": [], "mediacion": "Mapa mental: la idea central y sus ramas; cada rama abre su texto completo.", "rotulos": ["alternativa legal", "principios de eficacia", "diferentes instrumentos"], "titulo_genially": "4.1. Mecanismos de terminación anticipada y colaboración con la justicia", "complemento_genially": "fundamentos, modalidades y límites de los instrumentos de justicia premial en extinción de dominio", "apartado": "4.1. Mecanismos de terminación anticipada y colaboración con la justicia", "ilustracion": "revision-documentos.webp", "paginas_pdf": [58, 58]}, {"layout": "esquema", "segmentos": ["La justicia premial comprende mecanismos mediante los cuales el ordenamiento jurídico reconoce beneficios específicos a quienes desarrollan comportamientos de colaboración que contribuyen al cumplimiento de las finalidades de la administración de justicia. En el procedimiento de extinción de dominio, estos instrumentos poseen una dimensión esencialmente patrimonial, puesto que pueden permitir la conservación de determinados bienes o el reconocimiento de retribuciones económicas, dentro de los límites previstos por el legislador. Su justificación radica en la utilidad de la información proporcionada, la eficacia de la colaboración y la posibilidad de facilitar la identificación, recuperación o extinción de activos relacionados con actividades ilícitas.", "El artículo 142A de la Ley 1708 de 2014, adicionado por el artículo 44 de la Ley 1849 de 2017, establece expresamente que la justicia premial en extinción de dominio debe desarrollarse con sujeción a la política criminal del Estado. Esta previsión impide concebir la negociación patrimonial como una facultad ilimitada de disposición de los bienes investigados y exige que los beneficios respondan a una colaboración verificable y jurídicamente relevante. Asimismo, determina que la Fiscalía debe valorar la propuesta del afectado y someter el acuerdo al control judicial correspondiente, de manera que la concesión de beneficios no dependa exclusivamente de la voluntad de las partes."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "justicia premial", "segs": [0], "obj": "escalones"}, {"label": "artículo 142A de la Ley 1708 de 2014", "segs": [1], "obj": "libros"}]}], "rotulo": null, "seccion": "Lección 4.1. Mecanismos de terminación anticipada y colaboración con la justicia: fundamentos, modalidades y límites de los instrumentos de justicia premial en extinción de dominio", "grupo": "Fundamento de la justicia premial en extinción de dominio", "titulos_fuente": ["Lección 4.1. Mecanismos de terminación anticipada y colaboración con la justicia: fundamentos, modalidades y límites de los instrumentos de justicia premial en extinción de dominio", "Fundamento de la justicia premial en extinción de dominio"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["justicia premial", "artículo 142A de la Ley 1708 de 2014"], "titulo_genially": "Fundamento de la justicia premial en extinción de dominio", "complemento_genially": "", "apartado": "4.1. Mecanismos de terminación anticipada y colaboración con la justicia", "ilustracion": "analisis-financiero.webp", "paginas_pdf": [58, 59]}, {"layout": "rejilla", "segmentos": ["1. Sentencia anticipada de extinción de dominio. El artículo 133 regula el procedimiento abreviado mediante el cual el afectado reconoce expresamente la concurrencia de los presupuestos de una o varias causales de extinción de dominio y renuncia a presentar oposición. Esta manifestación permite remitir la actuación al juez para que adopte la correspondiente sentencia anticipada, sin necesidad de agotar el trámite ordinario de contradicción respecto de los bienes comprendidos en el reconocimiento. La disposición también contempla beneficios patrimoniales específicos, cuya procedencia debe examinarse conforme a las condiciones y límites establecidos legalmente.", "2. El artículo 134 contempla la aplicación del procedimiento anticipado cuando la investigación desarrollada durante la fase inicial concluye que no existe titular del bien perseguido o que resulta imposible identificarlo o localizarlo, siempre que no comparezca una persona que demuestre interés legítimo sobre el activo. Esta modalidad no depende de una manifestación de colaboración del afectado, sino de circunstancias particulares relacionadas con la ausencia o imposibilidad de identificación del titular. Por consiguiente, constituye un mecanismo procesal diferenciado que permite resolver determinadas situaciones patrimoniales, sin desconocer las garantías de quienes puedan acreditar derechos legítimos sobre los bienes.", "3. Negociación patrimonial por colaboración efectiva. El artículo 142A contempla la posibilidad de que el afectado proponga un plan de colaboración con la justicia durante la oportunidad procesal legalmente establecida. Esta modalidad exige valorar la eficacia de la información o de las actuaciones ofrecidas, determinar la viabilidad del acuerdo y someterlo al control judicial de legalidad. Su particularidad consiste en que la colaboración constituye el fundamento de una negociación patrimonial que puede generar beneficios económicos o permitir la conservación de determinados derechos de propiedad, dentro de los límites establecidos por la disposición.", "4. Sentencia anticipada por confesión. El artículo 189A de la Ley 1708 de 2014, adicionado por el artículo 50 de la Ley 1849 de 2017, contempla un mecanismo especial relacionado con la confesión de parte en materia de extinción de dominio. Esta figura permite que, bajo las condiciones legalmente previstas, se promueva una decisión anticipada y se reconozcan beneficios sujetos a las reglas del artículo 142A. Su aplicación exige verificar los presupuestos particulares de la confesión y la procedencia del acuerdo, sin confundirla con el reconocimiento y la renuncia a la oposición regulados en el artículo 133.", "5. Retribución por información eficaz. El artículo 120 establece un régimen de retribución a particulares que proporcionen información eficaz sobre bienes comprendidos en determinadas causales de extinción de dominio. Este mecanismo se diferencia de los anteriores porque no exige necesariamente que quien suministra la información sea titular del bien o tenga la condición de afectado dentro del procedimiento. Su finalidad consiste en incentivar la identificación de activos y fortalecer las investigaciones patrimoniales, mediante beneficios sometidos a límites económicos, criterios de eficacia y decisión judicial."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "Sentencia anticipada de extinción de dominio", "segs": [0], "obj": "libros", "ilus": "inspector-documento.webp"}, {"label": "artículo 134", "segs": [1], "obj": "lupa", "ilus": "equipo-torre.webp"}, {"label": "Negociación patrimonial por colaboración efectiva", "segs": [2], "obj": "tribunal", "ilus": "documento-inmueble.webp"}, {"label": "Sentencia anticipada por confesión", "segs": [3], "obj": "personas", "ilus": "casa-lupa.webp"}, {"label": "Retribución por información eficaz", "segs": [4], "obj": "carpetas", "ilus": "verificacion-registral.webp"}]}], "rotulo": null, "seccion": "Lección 4.1. Mecanismos de terminación anticipada y colaboración con la justicia: fundamentos, modalidades y límites de los instrumentos de justicia premial en extinción de dominio", "grupo": "Modalidades legalmente previstas", "titulos_fuente": ["Lección 4.1. Mecanismos de terminación anticipada y colaboración con la justicia: fundamentos, modalidades y límites de los instrumentos de justicia premial en extinción de dominio", "Modalidades legalmente previstas"], "encabezados": [], "mediacion": "Rejilla en collage: ventanas con ilustración que llenan el marco; cada una abre su texto completo.", "rotulos": ["Sentencia anticipada de extinción de dominio", "artículo 134", "Negociación patrimonial por colaboración efectiva", "Sentencia anticipada por confesión", "Retribución por información eficaz"], "titulo_genially": "Modalidades legalmente previstas", "complemento_genially": "", "apartado": "4.1. Mecanismos de terminación anticipada y colaboración con la justicia", "ilustracion": "archivo.webp", "paginas_pdf": [59, 60]}, {"layout": "puntos", "segmentos": ["La aplicación de estos instrumentos se encuentra sometida al principio de legalidad, de manera que los beneficios, requisitos y procedimientos deben corresponder a los expresamente previstos por el legislador. En consecuencia, la Fiscalía no puede establecer porcentajes de retribución diferentes de los autorizados, reconocer beneficios sin verificar sus presupuestos ni extender los efectos de una negociación a bienes o derechos que no se encuentren comprendidos en el acuerdo. Esta limitación resulta imprescindible cuando se examinan patrimonios integrados por activos de diferente naturaleza, bienes sometidos a destinaciones legales específicas o derechos de terceros que no han participado en la negociación.", "Otro límite fundamental consiste en la protección de los derechos de terceros de buena fe exenta de culpa y en la necesidad de garantizar que las decisiones anticipadas se encuentren respaldadas por los presupuestos sustanciales correspondientes. La colaboración del afectado no permite desconocer derechos legítimamente adquiridos por otras personas ni sustituye el control judicial previsto en el Código de Extinción de Dominio. Por esta razón, la Fiscalía debe individualizar los bienes comprendidos en la negociación, establecer la situación jurídica de sus titulares y documentar las circunstancias que permitan verificar que el beneficio propuesto se ajusta al régimen legal."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "principio de legalidad", "segs": [0], "obj": "escalones"}, {"label": "derechos de terceros de buena fe exenta de culpa", "segs": [1], "obj": "escudo"}]}], "rotulo": null, "seccion": "Lección 4.1. Mecanismos de terminación anticipada y colaboración con la justicia: fundamentos, modalidades y límites de los instrumentos de justicia premial en extinción de dominio", "grupo": "Límites jurídicos de los mecanismos de justicia premial", "titulos_fuente": ["Lección 4.1. Mecanismos de terminación anticipada y colaboración con la justicia: fundamentos, modalidades y límites de los instrumentos de justicia premial en extinción de dominio", "Límites jurídicos de los mecanismos de justicia premial"], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["principio de legalidad", "derechos de terceros de buena fe exenta de culpa"], "titulo_genially": "Límites jurídicos de los mecanismos de justicia premial", "complemento_genially": "", "apartado": "4.1. Mecanismos de terminación anticipada y colaboración con la justicia", "ilustracion": "gestion-activos.webp", "paginas_pdf": [60, 61]}, {"layout": "linea", "segmentos": ["Durante una investigación de extinción de dominio, el afectado manifiesta su disposición a reconocer que determinados inmuebles se encuentran comprendidos en una causal legal y, adicionalmente, ofrece información sobre otros bienes utilizados por una organización criminal. La Fiscalía deberá determinar si resulta procedente acudir al mecanismo de sentencia anticipada del artículo 133 o si, atendiendo a la etapa procesal y al contenido de la colaboración, corresponde examinar una negociación patrimonial bajo el artículo 142A. En ambos casos, la eventual concesión de beneficios exige verificar las condiciones legales, valorar la eficacia de la colaboración y respetar las competencias del juez especializado.", "La terminación anticipada y la colaboración con la justicia constituyen, por tanto, instrumentos jurídicos diferenciados que permiten fortalecer la eficacia de la acción de extinción de dominio sin desconocer su naturaleza constitucional. Su adecuada aplicación exige que los fiscales y servidores de policía judicial identifiquen oportunamente las posibilidades de colaboración, documenten los elementos de conocimiento proporcionados y distingan los beneficios previstos para cada modalidad. Sobre esta base resulta necesario examinar, en primer lugar, el procedimiento de sentencia anticipada de extinción de dominio y las condiciones que permiten obtener una decisión judicial mediante el reconocimiento expreso de las causales legales."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "linea", "items": [{"label": "disposición a reconocer", "segs": [0], "obj": "casa"}, {"label": "instrumentos jurídicos diferenciados", "segs": [1], "obj": "personas"}]}], "rotulo": null, "seccion": "Lección 4.1. Mecanismos de terminación anticipada y colaboración con la justicia: fundamentos, modalidades y límites de los instrumentos de justicia premial en extinción de dominio", "grupo": "Ejemplo práctico", "titulos_fuente": ["Lección 4.1. Mecanismos de terminación anticipada y colaboración con la justicia: fundamentos, modalidades y límites de los instrumentos de justicia premial en extinción de dominio", "Ejemplo práctico"], "encabezados": [], "mediacion": "Línea de tiempo: se avanza momento a momento.", "rotulos": ["disposición a reconocer", "instrumentos jurídicos diferenciados"], "titulo_genially": "Ejemplo práctico", "complemento_genially": "", "apartado": "4.1. Mecanismos de terminación anticipada y colaboración con la justicia", "ilustracion": "documento-inmueble.webp", "paginas_pdf": [61, 61]}, {"layout": "esquema", "segmentos": ["La sentencia anticipada de extinción de dominio constituye un mecanismo procesal abreviado mediante el cual el afectado reconoce expresamente que uno o varios bienes se encuentran comprendidos en alguna de las causales legales de extinción y renuncia a formular oposición frente a la pretensión correspondiente.", "Esta figura permite que la actuación sea sometida al conocimiento del juez especializado de extinción de dominio sin agotar íntegramente las etapas del procedimiento ordinario, siempre que concurran los presupuestos previstos en el artículo 133 de la Ley 1708 de 2014, modificado por el artículo 39 de la Ley 1849 de 2017.", "Su finalidad consiste en facilitar una decisión judicial oportuna cuando el afectado acepta los fundamentos de la pretensión extintiva, sin que ello implique trasladar a la Fiscalía la facultad de declarar definitivamente la pérdida del derecho de propiedad."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "mecanismo procesal abreviado", "segs": [0], "obj": "libros"}, {"label": "juez especializado de extinción de dominio", "segs": [1], "obj": "tribunal"}, {"label": "decisión judicial oportuna", "segs": [2], "obj": "documento"}]}], "rotulo": "Sentencia anticipada de extinción de dominio", "seccion": "Lección 4.2. Sentencia anticipada de extinción de dominio: reconocimiento de causales, renuncia a la oposición, requisitos, trámite y beneficios legalmente previstos", "grupo": null, "titulos_fuente": ["Lección 4.2. Sentencia anticipada de extinción de dominio: reconocimiento de causales, renuncia a la oposición, requisitos, trámite y beneficios legalmente previstos"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["mecanismo procesal abreviado", "juez especializado de extinción de dominio", "decisión judicial oportuna"], "titulo_genially": "4.2. Sentencia anticipada de extinción de dominio", "complemento_genially": "reconocimiento de causales, renuncia a la oposición, requisitos, trámite y beneficios legalmente previstos", "apartado": "4.2. Sentencia anticipada de extinción de dominio", "ilustracion": "inspector-documento.webp", "paginas_pdf": [61, 62]}, {"layout": "fichas", "segmentos": ["El presupuesto central de este mecanismo consiste en el reconocimiento expreso de la concurrencia de una o varias causales de extinción de dominio respecto de bienes determinados. Esta manifestación debe referirse a los presupuestos sustanciales que justifican la pretensión y no limitarse a una declaración genérica de voluntad de colaborar con la Fiscalía. Por ello, resulta necesario identificar los activos comprendidos en el reconocimiento, precisar las causales correspondientes y documentar las circunstancias que permitan establecer que el afectado conoce el alcance jurídico de su decisión. La aceptación debe ser clara, voluntaria y compatible con las garantías del debido proceso.", "La renuncia a presentar oposición constituye el segundo elemento esencial del procedimiento abreviado, puesto que permite prescindir del debate contradictorio ordinario respecto de los bienes comprendidos en la manifestación del afectado. Esta renuncia no debe interpretarse como una autorización para desconocer derechos de terceros que no han participado en el reconocimiento, ni como una facultad de la Fiscalía para disponer de activos cuya titularidad o situación jurídica no se encuentre suficientemente determinada. En consecuencia, corresponde verificar que la manifestación recaiga sobre bienes individualizados y que el procedimiento respete las garantías reconocidas por el Código de Extinción de Dominio."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "reconocimiento expreso", "segs": [0], "obj": "documento"}, {"label": "renuncia a presentar oposición", "segs": [1], "obj": "escalones"}]}], "rotulo": null, "seccion": "Lección 4.2. Sentencia anticipada de extinción de dominio: reconocimiento de causales, renuncia a la oposición, requisitos, trámite y beneficios legalmente previstos", "grupo": "Reconocimiento de las causales y renuncia a la oposición", "titulos_fuente": ["Lección 4.2. Sentencia anticipada de extinción de dominio: reconocimiento de causales, renuncia a la oposición, requisitos, trámite y beneficios legalmente previstos", "Reconocimiento de las causales y renuncia a la oposición"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["reconocimiento expreso", "renuncia a presentar oposición"], "titulo_genially": "Reconocimiento de las causales y renuncia a la oposición", "complemento_genially": "", "apartado": "4.2. Sentencia anticipada de extinción de dominio", "ilustracion": "investigacion-activos.webp", "paginas_pdf": [62, 62]}, {"layout": "mental", "segmentos": ["El artículo 133 permite acudir a la sentencia anticipada en cualquier etapa del proceso hasta la finalización del traslado previsto en el artículo 141 de la Ley 1708 de 2014. Esta oportunidad resulta especialmente relevante porque delimita temporalmente el ejercicio del mecanismo y permite diferenciarlo de la negociación patrimonial por colaboración efectiva, regulada en el artículo 142A, cuya procedencia comienza después de finalizado dicho traslado. En consecuencia, el fiscal debe identificar el estado de la actuación y determinar si la manifestación del afectado se presenta dentro de la oportunidad legalmente autorizada para acudir al procedimiento abreviado.", "La procedencia de la sentencia anticipada exige que concurran el reconocimiento expreso de la causal, la renuncia a presentar oposición y la existencia de elementos suficientes para sustentar la pretensión extintiva ante el juez. La norma establece que, cumplidas estas condiciones, lo actuado se considera suficiente para sustentar la pretensión y las carpetas deben remitirse a la autoridad judicial para que profiera la decisión correspondiente. No obstante, esta previsión no elimina la obligación de individualizar los bienes, identificar la causal aplicable y garantizar que el requerimiento presentado por la Fiscalía permita verificar los presupuestos del procedimiento abreviado."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mental", "items": [{"label": "artículo 133", "segs": [0], "obj": "libros"}, {"label": "procedencia de la sentencia anticipada", "segs": [1], "obj": "tribunal"}]}], "rotulo": null, "seccion": "Lección 4.2. Sentencia anticipada de extinción de dominio: reconocimiento de causales, renuncia a la oposición, requisitos, trámite y beneficios legalmente previstos", "grupo": "Oportunidad procesal y requisitos de procedencia", "titulos_fuente": ["Lección 4.2. Sentencia anticipada de extinción de dominio: reconocimiento de causales, renuncia a la oposición, requisitos, trámite y beneficios legalmente previstos", "Oportunidad procesal y requisitos de procedencia"], "encabezados": [], "mediacion": "Mapa mental: la idea central y sus ramas; cada rama abre su texto completo.", "rotulos": ["artículo 133", "procedencia de la sentencia anticipada"], "titulo_genially": "Oportunidad procesal y requisitos de procedencia", "complemento_genially": "", "apartado": "4.2. Sentencia anticipada de extinción de dominio", "ilustracion": "casa-lupa.webp", "paginas_pdf": [63, 63]}, {"layout": "ruta", "segmentos": ["El artículo 135 de la Ley 1708 de 2014 establece que, en los supuestos de los artículos 133 y 134, el fiscal debe presentar ante el juez un requerimiento de sentencia anticipada en el cual sustente los elementos que fundamentan la pretensión y el cumplimiento de los presupuestos del procedimiento abreviado. Esta exigencia permite diferenciar la manifestación del afectado de la actuación procesal necesaria para obtener la decisión judicial, puesto que la aceptación de las causales no produce por sí misma la extinción del derecho de propiedad. La consecuencia patrimonial definitiva requiere la intervención del juez especializado, quien debe resolver conforme al régimen legal aplicable.", "El procedimiento puede organizarse mediante la identificación de los bienes, la verificación de la oportunidad procesal, la recepción y documentación del reconocimiento expreso, la constatación de la renuncia a presentar oposición y la preparación del requerimiento judicial. Para ello, la Fiscalía debe conservar los elementos de conocimiento que sustentan la pretensión y verificar la existencia de derechos de terceros que puedan resultar comprometidos. Esta secuencia contribuye a garantizar que la decisión anticipada se produzca sobre una base jurídica y probatoria determinada, evitando que el trámite abreviado se utilice para suplir deficiencias de identificación patrimonial."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "artículo 135 de la Ley 1708 de 2014", "segs": [0], "obj": "libros"}, {"label": "identificación de los bienes", "segs": [1], "obj": "escalones"}]}], "rotulo": null, "seccion": "Lección 4.2. Sentencia anticipada de extinción de dominio: reconocimiento de causales, renuncia a la oposición, requisitos, trámite y beneficios legalmente previstos", "grupo": "Trámite de la sentencia anticipada", "titulos_fuente": ["Lección 4.2. Sentencia anticipada de extinción de dominio: reconocimiento de causales, renuncia a la oposición, requisitos, trámite y beneficios legalmente previstos", "Trámite de la sentencia anticipada"], "encabezados": [], "mediacion": "Ruta paso a paso con ficha que avanza.", "rotulos": ["artículo 135 de la Ley 1708 de 2014", "identificación de los bienes"], "titulo_genially": "Trámite de la sentencia anticipada", "complemento_genially": "", "apartado": "4.2. Sentencia anticipada de extinción de dominio", "ilustracion": "examen-bienes.webp", "paginas_pdf": [63, 64]}, {"layout": "mental", "segmentos": ["El artículo 133 contempla dos alternativas de beneficio para el afectado que se acoge al procedimiento abreviado. La primera consiste en la posibilidad de conservar el derecho de propiedad sobre uno o varios bienes cuyo origen sea consecuencia de una actividad ilícita, siempre que el fiscal lo considere procedente de acuerdo con la eficacia de la colaboración y se respeten los límites económicos establecidos por la disposición. La norma fija como referencia un valor comercial que no supere el 3 % del total de los bienes objeto de colaboración, junto con la remisión a los límites en salarios mínimos previstos en el artículo 120. Esta alternativa no constituye un derecho automático del afectado, pues su reconocimiento depende de la evaluación de los presupuestos legales.", "La segunda alternativa consiste en una retribución de hasta el 5 % del valor de los bienes objeto de colaboración, sin exceder 2.500 salarios mínimos legales mensuales vigentes. Adicionalmente, el artículo 133 contempla la posibilidad de otra retribución de hasta el 5 %, sujeta al mismo límite de 2.500 salarios mínimos, respecto de bienes en causal de extinción de dominio sobre los cuales el afectado proporcione información y contribuya eficazmente a determinados fines de la administración de justicia. Entre estos se encuentran la protección de las víctimas, la desarticulación de organizaciones criminales, la investigación de hechos de corrupción y la identificación de infraestructura económica vinculada con actividades ilícitas. Estos porcentajes deben aplicarse conforme a los supuestos diferenciados que establece la disposición y no pueden interpretarse como una autorización general para reconocer automáticamente el máximo de los beneficios."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mental", "items": [{"label": "dos alternativas de beneficio", "segs": [0], "obj": "escalones"}, {"label": "retribución de hasta el 5 %", "segs": [1], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 4.2. Sentencia anticipada de extinción de dominio: reconocimiento de causales, renuncia a la oposición, requisitos, trámite y beneficios legalmente previstos", "grupo": "Beneficios patrimoniales legalmente previstos", "titulos_fuente": ["Lección 4.2. Sentencia anticipada de extinción de dominio: reconocimiento de causales, renuncia a la oposición, requisitos, trámite y beneficios legalmente previstos", "Beneficios patrimoniales legalmente previstos"], "encabezados": [], "mediacion": "Mapa mental: la idea central y sus ramas; cada rama abre su texto completo.", "rotulos": ["dos alternativas de beneficio", "retribución de hasta el 5 %"], "titulo_genially": "Beneficios patrimoniales legalmente previstos", "complemento_genially": "", "apartado": "4.2. Sentencia anticipada de extinción de dominio", "ilustracion": "equipo-torre.webp", "paginas_pdf": [64, 64]}, {"layout": "acordeon", "segmentos": ["El artículo 134 establece una modalidad especial aplicable cuando la investigación adelantada durante la fase inicial concluye que no existe titular del bien perseguido o que resulta imposible identificarlo o localizarlo, siempre que no comparezca una persona que demuestre interés legítimo sobre el activo.", "En este supuesto, el procedimiento anticipado no se fundamenta en el reconocimiento expreso de un afectado, sino en las circunstancias particulares de identificación de la titularidad.", "Por ello, la Fiscalía debe documentar las actuaciones desarrolladas para establecer la situación jurídica del bien y verificar el cumplimiento de las condiciones que permiten promover el requerimiento judicial correspondiente."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "acordeon", "items": [{"label": "modalidad especial", "segs": [0], "obj": "libros"}, {"label": "identificación de la titularidad", "segs": [1], "obj": "escalones"}, {"label": "situación jurídica del bien", "segs": [2], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 4.2. Sentencia anticipada de extinción de dominio: reconocimiento de causales, renuncia a la oposición, requisitos, trámite y beneficios legalmente previstos", "grupo": null, "titulos_fuente": ["Lección 4.2. Sentencia anticipada de extinción de dominio: reconocimiento de causales, renuncia a la oposición, requisitos, trámite y beneficios legalmente previstos"], "encabezados": [], "mediacion": "Acordeón: cada apartado se despliega con su texto completo.", "rotulos": ["modalidad especial", "identificación de la titularidad", "situación jurídica del bien"], "titulo_genially": "Sentencia anticipada especial", "complemento_genially": "", "apartado": "4.2. Sentencia anticipada de extinción de dominio", "ilustracion": "verificacion-registral.webp", "paginas_pdf": [64, 65]}, {"layout": "puntos", "segmentos": ["Durante una investigación de extinción de dominio, la Fiscalía identifica tres inmuebles adquiridos con recursos cuya procedencia ilícita se encuentra sustentada en los elementos de conocimiento recopilados. Antes de finalizar el traslado previsto en el artículo 141, el afectado manifiesta expresamente que reconoce la concurrencia de la causal de extinción respecto de dos de los inmuebles y renuncia a presentar oposición sobre ellos. La Fiscalía deberá verificar la oportunidad procesal, individualizar los bienes comprendidos en el reconocimiento y preparar el requerimiento de sentencia anticipada ante el juez especializado. Si el afectado solicita un beneficio patrimonial, corresponderá examinar su procedencia conforme al artículo 133, sin extender automáticamente la aceptación a los bienes que no fueron incluidos en la manifestación.", "La sentencia anticipada constituye, un instrumento de terminación abreviada que permite obtener una decisión jurisdiccional cuando el afectado reconoce los presupuestos de la extinción y renuncia a controvertir la pretensión dentro de la oportunidad legal. Su aplicación exige distinguir entre la aceptación de las causales, la eventual colaboración que fundamenta los beneficios patrimoniales y el requerimiento judicial necesario para obtener la sentencia. Para la Fiscalía General de la Nación, esta diferenciación permite estructurar actuaciones ajustadas al principio de legalidad, documentar adecuadamente la manifestación del afectado y evitar que los beneficios se reconozcan por fuera de los límites expresamente establecidos por el legislador."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "tres inmuebles", "segs": [0], "obj": "casa"}, {"label": "instrumento de terminación abreviada", "segs": [1], "obj": "libros"}]}], "rotulo": null, "seccion": "Lección 4.2. Sentencia anticipada de extinción de dominio: reconocimiento de causales, renuncia a la oposición, requisitos, trámite y beneficios legalmente previstos", "grupo": "Ejemplo práctico", "titulos_fuente": ["Lección 4.2. Sentencia anticipada de extinción de dominio: reconocimiento de causales, renuncia a la oposición, requisitos, trámite y beneficios legalmente previstos", "Ejemplo práctico"], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["tres inmuebles", "instrumento de terminación abreviada"], "titulo_genially": "Ejemplo práctico", "complemento_genially": "", "apartado": "4.2. Sentencia anticipada de extinción de dominio", "ilustracion": "inspeccion-propiedad.webp", "paginas_pdf": [65, 65]}, {"layout": "esquema", "segmentos": ["La negociación patrimonial por colaboración efectiva constituye un mecanismo de justicia premial mediante el cual el afectado puede proponer a la Fiscalía General de la Nación un plan de colaboración que contribuya a identificar bienes relacionados con actividades ilícitas o a establecer estructuras patrimoniales vinculadas con organizaciones criminales.", "Su fundamento se encuentra en el artículo 142A de la Ley 1708 de 2014, adicionado por el artículo 44 de la Ley 1849 de 2017, y responde a la necesidad de fortalecer la eficacia de las investigaciones patrimoniales mediante incentivos sometidos a condiciones legales específicas.", "A diferencia de la sentencia anticipada regulada en el artículo 133, esta modalidad se desarrolla durante una oportunidad procesal posterior y exige valorar la eficacia de la colaboración ofrecida por el afectado."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "mecanismo de justicia premial", "segs": [0], "obj": "documento"}, {"label": "artículo 142A de la Ley 1708 de 2014", "segs": [1], "obj": "libros"}, {"label": "oportunidad procesal posterior", "segs": [2], "obj": "carpetas"}]}], "rotulo": "Negociación patrimonial por colaboración efectiva", "seccion": "Lección 4.3. Negociación patrimonial por colaboración efectiva: requisitos, oportunidad procesal, valoración de la colaboración, porcentajes de retribución y control judicial del acuerdo", "grupo": null, "titulos_fuente": ["Lección 4.3. Negociación patrimonial por colaboración efectiva: requisitos, oportunidad procesal, valoración de la colaboración, porcentajes de retribución y control judicial del acuerdo"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["mecanismo de justicia premial", "artículo 142A de la Ley 1708 de 2014", "oportunidad procesal posterior"], "titulo_genially": "4.3. Negociación patrimonial por colaboración efectiva", "complemento_genially": "requisitos, oportunidad procesal, valoración de la colaboración, porcentajes de retribución y control judicial del acuerdo", "apartado": "4.3. Negociación patrimonial por colaboración efectiva", "ilustracion": "analisis-financiero.webp", "paginas_pdf": [65, 66]}, {"layout": "mental", "segmentos": ["El artículo 142B de la Ley 1708 de 2014, adicionado por el artículo 45 de la Ley 1849 de 2017, establece los supuestos en los cuales puede aplicarse la negociación patrimonial por colaboración efectiva. Estas hipótesis se relacionan con la identificación de bienes propios diferentes de aquellos comprendidos en el proceso, la información sobre bienes ajenos de valor representativo, la identificación de estructuras criminales con activos susceptibles de extinción de dominio y el suministro de información sobre redes de testaferrato o colaboradores de organizaciones criminales. La disposición delimita el contenido jurídicamente relevante de la colaboración y permite establecer que no cualquier manifestación de cooperación resulta suficiente para acceder a los beneficios previstos.", "La primera hipótesis comprende la información proporcionada por el afectado sobre otros bienes de su propiedad, distintos de aquellos incluidos en la actuación, que se encuentren comprendidos en alguna causal de extinción de dominio. La segunda se refiere a bienes ajenos cuya identificación resulte relevante, siempre que su monto sea representativo a juicio del fiscal. Las restantes hipótesis comprenden información sobre estructuras criminales y redes de testaferrato o colaboradores cuyos activos puedan encontrarse comprendidos en causales de extinción. En todos estos casos, la colaboración debe permitir desarrollar actuaciones verificables y aportar información útil para el cumplimiento de las finalidades de la acción patrimonial."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mental", "items": [{"label": "artículo 142B de la Ley 1708 de 2014", "segs": [0], "obj": "libros"}, {"label": "otros bienes de su propiedad", "segs": [1], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 4.3. Negociación patrimonial por colaboración efectiva: requisitos, oportunidad procesal, valoración de la colaboración, porcentajes de retribución y control judicial del acuerdo", "grupo": "Requisitos y supuestos de procedencia", "titulos_fuente": ["Lección 4.3. Negociación patrimonial por colaboración efectiva: requisitos, oportunidad procesal, valoración de la colaboración, porcentajes de retribución y control judicial del acuerdo", "Requisitos y supuestos de procedencia"], "encabezados": [], "mediacion": "Mapa mental: la idea central y sus ramas; cada rama abre su texto completo.", "rotulos": ["artículo 142B de la Ley 1708 de 2014", "otros bienes de su propiedad"], "titulo_genially": "Requisitos y supuestos de procedencia", "complemento_genially": "", "apartado": "4.3. Negociación patrimonial por colaboración efectiva", "ilustracion": "archivo.webp", "paginas_pdf": [66, 66]}, {"layout": "acordeon", "segmentos": ["El artículo 142A establece que la negociación debe ser propuesta por el afectado una vez finalizado el traslado previsto en el artículo 141 y antes de dictarse sentencia. Esta delimitación temporal constituye una diferencia esencial frente a la sentencia anticipada del artículo 133, cuya oportunidad concluye precisamente al finalizar dicho traslado. En consecuencia, el fiscal debe verificar el estado procesal antes de examinar la propuesta, puesto que la procedencia del mecanismo depende de que se formule dentro del período expresamente autorizado por el legislador.", "El afectado puede solicitar la suspensión del proceso mediante escrito dirigido al fiscal investigador, en el cual debe expresar su plan de colaboración y las condiciones que estaría dispuesto a cumplir. La norma establece que esta suspensión no puede extenderse por más de treinta días y dispone que el fiscal encargado de evaluar la propuesta informe al juez de conocimiento para la suspensión correspondiente. Este período permite examinar la viabilidad del acuerdo y desarrollar las actuaciones necesarias para determinar si la colaboración ofrecida reúne las condiciones legales, sin que la solicitud produzca automáticamente la suspensión del procedimiento."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "acordeon", "items": [{"label": "artículo 142A", "segs": [0], "obj": "libros"}, {"label": "plan de colaboración", "segs": [1], "obj": "reloj"}]}], "rotulo": null, "seccion": "Lección 4.3. Negociación patrimonial por colaboración efectiva: requisitos, oportunidad procesal, valoración de la colaboración, porcentajes de retribución y control judicial del acuerdo", "grupo": "Oportunidad procesal para proponer la negociación", "titulos_fuente": ["Lección 4.3. Negociación patrimonial por colaboración efectiva: requisitos, oportunidad procesal, valoración de la colaboración, porcentajes de retribución y control judicial del acuerdo", "Oportunidad procesal para proponer la negociación"], "encabezados": [], "mediacion": "Acordeón: cada apartado se despliega con su texto completo.", "rotulos": ["artículo 142A", "plan de colaboración"], "titulo_genially": "Oportunidad procesal para proponer la negociación", "complemento_genially": "", "apartado": "4.3. Negociación patrimonial por colaboración efectiva", "ilustracion": "revision-documentos.webp", "paginas_pdf": [66, 67]}, {"layout": "fichas", "segmentos": ["La valoración de la colaboración exige establecer si la información suministrada por el afectado resulta concreta, verificable y útil para alcanzar las finalidades previstas en el artículo 142B. Para ello, la Fiscalía debe examinar la identificación de los bienes o estructuras denunciadas, la posibilidad de corroborar la información, su relevancia patrimonial y la contribución efectiva al desarrollo de las investigaciones correspondientes. Esta valoración no debe limitarse a considerar el número de activos mencionados, pues también resulta necesario establecer su relación con las causales de extinción de dominio y determinar si la información permite desarrollar actuaciones investigativas o judiciales relevantes.", "Desde la perspectiva de los servidores de policía judicial, la colaboración debe traducirse en actividades de verificación patrimonial que permitan corroborar la existencia, ubicación, titularidad y situación jurídica de los bienes identificados. Cuando la información se refiera a estructuras societarias o redes de testaferrato, será necesario examinar las relaciones entre personas naturales y jurídicas, reconstruir operaciones económicas y establecer las circunstancias que permitan vincular los activos con alguna causal legal. Los resultados de estas actuaciones deben documentarse de manera diferenciada, precisando cuáles datos fueron suministrados por el colaborador y cuáles fueron corroborados mediante fuentes independientes."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "valoración de la colaboración", "segs": [0], "obj": "carpetas"}, {"label": "verificación patrimonial", "segs": [1], "obj": "personas"}]}], "rotulo": null, "seccion": "Lección 4.3. Negociación patrimonial por colaboración efectiva: requisitos, oportunidad procesal, valoración de la colaboración, porcentajes de retribución y control judicial del acuerdo", "grupo": "Valoración de la eficacia de la colaboración", "titulos_fuente": ["Lección 4.3. Negociación patrimonial por colaboración efectiva: requisitos, oportunidad procesal, valoración de la colaboración, porcentajes de retribución y control judicial del acuerdo", "Valoración de la eficacia de la colaboración"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["valoración de la colaboración", "verificación patrimonial"], "titulo_genially": "Valoración de la eficacia de la colaboración", "complemento_genially": "", "apartado": "4.3. Negociación patrimonial por colaboración efectiva", "ilustracion": "investigacion-activos.webp", "paginas_pdf": [67, 68]}, {"layout": "mental", "segmentos": ["El artículo 142A contempla dos modalidades alternativas de beneficio patrimonial. La primera consiste en una retribución económica de hasta el 3 % del valor comercial del bien objeto del proceso, sin exceder 2.500 salarios mínimos legales mensuales vigentes. La segunda permite la conservación del derecho de propiedad sobre bienes susceptibles de extinción de dominio, de acuerdo con la eficacia de la colaboración, siempre que su valor corresponda hasta el 3 % del valor de los bienes objeto de colaboración, sin superar el límite de 2.500 salarios mínimos legales mensuales vigentes. Estas modalidades deben distinguirse de los beneficios previstos en el artículo 133, que establece porcentajes y supuestos específicos para la sentencia anticipada.", "La determinación del beneficio exige que el fiscal valore la eficacia de la colaboración y sustente la estimación patrimonial correspondiente. Los porcentajes establecidos por el legislador constituyen límites máximos y no beneficios que deban reconocerse de manera automática. La Fiscalía debe justificar la relación entre la utilidad de la información, los resultados obtenidos y la retribución propuesta, verificando que el acuerdo se mantenga dentro de las condiciones económicas legalmente autorizadas. Esta exigencia adquiere especial relevancia cuando se propone la conservación de derechos de propiedad sobre bienes comprendidos en causales de extinción, puesto que la excepción patrimonial debe encontrarse expresamente respaldada por el mecanismo legal aplicable."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mental", "items": [{"label": "dos modalidades alternativas", "segs": [0], "obj": "documento"}, {"label": "determinación del beneficio", "segs": [1], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 4.3. Negociación patrimonial por colaboración efectiva: requisitos, oportunidad procesal, valoración de la colaboración, porcentajes de retribución y control judicial del acuerdo", "grupo": "Porcentajes de retribución y conservación de bienes", "titulos_fuente": ["Lección 4.3. Negociación patrimonial por colaboración efectiva: requisitos, oportunidad procesal, valoración de la colaboración, porcentajes de retribución y control judicial del acuerdo", "Porcentajes de retribución y conservación de bienes"], "encabezados": [], "mediacion": "Mapa mental: la idea central y sus ramas; cada rama abre su texto completo.", "rotulos": ["dos modalidades alternativas", "determinación del beneficio"], "titulo_genially": "Porcentajes de retribución y conservación de bienes", "complemento_genially": "", "apartado": "4.3. Negociación patrimonial por colaboración efectiva", "ilustracion": "documento-inmueble.webp", "paginas_pdf": [68, 68]}, {"layout": "esquema", "segmentos": ["Una vez determinada la viabilidad de la negociación, el fiscal debe solicitar la extinción del bien objeto del proceso y presentar la estimación del beneficio correspondiente. El artículo 142A atribuye al juez de conocimiento la competencia para ejercer el control de legalidad del acuerdo, verificar su conformidad con las disposiciones aplicables y determinar si procede emitir la sentencia de extinción de dominio. Si el acuerdo se encuentra ajustado a derecho, el juez podrá dictar la decisión correspondiente; en caso contrario, deberá ordenar la continuación de la actuación procesal.", "El control judicial también comprende la verificación del cumplimiento de las obligaciones asumidas por el afectado, puesto que la disposición exige que el juez constate dicho cumplimiento antes de dictar sentencia. Esta previsión permite diferenciar la simple formulación de una propuesta de colaboración de su ejecución efectiva y evita que el beneficio patrimonial se reconozca exclusivamente sobre la base de compromisos futuros no verificados. Por ello, la Fiscalía debe aportar información suficiente sobre las actividades desarrolladas, los resultados obtenidos y las condiciones del acuerdo, de manera que el juez pueda examinar tanto su legalidad como su cumplimiento.", "El artículo 142A contempla, adicionalmente, la posibilidad de que el afectado solicite su inclusión en el programa de protección de testigos, siempre que el fiscal considere procedente dicha medida. También establece la remisión de un informe sobre los términos de la colaboración a las dependencias institucionales previstas en la disposición, con el propósito de que pueda servir como criterio para la aplicación del principio de oportunidad u otros beneficios dentro del proceso penal. Esta previsión no significa que la negociación patrimonial produzca automáticamente efectos sobre la responsabilidad penal individual, puesto que cualquier beneficio en esa materia debe examinarse conforme a sus presupuestos y procedimientos específicos."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "estimación del beneficio", "segs": [0], "obj": "libros"}, {"label": "cumplimiento de las obligaciones", "segs": [1], "obj": "tribunal"}, {"label": "programa de protección de testigos", "segs": [2], "obj": "reloj"}]}], "rotulo": null, "seccion": "Lección 4.3. Negociación patrimonial por colaboración efectiva: requisitos, oportunidad procesal, valoración de la colaboración, porcentajes de retribución y control judicial del acuerdo", "grupo": "Control judicial de legalidad del acuerdo", "titulos_fuente": ["Lección 4.3. Negociación patrimonial por colaboración efectiva: requisitos, oportunidad procesal, valoración de la colaboración, porcentajes de retribución y control judicial del acuerdo", "Control judicial de legalidad del acuerdo"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["estimación del beneficio", "cumplimiento de las obligaciones", "programa de protección de testigos"], "titulo_genially": "Control judicial de legalidad del acuerdo", "complemento_genially": "", "apartado": "4.3. Negociación patrimonial por colaboración efectiva", "ilustracion": "casa-lupa.webp", "paginas_pdf": [68, 69]}, {"layout": "puntos", "segmentos": ["Durante la etapa de juzgamiento de una acción de extinción de dominio, una persona afectada propone suministrar información sobre bienes que no han sido identificados por la Fiscalía y que presuntamente pertenecen a una estructura criminal. La propuesta se presenta después de finalizado el traslado del artículo 141 y antes de dictarse sentencia, mediante un escrito que contiene un plan de colaboración. El fiscal deberá examinar si la información corresponde a alguno de los supuestos del artículo 142B y disponer las actuaciones necesarias para corroborarla. Si la colaboración resulta eficaz y se considera viable la negociación, corresponderá sustentar el beneficio patrimonial propuesto y someter el acuerdo al control judicial, sin que la sola presentación de la información genere un derecho automático a obtener el porcentaje máximo de retribución.", "La negociación patrimonial por colaboración efectiva constituye, por tanto, un instrumento de justicia premial sometido a exigencias sustanciales, temporales, probatorias y judiciales específicas. Su correcta aplicación requiere que la Fiscalía identifique el supuesto legal de colaboración, verifique la oportunidad procesal, documente los resultados obtenidos y fundamente la retribución propuesta dentro de los límites establecidos por el legislador. De esta manera, el mecanismo permite fortalecer la identificación y recuperación de activos relacionados con actividades ilícitas, al tiempo que garantiza que los beneficios patrimoniales sean reconocidos mediante decisiones jurídicamente controladas."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "etapa de juzgamiento", "segs": [0], "obj": "libros"}, {"label": "negociación patrimonial por colaboración efectiva", "segs": [1], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 4.3. Negociación patrimonial por colaboración efectiva: requisitos, oportunidad procesal, valoración de la colaboración, porcentajes de retribución y control judicial del acuerdo", "grupo": "Ejemplo práctico", "titulos_fuente": ["Lección 4.3. Negociación patrimonial por colaboración efectiva: requisitos, oportunidad procesal, valoración de la colaboración, porcentajes de retribución y control judicial del acuerdo", "Ejemplo práctico"], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["etapa de juzgamiento", "negociación patrimonial por colaboración efectiva"], "titulo_genially": "Ejemplo práctico", "complemento_genially": "", "apartado": "4.3. Negociación patrimonial por colaboración efectiva", "ilustracion": "equipo-torre.webp", "paginas_pdf": [69, 70]}, {"layout": "mental", "segmentos": ["La sentencia que declara la extinción de dominio constituye la decisión jurisdiccional mediante la cual se establece la pérdida del derecho de propiedad sobre los bienes comprendidos en alguna de las causales legales y se declara su titularidad a favor del Estado. De conformidad con el artículo 15 de la Ley 1708 de 2014, esta consecuencia patrimonial se produce sin contraprestación ni compensación de naturaleza alguna para el afectado, sin perjuicio de los beneficios expresamente autorizados por los mecanismos de justicia premial y de la protección de los derechos legítimamente adquiridos. En consecuencia, la declaración de extinción debe diferenciarse de las medidas cautelares, puesto que estas últimas tienen naturaleza provisional y buscan preservar la eficacia del procedimiento, mientras que la sentencia determina definitivamente la situación jurídica de los bienes.", "El artículo 145 de la Ley 1708 de 2014 establece que el juez debe resolver sobre la procedencia o improcedencia de la extinción de dominio mediante sentencia, la cual produce efectos erga omnes. Esta característica significa que la decisión judicial tiene efectos generales respecto de la situación jurídica de los bienes comprendidos en ella, de conformidad con las reglas legales aplicables. No obstante, la eficacia general de la sentencia presupone el respeto de las garantías procesales de los afectados y de los terceros con derechos legítimamente adquiridos, así como la adecuada individualización de los activos sobre los cuales recae la declaración judicial."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mental", "items": [{"label": "pérdida del derecho de propiedad", "segs": [0], "obj": "libros"}, {"label": "artículo 145 de la Ley 1708", "segs": [1], "obj": "tribunal"}]}], "rotulo": null, "seccion": "Lección 4.4. Efectos patrimoniales y destinación definitiva de los bienes: declaración de titularidad a favor del Estado, incorporación al FRISCO y destinación conforme al régimen legal aplicable", "grupo": null, "titulos_fuente": ["Lección 4.4. Efectos patrimoniales y destinación definitiva de los bienes: declaración de titularidad a favor del Estado, incorporación al FRISCO y destinación conforme al régimen legal aplicable"], "encabezados": [], "mediacion": "Mapa mental: la idea central y sus ramas; cada rama abre su texto completo.", "rotulos": ["pérdida del derecho de propiedad", "artículo 145 de la Ley 1708"], "titulo_genially": "4.4. Efectos patrimoniales y destinación definitiva de los bienes", "complemento_genially": "declaración de titularidad a favor del Estado, incorporación al FRISCO y destinación conforme al régimen legal aplicable", "apartado": "4.4. Efectos patrimoniales y destinación definitiva de los bienes", "ilustracion": "bienes-afectados.webp", "paginas_pdf": [70, 70]}, {"layout": "puntos", "segmentos": ["La declaración judicial de extinción de dominio determina que los derechos patrimoniales comprendidos en la sentencia pasen a favor del Estado, conforme a los términos y alcances de la decisión. Esta consecuencia exige que los bienes se encuentren debidamente individualizados y que las autoridades competentes adelanten las actuaciones necesarias para reflejar la modificación de su situación jurídica. Cuando se trate de activos sujetos a registro, será necesario efectuar las inscripciones correspondientes; respecto de bienes muebles, productos financieros o participaciones societarias, deberán desarrollarse las actuaciones específicas que permitan ejecutar la decisión conforme a su naturaleza.", "La sentencia debe distinguir los bienes respecto de los cuales se declara la extinción de aquellos sobre los cuales se determina su improcedencia, evitando que la ejecución se extienda a activos o derechos no comprendidos en la decisión. Esta delimitación resulta especialmente importante cuando la actuación involucra patrimonios complejos, situaciones de copropiedad, derechos de garantía o intereses de terceros. En consecuencia, la ejecución patrimonial debe corresponder estrictamente al contenido de la providencia judicial y respetar las determinaciones adoptadas sobre los derechos que deban conservar protección jurídica."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "declaración judicial de extinción de dominio", "segs": [0], "obj": "libros"}, {"label": "improcedencia", "segs": [1], "obj": "escudo"}]}], "rotulo": null, "seccion": "Lección 4.4. Efectos patrimoniales y destinación definitiva de los bienes: declaración de titularidad a favor del Estado, incorporación al FRISCO y destinación conforme al régimen legal aplicable", "grupo": "Declaración de titularidad a favor del Estado", "titulos_fuente": ["Lección 4.4. Efectos patrimoniales y destinación definitiva de los bienes: declaración de titularidad a favor del Estado, incorporación al FRISCO y destinación conforme al régimen legal aplicable", "Declaración de titularidad a favor del Estado"], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["declaración judicial de extinción de dominio", "improcedencia"], "titulo_genially": "Declaración de titularidad a favor del Estado", "complemento_genially": "", "apartado": "4.4. Efectos patrimoniales y destinación definitiva de los bienes", "ilustracion": "gestion-activos.webp", "paginas_pdf": [70, 71]}, {"layout": "fichas", "segmentos": ["El artículo 90 de la Ley 1708 de 2014 establece que el FRISCO constituye una cuenta especial sin personería jurídica, administrada por la Sociedad de Activos Especiales S. A. S. (SAE). Su finalidad se relaciona con la administración de bienes y recursos sometidos al régimen especial de extinción de dominio, de acuerdo con las disposiciones legales aplicables. Esta estructura institucional permite diferenciar la función jurisdiccional de declarar la extinción, la competencia de la Fiscalía para adelantar la acción y las funciones administrativas que corresponden a la entidad encargada del Fondo.", "Es importante precisar que la administración de bienes por parte del FRISCO no comienza necesariamente con la sentencia definitiva, puesto que determinados activos pueden encontrarse bajo su administración desde la ejecución de las medidas cautelares. En consecuencia, la declaración judicial de extinción modifica la situación jurídica de los bienes y permite desarrollar las actuaciones de destinación definitiva que correspondan, pero no debe confundirse con su primera puesta a disposición de la entidad administradora. Esta distinción permite comprender que un mismo activo puede encontrarse sometido a administración cautelar durante el procedimiento y, posteriormente, adquirir la condición de bien extinguido mediante sentencia judicial."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "artículo 90 de la Ley 1708", "segs": [0], "obj": "libros"}, {"label": "no comienza necesariamente con la sentencia", "segs": [1], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 4.4. Efectos patrimoniales y destinación definitiva de los bienes: declaración de titularidad a favor del Estado, incorporación al FRISCO y destinación conforme al régimen legal aplicable", "grupo": "Incorporación y administración de los bienes en el FRISCO", "titulos_fuente": ["Lección 4.4. Efectos patrimoniales y destinación definitiva de los bienes: declaración de titularidad a favor del Estado, incorporación al FRISCO y destinación conforme al régimen legal aplicable", "Incorporación y administración de los bienes en el FRISCO"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["artículo 90 de la Ley 1708", "no comienza necesariamente con la sentencia"], "titulo_genially": "Incorporación y administración de los bienes en el FRISCO", "complemento_genially": "", "apartado": "4.4. Efectos patrimoniales y destinación definitiva de los bienes", "ilustracion": "verificacion-registral.webp", "paginas_pdf": [71, 72]}, {"layout": "giro", "segmentos": ["El artículo 91 de la Ley 1708 de 2014, modificado por el artículo 210 de la Ley 2294 de 2023, establece las reglas generales de administración y destinación de los bienes sobre los cuales se declara la extinción de dominio. La disposición contempla la distribución de recursos entre entidades del Estado, sin perjuicio de las destinaciones específicas previstas legalmente, las obligaciones del Fondo y las reglas particulares aplicables a determinados activos. Asimismo, incorpora criterios relacionados con la función social y ecológica de la propiedad y la utilización de bienes para el cumplimiento de objetivos de política pública.", "Conforme a la distribución general establecida en dicha disposición, una vez consideradas las exclusiones y destinaciones legalmente previstas, los recursos correspondientes se distribuyen así:", "(imagen 7, generada con ChatGPT, 2026)", "La distribución general no implica que todos los bienes extinguidos deban convertirse necesariamente en recursos líquidos ni que su destinación se realice mediante un único procedimiento. El régimen legal contempla reglas específicas para determinados activos, especialmente cuando poseen características que permiten destinarlos directamente al cumplimiento de finalidades públicas. En este sentido, el artículo 91 establece disposiciones particulares relacionadas con predios rurales de vocación agrícola, activos considerados estratégicos para la política pública, bienes destinados a entidades estatales y recursos que deben orientarse hacia programas sociales o de reparación, conforme a las condiciones previstas en la ley."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "artículo 91 de la Ley 1708 de 2014", "segs": [0], "obj": "libros"}, {"label": "exclusiones y destinaciones", "segs": [1, 2], "obj": "camara"}, {"label": "recursos líquidos", "segs": [3], "obj": "escalones"}]}], "rotulo": null, "seccion": "Lección 4.4. Efectos patrimoniales y destinación definitiva de los bienes: declaración de titularidad a favor del Estado, incorporación al FRISCO y destinación conforme al régimen legal aplicable", "grupo": "Destinación definitiva de los bienes extinguidos", "titulos_fuente": ["Lección 4.4. Efectos patrimoniales y destinación definitiva de los bienes: declaración de titularidad a favor del Estado, incorporación al FRISCO y destinación conforme al régimen legal aplicable", "Destinación definitiva de los bienes extinguidos"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["artículo 91 de la Ley 1708 de 2014", "exclusiones y destinaciones", "recursos líquidos"], "titulo_genially": "Destinación definitiva de los bienes extinguidos", "complemento_genially": "", "apartado": "4.4. Efectos patrimoniales y destinación definitiva de los bienes", "ilustracion": "revision-documentos.webp", "paginas_pdf": [72, 73]}, {"layout": "esquema", "segmentos": ["La destinación definitiva de los bienes extinguidos debe comprenderse a partir de los objetivos constitucionales y legales que justifican la intervención patrimonial del Estado. En particular, la función social y ecológica de la propiedad adquiere relevancia cuando los activos pueden contribuir al desarrollo rural, la atención de víctimas, el fortalecimiento institucional o la ejecución de programas públicos. Esta orientación permite que los bienes relacionados con actividades ilícitas sean incorporados a mecanismos de aprovechamiento legítimo, bajo las condiciones establecidas por el ordenamiento jurídico.", "La Ley 1708 de 2014 contempla diferentes mecanismos de administración y destinación que deben aplicarse según la naturaleza y situación jurídica de los activos. Por ello, la SAE debe examinar las condiciones económicas, materiales y legales de los bienes, así como las destinaciones específicas que puedan resultar obligatorias. La finalidad de estas actuaciones consiste en garantizar que la administración patrimonial se desarrolle conforme a las competencias atribuidas legalmente y que los activos extinguidos contribuyan al cumplimiento de los objetivos públicos previstos por el legislador."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "objetivos constitucionales y legales", "segs": [0], "obj": "escudo"}, {"label": "mecanismos de administración y destinación", "segs": [1], "obj": "libros"}]}], "rotulo": null, "seccion": "Lección 4.4. Efectos patrimoniales y destinación definitiva de los bienes: declaración de titularidad a favor del Estado, incorporación al FRISCO y destinación conforme al régimen legal aplicable", "grupo": "Destinación social y aprovechamiento de los activos", "titulos_fuente": ["Lección 4.4. Efectos patrimoniales y destinación definitiva de los bienes: declaración de titularidad a favor del Estado, incorporación al FRISCO y destinación conforme al régimen legal aplicable", "Destinación social y aprovechamiento de los activos"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["objetivos constitucionales y legales", "mecanismos de administración y destinación"], "titulo_genially": "Destinación social y aprovechamiento de los activos", "complemento_genially": "", "apartado": "4.4. Efectos patrimoniales y destinación definitiva de los bienes", "ilustracion": "inspector-documento.webp", "paginas_pdf": [73, 73]}, {"layout": "mental", "segmentos": ["La ejecución de la sentencia exige una adecuada coordinación entre la autoridad judicial, la Fiscalía General de la Nación, la SAE y las entidades encargadas de los registros o de la recepción definitiva de los bienes. Esta articulación debe permitir identificar los activos comprendidos en la decisión, verificar su situación administrativa, ejecutar las modificaciones registrales correspondientes y facilitar las actuaciones necesarias para su destinación. Cuando los bienes se encuentren bajo administración cautelar, resulta importante asegurar la continuidad de la información patrimonial y documentar las modificaciones derivadas de la decisión judicial.", "Para los fiscales y servidores de policía judicial, esta etapa exige conservar la información relacionada con la identificación de los bienes, las medidas cautelares adoptadas, las actuaciones de materialización y las circunstancias relevantes de su administración. Aunque la destinación definitiva corresponde a las autoridades competentes conforme al régimen especial, la calidad de la información obtenida durante la investigación puede facilitar la ejecución de la sentencia y prevenir controversias sobre la identidad, ubicación o situación jurídica de los activos. De esta manera, la trazabilidad patrimonial conserva importancia incluso después de la declaración judicial de extinción de dominio."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mental", "items": [{"label": "ejecución de la sentencia", "segs": [0], "obj": "libros"}, {"label": "información relacionada con la identificación", "segs": [1], "obj": "escalones"}]}], "rotulo": null, "seccion": "Lección 4.4. Efectos patrimoniales y destinación definitiva de los bienes: declaración de titularidad a favor del Estado, incorporación al FRISCO y destinación conforme al régimen legal aplicable", "grupo": "Articulación institucional para ejecutar la sentencia", "titulos_fuente": ["Lección 4.4. Efectos patrimoniales y destinación definitiva de los bienes: declaración de titularidad a favor del Estado, incorporación al FRISCO y destinación conforme al régimen legal aplicable", "Articulación institucional para ejecutar la sentencia"], "encabezados": [], "mediacion": "Mapa mental: la idea central y sus ramas; cada rama abre su texto completo.", "rotulos": ["ejecución de la sentencia", "información relacionada con la identificación"], "titulo_genially": "Articulación institucional para ejecutar la sentencia", "complemento_genially": "", "apartado": "4.4. Efectos patrimoniales y destinación definitiva de los bienes", "ilustracion": "examen-bienes.webp", "paginas_pdf": [73, 74]}, {"layout": "linea", "segmentos": ["En una investigación de extinción de dominio, la Fiscalía identifica varios inmuebles rurales y urbanos adquiridos mediante recursos relacionados con actividades ilícitas. Después de surtirse el procedimiento correspondiente, el juez especializado declara la extinción del derecho de dominio sobre determinados bienes y dispone las consecuencias jurídicas establecidas en la sentencia. Los activos que se encontraban bajo administración cautelar deberán continuar su tratamiento conforme a la nueva situación jurídica, mientras que la SAE deberá examinar las reglas de destinación definitiva aplicables. En el caso de los predios rurales, será necesario verificar si concurren los presupuestos de las disposiciones especiales relacionadas con su vocación agrícola y destinación a las entidades competentes.", "La declaración de extinción de dominio constituye, en consecuencia, el resultado jurisdiccional de una actuación patrimonial orientada a determinar la legitimidad constitucional y legal de los derechos ejercidos sobre determinados bienes. Su ejecución exige diferenciar la pérdida definitiva del derecho de propiedad, la administración de los activos y su destinación conforme al régimen especial del FRISCO. Para la Fiscalía General de la Nación, esta comprensión permite reconocer que la eficacia de la acción no concluye exclusivamente con la obtención de una sentencia favorable, sino que también requiere una adecuada identificación, trazabilidad y articulación institucional para hacer efectivas sus consecuencias patrimoniales.", "Con el estudio de los mecanismos de terminación anticipada, colaboración efectiva, negociación patrimonial y destinación definitiva de los bienes, se completa el análisis de las principales herramientas jurídicas previstas para resolver las controversias patrimoniales en el procedimiento de extinción de dominio. Estos conocimientos permiten integrar las etapas de investigación, afectación cautelar, control judicial y resolución definitiva, reconociendo que cada actuación debe desarrollarse conforme a sus competencias, presupuestos probatorios y garantías constitucionales."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "linea", "items": [{"label": "inmuebles rurales y urbanos", "segs": [0], "obj": "casa"}, {"label": "resultado jurisdiccional de una actuación patrimonial", "segs": [1], "obj": "documento"}, {"label": "principales herramientas jurídicas", "segs": [2], "obj": "lupa"}]}], "rotulo": null, "seccion": "Lección 4.4. Efectos patrimoniale
