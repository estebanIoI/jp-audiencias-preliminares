<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-srpa", "paleta": {"marino": "#07415C", "teal": "#2E6377", "oxido": "#B55D41", "coral": "#FF6936", "crema": "#FFE1D7", "niebla": "#CAE9E4", "hielo": "#E9F6F4", "celeste": "#CAE9E4", "madera": "#B55D41", "piso": "#CAE9E4", "gris": "#CAE9E4", "amarillo": "#FF6936"}, "anclas": {"construccion-bloques.webp": {"r": 1.2712, "p": [[62, 53], [41, 63], [52, 76], [66, 89]]}, "rompecabezas.webp": {"r": 1.264, "p": [[42, 31], [66, 43], [40, 66], [62, 69]]}, "camino-proteccion.webp": {"r": 1.1335, "p": [[79, 26], [87, 58], [61, 86], [20, 72]]}, "circulo-dialogo.webp": {"r": 1.1524, "p": [[31, 13], [68, 9], [11, 62], [89, 66]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "srpa", "partirComas": true, "bitacora": true, "retro": {"reacciones": ["rompecabezas.webp", "construccion-bloques.webp", "circulo-dialogo.webp"], "frases": ["¿Seguro?", "¡Revisa de nuevo!", "¡Mira otra vez!", "¡Casi!", "¡Un momento!", "¡Vuelve a leer!"], "acierto": ["camino-proteccion.webp", "cuidado-familia.webp"], "rotulo": "Unidad 5 · Lección 1"}, "leccion_rotulo": "Lección 1", "unit": 5, "lesson": 1, "heading": "Lección 1. Medidas restrictivas de derechos en el marco de la indagación y la investigación penal del sistema de responsabilidad penal para adolescentes", "scenes": [{"layout": "esquema", "segmentos": ["Elementos previos al inicio del proceso penal de adolescentes: desestimación y remisión.", "Teniendo en cuenta los postulados propios del sistema de responsabilidad penal para adolescentes que exige de las diferentes autoridades que intervienen en los procesos, el cumplimiento de una serie de requisitos, algunos de ellos restricciones o considerándolos de manera positiva, la observancia plena de unas garantías en favor de los menores de edad señalados de haber cometido algún delito, queremos recordar los límites y cuidados que debe tener quienes van a ser las autoridades encargadas de realizar las primeras actuaciones, las cuales de manera general están asignadas a la Policía Nacional y que consisten en la aprehensión del sujeto transgresor.", "Esta aprehensión ya sea en circunstancias de flagrancia, como casi siempre ocurre, o como resultado de una denuncia, debe ser realizada con suma cautela, teniendo en cuenta no vulnerar los derechos y preservar la integridad física y moral del aprehendido. Situación que plantea una serie de dificultades, muchas de las cuales se refieren al estado mental en el cual se encuentra el adolescente o el joven, quien puede estar bajo los efectos de sustancias psicoactivas o exaltado por las mismas circunstancias que rodean la ejecución de los hechos de transgresión o la persecución y reducción sufrida; siendo necesario desarrollar un proceso de nivelación a partir del acompañamiento, el dialogo y en algunas ocasiones la intervención especializada (medica) que permita generarle la confianza y lucidez necesarias para comprender y participar del proceso.", "Una vez logrado lo anterior, el adolescente es puesto a disposición de las autoridades del sistema de responsabilidad penal, las cuales en primera instancia deben ser un fiscal y un defensor de familia, el fiscal y el defensor de familia antes de iniciar sus respectivos procesos, deben tener en cuenta los elementos básicos los elementos básicos que se requieren para preservar la vida e integridad del joven o adolescente que les ha sido puesto a su disposición, ordenar las acciones de urgencia que sean pertinentes en este sentido y posteriormente en la audiencia de legalización de la aprehensión, tener en cuenta las situaciones encontradas para que se produzca la legalización o rechazo de la aprehensión."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Elementos previos al inicio del proceso penal", "segs": [0], "obj": "documento"}, {"label": "Teniendo en cuenta los postulados propios", "segs": [1], "obj": "escudo"}, {"label": "Circunstancias de flagrancia", "segs": [2], "obj": "puertaCerrada"}, {"label": "Puesto a disposición de las autoridades", "segs": [3], "obj": "escalones"}]}], "rotulo": null, "seccion": "Lección 1. Medidas restrictivas de derechos en el marco de la indagación y la investigación penal del sistema de responsabilidad penal para adolescentes", "grupo": "Consideraciones Preliminares:", "titulos_fuente": ["Consideraciones Preliminares:"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Elementos previos al inicio del proceso penal", "Teniendo en cuenta los postulados propios", "Circunstancias de flagrancia", "Puesto a disposición de las autoridades"], "titulo_genially": "Consideraciones Preliminares: (1 de 2)", "complemento_genially": "", "apartado": "", "ilustracion": "camino-proteccion.webp", "arte": {"img": "camino-proteccion.webp", "pos": "fondo"}, "relleno": "cuidado-familia.webp", "bloques_fuente": [36, 39]}, {"layout": "giro", "segmentos": ["Posteriormente se inicia un momento muy interesante por parte de la fiscalía, entidad que en cuanto al proceso judicial se refiere, es la que considera y determina si es o no pertinente la apertura de una investigación penal. Tal pertinencia se define observando algunos elementos como la magnitud del daño infringido al bien jurídico tutelado, las situaciones adversas generadas con la acción transgresora, las circunstancias en las que se dieron los hechos y las mismas características del sujeto transgresor; frente a los principios de despenalización y desjudicialización, propios de los sistemas de justicia juvenil apareciendo la posibilidad de utilizar una primera figura, propia de todo el derecho penal, pero que en el sistema de adolescentes tiene mayor vigencia y se usa muy poco, como lo es la desestimación del caso, que en este sistema tiene mayores posibilidades que con en el de adultos.", "Algunos de los elementos necesarios para considerar esta figura se relacionan con la desproporción entre la magnitud del daño causado y los costos y consecuencias de activar el proceso penal lo que quiere decir que si el fiscal advierte que el daño causado no tiene la entidad y la gravedad suficiente para llevar al adolescente o joven ante un tribunal, puede desestimar el caso y aconsejar otra serie de medidas pedagógicas. Esto puede darse frente a delitos de pequeña envergadura hemos visto en el comportamiento del sistema relacionados con el daño en bien ajeno, la violencia intrafamiliar o la suplantación de identidad.", "Los dos primeros cuando surgen como una reacción del adolescente por rebeldía o como un ejercicio contestatario, cuyas consecuencias pueden ser subsanados de otra manera diferente al derecho penal, y en el caso de la suplantación de la entidad, en situaciones propias de la travesura de la edad, cuando con el ánimo de ingresar a determinado sitio o espectáculo, que le esta restringido por su minoría de edad, utiliza el documento de identidad de otra persona, ante estas situaciones, como ocurre en otros países, el fiscal puede hacer uso de la figura de la desestimación del caso, absteniéndose de iniciar el proceso penal", "En el Sistema de Responsabilidad Penal para Adolescentes (SRPA) de Colombia, el término técnico exacto no suele ser \"desestimación\", sino archivo de las diligencias, preclusión, o la aplicación de salidas alternativas. Algunas de las vías legales por las cuales un caso puede ser desestimado o cerrado de forma anticipada dentro del SRPA se agota a través del archivo de las diligencias por parte de la fiscalía, que consiste en la desestimación directa que realiza el Fiscal cuando advierte que la conducta no existió, no es considerada un delito (es atípica) o es imposible identificar al autor. El fiscal ordena archivar el expediente, deteniendo cualquier investigación de forma inmediata, pero que a nuestro juicio bien puede la aplicación de esta figura extenderse a los casos anteriormente enunciados."], "parrafo": [0, 1, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Posteriormente", "segs": [0], "obj": "reloj"}, {"label": "Algunos de los elementos necesarios para considerar", "segs": [1], "obj": "tribunal"}, {"label": "Los dos primeros cuando surgen", "segs": [2], "obj": "documento"}, {"label": "En el Sistema de Responsabilidad Penal", "segs": [3], "obj": "puertaCerrada"}]}], "rotulo": null, "seccion": "Lección 1. Medidas restrictivas de derechos en el marco de la indagación y la investigación penal del sistema de responsabilidad penal para adolescentes", "grupo": "Consideraciones Preliminares:", "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Posteriormente", "Algunos de los elementos necesarios para considerar", "Los dos primeros cuando surgen", "En el Sistema de Responsabilidad Penal"], "titulo_genially": "Consideraciones Preliminares: (2 de 2)", "complemento_genially": "", "apartado": "", "bloques_fuente": [40, 42]}, {"layout": "fichas", "segmentos": ["Una vez descartadas las posibilidades anteriores, es decir, evitar que el asunto llegue hasta una instancia de penalización y judicialización, como se pide desde el denominado “derecho de las cuatro D” (descriminalización, despenalización, debido proceso y desinstitucionalización), si ese objetivo no se logró y es absolutamente necesario iniciar un proceso judicial en el marco del sistema de responsabilidad penal para adolescentes, el fiscal tiene, desde su ejercicio, dos caminos: el primero proceder a solicitar para la definición de la situación jurídica del adolescente una medida privativa de la libertad o simplemente no solicitarlo y solo enfocarse en preparar la imputación de cargos.", "En la segunda situación se han presentado críticas al respecto, ya que solo se va a dictar una medida al finalizar el proceso en el caso que el adolescente sea hallado responsable, y siendo que no es susceptible solicitar una medida de internamiento preventivo y teniendo en cuenta que la audiencia de juzgamiento y de posible imposición de la sanción se retardan como suele suceder, en forma continua se pierde la presencia del adolescente ya que no se han establecido mecanismos que permitan garantizar esa presencia y asistencia a las siguientes etapas del proceso. Debemos anotar que este riesgo no es motivo suficiente para forzar una detención preventiva y menos cuando no se cumple con la exigencia según la cual, solo procede esta figura cuando la conducta por la cual se está procesando al adolescente, en caso de ser hallado responsable, va a tener como resultado una medida de privación de la Libertad.", "Desde nuestra consideración, para estos casos es posible contar con las posibilidades que nos brinda la ejecución simultanea del proceso administrativo de restablecimiento de derechos, porque si se lograran coordinar los dos procesos, como lo exigen los principios de la actuación interinstitucional y la protección integral, podríamos logar que las medidas proferidas en el marco del restablecimiento de derechos por parte del defensor de familia, garanticen esa comparecencia y presencia, ordenando el compromiso y acompañamiento al adolescente por parte de sus responsables e inclusive conminando al mismo adolescente para que asista a las audiencias propias del proceso y haciendo el respectivo seguimiento. Este mecanismo ha sido poco explorado y no se ha avanzado lo suficiente en él ya que ha faltado la integración necesaria entre los dos procesos y por lo tanto su posible eficacia se ha visto reducida."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Una vez descartadas las posibilidades anteriores", "segs": [0], "obj": "documento"}, {"label": "En la segunda situación", "segs": [1], "obj": "tribunal"}, {"label": "Desde nuestra consideración, para estos casos", "segs": [2], "obj": "escudo"}]}], "rotulo": null, "seccion": "Lección 1. Medidas restrictivas de derechos en el marco de la indagación y la investigación penal del sistema de responsabilidad penal para adolescentes", "grupo": "La detención preventiva", "titulos_fuente": ["La detención preventiva"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Una vez descartadas las posibilidades anteriores", "En la segunda situación", "Desde nuestra consideración, para estos casos"], "titulo_genially": "La detención preventiva", "complemento_genially": "", "apartado": "", "bloques_fuente": [44, 46]}, {"layout": "puntos", "segmentos": ["Se considera que, si son aplicables las medidas sustitutivas de la privación de la libertad del artículo 314 CPP, por remisión normativa del 144 CIA y en virtud del principio de favorabilidad así:", "1. Cuando para el cumplimiento de los fines previstos para la medida de aseguramiento sea suficiente la reclusión en el lugar de residencia, aspecto que será fundamentado por quien solicite la sustitución y decidido por el juez en la respectiva audiencia de imposición, en atención a la vida personal, laboral, familiar o social del imputado:", "No es aplicable en el sistema de responsabilidad penal para adolescentes porque la condición de minoría de edad del infractor implica un análisis de corresponsabilidad y de garantía de derechos del núcleo familiar, así si al realizar el test estricto de proporcionalidad, se arriba a la conclusión que para el cumplimiento de los fines de la medida de aseguramiento es suficiente su ubicación en la residencia del procesado, ello implicaría un escenario positivo de corresponsabilidad familiar y en virtud a ello no sería viable la medida de aseguramiento privativa de la libertad en ninguna de sus modalidades al privilegiarse medidas menos restrictivas como lo es la administrativa de restablecimiento de derechos de ubicación en medio familiar a cargo del defensor de familia (Art. 83 CIA) y en contrario, ante una ausencia de corresponsabilidad familiar no sería posible tomar medidas relacionadas con la privación de la libertad en el domicilio requiriendo un medio más restrictivo de carácter institucional que permita alcanzar las finalidades de la medida de aseguramiento.", "2. Cuando el imputado o acusado fuere mayor de sesenta y cinco (65) años, siempre que su personalidad, la naturaleza y modalidad del delito hagan aconsejable su reclusión en el lugar de residencia. Referente a la edad del procesado no es aplicable al sistema de responsabilidad penal para adolescentes", "3. Cuando a la procesada le falten tres (3) meses o menos para el parto, y hasta los seis (6) meses después del nacimiento. La condición de madre gestante de la procesada si es aplicable y puede sustituirse cuando se presenten tales condiciones."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "Se considera que, si son aplicables", "segs": [0, 1], "obj": "puertaCerrada"}, {"label": "No es aplicable en el sistema", "segs": [2], "obj": "escudo"}, {"label": "Cuando el imputado o acusado fuere", "segs": [3], "obj": "reloj"}, {"label": "Cuando a la procesada le falten", "segs": [4], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 1. Medidas restrictivas de derechos en el marco de la indagación y la investigación penal del sistema de responsabilidad penal para adolescentes", "grupo": "Sustitución de la detención preventiva:", "titulos_fuente": ["Sustitución de la detención preventiva:"], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["Se considera que, si son aplicables", "No es aplicable en el sistema", "Cuando el imputado o acusado fuere", "Cuando a la procesada le falten"], "titulo_genially": "Sustitución de la detención preventiva: (1 de 2)", "complemento_genially": "", "apartado": "", "ilustracion": "construccion-bloques.webp", "relleno": "camino-proteccion.webp", "bloques_fuente": [48, 52]}, {"layout": "esquema", "segmentos": ["4. Cuando el imputado o acusado estuviere en estado grave por enfermedad, previo dictamen de médicos oficiales. Si es aplicable para el sistema de responsabilidad penal para adolescentes se aplica de la misma manera que en el SPA.", "5. Cuando la procesada fuere mujer cabeza de familia de hijo menor de edad o que sufriere incapacidad permanente, o tenga a un adulto mayor o una persona que no puede valerse por sí misma bajo su cuidado. La persona que haga sus veces podrá acceder a la misma medida. En estos eventos, el juez atenderá especialmente a las necesidades de protección de la unidad familiar y a la garantía de los derechos de las personas que se encuentran bajo su dependencia. La condición de madre cabeza de familia si es precedente en el sistema de responsabilidad penal para adolescentes, su aplicabilidad se presenta de la misma manera que en el Sistema Penal Acusatorio de adultos.", "En caso de ser procedente la sustitución de la detención preventiva, tal y como sucede en el Sistema Penal Acusatorio de adultos, el beneficiado deberá suscribir acta en la cual se compromete a permanecer en el lugar indicado, a no cambiar de residencia sin previa autorización, a concurrir ante la autoridad cuando sea requerido, y a someterse a la vigilancia de una institución determinada."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Cuando el imputado o acusado estuviere", "segs": [0], "obj": "personas"}, {"label": "Cuando la procesada fuere mujer cabeza", "segs": [1], "obj": "escudo"}, {"label": "En caso de ser procedente", "segs": [2], "obj": "puertaCerrada"}]}], "rotulo": null, "seccion": "Lección 1. Medidas restrictivas de derechos en el marco de la indagación y la investigación penal del sistema de responsabilidad penal para adolescentes", "grupo": "Sustitución de la detención preventiva:", "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Cuando el imputado o acusado estuviere", "Cuando la procesada fuere mujer cabeza", "En caso de ser procedente"], "titulo_genially": "Sustitución de la detención preventiva: (2 de 2)", "complemento_genially": "", "apartado": "", "ilustracion": "camino-proteccion.webp", "arte": {"img": "camino-proteccion.webp", "pos": "izq"}, "relleno": "cuidado-familia.webp", "bloques_fuente": [53, 55]}, {"layout": "giro", "segmentos": ["En el caso en el cual sea necesario solicitar un internamiento preventivo y este sea otorgado por el juez, previo el cumplimiento de los requisitos establecidos por la ley, (cuales) debemos observar que ese internamiento, que se cumple en un centro de internamiento preventivo (CIP), institución del Estado creada en la ley 1098/2006 para tal fin y que en Colombia está bajo la tutela y administración del Instituto Colombiano de Bienestar Familiar, quien lo opera a través de entidades especializadas, cumpla con los requisitos necesarios en materia de garantizar los derechos de los adolescentes privados de la libertad en calidad de imputados, siempre respetando su presunción de inocencia, ya que no han sido declarados responsables como conclusión de un juicio, garantizando al adolescente el ejercicio de todos los derechos que no le han sido conculcados con la restricción de la libertad procurando que el proceso avance con la mayor celeridad posible.", "El artículo 308 del Código de Procedimiento Penal regula los requisitos para que proceda en forma preventiva la privación de la y ente ellos destacamos los siguientes:", "Inferencia razonable de autoría o participación: La Fiscalía debe contar con pruebas o evidencias de las que se pueda establecer que la persona imputada tiene responsabilidad en la ejecución del hecho que se investiga.", "Imputación: Debe haberse realizado previamente la formulación de la imputación de cargos", "La medida debe ser necesaria para Garantizar la comparecencia del imputado al proceso, evitar la obstrucción de la justicia, Proteger a la comunidad o a las víctimas", "Necesidad y proporcionalidad para solicitar la medida debe analizase que no haya otras formas no restrictivas de la libertad que sirvan para lograr los fines de a medida impuesta.", "La medida de internamiento preventivo tiene una duración máxima de 4 meses que puede prorrogarse por un mes más si las circunstancias lo hacen necesario y su fin en el sistema de responsabilidad penal es complementado con la necesidad de brindar acompañamiento psicosocial, garantía de derechos y facilitar la reflexión del adolescente mientras se define la medida que le será impuesta"], "parrafo": [0, 1, 2, 3, 4, 5, 6], "vineta": [2, 3, 4, 5], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "En el caso", "segs": [0], "obj": "libros"}, {"label": "El artículo 308 del Código", "segs": [1, 2], "obj": "lupa"}, {"label": "Imputación", "segs": [3, 4, 5], "obj": "puertaAbierta"}, {"label": "La medida de internamiento preventivo tiene", "segs": [6], "obj": "reloj"}]}], "rotulo": null, "seccion": "Lección 1. Medidas restrictivas de derechos en el marco de la indagación y la investigación penal del sistema de responsabilidad penal para adolescentes", "grupo": "Internamiento Preventivo", "titulos_fuente": ["Internamiento Preventivo"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["En el caso", "El artículo 308 del Código", "Imputación", "La medida de internamiento preventivo tiene"], "titulo_genially": "Internamiento Preventivo (1 de 5)", "complemento_genially": "", "apartado": "", "bloques_fuente": [57, 63]}, {"layout": "fichas", "segmentos": ["Sentencia C-684 de 2009: La Corte Constitucional reiteró el carácter residual de las medidas restrictivas, determinando que el confinamiento se debe reducir al mínimo lapso indispensable y exclusivamente ante conductas delictivas graves acompañadas de violencia física o reincidencia. Además, declaró inconstitucional el procedimiento expedito de flagrancia para menores (artículo 191 del Código de la Infancia y la Adolescencia - CIA) por quebrantar las garantías fundamentales de defensa y debido proceso del menor.", "Frente a la anterior sentencia debemos anotar que las conductas frente a las que procede ya están delimitadas por la ley, siendo aquellas en las que se puede dar como resultado del proceso una medida privativa de la libertad. (ver ley 1098 de 2006)", "Ahora bien, toda privación de la libertad se encuentra atada al cumplimiento de unas finalidades constitucionales legítimas, las cuales están desarrolladas por el artículo 250 de la Constitución Política, dentro de las que se destaca las de: asegurar la comparencia al proceso, la conservación de la prueba, la protección de la comunidad en especial de las víctimas y el cumplimiento de la sentencia. Tal y como sucede en el Sistema Penal Acusatorio de adultos.", "En todos los casos, el juez que adelante el proceso deberá hacer uso de la remisión normativa contenida en el artículo 144 de la Ley 1098 de 2006, conforme a la cual el procedimiento del sistema de responsabilidad penal para adolescentes se regirá por las normas consagradas en la Ley 906 de 2004 salvo las reglas especiales del Código de la Infancia y Adolescencia, exceptuando aquellas disposiciones contrarias al interés superior del adolescente."], "parrafo": [0, 1, 2, 3], "vineta": [0], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Sentencia C-684 de 2009", "segs": [0], "obj": "libros"}, {"label": "Frente a la anterior sentencia debemos anotar", "segs": [1], "obj": "puertaCerrada"}, {"label": "toda privación de la libertad", "segs": [2], "obj": "puertaAbierta"}, {"label": "En todos los casos, el juez", "segs": [3], "obj": "tribunal"}]}], "rotulo": null, "seccion": "Lección 1. Medidas restrictivas de derechos en el marco de la indagación y la investigación penal del sistema de responsabilidad penal para adolescentes", "grupo": "Internamiento Preventivo", "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Sentencia C-684 de 2009", "Frente a la anterior sentencia debemos anotar", "toda privación de la libertad", "En todos los casos, el juez"], "titulo_genially": "Internamiento Preventivo (2 de 5)", "complemento_genially": "", "apartado": "", "bloques_fuente": [64, 67]}, {"layout": "puntos", "segmentos": ["De manera que, al Juez de Control de Garantías para Adolescentes, le corresponde hacer uso de los requisitos establecidos para la imposición de la medida de aseguramiento privativa de la libertad del Sistema Penal Acusatorio Código de Procedimiento Penal Ley 906 de 2004 que están desarrollados por los artículos 306 y ss, destacándose lo relacionado con la construcción de inferencia razonable de autoría o participación, así como la urgencia de la medida, también el artículo 295, 296, que hablan del juicio de proporcionalidad que incluye idoneidad, necesidad, proporcionalidad en sentido estricto que es un criterio que debe abarcar toda medida restrictiva de derechos conforme a lo que ha venido señalando de manera reiterada la jurisprudencia constitucional inclusive desde la sentencia hito C-822/2005.", "Dentro de los instrumentos internacionales que regulan las medidas restrictivas se encuentra que las “Reglas Mínimas de las Naciones Unidas para la Administración de Justicia de Menores -Reglas de Beijing-, desarrollan en la regla 13 lo referente al estándar internacional aplicable para la privación de la libertad como medida cautelar personal frente a un menor de edad, estableciendo que sólo se aplicará como medida de último recurso y por el plazo más breve posible, así como la preferencia por las medidas sustitutorias de la prisión preventiva.", "Conforme a la regla 13 de Beijing y al artículo 181 CIA, se encuentra un requisito particular y propio del Sistema de Responsabilidad Penal para Adolescentes el cual es el de último recurso, el cual puede ser entendido como la última opción, únicamente disponible cuando ya se han agotado todas las alternativas existentes, esto quiere decir que se acredita el requisito de último recurso cuando ya se han agotado todas las posibilidades diferentes a la privación de la libertad, sin que ello implique que en un primer ingreso de un adolescente al sistema no pueda haber privación de la libertad, se requiere es explicar de manera suficiente porque en ese caso concreto no son adecuadas las alternativas diferentes a la privación de la libertad.", "Esto requiere que el fiscal delegado le acredite al juez las razones por las cuales las medidas diferentes a la privación de la libertad no son idóneas, adecuadas, razonables y proporcionales frente a las finalidades del sistema de responsabilidad penal para adolescentes y en especial las finalidades cautelares legítimas del 250 constitucional o como lo dice Ángulo y Escalante (2010: 164), “el requisito del último recurso implica que solamente puede acudirse a ella en casos excepcionales, cuando realmente sea necesaria para el cumplimiento de sus fines y entendiendo que la afectación de la libertad de los adolescentes constituye una medida pedagógica y no una sanción penal y que por lo tanto solo debe ser impuesta cuando se den los requisitos legales que la justifiquen y viabilicen”."], "parrafo": [1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "Ley 906 de 2004", "segs": [0], "obj": "puertaCerrada"}, {"label": "Dentro de los instrumentos internacionales", "segs": [1], "obj": "puertaAbierta"}, {"label": "Conforme a la regla 13", "segs": [2], "obj": "escalones"}, {"label": "Esto requiere que el fiscal delegado", "segs": [3], "obj": "tribunal"}]}], "rotulo": null, "seccion": "Lección 1. Medidas restrictivas de derechos en el marco de la indagación y la investigación penal del sistema de responsabilidad penal para adolescentes", "grupo": "Internamiento Preventivo", "titulos_fuente": [], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["Ley 906 de 2004", "Dentro de los instrumentos internacionales", "Conforme a la regla 13", "Esto requiere que el fiscal delegado"], "titulo_genially": "Internamiento Preventivo (3 de 5)", "complemento_genially": "", "apartado": "", "ilustracion": "circulo-dialogo.webp", "relleno": "camino-proteccion.webp", "bloques_fuente": [67, 69]}, {"layout": "esquema", "segmentos": ["Ahora bien, véase que el requisito de último recurso también es un requisito de bloque de constitucionalidad por expresa disposición del artículo 37 de la Convención de los Derechos del Niño, el cual regula la materia así: “b) Ningún niño sea privado de su libertad ilegal o arbitrariamente. La detención, el encarcelamiento o la prisión de un niño se llevará a cabo de conformidad con la ley y se utilizará tan sólo como medida de último recurso y durante el período más breve que proceda”", "Volviendo a las medidas de aseguramiento, se considera que las medidas restrictivas de derechos durante la investigación y el juzgamiento tienen reserva legal, y en consecuencia el legislador solamente contempló una medida de aseguramiento para el Sistema de Responsabilidad Penal para Adolescentes de carácter privativo de la libertad en el artículo 181 CIA, no regulando las medidas no privativas de la libertad del artículo 307 B de la Ley 906 de 2004.", "Frente a las medidas no privativas de la libertad, en el Sistema de Responsabilidad Penal para Adolescentes deben preferirse las medidas menos restrictivas de los derechos del adolescente infractor, así si al realizar un test estricto de proporcionalidad se concluye que la medida de aseguramiento privativa de la libertad no es necesaria pues ese test estricto deberá verificar la existencia de otras medidas menos restrictivas de derechos que permitan alcanzar las mismas finalidades legítimas del 250 constitucional, y sólo en ese caso podría hacerse uso de las no privativas del 307 literal b en virtud de la remisión normativa del artículo 144 de la ley 1098 de 2006.", "Aunado a lo anterior, las Reglas Mínimas de las Naciones Unidas para la Administración de Justicia de Menores “Reglas de Beijing” en su regla 13.2 señalan que, siempre que sea apropiado y deseable se adoptarán medidas sustitutorias de la prisión preventiva, y ello concordante con la regla 18 que habla de la pluralidad de medidas resolutorias de las cuales pueden hacer uso los jueces en los sistemas de justicia penal juvenil."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "véase que el requisito de último", "segs": [0], "obj": "puertaCerrada"}, {"label": "Volviendo a las medidas de aseguramiento", "segs": [1], "obj": "puertaAbierta"}, {"label": "Frente a las medidas no privativas", "segs": [2], "obj": "documento"}, {"label": "Reglas Mínimas de las Naciones Unidas", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 1. Medidas restrictivas de derechos en el marco de la indagación y la investigación penal del sistema de responsabilidad penal para adolescentes", "grupo": "Internamiento Preventivo", "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["véase que el requisito de último", "Volviendo a las medidas de aseguramiento", "Frente a las medidas no privativas", "Reglas Mínimas de las Naciones Unidas"], "titulo_genially": "Internamiento Preventivo (4 de 5)", "complemento_genially": "", "apartado": "", "ilustracion": "camino-proteccion.webp", "arte": {"img": "camino-proteccion.webp", "pos": "der"}, "relleno": "rompecabezas.webp", "bloques_fuente": [70, 73]}, {"layout": "fichas", "segmentos": ["Ahora bien, se excluye de esa posibilidad la detención preventiva en la residencia del imputado o acusado, en tanto que si a la luz del test estricto de proporcionalidad es suficiente su ubicación en el medio familiar en su residencia ello implicaría que el adolescente cuenta con un núcleo familiar corresponsable y garante de sus derechos lo que generaría inviable la imposición de la restricción de la libertad en el domicilio.", "Sin embargo si existe un escenario en el cual es procedente la detención domiciliaria y es aquel escenario del artículo 162 inciso 2 el cual contempla que, “En tanto no existan establecimientos especiales separados de los adultos para recluir a los adolescentes privados de la libertad, el funcionario judicial procederá a otorgarles, libertad provisional o la detención domiciliaria.” y para el efecto inclusive el Instituto Colombiano de Bienestar Familiar ha expedido un Lineamiento Técnico Administrativo para la Medida de Detención Domiciliaria."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "se excluye de esa posibilidad", "segs": [0], "obj": "puertaCerrada"}, {"label": "si existe un escenario", "segs": [1], "obj": "puertaAbierta"}]}], "rotulo": null, "seccion": "Lección 1. Medidas restrictivas de derechos en el marco de la indagación y la investigación penal del sistema de responsabilidad penal para adolescentes", "grupo": "Internamiento Preventivo", "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["se excluye de esa posibilidad", "si existe un escenario"], "titulo_genially": "Internamiento Preventivo (5 de 5)", "complemento_genially": "", "apartado": "", "ilustracion": "cuidado-familia.webp", "bloques_fuente": [74, 75]}, {"layout": "caso", "segmentos": ["¿Cuáles son las finalidades de la medida de aseguramiento en el sistema de responsabilidad penal para adolescentes? ¿Dentro de estas finalidades se encuentra la de protección del adolescente? Justifique su respuesta:"], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "caso", "roles": {"titulo": "", "parrafos": [0]}, "obj": "documento", "items": [], "encabezado": "Bitácora de reflexión", "nombre": "Evaluación lección 1:"}], "rotulo": null, "seccion": "Lección 1. Medidas restrictivas de derechos en el marco de la indagación y la investigación penal del sistema de responsabilidad penal para adolescentes", "grupo": "Evaluación lección 1:", "titulos_fuente": ["Evaluación lección 1:"], "encabezados": [], "mediacion": "Actividad de escritura: el caso, la consigna y el espacio para responder.", "rotulos": ["Evaluación lección 1:"], "titulo_genially": "Evaluación lección 1:", "complemento_genially": "", "apartado": "", "bloques_fuente": [77, 77]}, {"layout": "lamina", "segmentos": ["La finalidad de protección en la privación de la libertad era una finalidad propia del sistema de justicia tutelar del decreto 2737 de 1989, tal finalidad no es aplicable en la Ley 1098 de 2006 en tanto que nos encontramos en un sistema de responsabilidad penal o garantía de derechos, así es como en parágrafo del artículo 140 del Código de Infancia y Adolescencia se plantea que en ningún caso la protección integral puede servir de excusa para violar los derechos y garantías de los niños, las niñas y los adolescentes.", "Ahora bien, las finalidades de la medida de aseguramiento privativa de la libertad son aquellas finalidades constitucionales legitimas que están desarrolladas por el acto legislativo 03 de 2002 en el artículo 250 constitucional que también son aplicables en el Sistema Penal Acusatorio de adultos que corresponden a las de asegurar la comparencia al proceso, la preservación de la prueba, la protección de la comunidad y en especial de las víctimas."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Respuesta:", "segs": [0, 1], "obj": "puertaAbierta", "acomp": ["libros", "escudo"]}]}], "rotulo": null, "seccion": "Lección 1. Medidas restrictivas de derechos en el marco de la indagación y la investigación penal del sistema de responsabilidad penal para adolescentes", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Respuesta:"], "titulo_genially": "Respuesta:", "complemento_genially": "", "apartado": "", "relleno": "camino-proteccion.webp", "bloques_fuente": [79, 80]}]}</script>
