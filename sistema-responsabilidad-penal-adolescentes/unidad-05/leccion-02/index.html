<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-srpa", "paleta": {"marino": "#07415C", "teal": "#2E6377", "oxido": "#B55D41", "coral": "#FF6936", "crema": "#FFE1D7", "niebla": "#CAE9E4", "hielo": "#E9F6F4", "celeste": "#CAE9E4", "madera": "#B55D41", "piso": "#CAE9E4", "gris": "#CAE9E4", "amarillo": "#FF6936"}, "anclas": {"construccion-bloques.webp": {"r": 1.2712, "p": [[62, 53], [41, 63], [52, 76], [66, 89]]}, "rompecabezas.webp": {"r": 1.264, "p": [[42, 31], [66, 43], [40, 66], [62, 69]]}, "camino-proteccion.webp": {"r": 1.1335, "p": [[79, 26], [87, 58], [61, 86], [20, 72]]}, "circulo-dialogo.webp": {"r": 1.1524, "p": [[31, 13], [68, 9], [11, 62], [89, 66]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "srpa", "partirComas": true, "bitacora": true, "retro": {"reacciones": ["rompecabezas.webp", "construccion-bloques.webp", "circulo-dialogo.webp"], "frases": ["¿Seguro?", "¡Revisa de nuevo!", "¡Mira otra vez!", "¡Casi!", "¡Un momento!", "¡Vuelve a leer!"], "acierto": ["camino-proteccion.webp", "cuidado-familia.webp"], "rotulo": "Unidad 5 · Lección 2"}, "leccion_rotulo": "Lección 2", "unit": 5, "lesson": 2, "heading": "Lección 2. Requisitos habilitantes de las medidas restrictivas de derechos", "scenes": [{"layout": "esquema", "segmentos": ["Una vez analizadas todas las posibilidades y se define la necesidad y la pertinencia de solicitar la medida de internamiento preventivo ante el juez de garantías, es necesario revisar que ese internamiento no sea contrario al interés superior del adolescente y este de acuerdo con el principio general de la protección integral. Es entonces el fiscal quien solicita la medida y el juez de garantías quien la autoriza, después de un examen riguroso, que debe contener un ejercicio de ponderación, desde el cual se determine si dicha medida es necesaria y a lograr con los fines propuestos en el sistema de justicia juvenil y no simplemente un acto legal y protocolar.", "Esta medida de internamiento preventivo está regulado por las normas que el sistema de derechos humanos ha establecido para la protección de las personas privadas de la libertad, dentro de las que destacamos las Reglas Mínimas para el Tratamiento de los Reclusos o Reglas de Mandela, las Reglas para el tratamiento de las reclusas y medidas no privativas de la libertad para las mujeres delincuentes o Reglas de Bangkok, el Conjunto de Principios para la Protección de Todas las Personas Sometidas a Cualquier Forma de Detención o Prisión y de manera especial las Reglas de las Naciones Unidas para la protección de los menores privados de libertad o reglas de la habana.", "Las reglas de la Habana son las normas establecidas por el Sistema de Naciones Unidas para la protección de los menores privados de la libertad y por tanto es importante contar con el conocimiento previo de ese instrumento, el cual dejamos anexo a este capítulo.", "Esta segunda lección tiene que ver con los requisitos habilitantes de las medidas restrictivas de derechos a los adolescentes sometidos a un proceso de justicia juvenil, los que a simple vista constituyen un tema sencillo y corto, ya que podríamos simplemente afirmar que los requisitos habilitantes son aquellos que la ley prevé para solicitar y ordenar una medida privativa de la libertad y en el caso de la detención preventiva y que ese elemento habilitante lo constituye la autorización previa del juez de garantías, quien en consonancia con los previsto en el artículo 308 del código de Procedimiento Penal la autorizara cuando se cumplan los requisitos allí previsto, previa solicitud de la fiscalía, y participación de la defensa, en este caso no solo la defensa publica, si no que consideramos de gran importancia el pronunciamiento de la defensoría de familia."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Una vez analizadas todas las posibilidades", "segs": [0], "obj": "escudo"}, {"label": "Esta medida de internamiento preventivo está", "segs": [1], "obj": "puertaCerrada"}, {"label": "Las reglas de la Habana son", "segs": [2], "obj": "puertaAbierta"}, {"label": "Esta segunda lección tiene que ver", "segs": [3], "obj": "escalones"}]}], "rotulo": null, "seccion": "Lección 2. Requisitos habilitantes de las medidas restrictivas de derechos", "grupo": "Aspectos Preliminares.", "titulos_fuente": ["Aspectos Preliminares."], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Una vez analizadas todas las posibilidades", "Esta medida de internamiento preventivo está", "Las reglas de la Habana son", "Esta segunda lección tiene que ver"], "titulo_genially": "Aspectos Preliminares. (1 de 5)", "complemento_genially": "", "apartado": "", "ilustracion": "camino-proteccion.webp", "arte": {"img": "camino-proteccion.webp", "pos": "fondo"}, "relleno": "cuidado-familia.webp", "bloques_fuente": [83, 86]}, {"layout": "giro", "segmentos": ["A nuestro criterio existen otros requisitos habilitantes que podemos denominar de carácter implícito al sistema de justicia juvenil, y ellos deben ser tenidos en cuenta tanto frente a la medida del internamiento preventivo, como ante la situación que genera para el adolescente o joven haber sido vinculado al proceso y ser sujeto pasivo de algunos actos que corresponden a la policía técnica judicial, tales como la solicitud de información sobre su comportamiento así como el estudio de sus circunstancias particulares, de su comportamiento en los escenarios familiar y escolar, lo que constituye una invasión a su esfera personal y privacidad, que puede conllevar la realización de unos actos previos por parte de la policía técnica judicial, los cuales deben estar sujetos a los requerimientos de ley y algunos de ellos pasar por un control previo por parte de un juez de garantías, de manera igual a como ocurre con los adultos y en el caso de los adolescentes tenemos otro elemento ya que", "además del juez de garantías, el defensor de familia, debe estar enterado y debe contarse con su concepto.", "Los elementos habilitantes que denominamos de carácter intrínseco o derivados de los principios del derecho que rige los sistemas de justicia juvenil, se plantean como dos grandes bloques que se desprenden del principio de interés superior y de la protección integral.", "Desde principio del interés superior del adolescente no se puede tomar ninguna decisión que vaya a afectar de manera más grave la situación del adolescente, que aquella afectación que de manera proporcional debe hacerse como respuesta a la acción transgresora, pero teniendo en cuenta que según el interés superior la medida que se tome debe ser la más benéfica para el desarrollo integral del adolescente o si hay otras medidas menos gravosas con las cuales puedo lograr los objetivos y causarían un menor daño, debo optar por estas, en tal sentido diremos que un requisito habilitante lo constituye el tener una mínima certeza que la medida solicitada o autorizada no solo no afecta. sino que va en favor del interés superior del Adolescente, que ya la doctrina ha definido como entenderlo en el marco de una perspectiva de derechos."], "parrafo": [0, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "A nuestro criterio existen otros requisitos", "segs": [0], "obj": "escalones"}, {"label": "del juez de garantías, el defensor", "segs": [1], "obj": "escudo"}, {"label": "Los elementos habilitantes que denominamos", "segs": [2], "obj": "documento"}, {"label": "Desde principio del interés superior del adolescente", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 2. Requisitos habilitantes de las medidas restrictivas de derechos", "grupo": "Aspectos Preliminares.", "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["A nuestro criterio existen otros requisitos", "del juez de garantías, el defensor", "Los elementos habilitantes que denominamos", "Desde principio del interés superior del adolescente"], "titulo_genially": "Aspectos Preliminares. (2 de 5)", "complemento_genially": "", "apartado": "", "ilustracion": "cuidado-familia.webp", "arte": {"img": "cuidado-familia.webp", "pos": "izq"}, "bloques_fuente": [87, 88]}, {"layout": "fichas", "segmentos": ["La segunda medida habilitante tiene que ver con los requerimientos que se desprenden del principio de la protección integral, y se refiere al análisis previo si la medida propuesta o autorizada sirve para brindar una mayor protección al adolescente y se está logrando con ella que se active o fortalezca la sombrilla protectora que le permita gozar plenamente de todos sus derechos y lo ubique en un entorno en el cual pueda desarrollarse de manera integral y libre.", "En el estado actual del funcionamiento del sistema de responsabilidad penal para adolescentes, tendríamos que medir los riesgos a los que se puede exponer al adolescente al ser enviarlo a un centro internamiento preventivo o a un centro de atención especializado, ya que hemos visto en la realidad cómo en estos centros se suelen presentar situaciones de vulneración de derechos que en ocasiones antes que favorecer al adolescente terminan afectándolo de manera negativa en forma grave, incluso perjudicando su proceso de desarrollo. Es por esta razón que desde el sistema de Naciones Unidas se insta a acudir solo de manera residual y prácticamente en forma excepcional a las medidas que impliquen privación de la libertad.", "Otro elemento que es necesario tener en cuenta es que los centros de internamiento preventivo y los centros de atención especializadas no son centros de protección, ni especializados para el restablecimiento de derechos, esto para responder a ciertas enfrentar tesis desde las cuales, el vincular al joven a estas medidas trae beneficios en el sentido que logrará satisfacer unos derechos, al tener acceso a la atención, sobre todo en materia de salud mental frente a la adicción y consumo de sustancias psicoactivas, , beneficio que no se lograría desde otras instancias;", "otro imaginario es en estos centros estarían exentos de los peligros y adversidades que puede tener la vida en el mundo exterior, teniendo que nadar contra la corriente porque curiosamente, el sistema de responsabilidad penal para adolescentes, es el único sistema donde cotidianamente se hacen peticiones por parte de las familias en el sentido de internar al adolescente o prorrogar su internamiento, porque las mismas familias consideran que esta medida es un beneficio para ellas."], "parrafo": [0, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "La segunda medida habilitante tiene", "segs": [0], "obj": "escudo"}, {"label": "En el estado actual del funcionamiento", "segs": [1], "obj": "documento"}, {"label": "Otro elemento", "segs": [2], "obj": "carpetas"}, {"label": "otro imaginario es en estos centros", "segs": [3], "obj": "lupa"}]}], "rotulo": null, "seccion": "Lección 2. Requisitos habilitantes de las medidas restrictivas de derechos", "grupo": "Aspectos Preliminares.", "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["La segunda medida habilitante tiene", "En el estado actual del funcionamiento", "Otro elemento", "otro imaginario es en estos centros"], "titulo_genially": "Aspectos Preliminares. (3 de 5)", "complemento_genially": "", "apartado": "", "bloques_fuente": [89, 90]}, {"layout": "esquema", "segmentos": ["En el Sistema de Responsabilidad Penal para Adolescentes (SRPA) de Colombia, presenta como requisito habilitante general para las medidas que afectan los derechos del adolescente la orden expresa, previa y motivada del juez de control de garantías.", "La imposición de estas medidas conforme al planteamiento de la ley 1098 de 2006 y las Reglas de Beijing, deben cumplir con los principios y requerimientos de ser el último recurso posible, y la excepcionalidad de la medida, es decir que solo procede luego de haber analizado todas las otras posibilidades y considerarlas no apropiadas.", "La habilitación de la medida restrictiva debe ser directamente proporcional con la conducta y ser considerada así en la ley (principios de legalidad y tipicidad) y ser proporcional al daño causado desde la gravedad de la acción.", "Para autorizar el internamiento preventivo de forma cautelar debe haber riesgo de evasión, obstaculización dl la recolección de pruebas o representar un peligro para la víctima/comunidad y su término máximo es de 4 meses, prorrogable por 1 mes."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "En el Sistema de Responsabilidad Penal", "segs": [0], "obj": "escudo"}, {"label": "La imposición de estas medidas conforme", "segs": [1], "obj": "libros"}, {"label": "La habilitación de la medida restrictiva", "segs": [2], "obj": "reloj"}, {"label": "Para autorizar el internamiento preventivo", "segs": [3], "obj": "expediente"}]}], "rotulo": null, "seccion": "Lección 2. Requisitos habilitantes de las medidas restrictivas de derechos", "grupo": "Aspectos Preliminares.", "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["En el Sistema de Responsabilidad Penal", "La imposición de estas medidas conforme", "La habilitación de la medida restrictiva", "Para autorizar el internamiento preventivo"], "titulo_genially": "Aspectos Preliminares. (4 de 5)", "complemento_genially": "", "apartado": "", "relleno": "camino-proteccion.webp", "objeto_raiz": "escudo", "bloques_fuente": [91, 94]}, {"layout": "puntos", "segmentos": ["Otro elemento que debemos tener en cuenta es que distinto a lo que ocurre en el sistema penal de adultos, en el SRPA las medidas que se imponen no tienen un fin retributivo ni punitivo, sino que están enfocadas a la integración social y el restablecimiento de los derechos del adolescente, elementos en los que se debe fundar tanto la solicitud como el otorgamiento de a medida, motivando como la medida logrará beneficiar al adolescente.", "Como lo hemos dicho antes se plantea como un requisito indispensable el conocimiento, la verificación y el acompañamiento por parte del defensor de Familia o quien cumpla esa función, quien es la autoridad encargada de dirigir el Proceso Administrativo de Restablecimiento de Derechos (PARD) paralelo al proceso judicial.", "El principio de proporcionalidad es un criterio orientador para el Sistema de Responsabilidad Penal para adolescentes e implica que, en toda medida restrictiva de derechos tanto la fiscalía como la autoridad judicial, deberán tener especial consideración por el principio del interés superior así como las finalidades restaurativas, pedagógicas educativas de sistema de responsabilidad penal para adolescentes y atendiendo ello determinarán si la medida restrictiva propuesta es idónea, necesaria y proporcional en sentido estricto frente a las finalidades acotadas y solamente cuando la medida restrictiva supere ese test podrá determinarse su procedencia."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "Otro elemento", "segs": [0], "obj": "documento"}, {"label": "Como lo hemos dicho antes", "segs": [1], "obj": "escalones"}, {"label": "El principio de proporcionalidad es", "segs": [2], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 2. Requisitos habilitantes de las medidas restrictivas de derechos", "grupo": "Aspectos Preliminares.", "titulos_fuente": [], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["Otro elemento", "Como lo hemos dicho antes", "El principio de proporcionalidad es"], "titulo_genially": "Aspectos Preliminares. (5 de 5)", "complemento_genially": "", "apartado": "", "ilustracion": "rompecabezas.webp", "relleno": "cuidado-familia.webp", "bloques_fuente": [95, 97]}, {"layout": "caso", "segmentos": ["¿Son procedentes en el Sistema de Responsabilidad Penal para Adolescentes SRPA, los actos de investigación tales como registros y allanamientos y otros del Código de Procedimiento Penal? ¿Qué aspectos debe considerar el fiscal delegado para emitir la orden de registro y allanamiento, y solicitar su control de legalidad posterior ante el Juez de Control de Garantías?", "¿En el Sistema de Responsabilidad Penal para Adolescentes deben realizarse las solicitudes de audiencia de control de legalidad previa y posterior a los actos de investigación de la fiscalía?", "Tome atenta nota de su respuesta y Reflexione sobre ellas en el desarrollo de la unidad."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "caso", "roles": {"titulo": "", "parrafos": [0, 1, 2]}, "obj": "documento", "items": [], "encabezado": "Bitácora de reflexión", "nombre": "Pregunta orientadora:"}], "rotulo": null, "seccion": "Lección 2. Requisitos habilitantes de las medidas restrictivas de derechos", "grupo": "Pregunta orientadora:", "titulos_fuente": ["Pregunta orientadora:"], "encabezados": [], "mediacion": "Actividad de escritura: el caso, la consigna y el espacio para responder.", "rotulos": ["Pregunta orientadora:"], "titulo_genially": "Pregunta orientadora:", "complemento_genially": "", "apartado": "", "ilustracion": "camino-proteccion.webp", "bloques_fuente": [103, 105]}, {"layout": "giro", "segmentos": ["Frente a los requisitos habilitantes para las medidas restrictivas de derechos, se encuentra que la normatividad referente a los actos de investigación no está expresamente regulada en el Código de Infancia y Adolescencia y en consecuencia, deberá hacerse uso de la remisión normativa que contempla el artículo 144 del Código de la Infancia y la Adolescencia, conforme al cual, lo que no esté expresamente contemplado por las normas de la Ley 1098 de 2006, deberá seguir la regulación de las normas consagradas en la Ley 906 de 2004, exceptuando aquellas que sean contrarias al interés superior del adolescente.", "Así el juez de control de garantías, actuará como juez constitucional de la investigación y para el caso del Sistema de Responsabilidad Penal para Adolescentes deberá hacer uso del bloque de constitucionalidad y de instrumentos internacionales de derecho internacional aplicables a la justicia penal juvenil tales como, la Convención de los derechos del niño y otros instrumentos las Reglas Mínimas de las Naciones Unidas para la Administración de Justicia de Menores -Reglas de Beijing-, las Reglas de las Naciones Unidas para los menores privados de la libertad -Reglas de la Habana-, entre otras disposiciones, por expreso mandato del artículo 6 del Código de la Infancia y la Adolescencia, el cual contempla que las normas contenidas en la Constitución Política y en los Tratados o Convenios Internacionales de Derechos Humanos ratificados por Colombia, en especial la Convención sobre los Derechos del Niño, harán parte integral de este código y servirán de guía para su interpretación y", "aplicación.", "Así, dentro de los criterios a utilizar como requisitos habilitantes para las medidas de restricción de derechos, se encuentra el principio de proporcionalidad que es un criterio orientador para el Sistema de Responsabilidad Penal para adolescentes e implica que, en toda medida restrictiva de derechos tanto la fiscalía como la autoridad judicial, deberán tener especial consideración por el principio del interés superior así como las finalidades restaurativas, pedagógicas educativas y atendiendo ello determinarán si la medida restrictiva propuesta es idónea, necesaria y proporcional en sentido estricto frente a las finalidades acotadas y solamente cuando la medida restrictiva supere ese test podrá determinarse su procedencia.", "De manera que, toda medida restrictiva de derechos durante la investigación en el SRPA, solamente se hace procedente una vez superados los requisitos de idoneidad, necesidad y proporcionalidad estricta frente al principio del interés superior del niño y los objetivos pedagógicos, educativos y restaurativos del sistema de justicia penal juvenil."], "parrafo": [0, 1, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Frente a los requisitos habilitantes", "segs": [0], "obj": "libros"}, {"label": "el juez de control de garantías", "segs": [1, 2], "obj": "escudo"}, {"label": "dentro de los criterios a utilizar", "segs": [3], "obj": "escalones"}, {"label": "toda medida restrictiva de derechos durante", "segs": [4], "obj": "lupa"}]}], "rotulo": null, "seccion": "Lección 2. Requisitos habilitantes de las medidas restrictivas de derechos", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Frente a los requisitos habilitantes", "el juez de control de garantías", "dentro de los criterios a utilizar", "toda medida restrictiva de derechos durante"], "titulo_genially": "Requisitos habilitantes de las medidas restrictivas de derechos (1 de 4)", "complemento_genially": "", "apartado": "", "ilustracion": "cuidado-familia.webp", "arte": {"img": "cuidado-familia.webp", "pos": "der"}, "bloques_fuente": [106, 109]}, {"layout": "esquema", "segmentos": ["Al respecto, deberá considerarse que los requisitos generales de procedibilidad de las medidas restrictivas de derechos del Código de Procedimiento Penal también son aplicables y en razón a la especificidad se deberá contar en las audiencias con el concepto del defensor de familia.", "Ahora bien para la procedencia de las medidas restrictivas de derechos durante la investigación penal en el SRPA, debe contarse con un mínimo de sustento probatorio que con fundamento en el artículo 250 de la Constitución Política exige que, “medien suficientes motivos y circunstancias fácticas” requisito que es asimilable al establecido en el artículo 220 del CPP, conforme al cual se desarrolla el concepto de motivos fundados el cual implica que, la ocurrencia del delito investigado tiene como probable autor o partícipe a aquel relacionado con el bien inmueble para el caso de la diligencia de registro y allanamiento, y que de manera general se traduce en la relación entre el autor o partícipe y los hechos jurídicamente relevantes objeto de la investigación, encontrando que el artículo siguiente el 221 establece el respaldo probatorio que deben tener los motivos fundados dentro de los que se destaca: informe de policía judicial, declaración jurada de testigo o informante.", "Respecto del requisito de motivos fundados, este va de la mano con el requisito de inferencia razonable, y así lo dice, Pabón (2019: 134) que desarrolla el concepto de inferencia razonable indicando que esta debe ser construida con base en elementos materiales probatorios, evidencias físicas, o informaciones lícitas y legalmente obtenidas, y frente a su definición indicó: la inferencia razonable es una deducción soportada en elementos materiales, valga decir, es un resultado que se deriva de una suposición hipotética fundamentada en elementos fácticos.", "Los restantes requisitos deberán seguir las reglas del Sistema Penal Acusatorio, con una protección reforzada frente a los derechos constitucionales de los adolescentes infractores de la Ley penal, fundamentado ello en el artículo 44 constitucional, así como en el artículo 6 del Código de la Infancia y la Adolescencia y la aplicación consecuente del bloque de constitucionalidad."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Al respecto, deberá considerarse", "segs": [0], "obj": "libros"}, {"label": "La procedencia de las medidas restrictivas", "segs": [1], "obj": "lupa"}, {"label": "Respecto del requisito de motivos fundados", "segs": [2], "obj": "expediente"}, {"label": "Los restantes requisitos deberán seguir", "segs": [3], "obj": "escudo"}]}], "rotulo": null, "seccion": "Lección 2. Requisitos habilitantes de las medidas restrictivas de derechos", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Al respecto, deberá considerarse", "La procedencia de las medidas restrictivas", "Respecto del requisito de motivos fundados", "Los restantes requisitos deberán seguir"], "titulo_genially": "Requisitos habilitantes de las medidas restrictivas de derechos (2 de 4)", "complemento_genially": "", "apartado": "", "objeto_raiz": "libros", "bloques_fuente": [110, 113]}, {"layout": "caso", "segmentos": ["Pregunta Final de la lección: ¿Para qué delitos del SRPA es procedente la orden de registro y allanamiento y qué controles debe tener?"], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "caso", "roles": {"titulo": "", "parrafos": [0]}, "obj": "documento", "items": [], "encabezado": "Bitácora de reflexión", "nombre": "Lección 2. Requisitos habilitantes de las medidas restrictivas de derechos"}], "rotulo": null, "seccion": "Lección 2. Requisitos habilitantes de las medidas restrictivas de derechos", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Actividad de escritura: el caso, la consigna y el espacio para responder.", "rotulos": ["Requisitos habilitantes de las medidas restrictivas de derechos"], "titulo_genially": "Requisitos habilitantes de las medidas restrictivas de derechos (3 de 4)", "complemento_genially": "", "apartado": "", "relleno": "camino-proteccion.webp", "bloques_fuente": [114, 114]}, {"layout": "fichas", "segmentos": ["Respuesta: Con fundamento en lo visto en la unidad, se encuentra que para la expedición de la orden de registro y allanamiento así como la emisión de las demás órdenes de actos de investigación en el Sistema de Responsabilidad Penal para Adolescente, en tanto los actos de investigación no están desarrollados por la Ley 1098 de 2006, deberán seguirse las mismas reglas establecidas en el Código de Procedimiento Penal de adultos Ley 906 de 2004, en virtud a la remisión normativa que contempla el artículo 144 del Código de la Infancia y la Adolescencia.", "En consecuencia, se seguirán las mismas reglas relativas a las actuaciones de policía judicial que no requieren orden previa, las actuaciones del fiscal que no requieren autorización judicial previa y las actuaciones que requieren control judicial previo y posterior, para todos los casos y en todos los delitos.", "Así como ejemplo, para el caso de los registros y allanamientos, se trata de una diligencia que conforme al artículo 219 y subsiguientes de la Ley 906 de 2004 requiere orden del fiscal pero no requiere orden previa del juez de control de garantías, tan solo requiere el control posterior del juez de control de garantías, sin embargo tal y como sucede en el Sistema Penal Acusatorio de adultos, cuando la diligencia de registro y allanamiento tiene como finalidad la captura del indiciado en ese caso si se requiere un control previo del juez de control de garantías, escenarios en los que se debe orientar su contenido a los delitos por los cuales es procedente la privación de la libertad en el Sistema de Responsabilidad Penal para Adolescentes conforme al artículo 187 del Código de la Infancia y la Adolescencia.", "Concordante con ello, en la audiencia de control de legalidad ante el Juez de Control de Garantías, el fiscal delegado deberá fundamentar los motivos fundados de procedencia y sus soportes, la urgencia de la medida frente a la finalidad de encontrar elementos materiales probatorios de interés para la investigación o conseguir la captura del indiciado. Así mismo se deberá fundamentar el juicio estricto de proporcionalidad, frente a este punto Londoño C (2019: 414) ha señalado “La medida que se haya de imponer al sujeto penable debe pasar el examen de idoneidad, necesidad y proporcionalidad en sentido estricto que determinarán si la medida que se pretenda imponer es o no proporcional, es decir si resulta constitucional o ilegitima por contrariar la axiología de la norma fundamental.”", "Así deberá recordarse los elementos del Juicio Estricto de Proporcionalidad que corresponden a idoneidad: adecuación o utilidad al fin propuesto (en este caso frente al acto de investigación restrictivo de derechos) necesidad: de intervención mínima o subsidiariedad que implica buscar si existen medidas menos restrictivas de derechos y escoger aquella menos restrictiva que permita alcanzar la misma finalidad, y proporcionalidad estricta: la que conlleva la realización de un balanceo o ponderación entre los derechos en conflicto escogiendo aquella medida que deba prevalecer frente a la restricción de derechos planteada, esta implica según Londoño C (2019: 480) armonizar o establecer un orden de preferencia o paritario entre los bienes o valores implicados en el caso concreto."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Respuesta", "segs": [0], "obj": "casa"}, {"label": "se seguirán las mismas reglas relativas", "segs": [1], "obj": "tribunal"}, {"label": "como ejemplo, para el caso", "segs": [2], "obj": "libros"}, {"label": "Concordante con ello", "segs": [3], "obj": "puertaCerrada"}, {"label": "deberá recordarse los elementos del Juicio", "segs": [4], "obj": "lupa"}]}], "rotulo": null, "seccion": "Lección 2. Requisitos habilitantes de las medidas restrictivas de derechos", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Respuesta", "se seguirán las mismas reglas relativas", "como ejemplo, para el caso", "Concordante con ello", "deberá recordarse los elementos del Juicio"], "titulo_genially": "Requisitos habilitantes de las medidas restrictivas de derechos (4 de 4)", "complemento_genially": "", "apartado": "", "ilustracion": "camino-proteccion.webp", "bloques_fuente": [115, 118]}]}</script>
