onstitucional de Derecho, pues desde un punto de vista histórico, doctrinal y jurisprudencial, así se ha comprendido la protección de derechos fundamentales ya que existe un consenso generalizado en el discurso, la teoría y la jurisprudencia de protección de los derechos y las garantías de todas personas, incluyendo por supuesto a los adolescentes."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "El punto de partida", "segs": [0], "obj": "reloj"}, {"label": "En otras palabras, merecen sanción educativa", "segs": [1], "obj": "libros"}, {"label": "Lo anterior por cuanto la sanción", "segs": [2], "obj": "puertaAbierta"}, {"label": "El principio de antijuridicidad material", "segs": [3], "obj": "escudo"}]}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": "El principio de antijuridicidad material", "titulos_fuente": ["Fase de Conceptualización abstracta", "El principio de antijuridicidad material"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["El punto de partida", "En otras palabras, merecen sanción educativa", "Lo anterior por cuanto la sanción", "El principio de antijuridicidad material"], "titulo_genially": "El principio de antijuridicidad material (1 de 2)", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "bloques_fuente": [407, 410]}, {"layout": "esquema", "segmentos": ["Es necesario aclarar que en la doctrina y la jurisprudencia hay diversas formas de comprender los conceptos de antijuridicidad, lesividad u ofensividad. Para Ferrajoli, por ejemplo, es posible articular el principio de ofensividad en dos subprincipios: el de ofensividad en abstracto, que podría anclarse a la Constitución mediante una formulación del tipo “nadie puede ser castigado por un hecho que no ofenda bienes jurídicos de relevancia constitucional”; y el de ofensividad en concreto, con el cual se podría establecer que “nadie puede ser castigado por un hecho que, aun correspondiendo a un tipo normativo de delito, no produzca en concreto, al bien por éste protegido, ningún daño o peligro”. El primer principio, al consistir en una norma dirigida al legislador, debería formularse en la Constitución. El segundo, al ser una norma dirigida a los jueces, podría perfectamente ser previsto por una ley común.", "En ambos casos, este principio tiene la forma, que es propia de todas las garantías, de límite o conditio sine qua non de la intervención penal o de la imposición de una sanción pedagógica a los adolescentes."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Es necesario aclarar", "segs": [0], "obj": "libros"}, {"label": "En ambos casos, este principio tiene", "segs": [1], "obj": "escudo"}]}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": "El principio de antijuridicidad material", "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Es necesario aclarar", "En ambos casos, este principio tiene"], "titulo_genially": "El principio de antijuridicidad material (2 de 2)", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "objeto_raiz": "libros", "bloques_fuente": [411, 411]}, {"layout": "giro", "segmentos": ["La antijuridicidad no es un principio con expresa regulación constitucional, sin embargo, esta Corporación ha establecido que guarda una íntima conexión con el principio de proporcionalidad o “prohibición de exceso” el cual se deduce jurisprudencialmente de los postulados de Estado Social de Derecho, la dignidad humana, la efectividad de los principios, derechos y deberes consagrados en la Constitución, los derechos inalienables de la personal, prohibición de la pena de muerte y de tratos o penas crueles, inhumanos o degradantes, el principio de igualdad y de la proporcionalidad de las medidas excepcionales.", "Conforme a lo anterior, la responsabilidad de los particulares por la infracción a las leyes, especialmente las penales, requiere la verificación de un daño efectivo a los bienes jurídicos protegidos y no la simple valoración de una intención que se juzga lesiva, solo esta última condición justifica la restricción de los derechos y libertades, que gozan igualmente de protección constitucional.", "En síntesis, aunque la antijuridicidad no tiene rango de principio constitucional, guarda una estrecha relación con el principio de proporcionalidad, puesto que solo la protección de bienes jurídicos realmente amenazados justifica la restricción de derechos fundamentales como la libertad personal. (Corte Constitucional, 2016, C-181)", "De lo anterior se infiere la necesidad de comprender los cambios planteados desde la concepción constitucional y la legal con relación al daño en las conductas tipificadas como delito. Lamentablemente hoy es común la demanda de castigo por conductas que no tienen relevancia por ausencia de daño, por la sola infracción de deber o lo que está de moda pero que genera un amplio debate, por la necesidad de mantener la vigencia de la norma."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "La antijuridicidad no es un principio", "segs": [0], "obj": "libros"}, {"label": "Conforme a lo anterior, la responsabilidad", "segs": [1], "obj": "puertaAbierta"}, {"label": "aunque la antijuridicidad no tiene rango", "segs": [2], "obj": "escudo"}, {"label": "De lo anterior se infiere", "segs": [3], "obj": "reloj"}]}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": "La Corte Constitucional ha desarrollado el siguiente planteamiento constitucional sobre el tema:", "titulos_fuente": ["Fase de Conceptualización abstracta", "La Corte Constitucional ha desarrollado el siguiente planteamiento constitucional sobre el tema:"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["La antijuridicidad no es un principio", "Conforme a lo anterior, la responsabilidad", "aunque la antijuridicidad no tiene rango", "De lo anterior se infiere"], "titulo_genially": "La Corte Constitucional ha desarrollado el siguiente planteamiento constitucional sobre el tema:", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "bloques_fuente": [413, 416]}, {"layout": "puntos", "segmentos": ["Como se ha venido insistiendo en este trabajo, toda conducta del adolescente debe ser típica y antijurídica, esto es, que sea un injusto material. Una vez se configura el injusto material, se habilita el juicio de culpabilidad que, en materia de adolescentes por su carácter especial, diferenciado y de protección especial, deber cumplir con unas características también especiales y diferenciadas, esto es, el juicio de culpabilidad no puede ser solo juicio de reproche como exigibilidad de un comportamiento ajustado a derecho, de conciencia de la antijuridicidad, y de la capacidad de comprensión del injusto y de determinarse de acuerdo con esa comprensión.", "La culpabilidad también implica valorar esa exigibilidad de comportarse conforme al derecho bajo las condiciones en las que está el adolescente en particular y las condiciones de realización del injusto, de manera que aquellas circunstancias externas que le llevaron a cometer el hecho o que influyeron en el mismo, sean valoradas a su favor en virtud del principio de corresponsabilidad.", "La corresponsabilidad como principio del sistema de responsabilidad penal para adolescentes y como criterio diferenciador y especial de la valoración de la culpabilidad como categoría del delito, implica que si el Estado, la Sociedad y la Familia no le aportaron las condiciones mínimas para desempeñarse adecuadamente conforme a la norma, no le pueden exigir posteriormente al adolescente un comportamiento ajustado a derecho y a las expectativas normativas, pues no se ha cumplido con el deber de corresponsabilidad derivado de la Convención.", "Si quienes son garantes de las condiciones mínimas de existencia del adolescente no han cumplido con su mandato constitucional, no estarían legitimados para demandar un comportamiento diverso. En este sentido, el juicio de reproche debe tener en cuenta estas condiciones y restarlas del juicio de reproche personal al adolescente.", "Recapitulando, el contenido de la culpabilidad como categoría del delito del adolescente debe atender a criterios de corresponsabilidad, de legitimidad del poder punitivo para sancionar y del interés superior del joven en conflicto con la ley, de lo contrario la medida, aunque se diga pedagógica, es ilegítima en el marco del bloque de constitucionalidad y en el Estado Constitucional."], "parrafo": [0, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "Como se ha venido insistiendo", "segs": [0, 1], "obj": "escudo"}, {"label": "La corresponsabilidad como principio del sistema", "segs": [2], "obj": "documento"}, {"label": "Si quienes son garantes", "segs": [3], "obj": "personas"}, {"label": "Recapitulando", "segs": [4], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": "La conducta punible en el sistema de responsabilidad penal para adolescentes.", "titulos_fuente": ["Fase de Conceptualización abstracta", "La conducta punible en el sistema de responsabilidad penal para adolescentes."], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["Como se ha venido insistiendo", "La corresponsabilidad como principio del sistema", "Si quienes son garantes", "Recapitulando"], "titulo_genially": "La conducta punible en el sistema de responsabilidad penal para adolescentes. (1 de 2)", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "ilustracion": "construccion-bloques.webp", "bloques_fuente": [418, 421]}, {"layout": "esquema", "segmentos": ["A partir de esta comprensión, en la dogmática penal de la infancia y la adolescencia se materializa la función social de la sanción con un contenido pedagógico concreto, cuya finalidad es proteger y restablecer los derechos de los adolescentes en desarrollo de los principios y valores constitucionalmente reconocidos.", "Para Acuña Vizcaya la sanción pedagógica se debe entender como una unidad diversa de sentido, cuyo contenido material se realiza en cada caso concreto. Agrega el autor, que dicha materialización se realiza con la verificación del restablecimiento y promoción de los derechos, cuya finalidad es que el adolescente adecúe su conducta a las expectativas sociales contenidas en la Constitución Política, tales como la Paz, el respeto a la diversidad, respeto a los derechos fundamentales. Sanción que a todas luces es diversa de la pena del sistema penal de adultos, no solo en su ejecución, sino en su función, pues la sanción del adolescente es pedagógica y su función es de restablecimiento, realización y garantía de derechos. (Acuña, 2008: 19)"], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "A partir de esta comprensión", "segs": [0], "obj": "documento"}, {"label": "Para Acuña Vizcaya la sanción pedagógica", "segs": [1], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": "La conducta punible en el sistema de responsabilidad penal para adolescentes.", "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["A partir de esta comprensión", "Para Acuña Vizcaya la sanción pedagógica"], "titulo_genially": "La conducta punible en el sistema de responsabilidad penal para adolescentes. (2 de 2)", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "ilustracion": "cuidado-familia.webp", "arte": {"img": "cuidado-familia.webp", "pos": "fondo"}, "relleno": "circulo-dialogo.webp", "bloques_fuente": [422, 423]}, {"layout": "fichas", "segmentos": ["De acuerdo con el estatuto penal sustancial, para que una conducta sea punible se requiere sea típica, antijurídica y culpable, leída la norma desde la perspectiva de la infancia y la adolescencia, se tendría que concretar la fórmula de acuerdo con las garantías constitucionales de la infancia y la adolescencia. Para que la conducta del adolescente sea sancionable, en el marco del sistema con una medida pedagógica, educativa y restaurativa o una medida de seguridad orientada pedagógicamente, debe ser una conducta típica (objetiva y subjetivamente), antijurídica en la medida que haya puesto en peligro o lesionado efectivamente un bien jurídico y que la misma se le pueda reprochar en el juico de culpabilidad como categoría del delito. Teniendo en cuenta, además, que la causalidad por sí sola no es suficiente para la imputación jurídica del resultado.", "Al observar la especialidad y diferenciación del sistema de responsabilidad penal para adolescentes, es posible afirmar que la teoría y las categorías del delito deberán leerse con base en esa diferenciación y especialidad, de manera que en este ámbito, sobre la norma rectora de la igualdad de la ley penal, el funcionario judicial tendrá especial consideración cuando se trate de valorar el injusto, la culpabilidad y las consecuencias jurídicas del delito en relación con los menores de edad, sin que ello implique una vulneración de la constitución y sí una aplicación concreta del inciso final del artículo 13 de la Constitución Política.", "Las categorías del delito se deben interpretar y aplicar desde la óptica de los principios de la infancia y la adolescencia que se han venido desarrollando desde la primera lección de este curso."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "De acuerdo con el estatuto penal", "segs": [0], "obj": "escudo"}, {"label": "Al observar la especialidad y diferenciación", "segs": [1], "obj": "personas"}, {"label": "Las categorías del delito", "segs": [2], "obj": "documento"}]}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": "La configuración del injusto del adolescente.", "titulos_fuente": ["Fase de Conceptualización abstracta", "La configuración del injusto del adolescente."], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["De acuerdo con el estatuto penal", "Al observar la especialidad y diferenciación", "Las categorías del delito"], "titulo_genially": "La configuración del injusto del adolescente.", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "ilustracion": "camino-proteccion.webp", "relleno": "circulo-dialogo.webp", "bloques_fuente": [425, 427]}, {"layout": "esquema", "segmentos": ["El principio de legalidad en materia penal implica superar en la práctica de la decisión judicial cualquier asomo de decisión tutelar o retributiva.", "Desde un punto de vista de protección constitucional-material, en nuestro medio el artículo 29 superior establece que nadie puede ser juzgado sino conforme a leyes preexistentes al acto que se le imputa. Este principio desarrollado en el Código Penal a través de la norma rectora relativa al mismo (art., 6), también está relacionado con la tipicidad (art., 10), según la cual, en la ley penal se definen de manera inequívoca, expresa y clara las características básicas estructurales del tipo penal, de manera que la ley penal debe ser previa, escrita de forma clara y expresa.", "Todo lo anterior implica identificar en la aplicación del código penal a las conductas de los adolescentes la función de garantía del tipo penal. El tipo penal tiene la función de describir en forma objetiva la ejecución de una acción prohibida como expresión de la exigencia del principio nulla poena sine lege, de manera que el destinatario, en este caso el adolescente, tenga la posibilidad de un conocimiento previo de si su conducta es punible o no, si lo es, de qué delito se le puede hacer responsable y si su acto tiene que ver o no con la fórmula descriptiva usada en el presupuesto de hecho.", "Una conducta, por acción o por omisión, debe ser analizada desde la óptica del tipo complejo, esto es, una conducta típica, objetiva y subjetivamente. Luego de lo cual, si es típica, puede ser antijurídica pero no necesariamente y la constatación de la antijuridicidad es una constatación también material."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "El principio de legalidad en materia", "segs": [0], "obj": "documento"}, {"label": "Desde un punto de vista", "segs": [1], "obj": "libros"}, {"label": "Todo lo anterior", "segs": [2], "obj": "escudo"}, {"label": "Una conducta, por acción", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": "La tipicidad en el sistema de responsabilidad penal para adolescentes", "titulos_fuente": ["Fase de Conceptualización abstracta", "La tipicidad en el sistema de responsabilidad penal para adolescentes"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["El principio de legalidad en materia", "Desde un punto de vista", "Todo lo anterior", "Una conducta, por acción"], "titulo_genially": "La tipicidad en el sistema de responsabilidad penal para adolescentes (1 de 2)", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "relleno": "construccion-bloques.webp", "objeto_raiz": "escudo", "bloques_fuente": [429, 432]}, {"layout": "fichas", "segmentos": ["El análisis escalonado de la conducta punible requiere de esta manera un análisis material de tipicidad. La conducta realizada se debe adecuar a las exigencias materiales definidas en la descripción objetiva del tipo penal, esto es, en los elementos que conforman el precepto definido en la parte especial del código como tipo objetivo.", "Luego de lo cual, se debe observar que cumpla con las exigencias del tipo subjetivo, esto es, que la conducta se haya realizado a título doloso o que, no siendo dolosa, exista norma expresa para ese delito en particular que acepte expresamente la modalidad culposa o preterintencional.", "De acuerdo con el código penal actual, aplicable a las conductas de los adolescentes, se entiende que se actúa con error de tipo cuando se obra con error invencible de que no concurre en su conducta un hecho constitutivo en la descripción típica y “se concreta cuando el sujeto activo de la acción ignora que su comportamiento se adecúa a un tipo penal y excluye el dolo porque afecta su aspecto cognitivo, incidiendo así en la responsabilidad”.", "Como se observa, uno de los factores a considerar siempre en la valoración del tipo subjetivo, es el error del adolescente, pues de allí se deriva si se puede reconocer un error de tipo o no.", "En resumen, la conducta típica, debe ser antijurídica para que sea un injusto, no toda conducta que es típica necesariamente es antijurídica, de manera que la tipicidad es un indicio de antijuridicidad."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "El análisis escalonado de la conducta", "segs": [0], "obj": "libros"}, {"label": "cumpla con las exigencias del tipo subjetivo", "segs": [1], "obj": "documento"}, {"label": "De acuerdo con el código penal", "segs": [2], "obj": "personas"}, {"label": "uno de los factores a considerar", "segs": [3], "obj": "carpetas"}, {"label": "la conducta típica, debe ser antijurídica", "segs": [4], "obj": "lupa"}]}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": "La tipicidad en el sistema de responsabilidad penal para adolescentes", "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["El análisis escalonado de la conducta", "cumpla con las exigencias del tipo subjetivo", "De acuerdo con el código penal", "uno de los factores a considerar", "la conducta típica, debe ser antijurídica"], "titulo_genially": "La tipicidad en el sistema de responsabilidad penal para adolescentes (2 de 2)", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "bloques_fuente": [433, 437]}, {"layout": "puntos", "segmentos": ["Uno de los debates contemporáneos está relacionado con las funciones del derecho penal, de una parte, se dice que el derecho penal tiene como función la protección de bienes jurídicos, de otra parte, se ha planteado que su función es mantener la vigencia de la norma.", "Al margen de dicho debate, en el código penal colombiano se establece una concepción de antijuridicidad material, razón por la cual, en materia de infancia y adolescencia la sanción pedagógica sería legítima solo si la conducta del adolescente implica una lesión o puesta en peligro efectiva de un bien jurídico tutelado. Al adolescente no se le podría sancionar solo por faltar a las expectativas normativas de comportamiento o a la no asunción de un rol social asignado, pues apenas está en proceso de formación y adaptación a esas normas de comportamiento.", "En este sentido, en el marco del sistema de responsabilidad penal para adolescentes se impone una concepción constitucional material, según la cual, la valoración de la antijuridicidad como categoría del delito no es la simple constatación de circunstancias de ausencia de responsabilidad penal e incluye, en cambio, la constatación de un daño o puesta efectiva en peligro del bien jurídico tutelado en cada caso particular.", "Para el efecto, uno de los planteamientos más claros se puede resumir de la siguiente manera: “La antijuridicidad consiste en un juicio negativo de valor que recae sobre una conducta que lesiona o atenta seriamente en contra de los bienes jurídicos indispensables para la subsistencia humana”. (Araque, 2016: 266)"], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "Uno de los debates contemporáneos", "segs": [0], "obj": "reloj"}, {"label": "Al margen de dicho debate", "segs": [1], "obj": "libros"}, {"label": "Una concepción constitucional material", "segs": [2], "obj": "documento"}, {"label": "Para el efecto, uno", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": "La antijuridicidad material en el sistema de responsabilidad penal para adolescentes", "titulos_fuente": ["Fase de Conceptualización abstracta", "La antijuridicidad material en el sistema de responsabilidad penal para adolescentes"], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["Uno de los debates contemporáneos", "Al margen de dicho debate", "Una concepción constitucional material", "Para el efecto, uno"], "titulo_genially": "La antijuridicidad material en el sistema de responsabilidad penal para adolescentes (1 de 2)", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "ilustracion": "circulo-dialogo.webp", "bloques_fuente": [439, 442]}, {"layout": "esquema", "segmentos": ["Por lo anterior, la compresión material de la antijuridicidad como categoría dogmática del delito niega que se trate de una mera contradicción formal entre la conducta y el ordenamiento jurídico. La antijuridicidad tampoco es una simple constatación de causales de ausencia de responsabilidad, mucho menos, la simple introyección de valores ético-sociales, y no se configura con la simple creación de riesgos o el incumplimiento de roles socialmente asignados, por violación de la expectativa cognitiva de comportamiento conforme a la norma, por infracción de deber o la fiel observancia al derecho. (Araque, 2016: 266)", "El artículo 11 de la ley penal vigente establece que, “para que una conducta típica sea punible se requiere que lesione o ponga efectivamente en peligro, sin justa causa, el bien jurídicamente tutelado por la ley penal”, esto es, se establece como requisito la necesaria concurrencia de antijuridicidad material y antijuridicidad formal de la conducta."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "la compresión material de la antijuridicidad", "segs": [0], "obj": "documento"}, {"label": "El artículo 11 de la ley", "segs": [1], "obj": "escalones"}]}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": "La antijuridicidad material en el sistema de responsabilidad penal para adolescentes", "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["la compresión material de la antijuridicidad", "El artículo 11 de la ley"], "titulo_genially": "La antijuridicidad material en el sistema de responsabilidad penal para adolescentes (2 de 2)", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "objeto_raiz": "documento", "bloques_fuente": [443, 444]}, {"layout": "caso", "segmentos": ["¿Se le pueden imputar delitos de comisión por omisión a los adolescentes?, ¿Cuáles y en qué circunstancias?, ¿Existen delitos que se deban excluir de manera a priori del ámbito de responsabilidad de los adolescentes?."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "caso", "roles": {"titulo": "", "parrafos": [0]}, "obj": "documento", "items": [], "encabezado": "Fase de Conceptualización abstracta", "nombre": "Bitácora de reflexión"}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Actividad de escritura: el caso, la consigna y el espacio para responder.", "rotulos": ["Fase de Conceptualización abstracta"], "titulo_genially": "Fase de Conceptualización abstracta", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "bloques_fuente": [445, 445]}, {"layout": "fichas", "segmentos": ["Como se observó en los apartados anteriores, al adolescente no se le puede imponer una sanción de carácter pedagógico o limitación de derechos por criterios o concepciones de “peligrosidad”, por la necesidad meramente educativa u orientadora y tampoco para tutelar o proteger derechos de los que carece, como sucedía en la concepción bienestarista o meramente tutelar.", "En este sentido, para imponer una sanción, es menester que la conducta del adolescente sea típica (objetiva y subjetivamente), materialmente antijurídica (principio de antijuridicidad), que no esté amparada en una causal de ausencia de responsabilidad, que se haya actuado con culpabilidad y su conducta sea merecedora de una sanción pedagógica. Todo lo cual implica, reconocer la necesidad de la construcción de un concepto de responsabilidad penal del adolescente acorde con la concepción de la doctrina convencional de protección integral constitucionalmente orientada.", "La culpabilidad como categoría dogmática del delito es el último elemento o requisito del delito que habilita la imposición de la sanción pedagógica del adolescente infractor de la ley penal. Dicho sea de paso, que también existe la posibilidad que un adolescente, al momento de la conducta, sea inimputable y que por ello la consecuencia del injusto sea necesariamente diversa a la sanción prevista para el adolescente imputable.", "La culpabilidad se predica del adolescente en concreto, frente a su conducta, sus circunstancias, de manera que el análisis del sujeto en concreto no se puede circunscribir a discutibles y antiguas concepciones de “peligrosidad”, “pandillaje”, “vagancia” o por situación de pobreza, abandono o por la tan nombrada “situación irregular”, pero tampoco a una concepción normativa radical o de mera verificación de su rol social, de manera que la concepción de culpabilidad específica y diferenciada del sistema de responsabilidad penal para adolescentes debe superar estas dos visiones. (Muñoz, 2013: 742)", "En efecto, aunque el código de infancia y adolescencia no prescribe un concepto de responsabilidad penal del adolescente, tampoco plantea un concepto de imputabilidad y mucho menos define la categoría dogmática de culpabilidad, siguiendo el planteamiento de Muñoz Gómez (2013), el sistema de justicia penal juvenil por su carácter especial y diferenciado debe procurar su propio sentido y construir sus propias categorías a partir del contenido material constitucional, de su sistema de reglas y principios y en especial, de las normas derivadas de la concepción de la protección integral, el interés superior del niño, la niña y los adolescentes y por supuesto, la corresponsabilidad como norma rectora y principio del sistema."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Una sanción de carácter pedagógico", "segs": [0], "obj": "documento"}, {"label": "para imponer una sanción, es menester", "segs": [1], "obj": "carpetas"}, {"label": "La culpabilidad como categoría dogmática", "segs": [2], "obj": "escalones"}, {"label": "La culpabilidad se predica del adolescente", "segs": [3], "obj": "lupa"}, {"label": "En efecto, aunque el código", "segs": [4], "obj": "libros"}]}], "rotulo": null, "seccion": "Fase de Concep
