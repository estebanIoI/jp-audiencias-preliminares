<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-srpa", "paleta": {"marino": "#07415C", "teal": "#2E6377", "oxido": "#B55D41", "coral": "#FF6936", "crema": "#FFE1D7", "niebla": "#CAE9E4", "hielo": "#E9F6F4", "celeste": "#CAE9E4", "madera": "#B55D41", "piso": "#CAE9E4", "gris": "#CAE9E4", "amarillo": "#FF6936"}, "anclas": {"construccion-bloques.webp": {"r": 1.2712, "p": [[62, 53], [41, 63], [52, 76], [66, 89]]}, "rompecabezas.webp": {"r": 1.264, "p": [[42, 31], [66, 43], [40, 66], [62, 69]]}, "camino-proteccion.webp": {"r": 1.1335, "p": [[79, 26], [87, 58], [61, 86], [20, 72]]}, "circulo-dialogo.webp": {"r": 1.1524, "p": [[31, 13], [68, 9], [11, 62], [89, 66]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "srpa", "partirComas": true, "bitacora": true, "retro": {"reacciones": ["rompecabezas.webp", "construccion-bloques.webp", "circulo-dialogo.webp"], "frases": ["¿Seguro?", "¡Revisa de nuevo!", "¡Mira otra vez!", "¡Casi!", "¡Un momento!", "¡Vuelve a leer!"], "acierto": ["camino-proteccion.webp", "cuidado-familia.webp"], "rotulo": "Unidad 1 · Lección 1"}, "leccion_rotulo": "Lección 1", "unit": 1, "lesson": 1, "heading": "Lección 1. Sentido de un sistema especial y diferenciado", "scenes": [{"layout": "esquema", "segmentos": ["El ejercicio de la actividad laboral de todo profesional que se desempeñe en el marco de los derechos de la infancia y la adolescencia implica el conocimiento integral y la práctica reflexiva sobre su interpretación y aplicación y, dentro de la aplicación de la Ley 1098 de 2006, conocimiento del tratamiento que se le da a los niños, niñas y adolescentes en el Sistema Penal colombiano.", "El punto de partida implica reflexionar sobre el concepto de niño, niña y adolescente y su diferencia con el concepto que subyacía al derogado Código del Menor.", "Reconozcamos la construcción social e histórica del concepto y comprendamos la diferencia entre la doctrina de la situación irregular y la doctrina de la protección integral como horizontes de aplicación e interpretación práctica.", "Pues bien, partamos del hecho, según el cual, definir el concepto de niño o niña no deja de ser una situación compleja, históricamente la concepción que se ha tenido de los niños, las niñas y los adolescentes ha sido diversa dependiendo del concepto construido en un momento histórico dado y con base en él ha fluctuado el tratamiento legal o social de los niños y las niñas."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "El ejercicio de la actividad laboral", "segs": [0], "obj": "libros"}, {"label": "El punto de partida implica reflexionar", "segs": [1], "obj": "documento"}, {"label": "Reconozcamos la construcción social e histórica", "segs": [2], "obj": "escudo"}, {"label": "Definir el concepto de niño o niña", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": "Punto de partida. ¿Por qué debemos hablar de Niños, Niñas y Adolescentes, de infancia, de adolescencia y no de menores?", "titulos_fuente": ["Fase de Conceptualización abstracta", "Punto de partida. ¿Por qué debemos hablar de Niños, Niñas y Adolescentes, de infancia, de adolescencia y no de menores?"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["El ejercicio de la actividad laboral", "El punto de partida implica reflexionar", "Reconozcamos la construcción social e histórica", "Definir el concepto de niño o niña"], "titulo_genially": "Punto de partida. ¿Por qué debemos hablar de Niños, Niñas y Adolescentes, de infancia, de adolescencia y no de menores? (1 de 6)", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "ilustracion": "construccion-bloques.webp", "arte": {"img": "construccion-bloques.webp", "pos": "fondo"}, "relleno": "camino-proteccion.webp", "bloques_fuente": [86, 89]}, {"layout": "giro", "segmentos": ["El concepto de niño y niña es una noción socialmente construida (Aries, 1987), razón por la cual no se puede considerar como una categoría ontológica, pues constituye el resultado de un complejo proceso de construcción social, cuyos orígenes se remontan al siglo XVII (García Méndez, 1998). Para Aries, en la Edad Media las sociedades no podían representarse a los niños y niñas, muchísimo menos pensarlos como sujetos sociales. Se era niño y niña mientras se mantuviera una dependencia física con la encargada de la crianza, luego se ingresaba al mundo adulto. En ese tiempo no había cabida para los niños y niñas; lo anterior, no implica un desprecio por ellos y ellas, sino una indistinción con la sociedad de los adultos.", "Posteriormente la niñez, toma la forma del “mimoseo”, es decir, en las familias más selectas se consideraba como la primera etapa donde los niños y las niñas no eran sujetos, sino que se constituían en un objeto para la recreación de los adultos, a través de sus actos graciosos de aprendizaje y socialización. A finales del siglo XVIII aparece la escuela como un medio de educación bajo el modelo del aislamiento; este aspecto refleja la cultura del internamiento, según la cual, para cada problema social se utilizaba una institución cerrada que modificara el comportamiento del niño y lo adecuara a los estándares sociales de comportamientos válidos y aceptados socialmente, en cuyo contexto se buscaba adecuar o moldear la subjetividad del niño o la niña a los comportamientos aceptados.", "En el siglo XIX y hasta mediados del XX, el concepto de niño se relacionó con la noción de menor, estableciendo una dicotomía entre estas dos nociones: por niños y niñas se entendió todo aquel que contaba con las condiciones básicas de desarrollo (familia, escuela y salud), y por menor aquel que no gozaba de ellas y por ende se encontraba en una “situación irregular” y era potencialmente un delincuente; en ese sentido, el menor se convertía en “objeto” de cuidado, objeto de protección de las políticas legislativas.", "El concepto de menor se asocia al peligro que representa para la sociedad un menor de edad que está en situación irregular y por lo tanto debe ser institucionalizado como primera opción de protección."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "El concepto de niño y niña", "segs": [0], "obj": "documento"}, {"label": "Posteriormente la niñez, toma la forma", "segs": [1], "obj": "escalones"}, {"label": "En el siglo XIX", "segs": [2], "obj": "corazon"}, {"label": "El concepto de menor se asocia", "segs": [3], "obj": "escudo"}]}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": "Punto de partida. ¿Por qué debemos hablar de Niños, Niñas y Adolescentes, de infancia, de adolescencia y no de menores?", "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["El concepto de niño y niña", "Posteriormente la niñez, toma la forma", "En el siglo XIX", "El concepto de menor se asocia"], "titulo_genially": "Punto de partida. ¿Por qué debemos hablar de Niños, Niñas y Adolescentes, de infancia, de adolescencia y no de menores? (2 de 6)", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "bloques_fuente": [90, 93]}, {"layout": "fichas", "segmentos": ["Antes de la Ley de Infancia y Adolescencia el concepto de menor se utilizaba como sinónimo de niños, niñas y adolescentes por parte de las autoridades, pero con una orientación peyorativa de quien no tenía condiciones “normales” de vida. En los desarrollos constitucionales actuales, todos estos conceptos hacen parte de la misma categoría de niñez hasta los 18 años y se prefiere no usar el término de menor.", "A manera de ejemplo, en Argentina se promulgó la Ley Agote, oficialmente Ley Nacional 10.903 o Ley de Patronato de menores, sancionada en 1919 e impulsada por el médico y político Luis Agote, esta es considerada la primera legislación específica sobre la minoridad en América Latina, su objetivo declarado era la protección y educación de los niños en situación de vulnerabilidad, pero en la práctica consolidó un modelo de control estatal sobre la infancia pobre.", "Estas concepciones de menor perduraron por largo tiempo, y con base en ellas germinó y se desarrolló la doctrina de la “situación irregular”, hasta que se proclama la concepción de los niños y las niñas como sujetos de derechos. La superación del niño como objeto de tratamiento es resultado de un largo proceso que parte de la Declaración Universal de los Derechos Humanos de 1948 que considera a todos los seres humanos – sin excluir a los niños y las niñas- como personas; continúa con la Declaración de los Derechos del Niño de 1958 y tiene su punto de no retorno en la Convención Internacional de los Derechos del Niño en 1989, en donde se les declara sujetos de plenos de derechos (García Méndez, 1998)", "La Convención Internacional de los Derechos del Niño en 1989 fue adoptada por la Asamblea General de las Naciones Unidas en resolución No. 4425 del 20 de noviembre de 1989 la cual entró en vigor el 2 de septiembre de 1990. Para Colombia su vigencia es a partir del 28 de enero de 1991 en virtud de la Ley 12 del mismo año."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Antes de la Ley de Infancia", "segs": [0], "obj": "reloj"}, {"label": "A manera de ejemplo, en Argentina", "segs": [1], "obj": "escudo"}, {"label": "La doctrina de la “situación irregular”", "segs": [2], "obj": "libros"}, {"label": "Convención Internacional de los Derechos", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": "Punto de partida. ¿Por qué debemos hablar de Niños, Niñas y Adolescentes, de infancia, de adolescencia y no de menores?", "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Antes de la Ley de Infancia", "A manera de ejemplo, en Argentina", "La doctrina de la “situación irregular”", "Convención Internacional de los Derechos"], "titulo_genially": "Punto de partida. ¿Por qué debemos hablar de Niños, Niñas y Adolescentes, de infancia, de adolescencia y no de menores? (3 de 6)", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "bloques_fuente": [94, 97]}, {"layout": "puntos", "segmentos": ["Como categoría normativa, el concepto de niño ha sido muy polémico; en la actualidad no existe duda de lo que se entiende por niños, conforme a la Convención Internacional de los Derechos del Niño de 1989, cuando en su artículo primero expresa “…se entiende por niño todo ser humano menor de dieciocho años de edad, salvo que, en virtud de la Ley que le sea aplicable, haya alcanzado antes la mayoría de edad”.", "Es importante destacar que la Convención establece este criterio cuantitativo, para definir al niño por dos aspectos importantes: primero porque comprende el tránsito de la niñez a la etapa adulta como un proceso en el cual no hay una ruptura fácilmente delimitable y de aplicación universal. Segundo, porque desde una interpretación adecuada de ella, fácilmente se concluye que desde el punto de vista cualitativo, los niños son personas y como tales son titulares como mínimo de los mismos derechos de los adultos, solo que ejercen esos derechos conforme al ciclo vital en el que se encuentran y son de rango privilegiado. Los niños y las niñas gozan de una súper protección o protección complementaria de sus derechos, que no es autónoma sino fundada en la protección jurídica general (Cillero Bruñol, 2001).", "La Constitución colombiana coincide con la Convención, al declarar la mayoría de edad a los 18 años; en este sentido, el artículo 3 del Código de la Infancia y Adolescencia (Ley 1098 de 2006) establece que, “Para todos los efectos de esta ley son sujetos titulares de derechos todas las personas menores de 18 años. Sin perjuicio de lo establecido en el artículo 34 del Código Civil, se entiende por niño o niña las personas entre los 0 y los 12 años, y por adolescente las personas entre 12 y 18 años de edad”.", "Dentro del concepto de sujetos de derechos prevalentes, los niños y las niñas son incluidos en la ciudadanía, con participación en la comunidad estatal y en los otros entes políticos territoriales, de ahí que el artículo 45 de la Constitución consagre el derecho de los adolescentes a la participación en organismos públicos encargados de adoptar y desarrollar políticas públicas de orden social, económico, educativo y familiar relacionadas con la juventud. En esta misma línea, la adolescencia es parte del concepto de niñez, en tanto el rango de edad incluye este periodo de desarrollo psicológico y social, puede identificarse como aquella etapa en que empiezan los cambios físicos de maduración sexual (12 años aproximadamente), y se prolonga hasta más allá de los 18 años de edad; sin embargo, para efectos legales el legislador ha previsto los 18 años para determinar la mayoría de edad."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "Como categoría normativa, el concepto", "segs": [0], "obj": "reloj"}, {"label": "Es importante destacar que la Convención", "segs": [1], "obj": "escalones"}, {"label": "La Constitución colombiana coincide", "segs": [2], "obj": "libros"}, {"label": "Dentro del concepto de sujetos", "segs": [3], "obj": "personas"}]}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": "Punto de partida. ¿Por qué debemos hablar de Niños, Niñas y Adolescentes, de infancia, de adolescencia y no de menores?", "titulos_fuente": [], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["Como categoría normativa, el concepto", "Es importante destacar que la Convención", "La Constitución colombiana coincide", "Dentro del concepto de sujetos"], "titulo_genially": "Punto de partida. ¿Por qué debemos hablar de Niños, Niñas y Adolescentes, de infancia, de adolescencia y no de menores? (4 de 6)", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "ilustracion": "camino-proteccion.webp", "bloques_fuente": [98, 101]}, {"layout": "esquema", "segmentos": ["Desde el punto de vista de la Constitución, los niños, las niñas y los adolescentes son sujetos de derechos constitucionales fundamentales, de protección especial prevalente, de protección reforzada y sujetos de restablecimiento de derechos.", "En la Carta Política, se les ha denominado indistintamente como niños, adolescentes y menores, sin que normativamente se precise su significado y la diferencia que comporta cada una de estas voces, por lo que hoy se deben entender como sinónimos y de igual tratamiento constitucional.", "La Corte Constitucional en la Sentencia C-170 de 2004, estableció que los conceptos de “adolescentes” y “niños” son sinónimos en Colombia, en cuanto no existe un contenido normativo que distinga dichas nociones y se asimiló la palabra “adolescentes”, a todos los niños que se encuentran en etapa de escolaridad, frente a los cuales es predicable un mayor grado de capacidad, autonomía y madurez, principalmente, para la participación activa en las decisiones que les conciernen. En la sentencia C-228 de 2008, estableció: “En relación con la protección constitucional a los adolescentes, la Corte ha considerado que ellos están comprendidos en el concepto de “niños” (…) y por tanto gozan de protección especial por parte de la familia, la sociedad y el Estado y son titulares de los derechos fundamentales en él consagrados, que prevalecen sobre los derechos de los demás.", "En este sentido ha señalado que la distinción constitucional entre niños y adolescentes no tiene como finalidad otorgar a estos últimos distinta protección, sino otorgarles participación en los organismos públicos y privados que adopten decisiones que les conciernen, teniendo en cuenta su mayor grado de desarrollo”."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Desde el punto de vista", "segs": [0], "obj": "escudo"}, {"label": "En la Carta Política", "segs": [1], "obj": "documento"}, {"label": "Sentencia C-170 de 2004", "segs": [2], "obj": "libros"}, {"label": "La distinción constitucional entre niños y adolescentes", "segs": [3], "obj": "escalones"}]}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": "Punto de partida. ¿Por qué debemos hablar de Niños, Niñas y Adolescentes, de infancia, de adolescencia y no de menores?", "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Desde el punto de vista", "En la Carta Política", "Sentencia C-170 de 2004", "La distinción constitucional entre niños y adolescentes"], "titulo_genially": "Punto de partida. ¿Por qué debemos hablar de Niños, Niñas y Adolescentes, de infancia, de adolescencia y no de menores? (5 de 6)", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "ilustracion": "cuidado-familia.webp", "arte": {"img": "cuidado-familia.webp", "pos": "izq"}, "bloques_fuente": [102, 104]}, {"layout": "fichas", "segmentos": ["Si bien el concepto de adolescente ha sido de difícil definición (Sentencia: C-092, 2002), la Corte Constitucional ha indicado que la distinción entre niño y adolescente no está desarrollada para efectos de la prevalencia de sus derechos, sino de la participación, por lo que la protección especial otorgada a la niñez, también lo es para los adolescentes, al considerar que todo ser humano menor de 18 años es niño o niña. Así, la máxima intérprete de la Carta Fundamental expuso que “…los adolescentes (…) gozan de los mismos privilegios y derechos fundamentales que los niños y las niñas, (siempre y cuando no hayan cumplido los 18 años)\". En consecuencia, la protección constitucional estatuida en el artículo 44 de la Ley Fundamental a favor de los \"niños\" ha de entenderse referida a todo menor de dieciocho años.”.", "La Corte Constitucional en la sentencia C-092 de 2002, desarrolla conceptualmente la importancia de los derechos prevalentes del niño, la niña y el adolescente, al punto que con base en esta prevalencia de derechos, la Corte modificó la interpretación del régimen de prelación de créditos en el caso de las acreencias por alimentos en favor de esta población de especial protección constitucional."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Si bien el concepto de adolescente", "segs": [0], "obj": "libros"}, {"label": "La Corte Constitucional en la sentencia", "segs": [1], "obj": "escudo"}]}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": "Punto de partida. ¿Por qué debemos hablar de Niños, Niñas y Adolescentes, de infancia, de adolescencia y no de menores?", "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Si bien el concepto de adolescente", "La Corte Constitucional en la sentencia"], "titulo_genially": "Punto de partida. ¿Por qué debemos hablar de Niños, Niñas y Adolescentes, de infancia, de adolescencia y no de menores? (6 de 6)", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "ilustracion": "circulo-dialogo.webp", "bloques_fuente": [105, 106]}, {"layout": "caso", "segmentos": ["¿Cuál cree usted que es la principal consecuencia práctica de que se considere a un menor de edad como menor y no como sujeto de derechos?"], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "caso", "roles": {"titulo": "", "parrafos": [0]}, "obj": "documento", "items": [], "encabezado": "Fase de Conceptualización abstracta", "nombre": "Bitácora de reflexión"}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Actividad de escritura: el caso, la consigna y el espacio para responder.", "rotulos": ["Fase de Conceptualización abstracta"], "titulo_genially": "Fase de Conceptualización abstracta (1 de 6)", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "bloques_fuente": [107, 107]}, {"layout": "giro", "segmentos": ["La distinción planteada, entre situación irregular y protección integral, no es una simple distinción teórica o conceptual sin alcance práctico. Esta distinción ha sido muy importante en el desarrollo histórico de la protección de los derechos de los niños, las niñas y los adolescentes, en este sentido García Méndez plantea que la Convención sobre los Derechos del Niño impuso un cambio en la percepción sobre la infancia que va más allá de los límites del derecho, en la medida que impuso la instauración de una nueva cultura de respeto a los Derechos Humanos de los niños, las niñas y los adolescentes sin distinción alguna, reconociéndolos como auténticos sujetos de derechos que gozan de todos los Derechos Humanos de los adultos, además de una serie de derechos especiales que les corresponde como personas en crecimiento y desarrollo.", "Para el autor citado, este cambio superó la concepción que se tenía y que se denominaba “la situación irregular” y se avanzó hacía una concepción de la “protección integral”. La primera (situación irregular), tenía como características la preponderancia de la acción judicial sobre los “menores” en situación irregular, es decir, aquellos menores desprovistos de condiciones básicas y delincuentes en potencia; no tenía en cuenta las deficiencias de las políticas sociales, y daba más importancia a las soluciones individuales de tipo represivo o administrativo cuyo resultado común era la adopción o el encerramiento en instituciones, la adopción de medidas discrecionales sin políticas sociales definidas, el tratamiento diferenciado a los menores que cometían actos penalmente relevantes con relación a los niños de familias de sectores sociales privilegiados y, en el mejor de los casos, el menor era objeto de protección, objeto de compasión/represión, objeto del derecho (Escalante Barreto, 2018), en este sentido, el menor al ser objeto de algo o de alguien era cosificado y tratado como tal.", "Respecto al concepto de menor y la orientación filosófica del anterior código del menor en Colombia, la doctrina especializada fue crítica de su contenido a pesar de ser posterior a importantes instrumentos internacionales en la materia, en este sentido compartimos la tesis que plantea García (1999; 75-76), según la cual, el código del menor de 1989, a pesar de ser posterior a la Convención y haberse declarado inspirado en ella, en su interior y en la práctica o puesta en acción reproducía los vicios de las viejas legislaciones de menores, por lo que se le acusaba de ser sólo una adecuación formal a los principios de la Convención, representando una “versión elaborada y refinada de la obsoleta doctrina de la “situación irregular”.", "Es por esta razón, por la que se insiste en la necesidad de leer e interpretar la Ley de Infancia y Adolescencia desde una perspectiva constitucional y no desde la antigua óptica del código anterior, sino con nuevos referentes constitucionales y especialmente desde el reconocimiento de los niños, niñas y adolescentes como ciudadanos activos- sujetos de derechos."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "La distinción planteada, entre situación irregular", "segs": [0], "obj": "escudo"}, {"label": "Para el autor citado, este cambio", "segs": [1], "obj": "documento"}, {"label": "Respecto al concepto de menor", "segs": [2], "obj": "libros"}, {"label": "Es por esta razón", "segs": [3], "obj": "personas"}]}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": null, "titulos_fuente": ["Fase de Conceptualización abstracta"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["La distinción planteada, entre situación irregular", "Para el autor citado, este cambio", "Respecto al concepto de menor", "Es por esta razón"], "titulo_genially": "Fase de Conceptualización abstracta (2 de 6)", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "ilustracion": "camino-proteccion.webp", "arte": {"img": "camino-proteccion.webp", "pos": "der"}, "relleno": "cuidado-familia.webp", "bloques_fuente": [108, 110]}, {"layout": "puntos", "segmentos": ["Si en materia penal se habla de la necesidad de que la acción punitiva del Estado sea la última ratio, en materia de infancia y adolescencia esa última ratio está reforzada bajo el entendido de que toda restricción de derechos y limitación de garantías debe hacerse en el marco del proceso penal con todas las garantías y no en el ámbito administrativo.", "La doctrina de la protección integral está orientada al reconocimiento de la infancia y adolescencia en igualdad de condiciones; esto es, los niños, niñas y adolescentes como sujetos plenos de derecho, de derechos fundamentales prevalentes. En esta concepción constitucionalmente orientada, no se hacen distinciones entre niñez y menores, se busca la articulación de políticas públicas para mejorar las condiciones de vida de la infancia y la adolescencia en igualdad de condiciones y se busca la corresponsabilidad en el restablecimiento de sus derechos en caso de ser vulnerados.", "Dicho contexto de diferenciación orienta el marco conceptual para la lectura, aplicación e interpretación que debemos dar a la ley de infancia y adolescencia, el tratamiento de los niños, las niñas y los adolescentes como sujetos de derechos implica, como se verá, el reconocimiento como sujetos que construyen su realidad social y que deben por tanto participar en las decisiones que sobre la misma se deban adoptar, no solo a nivel familiar, sino social y de políticas públicas que versen en el ámbito de sus derechos.", "A pesar del avance de tipo normativo que implica la ley en comento, es necesario adoptar nuevos modelos de interpretación que materialicen y realicen en la práctica las condiciones anunciadas, que den en la cotidianeidad el sentido al concepto de niños y niñas, que supere la vieja concepción del menor como objeto del derecho o de la sociedad."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "Si en materia penal se habla", "segs": [0], "obj": "escudo"}, {"label": "La doctrina de la protección integral", "segs": [1], "obj": "libros"}, {"label": "Contexto de diferenciación", "segs": [2], "obj": "personas"}, {"label": "A pesar del avance de tipo", "segs": [3], "obj": "megafono"}]}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["Si en materia penal se habla", "La doctrina de la protección integral", "Contexto de diferenciación", "A pesar del avance de tipo"], "titulo_genially": "Fase de Conceptualización abstracta (3 de 6)", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "ilustracion": "rompecabezas.webp", "relleno": "cuidado-familia.webp", "bloques_fuente": [111, 114]}, {"layout": "esquema", "segmentos": ["Recapitulando, encontramos en el Código de la Infancia y Adolescencia diversos referentes que permiten identificar que el paradigma de la “situación irregular” debe ser superado en la práctica, no sólo desde el punto de vista formal, sino desde el punto de vista material, es decir, desde la práctica se deben cumplir los derechos de los niños, niñas y adolescentes como sujetos de derecho, su desarrollo y protección integral a través del planteamiento de planes, políticas, programas y acciones que hagan posible su materialización; las normas constitucionales han recuperado el sentido de lo humano en la legislación de la infancia en Colombia al plantear con fuerza normativa y remisión expresa la aplicación preferente de instrumentos y estándares internacionales de Derechos Humanos, en relación con los niños, las niñas y los adolescentes.", "En este orden de ideas, se deben tomar en serio los derechos fundamentales consagrados en la Constitución a favor de esta población de protección especial, cuyo carácter normativo es de aplicación inmediata, igualmente en el contexto del tratamiento de los derechos de la infancia y adolescencia se deben tener en cuenta los tratados o convenios internacionales sobre Derechos Humanos que hacen parte del bloque de constitucionalidad, en especial la Convención sobre los Derechos del Niño y la doctrina de instancias internacionales que desarrollan dichos tratados como herramientas de interpretación.", "En este sentido se debe recordar que en Colombia la Constitución es norma de normas, sus reglas jurídicas tienen fuerza normativa y por tanto se deben aplicar por todos los operadores jurídicos en su actuación cotidiana."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Recapitulando", "segs": [0], "obj": "libros"}, {"label": "Tomar en serio los derechos fundamentales", "segs": [1], "obj": "escudo"}, {"label": "La Constitución es norma de normas", "segs": [2], s": [{"label": "Fuentes normativas principales", "label_seg": 3, "segs": [4, 5], "filas": [[[1, 4], [2, 5]]], "obj": "documento"}, {"label": "Sujeto central y lenguaje", "label_seg": 6, "segs": [7, 8], "filas": [[[1, 7], [2, 8]]], "obj": "personas"}, {"label": "Naturaleza y estatus jurídico", "label_seg": 9, "segs": [10, 11], "filas": [[[1, 10], [2, 11]]], "obj": "carpetas"}, {"label": "Objeto y criterio de intervención", "label_seg": 12, "segs": [13, 14], "filas": [[[1, 13], [2, 14]]], "obj": "lupa"}, {"label": "Rol de la autoridad judicial", "label_seg": 15, "segs": [16, 17], "filas": [[[1, 16], [2, 17]]], "obj": "expediente"}, {"label": "Garantías procesales", "label_seg": 18, "segs": [19, 20], "filas": [[[1, 19], [2, 20]]], "obj": "escudo"}, {"label": "Tratamiento de la pobreza y riesgo", "label_seg": 21, "segs": [22, 23], "filas": [[[1, 22], [2, 23]]], "obj": "libros"}, {"label": "Respuesta al conflicto penal", "label_seg": 24, "segs": [25, 26], "filas": [[[1, 25], [2, 26]]], "obj": "escalones"}, {"label": "Régimen de privación de libertad", "label_seg": 27, "segs": [28, 29], "filas": [[[1, 28], [2, 29]]], "obj": "puertaAbierta"}, {"label": "Modelo de justicia penal", "label_seg": 30, "segs": [31, 32], "filas": [[[1, 31], [2, 32]]], "obj": "expediente"}], "titulo": [0], "dims": [1, 2]}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": "Matriz Comparativa", "titulos_fuente": ["Matriz Comparativa"], "encabezados": [], "mediacion": "Matriz en un eje (comparación en ventana)", "rotulos": ["Fuentes normativas principales", "Sujeto central y lenguaje", "Naturaleza y estatus jurídico", "Objeto y criterio de intervención", "Rol de la autoridad judicial", "Garantías procesales", "Tratamiento de la pobreza y riesgo", "Respuesta al conflicto penal", "Régimen de privación de libertad", "Modelo de justicia penal"], "titulo_genially": "Matriz Comparativa", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "bloques_fuente": [123, 123]}, {"layout": "esquema", "segmentos": ["Como se ha observado hasta el momento, se puede inferir que la doctrina de la protección integral implica que los niños, niñas y adolescentes son responsables de sus conductas, es decir, de sus acciones y, por qué no, de sus omisiones al ser sujetos de derechos.", "Pero su responsabilidad penal está limitada por su condición de persona de especial protección constitucional, por lo tanto, la Ley prevé un sistema especial y diferenciado en consideración a su etapa.", "Síntesis y análisis comparativo exhaustivo: de la doctrina de la situación irregular a la doctrina de la protección integral.", "El tránsito paradigmático en el tratamiento jurídico, político y social de la infancia y la adolescencia en América Latina representa uno de los saltos cualitativos más revolucionarios del derecho contemporáneo. Este proceso de transformación se sintetiza en la transición desde la Doctrina de la Situación Irregular (centrada en la categoría estigmatizante del \"menor\" como objeto de tutela y represión) hacia la Doctrina de la Protección Integral (fundada en el reconocimiento del niño, niña y adolescente como sujeto pleno de derechos y ciudadano).", "Características de los paradigmas dominantes."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Como se ha observado", "segs": [0], "obj": "libros"}, {"label": "Pero su responsabilidad penal está limitada", "segs": [1], "obj": "escudo"}, {"label": "Síntesis y análisis comparativo exhaustivo", "segs": [2], "obj": "lupa"}, {"label": "El tránsito paradigmático en el tratamiento", "segs": [3], "obj": "documento"}, {"label": "Características de los paradigmas dominantes", "segs": [4], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Fase de experimentación activa", "grupo": "Recapitulación", "titulos_fuente": ["Fase de experimentación activa", "Recapitulación"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Como se ha observado", "Pero su responsabilidad penal está limitada", "Síntesis y análisis comparativo exhaustivo", "El tránsito paradigmático en el tratamiento", "Características de los paradigmas dominantes"], "titulo_genially": "Recapitulación", "complemento_genially": "", "apartado": "Fase de experimentación activa", "ilustracion": "cuidado-familia.webp", "arte": {"img": "cuidado-familia.webp", "pos": "fondo"}, "relleno": "camino-proteccion.webp", "bloques_fuente": [126, 130]}, {"layout": "linea", "segmentos": ["La concepción del \"menor\" es una construcción social e histórica gestada entre finales del siglo XIX y principios del XX. Surgió institucionalmente con la creación del primer Tribunal de Menores en Chicago (1899) y se expandió en América Latina a través de normativas como la Ley Agote en Argentina (1919), los códigos de menores tradicionales de la región y, en el caso colombiano, el Decreto 2737 de 1989.", "Dicotomía discriminatoria en la infancia: Este modelo escindió el universo de la infancia en dos categorías antagónicas: por un lado, los \"niños y niñas\", aquellos que contaban con sus necesidades básicas satisfechas en el marco de la familia, la escuela y la salud; por el otro, los \"menores\", concepto reservado de forma peyorativa para los sectores excluidos de la estructura social, escolar y económica.", "El \"menor\" como objeto de protección, compasión y represión: En este esquema, el menor carece de autonomía y de derechos fundamentales ejecutables. No es considerado un ciudadano, sino un \"objeto\" de piedad, asistencia o control por parte del Estado y de la sociedad. Se asume normativamente su incapaz condición bajo una perspectiva \"paternalista\" (\"en nombre del amor\" o de la \"piedad asistencial\").", "Judicialización de la pobreza y confusión de categorías: Se equiparó al menor en \"situación de abandono material o moral\" con el menor \"infractor\" o \"delincuente en potencia\". Al patologizar y criminalizar situaciones de origen social y económico estructural, los tribunales judiciales asumieron el papel de suplir mediante internaciones coactivas e indeterminadas las deficiencias de las políticas sociales básicas. La falta de recursos materiales familiares justificaba la pérdida o suspensión de la patria potestad y el encierro en \"instituciones totales\"."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "linea", "items": [{"label": "La concepción del \"menor\"", "segs": [0], "obj": "libros"}, {"label": "Dicotomía discriminatoria en la infancia", "segs": [1], "obj": "escudo"}, {"label": "El \"menor\" como objeto de protección", "segs": [2], "obj": "documento"}, {"label": "Judicialización de la pobreza y confusión de categorías", "segs": [3], "obj": "tribunal"}]}], "rotulo": null, "seccion": "Fase de experimentación activa", "grupo": "La concepción del \"menor\" y la doctrina de la situación irregular.", "titulos_fuente": ["Fase de experimentación activa", "La concepción del \"menor\" y la doctrina de la situación irregular."], "encabezados": [], "mediacion": "Línea de tiempo: se avanza momento a momento.", "rotulos": ["La concepción del \"menor\"", "Dicotomía discriminatoria en la infancia", "El \"menor\" como objeto de protección", "Judicialización de la pobreza y confusión de categorías"], "titulo_genially": "La concepción del \"menor\" y la doctrina de la situación irregular. (1 de 2)", "complemento_genially": "", "apartado": "Fase de experimentación activa", "relleno": "construccion-bloques.webp", "bloques_fuente": [132, 135]}, {"layout": "puntos", "segmentos": ["Centralización en el juez de menores con potestad omnímoda: La figura central del sistema era el juez de menores, facultado normativamente para actuar como un \"buen padre de familia\". Este juzgador gozaba de una discrecionalidad absoluta y no guiada por el derecho penal, pudiendo \"disponer\" de manera ilimitada de la vida, libertad y destino del menor sin estar sujeto a barreras garantistas.", "Ausencia sustancial de garantías procesales y eufemismos punitivos: Bajo la premisa de que la medida estatal no era una sanción sino una \"acción protectora\" o un \"bien\", el sistema despojó al menor de las garantías constitucionales más elementales (debido proceso, legalidad, presunción de inocencia, contradicción, defensa técnica). A su vez, construyó un lenguaje eufemístico donde la privación de libertad se encubría bajo términos como \"internación\", \"ubicación sustitutiva\", \"medida de protección\" o \"abrigo\". Esto derivó en un binomio de impunidad para los sectores altos y arbitrariedad represiva para los desposeídos."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "Centralización en el juez de menores", "segs": [0], "obj": "puertaAbierta"}, {"label": "Ausencia sustancial de garantías procesales y eufemismos", "segs": [1], "obj": "escudo"}]}], "rotulo": null, "seccion": "Fase de experimentación activa", "grupo": "La concepción del \"menor\" y la doctrina de la situación irregular.", "titulos_fuente": [], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["Centralización en el juez de menores", "Ausencia sustancial de garantías procesales y eufemismos"], "titulo_genially": "La concepción del \"menor\" y la doctrina de la situación irregular. (2 de 2)", "complemento_genially": "", "apartado": "Fase de experimentación activa", "ilustracion": "camino-proteccion.webp", "bloques_fuente": [136, 137]}, {"layout": "giro", "segmentos": ["Se consolida a partir de la ratificación de la Convención Internacional sobre los Derechos del Niño (CDN, 1989) y se complementa con el corpus juris internacional integrado por las Reglas de Beijing (1985), las Directrices de Riad (1990) y las Reglas para Jóvenes Privados de Libertad (1990), cristalizándose a nivel interno en legislaciones como la Ley 1098 de 2006 en Colombia.", "Reconocimiento como sujeto pleno de derechos y ciudadano: Todo ser humano menor de 18 años es reconocido como persona y titular activo de derechos humanos universales, prevalentes, e interdependientes, superando la cosificación tradicional. Goza de la ciudadanía plena en el marco de una \"democracia inclusiva\", ejerciendo sus libertades civiles, políticas, sociales y el derecho a ser escuchado (artículo 12 CDN) según el desarrollo progresivo de sus facultades.", "El interés superior del niño (ISN) como principio garantista y límite al poder: El ISN deja de ser una pauta vaga o paternalista para transformarse en el imperativo jurídico que exige la plena, integral y simultánea satisfacción de todos los derechos fundamentales del niño. Sirve como regla hermenéutica para resolver conflictos normativos, como garantía infranqueable frente a la discrecionalidad de las autoridades estatales y como directriz de prioridad en la formulación de políticas públicas.", "Separación categórica entre problemas sociales y conflictos penales: Se deslinda estrictamente la protección de derechos frente a situaciones de vulneración o pobreza de la respuesta coactiva estatal ante infracciones penales. Las carencias económicas o la desprotección no son \"situaciones irregulares\" del menor, sino omisiones del Estado en sus políticas sociales básicas. Se desjudicializa la asistencia social, la cual se devuelve a la red administrativa y comunitaria."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Ley 1098 de 2006", "segs": [0], "obj": "puertaAbierta"}, {"label": "Reconocimiento como sujeto pleno de derechos y ciudadano", "segs": [1], "obj": "reloj"}, {"label": "El interés superior del niño (ISN)", "segs": [2], "obj": "escudo"}, {"label": "Separación categórica entre problemas sociales y conflictos", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "Fase de experimentación activa", "grupo": "La concepción del Niño, Niña, Adolescente como sujeto de derechos y la doctrina de la protección integral.", "titulos_fuente": ["Fase de experimentación activa", "La concepción del Niño, Niña, Adolescente como sujeto de derechos y la doctrina de la protección integral."], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Ley 1098 de 2006", "Reconocimiento como sujeto pleno de derechos y ciudadano", "El interés superior del niño (ISN)", "Separación categórica entre problemas sociales y conflictos"], "titulo_genially": "La concepción del Niño, Niña, Adolescente como sujeto de derechos y la doctrina de la protección integral. (1 de 2)", "complemento_genially": "", "apartado": "Fase de experimentación activa", "ilustracion": "construccion-bloques.webp", "arte": {"img": "construccion-bloques.webp", "pos": "der"}, "relleno": "rompecabezas.webp", "bloques_fuente": [139, 142]}, {"layout": "fichas", "segmentos": ["Corresponsabilidad tripartita: La atención, cuidado, desarrollo y restablecimiento de los derechos de los niños, niñas y adolescentes es una obligación compartida, solidaria y concurrente entre la Familia, la Sociedad y el Estado.", "Sistema Penal Juvenil Especializado y Garantista (sistema de responsabilidad penal para adolescentes): Ante la comisión de un delito por parte de un adolescente (mayor de 14 y menor de 18 años), no opera la inimputabilidad tutelar o la impunidad, sino un sistema de responsabilidad penal diferenciado y especializado. El adolescente es imputable en un sistema fundado en la dignidad humana y dotado de todas las garantías del debido proceso acusatorio.", "Mínima intervención, excepcionalidad de la privación de libertad y justicia restaurativa: La privación de libertad deja de ser la respuesta por defecto y se convierte en una medida de última ratio, excepcional, breve y sometida a estricta reserva legal. El sistema prioriza las soluciones alternativas al conflicto procesal (principio de oportunidad, remisión, conciliación, mediación) y se estructura bajo un paradigma pedagógico, educativo y restaurativo enfocado en la reparación del daño a la víctima, el aprendizaje del infractor y la resocialización."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Corresponsabilidad tripartita", "segs": [0], "obj": "documento"}, {"label": "Sistema Penal Juvenil Especializado y Garantista", "segs": [1], "obj": "reloj"}, {"label": "Mínima intervención", "segs": [2], "obj": "puertaAbierta"}]}], "rotulo": null, "seccion": "Fase de experimentación activa", "grupo": "La concepción del Niño, Niña, Adolescente como sujeto de derechos y la doctrina de la protección integral.", "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Corresponsabilidad tripartita", "Sistema Penal Juvenil Especializado y Garantista", "Mínima intervención"], "titulo_genially": "La concepción del Niño, Niña, Adolescente como sujeto de derechos y la doctrina de la protección integral. (2 de 2)", "complemento_genially": "", "apartado": "Fase de experimentación activa", "ilustracion": "circulo-dialogo.webp", "relleno": "cuidado-familia.webp", "bloques_fuente": [143, 145]}]}</script>
