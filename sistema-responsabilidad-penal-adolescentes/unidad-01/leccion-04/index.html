: "libros", "acomp": ["escalones", "documento"]}]}], "rotulo": "Fase de Conceptualización abstracta", "seccion": "Fase de Conceptualización abstracta", "grupo": null, "titulos_fuente": ["Fase de Conceptualización abstracta"], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Fase de Conceptualización abstracta"], "titulo_genially": "Fase de Conceptualización abstracta", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "bloques_fuente": [462, 462]}, {"layout": "fichas", "segmentos": ["De acuerdo con las características propias de los sistemas de justicia penal para adolescentes propuestos por la Convención de los derechos del niño, existen un conjunto de normas de carácter internacional que están consagrados en diferentes instrumentos internacionales y deben ser tenidas en cuenta en las decisiones que se deriven de la actuación de los funcionarios judiciales en este sistema.", "Dichas normativas están plenamente autorizadas por la Constitución Política de Colombia en el denominado “bloque de constitucionalidad”.", "“El bloque de constitucionalidad se refiere a aquellas normas y principios que, sin aparecer formalmente en el articulado del texto constitucional, son utilizados como parámetros del control de constitucionalidad de las leyes, por cuanto han sido normativamente integrados a la Constitución, por diversas vías y por mandato de la propia Constitución.”[^5]", "[^5] Sentencia C-225-95 MP: Alejandro Martínez Caballero. Posición reiterada en sentencia C-578-95 MP: Eduardo Cifuentes Muñoz, Sentencia C-358-97 MP: Eduardo Cifuentes Muñoz y en Sentencia C-191-98 MP: Eduardo Cifuentes Muñoz", "El bloque de constitucionalidad es un término que comenzó a utilizar la Corte Constitucional colombiana sólo a partir de 1995 pero que como concepto se venía aplicando desde años anteriores utilizando los valores y principios en el texto constitucional para asegurar la permanencia y obligatoriedad del contenido material del mismo (Corte Constitucional, C-574 de 1992) ."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "De acuerdo con las características propias", "segs": [0], "obj": "escalones"}, {"label": "Dichas normativas", "segs": [1], "obj": "documento"}, {"label": "“El bloque de constitucionalidad se refiere", "segs": [2, 3], "obj": "libros"}, {"label": "El bloque de constitucionalidad", "segs": [4], "obj": "reloj"}]}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": "Normas supranacionales aplicables al sistema penal de adolescentes. Bloque de constitucionalidad.", "titulos_fuente": ["Fase de Conceptualización abstracta", "Normas supranacionales aplicables al sistema penal de adolescentes. Bloque de constitucionalidad."], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["De acuerdo con las características propias", "Dichas normativas", "“El bloque de constitucionalidad se refiere", "El bloque de constitucionalidad"], "titulo_genially": "Normas supranacionales aplicables al sistema penal de adolescentes. Bloque de constitucionalidad. (1 de 2)", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "relleno": "rompecabezas.webp", "bloques_fuente": [464, 467]}, {"layout": "esquema", "segmentos": ["De acuerdo con Arias López (2010) “(…) hay que concluir que, según la jurisprudencia de la Corte, hacen parte del bloque en sentido estricto (i) el Preámbulo, (ii) el articulado constitucional, (iii) los tratados de limites ratificados por Colombia, (iv) los tratados de derecho humanitario, (v) los tratados ratificados por Colombia que reconocen derechos intangibles, eso es, derechos que no pueden ser suspendidos o limitados en estados de excepción.”", "Según la dogmática que se ha desarrollado en este curso, también deben entenderse como parte del “Bloque de Constitucionalidad” en sentido estricto todos los demás artículos de los tratados de derechos humanos ratificados por Colombia cuando se trate de derechos humanos reconocidos por la Carta, para efectos de delimitar el contenido y los límites de los derechos constitucionales. (Arias López, 2010)", "Este bloque de constitucionalidad, autorizado por el artículo 93 de la Carta nos remite de manera directa a los artículos 13 y 44 de la Constitución Nacional, los cuales consagran respectivamente que:", "“El Estado promoverá las condiciones para que la igualdad sea real y efectiva y adoptará medidas en favor de grupos discriminados o marginados” y a renglón seguido aduce: “El Estado protegerá especialmente a aquellas personas que, por su condición económica, física o mental, se encuentren en circunstancia de debilidad manifiesta y sancionará los abusos o maltratos que contra ellas se cometan”.", "Son derechos fundamentales de los niños: la vida, la integridad física, la salud y la seguridad social, la alimentación equilibrada, su nombre y nacionalidad, tener una familia y no ser separados de ella, el cuidado y amor, la educación y la cultura, la recreación y la libre expresión de su opinión. Serán protegidos contra toda forma de abandono, violencia física o moral, secuestro, venta, abuso sexual, explotación laboral o económica y trabajos riesgosos. Gozarán también de los demás derechos consagrados en la Constitución, en las leyes y en los tratados internacionales ratificados por Colombia.", "La familia, la sociedad y el Estado tienen la obligación de asistir y proteger al niño para garantizar su desarrollo armónico e integral y el ejercicio pleno de sus derechos. Cualquier persona puede exigir de la autoridad competente su cumplimiento y la sanción de los infractores."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "De acuerdo con Arias López (2010)", "segs": [0], "obj": "libros"}, { rte Constitucional al respecto, el panorama se ha aclarado al introducir la necesidad de que exista una regla constitucional clara que ordene dicha inclusión (Rodrigo Uprimny: 2006; 50-68), por lo que se han establecido unas técnicas específicas de remisión admitidas por la Carta.", "Todos los tratados de derechos humanos ratificados por Colombia se incorporan al bloque de constitucionalidad mediante el artículo 93, por el inciso primero (sentido estricto), o el segundo (sentido lato), según sean o no limitables en los estados de excepción; sin embargo, es de aclarar que no es la única forma de integrar el bloque de constitucionalidad."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Corte Constitucional", "segs": [0], "obj": "libros"}, {"label": "El artículo 93 de la Constitución establece", "segs": [1], "obj": "documento"}, {"label": "Los derechos y deberes consagrados", "segs": [2], "obj": "escalones"}, {"label": "la introducción al ordenamiento jurídico", "segs": [3], "obj": "carpetas"}, {"label": "Todos los tratados de derechos humanos ratificados", "segs": [4], "obj": "lupa"}]}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": null, "titulos_fuente": ["Fase de Conceptualización abstracta"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Corte Constitucional", "El artículo 93 de la Constitución establece", "Los derechos y deberes consagrados", "la introducción al ordenamiento jurídico", "Todos los tratados de derechos humanos ratificados"], "titulo_genially": "Fase de Conceptualización abstracta (2 de 2)", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "ilustracion": "rompecabezas.webp", "arte": {"img": "rompecabezas.webp", "pos": "der"}, "bloques_fuente": [474, 478]}, {"layout": "lamina", "segmentos": ["el preámbulo [de la Constitución],", "el articulado entos internacionales al régimen de protección de sus derechos, a través del artículo 44, tal como lo hizo en la sentencia C-154 de 2007, en la que se argumentó que los niños gozan de los derechos consagrados en la Constitución, en las leyes y en los tratados internacionales de los cuales Colombia es Estado parte y se encuentran en vigencia internacional. Dentro de estos destaca la Corte:", "Declaración de Ginebra de 1924 sobre los Derechos del Niño. Declaración Universal de Derechos Humanos de 1948."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [0, 1, 5], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "las leyes estatutarias", "segs": [0, 1], "obj": "documento"}, {"label": "Para Uprimny (2006), existen también normas", "segs": [2], "obj": "carpetas"}, {"label": "tratándose de los derechos", "segs": [3], "obj": "escudo"}, {"label": "En materia de niñez, la Corte", "segs": [4, 5], "obj": "libros"}]}], "rotulo": null, "seccion": "Fase de Conceptualización abstracta", "grupo": "Hacen parte del bloque de constitucionalidad en sentido lato:", "titulos_fuente": ["Fase de Conceptualización abstracta", "Hacen parte del bloque de constitucionalidad en sentido lato:"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["las leyes estatutarias", "Para Uprimny (2006), existen también normas", "tratándose de los derechos", "En materia de niñez, la Corte"], "titulo_genially": "Hacen parte del bloque de constitucionalidad en sentido lato: (1 de 3)", "complemento_genially": "", "apartado": "Fase de Conceptualización abstracta", "ilustracion": "cuidado-familia.webp", "bloques_fuente": [486, 491]}, {"layout": "esquema", "segmentos": ["Declaración de los Derechos del Niño, proclamada por la Asamblea General de las Naciones Unidas el 20 de Noviembre de 1959.", "Pacto Internacional de Derechos Económicos, Sociales y Culturales, adoptado por la Asamblea General de las Naciones Unidas en 19
