<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-srpa", "paleta": {"marino": "#07415C", "teal": "#2E6377", "oxido": "#B55D41", "coral": "#FF6936", "crema": "#FFE1D7", "niebla": "#CAE9E4", "hielo": "#E9F6F4", "celeste": "#CAE9E4", "madera": "#B55D41", "piso": "#CAE9E4", "gris": "#CAE9E4", "amarillo": "#FF6936"}, "anclas": {"construccion-bloques.webp": {"r": 1.2712, "p": [[62, 53], [41, 63], [52, 76], [66, 89]]}, "rompecabezas.webp": {"r": 1.264, "p": [[42, 31], [66, 43], [40, 66], [62, 69]]}, "camino-proteccion.webp": {"r": 1.1335, "p": [[79, 26], [87, 58], [61, 86], [20, 72]]}, "circulo-dialogo.webp": {"r": 1.1524, "p": [[31, 13], [68, 9], [11, 62], [89, 66]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "srpa", "partirComas": true, "bitacora": true, "retro": {"reacciones": ["rompecabezas.webp", "construccion-bloques.webp", "circulo-dialogo.webp"], "frases": ["¿Seguro?", "¡Revisa de nuevo!", "¡Mira otra vez!", "¡Casi!", "¡Un momento!", "¡Vuelve a leer!"], "acierto": ["camino-proteccion.webp", "cuidado-familia.webp"], "rotulo": "Unidad 4 · Lección 4"}, "leccion_rotulo": "Lección 4", "unit": 4, "lesson": 4, "heading": "Lección 4. Mecanismos procesales para la implementación de procesos y prácticas restaurativas", "scenes": [{"layout": "ruta", "segmentos": ["El artículo 523 de la Ley 906 de 2004, contempla la mediación como un mecanismo por medio del cual un tercero neutral, particular o servidor público designado por el Fiscal General de la Nación o su delegado, trata de permitir el intercambio de opiniones entre víctima y el imputado o acusado, para que confronten sus puntos de vista y, con su ayuda logren solucionar el conflicto que les enfrenta. Como efectos procesales el artículo 526 refiere que esta tiene efectos vinculantes frente a la acción civil derivada del delito y el incidente de reparación integral, y aclara que el mediador expedirá un informe de sus resultados y lo remitirá al fiscal para que lo valore y le otorgue efectos jurídicos en la actuación.", "La mediación se encuentra ampliamente desarrollada en el Manual de Justicia Restaurativa de la Fiscalía General de la Nación (2022), en donde se habla del trámite de la mediación penal de la siguiente manera:", "1. Solicitud de intención de desarrollar la mediación: (A iniciativa del fiscal, o por solicitud de la víctima o el procesado, el Fiscal evalúa la procedencia de la mediación sus efectos en el proceso, y una vez aceptada deberá comunicar a las partes).", "2. Aceptación y remisión del caso a un centro de mediación: (Si la respuesta por parte de las partes es positiva frente a la posibilidad de resolver el conflicto con la mediación, se remitirá el asunto a los programas de justicia restaurativa autorizados mediante convenio).", "3. Desarrollo de la Mediación (por parte del centro de mediación se citará a las partes y se adelantará lo pertinente, luego de realizada la mediación se remitirá al fiscal el acta de mediación y el informe de los resultados restaurativos, se procederá a valorar por el fiscal los resultados restaurativos alcanzados y le otorgará los efectos jurídicos pertinentes de acuerdo al caso y el estado del proceso, bien sea orden de archivo, solicitud de control de legalidad al principio de oportunidad o solicitud de preclusión)."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "El artículo 523 de la Ley", "segs": [0], "obj": "libros"}, {"label": "La mediación se encuentra ampliamente desarrollada", "segs": [1, 2], "obj": "escudo"}, {"label": "Aceptación y remisión del caso", "segs": [3], "obj": "documento"}, {"label": "Desarrollo de la Mediación", "segs": [4], "obj": "expediente"}]}], "rotulo": null, "seccion": "Lección 4. Mecanismos procesales para la implementación de procesos y prácticas restaurativas", "grupo": "La mediación como mecanismo de justicia restaurativa:", "titulos_fuente": ["La mediación como mecanismo de justicia restaurativa:"], "encabezados": [], "mediacion": "Ruta paso a paso con ficha que avanza.", "rotulos": ["El artículo 523 de la Ley", "La mediación se encuentra ampliamente desarrollada", "Aceptación y remisión del caso", "Desarrollo de la Mediación"], "titulo_genially": "La mediación como mecanismo de justicia restaurativa: (1 de 2)", "complemento_genially": "", "apartado": "", "ilustracion": "camino-proteccion.webp", "arte": {"img": "camino-proteccion.webp", "pos": "fondo"}, "relleno": "circulo-dialogo.webp", "bloques_fuente": [114, 118]}, {"layout": "esquema", "segmentos": ["Frente a los requisitos de procedencia de la Mediación en el sistema de responsabilidad penal para adolescentes, tal y como sucede en el principio de oportunidad en razón de las normas e instrumentos internacionales como la Convención de los Derechos del Niño (Artículo 40), las Reglas de Beijing (regla 11), la Observación General 24 del Comité de los Derechos del Niño, no son vinculantes las restricciones normativas de derecho interno que impiden hacer uso del mecanismo de remisión o desjudicialización en todos los delitos y en todos los casos, en consecuencia para el caso del sistema de responsabilidad penal para adolescentes la mediación penal si procede para todos los delitos.", "Dentro de lo visto se tiene que, una vez el fiscal recibe el informe de la mediación y si este cuenta con un resultado totalmente restaurativo en su componente de reparación, el Fiscal contará con los insumos suficientes para:", "1. Archivo de las diligencias por conciliación previa, aplicable en delitos querellables conforme al artículo 522 Ley 906 de 2004.", "2. Aplicar principio de oportunidad en la modalidad de suspensión o renuncia y solicitar el control de legalidad ante el Juez de Control de Garantías, con base en las causales del artículo 324 Ley 906 de 2004.", "3. Solicitar la preclusión de la acción penal ante el Juez de Conocimiento, con base en la Ley 2477 de 2025 que adiciona el artículo 78A de la Ley 906 de 2004 y establece causal de extinción de la acción penal por reparación integral para ciertos delitos, o conforme al artículo 24 de la Ley 1826 de 2017 que adiciona el artículo 547 de la Ley 906 de 2004 para los delitos del procedimiento especial abreviado."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Frente a los requisitos de procedencia", "segs": [0], "obj": "escalones"}, {"label": "Dentro de lo visto se tiene", "segs": [1, 2], "obj": "libros"}, {"label": "Aplicar principio de oportunidad en la modalidad", "segs": [3], "obj": "escudo"}, {"label": "Solicitar la preclusión de la acción penal", "segs": [4], "obj": "puertaCerrada"}]}], "rotulo": null, "seccion": "Lección 4. Mecanismos procesales para la implementación de procesos y prácticas restaurativas", "grupo": "La mediación como mecanismo de justicia restaurativa:", "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Frente a los requisitos de procedencia", "Dentro de lo visto se tiene", "Aplicar principio de oportunidad en la modalidad", "Solicitar la preclusión de la acción penal"], "titulo_genially": "La mediación como mecanismo de justicia restaurativa: (2 de 2)", "complemento_genially": "", "apartado": "", "ilustracion": "circulo-dialogo.webp", "arte": {"img": "circulo-dialogo.webp", "pos": "izq"}, "relleno": "rompecabezas.webp", "bloques_fuente": [119, 123]}, {"layout": "lamina", "segmentos": ["Frente a la conciliación, esta debe abarcar lo relacionado con el artículo 522 de la Ley 906 de 2004, en el entendido que se surtirá obligatoriamente como requisito de procedibilidad para el ejercicio de la acción penal en los delitos querellables. Para el efecto con la entrada en vigor del estatuto de conciliación de la Ley 2220 de 2022 en lo que sea pertinente será aplicable esa normatividad."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Conciliación:", "segs": [0], "obj": "libros", "acomp": ["escalones", "documento"]}]}], "rotulo": null, "seccion": "Lección 4. Mecanismos procesales para la implementación de procesos y prácticas restaurativas", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Conciliación:"], "titulo_genially": "Conciliación:", "complemento_genially": "", "apartado": "", "bloques_fuente": [125, 125]}, {"layout": "giro", "segmentos": ["El artículo 94 del Código Penal prevé “(…) la conducta punible origina obligación de reparar los daños materiales y morales causados con ocasión de aquella (…)” y el artículo 11 de la Ley 906 de 2004 prevé que el Estado debe garantizar el acceso de las víctimas a la administración de justicia, y conforme al literal c) del inciso segundo de dicha disposición tienen derecho “(…) [a] una pronta e integral reparación de los daños sufridos, a cargo del autor o partícipe del injusto o de los terceros llamados a responder en los términos de este código (…)”.", "En ese sentido, el legislador previó el incidente de reparación integral en los artículos 102 a 108 de la Ley 906 de 2004 que tiene como objetivo desarrollar un procedimiento accesorio posterior a la sentencia penal que busca determinar la tasación de la responsabilidad civil derivada del daño causado con el delito.", "En desarrollo del incidente de reparación integral, el legislador contempló etapas procesales en las cuales es procedente la terminación del trámite de incidente de reparación integral por conciliación.", "Así, el inciso 3 del artículo 103 de la Ley 906 de 2004, señala que admitida la pretensión el juez la pondrá en conocimiento del condenado y acto seguido ofrecerá la posibilidad de una conciliación que de prosperar dará término al incidente."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "El artículo 94 del Código Penal", "segs": [0], "obj": "libros"}, {"label": "el legislador previó el incidente", "segs": [1], "obj": "reloj"}, {"label": "En desarrollo del incidente de reparación", "segs": [2], "obj": "escalones"}, {"label": "el inciso 3 del artículo 103", "segs": [3], "obj": "tribunal"}]}], "rotulo": null, "seccion": "Lección 4. Mecanismos procesales para la implementación de procesos y prácticas restaurativas", "grupo": "Conciliación en el incidente de reparación integral:", "titulos_fuente": ["Conciliación en el incidente de reparación integral:"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["El artículo 94 del Código Penal", "el legislador previó el incidente", "En desarrollo del incidente de reparación", "el inciso 3 del artículo 103"], "titulo_genially": "Conciliación en el incidente de reparación integral: (1 de 2)", "complemento_genially": "", "apartado": "", "ilustracion": "cuidado-familia.webp", "arte": {"img": "cuidado-familia.webp", "pos": "der"}, "bloques_fuente": [127, 130]}, {"layout": "fichas", "segmentos": ["Por su parte, el inciso 1 del artículo 104 de la Ley 906 de 2004, señala referente a la audiencia de pruebas y alegaciones que, el día y la hora señalados el juez realizará la audiencia la cual iniciará con una invitación a los intervinientes a conciliar y que de lograrse el acuerdo su contenido se incorporará a la decisión.", "La Conciliación en el marco del incidente de reparación integral, permite en consecuencia una terminación anticipada de este procedimiento y para lo referente a la exigibilidad vía judicial de las obligaciones contenidas en el acuerdo conciliatorio, las partes tienen a su disposición la vía procesal ordinaria ante los jueces civiles."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "el inciso 1 del artículo 104", "segs": [0], "obj": "libros"}, {"label": "Conciliación en el marco del incidente", "segs": [1], "obj": "escalones"}]}], "rotulo": null, "seccion": "Lección 4. Mecanismos procesales para la implementación de procesos y prácticas restaurativas", "grupo": "Conciliación en el incidente de reparación integral:", "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["el inciso 1 del artículo 104", "Conciliación en el marco del incidente"], "titulo_genially": "Conciliación en el incidente de reparación integral: (2 de 2)", "complemento_genially": "", "apartado": "", "relleno": "circulo-dialogo.webp", "bloques_fuente": [131, 132]}, {"layout": "lamina", "segmentos": ["Para la CSJ, AP-1827-2026, Rad. No. 65824, la remisión a programas de justicia restaurativa no es una pena ni una sanción por sí misma sino una medida complementaria, al respecto, se ha señalado que, la vinculación a dichos programas, “(…) no es una “pena” ni una acción restaurativa que repare a la víctima, sino una medida de asistencia psicosocial. Y esta es dirigida al adolescente infractor, en quien se detectaron factores de vulnerabilidad, para que de manera complementaria a la sanción lo dote de herramientas para gestionar su comportamiento conforme a su propio bienestar (…)”"], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Los programas de Justicia Restaurativa en la jurisprudencia:", "segs": [0], "obj": "libros", "acomp": ["escudo", "documento"]}]}], "rotulo": null, "seccion": "Lección 4. Mecanismos procesales para la implementación de procesos y prácticas restaurativas", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Los programas de Justicia Restaurativa en la jurisprudencia:"], "titulo_genially": "Los programas de Justicia Restaurativa en la jurisprudencia:", "complemento_genially": "", "apartado": "", "ilustracion": "circulo-dialogo.webp", "relleno": "camino-proteccion.webp", "bloques_fuente": [134, 134]}, {"layout": "caso", "segmentos": ["Retome la sentencia y reflexione sobre la siguiente pregunta orientadora: ¿Cuál es la función de los programas de justicia restaurativa para el momento de la imposición de la sanción? ¿Son una sanción o una medida complementaria?"], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "caso", "roles": {"titulo": "", "parrafos": [0]}, "obj": "documento", "items": [], "encabezado": "Bitácora de reflexión", "nombre": "Evaluación de la lección 3"}], "rotulo": null, "seccion": "Lección 4. Mecanismos procesales para la implementación de procesos y prácticas restaurativas", "grupo": "Evaluación de la lección 3", "titulos_fuente": ["Evaluación de la lección 3"], "encabezados": [], "mediacion": "Actividad de escritura: el caso, la consigna y el espacio para responder.", "rotulos": ["Evaluación de la lección 3"], "titulo_genially": "Evaluación de la lección 3", "complemento_genially": "", "apartado": "", "bloques_fuente": [136, 136]}, {"layout": "lamina", "segmentos": ["De conformidad con lo visto en la sentencia AP-1827-2026, Rad. No. 65824, la remisión a los programas de Justicia Restaurativa para el momento de la sanción es una medida complementaria, no es una sanción en tanto que no buscan derivar consecuencias jurídicas frente a su incumplimiento, implican voluntariedad del joven en la vinculación, y están orientados a brindar al adolescente infractor herramientas para enmendar su comportamiento atendiendo las problemáticas más significativas en su situación individual y que son motivo de su ingreso al sistema de responsabilidad penal."], "parrafo": [0], "vineta": [], "lead": [], "titu
