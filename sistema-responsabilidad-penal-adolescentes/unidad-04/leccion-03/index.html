l, que tiene a su cargo la formulación de directrices para el diseño de las políticas públicas relacionadas con la responsabilidad penal adolescente.", "En el nivel nacional la presidencia está a cargo del Ministerio de Justicia y del Derecho y la Secretaría Técnica corresponde a la Subdirección de Responsabilidad Penal para Adolescentes del Instituto Colombiano de Bienestar Familiar, en el nivel departamental la presidencia está a cargo del Gobernador y la Secretaría Técnica corresponde a la Regional del Instituto Colombiano de Bienestar Familiar.", "Dentro de las funciones del sistema nacional de coordinación de responsabilidad penal para adolescentes se tiene las de formular y recomendar directrices para garantizar el óptimo funcionamiento del SRPA en cumplimiento de las normas constitucionales y legales por parte de las autoridades, actores y entidades que lo conforman."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Mediante el decreto 1885 de 2015", "segs": [0], "obj": "camara"}, {"label": "Sistema Nacional de Coordinación de Responsabilidad", "segs": [1], "obj": "documento"}, {"label": "En el nivel nacional la presidencia", "segs": [2], "obj": "carpetas"}, {"label": "Dentro de las funciones del sistema nacional", "segs": [3], "obj": "escudo"}]}], "rotulo": null, "seccion": "Lección 3. Sistema nacional de coordinación del sistema de responsabilidad penal para adolescentes en materia de justicia restaurativa (directrices)", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Mediante el decreto 1885 de 2015", "Sistema Nacional de Coordinación de Responsabilidad", "En el nivel nacional la presidencia", "Dentro de las funciones del sistema nacional"], "titulo_genially": "Sistema nacional de coordinación del sistema de responsabilidad penal para adolescentes en materia de justicia restaurativa (directrices) (1 de 3)", "complemento_genially": "", "apartado": "", "ilustracion": "circulo-dialogo.webp", "arte": {"img": "circulo-dialogo.webp", "pos": "fondo"}, "relleno": "rompecabezas.webp", "bloques_fuente": [101, 104]}, {"layout": "giro", "segmentos": ["Frente a ello, en el nivel nacional el SNCRPA han emitido directrices vinculantes para los actores del SRPA, dentro de las más destacadas se encuentran entre otras las siguientes:", "Directrices del SNCRPA para orientar la formulación de estrategias de prevención del delito de adolescentes y jóvenes en el marco de los planes de desarrollo departamentales y municipales.", "Directrices del Sistema Nacional de Coordinación de Responsabilidad Penal Para Adolescentes, para orientar la formulación de programas de justicia juvenil restaurativa.", "En las directrices se ha recomendado a las autoridades territoriales impulsar el funcionamiento y fortalecimiento de los Comités Departamentales y Distritales del Sistema Nacional de Coordinación de Responsabilidad Penal para Adolescentes, al ser estas el espacio de coordinación interinstitucional que permite abordar las distintas problemáticas que afectan a los adolescentes y jóvenes del Sistema de Responsabilidad Penal para Adolescentes.", "Así mismo se ha planteado la necesidad de formulación de políticas públicas materializadas en planes, programas y proyectos destinados a los adolescentes infractores del Sistema de Responsabilidad Penal para Adolescentes y a la Justicia Restaurativa. También la necesidad de fortalecimiento del servicio de educación, salud, para los jóvenes y adolescentes vinculados al Sistema de Responsabilidad Penal para Adolescentes, así como la toma de medidas para el mejoramiento de la infraestructura física destinada al sistema, la prevención y atención del consumo de sustancias psicoactivas y la generación de programas de prevención o de post egreso."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Frente a ello, en el nivel", "segs": [0, 1], "obj": "documento"}, {"label": "Directrices del Sistema Nacional de Coordinación", "segs": [2], "obj": "carpetas"}, {"label": "En las directrices se ha recomendado", "segs": [3], "obj": "lupa"}, {"label": "Planes, programas y proyectos", "segs": [4], "obj": "corazon"}]}], "rotulo": null, "seccion": "Lección 3. Sistema nacional de coordinación del sistema de responsabilidad penal para adolescentes en materia de justicia restaurativa (directrices)", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Frente a ello, en el nivel", "Directrices del Sistema Nacional de Coordinación", "En las directrices se ha recomendado", "Planes, programas y proyectos"], "titulo_genially": "Sistema nacional de coordinación del sistema de responsabilidad penal para adolescentes en materia de justicia restaurativa (directrices) (2 de 3)", "complemento_genially": "", "apartado": "", "ilustracion": "rompecabezas.webp", "arte": {"img": "rompecabezas.webp", "pos": "izq"}, "bloques_fuente": [105, 109]}, {"layout": "fichas", "segmentos": ["En las recomendaciones dirigidas a los Comités Departamentales y Distritales del Sistema de Coordinación de Responsabilidad Penal para Adolescentes se ha insistido en la necesidad de dar estricto cumplimiento al decreto 1885 de 2015 para materializar el funcionamiento efectivo de los comités departamentales y distritales, los cuales deben estar integrados conforme a la normativa indicada, resaltando la importancia de la presidencia y la secretaria técnica y que tales cargos no sean delegados o relegados a otros servidores públicos.", "También se ha orientado la Formulación de Programas de Justicia juvenil Restaurativa, y la importancia de implementar el Decálogo Iberoamericano Sobre Justicia Juvenil Restaurativa, adoptado po
