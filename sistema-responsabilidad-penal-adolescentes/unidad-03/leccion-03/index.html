<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-srpa", "paleta": {"marino": "#07415C", "teal": "#2E6377", "oxido": "#B55D41", "coral": "#FF6936", "crema": "#FFE1D7", "niebla": "#CAE9E4", "hielo": "#E9F6F4", "celeste": "#CAE9E4", "madera": "#B55D41", "piso": "#CAE9E4", "gris": "#CAE9E4", "amarillo": "#FF6936"}, "anclas": {"construccion-bloques.webp": {"r": 1.2712, "p": [[62, 53], [41, 63], [52, 76], [66, 89]]}, "rompecabezas.webp": {"r": 1.264, "p": [[42, 31], [66, 43], [40, 66], [62, 69]]}, "camino-proteccion.webp": {"r": 1.1335, "p": [[79, 26], [87, 58], [61, 86], [20, 72]]}, "circulo-dialogo.webp": {"r": 1.1524, "p": [[31, 13], [68, 9], [11, 62], [89, 66]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "srpa", "partirComas": true, "bitacora": true, "retro": {"reacciones": ["rompecabezas.webp", "construccion-bloques.webp", "circulo-dialogo.webp"], "frases": ["¿Seguro?", "¡Revisa de nuevo!", "¡Mira otra vez!", "¡Casi!", "¡Un momento!", "¡Vuelve a leer!"], "acierto": ["camino-proteccion.webp", "cuidado-familia.webp"], "rotulo": "Unidad 3 · Lección 3"}, "leccion_rotulo": "Lección 3", "unit": 3, "lesson": 3, "heading": "Lección 3. Remisión de casos o medidas extrajudiciales", "scenes": [{"layout": "esquema", "segmentos": ["Siguiendo a Ramírez (2024), La remisión de casos o medidas extrajudiciales, es una obligación a cargo de los Estados que está contenida en instrumentos internacionales del Derecho Internacional de los Derechos Humanos de la Infancia y la Adolescencia, que hacen parte del bloque de constitucionalidad. Busca que los adolescentes vinculados a procesos judiciales sean remitidos de manera preferente a: salidas alternativas, procesos y prácticas diferentes a la judicialización, y es un desarrollo de los principios de desjudicialización y mínima intervención en los Sistemas de Justicia Penal Juvenil.", "Mediante esta figura se busca derivar el proceso penal a una vía alternativa diferente a la judicialización, esta se denomina remisión de casos o medidas extrajudiciales, la cual se refiere a todas aquellas medidas de desjudicialización necesarias para mantener a los niños al margen del sistema judicial en cualquier momento antes o a lo largo de los procedimientos judiciales pertinentes, las que deben ser parte integral del sistema de justicia penal juvenil y deben estar disponibles durante todo el proceso.", "En desarrollo del principio de remisión, serán las autoridades administrativas, organizaciones civiles o comunitarias, las encargadas de realizar las actividades que permitan movilizar la responsabilización del ofensor y su reintegración, teniendo en cuenta los intereses y necesidades de las víctimas a la reparación y garantías de no repetición, en todo caso el fiscal para preparar su audiencia deberá indagar sobre el programa o práctica restaurativa al cual será remitido el infractor y si este cumple con contenidos mínimos de: responsabilización, reparación y reintegración.", "Así, la Fiscalía General de la Nación (2022: 25), señaló que, para la implementación de la mediación, se procedería a suscribir convenios con entidades públicas o privadas que brinden programas de mediación penal, dando prioridad a las entidades con avances importantes o programas sólidos en materia de justicia restaurativa."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Siguiendo a Ramírez (2024), La remisión", "segs": [0], "obj": "documento"}, {"label": "Mediante esta figura", "segs": [1], "obj": "escalones"}, {"label": "En desarrollo del principio de remisión", "segs": [2], "obj": "escudo"}, {"label": "La Fiscalía General de la Nación", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Fase de conceptualización abstracta", "grupo": null, "titulos_fuente": ["Fase de conceptualización abstracta"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Siguiendo a Ramírez (2024), La remisión", "Mediante esta figura", "En desarrollo del principio de remisión", "La Fiscalía General de la Nación"], "titulo_genially": "Fase de conceptualización abstracta (1 de 2)", "complemento_genially": "", "apartado": "Fase de conceptualización abstracta", "ilustracion": "rompecabezas.webp", "arte": {"img": "rompecabezas.webp", "pos": "fondo"}, "relleno": "camino-proteccion.webp", "bloques_fuente": [138, 141]}, {"layout": "giro", "segmentos": ["Referente a la remisión de casos, debe considerarse que esta es una obligación internacional contenida en instrumentos internacionales tales como la Convención de los Derechos del Niño (Art. 40 #3b), las Reglas de Beijing (regla 11), la Observación General 24 del Comité de los Derechos del Niño, se refiere a todas aquellas medidas necesarias para mantener a los niños al margen del proceso judicial en cualquier momento antes o en desarrollo de los procedimientos pertinentes y busca derivar el asunto penal a una vía alternativa diferente a la judicialización.", "La remisión de casos es una característica de los sistemas de justicia penal juvenil bajo el paradigma de la protección integral, responsabilidad penal o garantía de derechos, así lo señala Ramírez (2024: 63) citando a García Méndez (1999), y esta figura está relacionada con la finalidad restaurativa del proceso penal para adolescentes en tanto que este modelo se caracteriza por la preferencia de las medidas extrajudiciales como mandato general limitando al mínimo posible la cantidad de asuntos que siguen la vía de la judicialización.", "Ahora bien, la remisión de casos no es sinónimo de principio de oportunidad e implica la remisión de los asuntos a programas extrajudiciales que corresponden a programas de Justicia Restaurativa en tanto que esa es la finalidad del sistema de responsabilidad penal para adolescentes, junto con los objetivos pedagógicos, específicos, diferenciados, verdad y reparación del daño.", "Así, la CSJ, en sentencia SP3520-2022 Radicación 60553, utilizó la Remisión de Casos en un escenario diferente al Principio de Oportunidad, refiriéndose al tratamiento que debe darse a los menores de edad que se encuentren inmersos en las circunstancias del inciso 2 artículo 142 de la Ley 1098 de 2006, que presenten una discapacidad psíquica o mental, los cuales no pueden ser juzgados, ni declarados penalmente responsables, señalando que le corresponde al Juez de Adolescentes hacer la remisión del caso a las diferentes instancias administrativas del SNBF, a fin de garantizar el restablecimiento de derechos del menor de edad.", "Frente a ello el fiscal deberá aportar al juez de adolescentes el dictamen pericial que acredite la condición de discapacidad física o mental que implica inimputabilidad y solicitar al juez la adopción de la decisión de remisión a programas extrajudiciales la cual se emite mediante auto que hace tránsito a cosa juzgada y sobre el cual proceden los recursos de ley."], "parrafo": [0, 1, 2, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Referente a la remisión de casos", "segs": [0], "obj": "documento"}, {"label": "La remisión de casos", "segs": [1], "obj": "escudo"}, {"label": "la remisión de casos no", "segs": [2, 3], "obj": "reloj"}, {"label": "Frente a ello el fiscal", "segs": [4], "obj": "tribunal"}]}], "rotulo": null, "seccion": "Fase de conceptualización abstracta", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Referente a la remisión de casos", "La remisión de casos", "la remisión de casos no", "Frente a ello el fiscal"], "titulo_genially": "Fase de conceptualización abstracta (2 de 2)", "complemento_genially": "", "apartado": "Fase de conceptualización abstracta", "ilustracion": "camino-proteccion.webp", "arte": {"img": "camino-proteccion.webp", "pos": "izq"}, "bloques_fuente": [142, 145]}, {"layout": "fichas", "segmentos": ["El artículo 142 de la Ley 1098 de 2006 se refiere a la exclusión de responsabilidad penal para adolescentes y señala en su inciso 1 que las personas menores de 14 años no serán juzgadas ni declaradas penalmente responsables, siendo competencia del defensor de familia adelantar las labores de verificación y restablecimiento de derechos.", "El inciso 2 del artículo 142 ibidem, indica que tampoco serán juzgadas, declaradas penalmente responsables ni sometidas a sanciones penales, las personas mayores de catorce (14) y menores de dieciocho (18) años con discapacidad psíquico o mental, pero se les aplicará la respectiva medida de seguridad, siempre y cuando la situación de discapacidad psíquica o mental este probada en el proceso y la conducta guarde relación con la discapacidad.", "La CSJ en la sentencia SP3520-2022 Radicación 60553, utilizó la remisión de casos en el inciso 2 del artículo 142 de la Ley 1098 de 2006, referente a los adolescentes entre catorce (14) y menores de dieciocho (18) años con discapacidad psíquico o mental, los cuales no podrán ser juzgados ni declarados penalmente responsables, siendo necesario para ello que el fiscal delegado documente la discapacidad psíquica o mental (dictamen médico legal), le acredite al Juez que la conducta objeto del proceso guarda relación directa con la condición de discapacidad, y le solicite dar aplicación a la remisión del caso, al Instituto Colombiano de Bienestar Familiar a fin de garantizar el restablecimiento de derechos del menor de edad, procediendo a decretar la extinción de la acción penal por remisión de casos y el archivo definitivo de las diligencias. Auto sobre el cual proceden recursos y hace tránsito a cosa juzgada."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [ 006 y la sentencia SP3520-2022 Radicación 60553? Reflexione sobre su respuesta.", "¿Considera usted que los adolescentes entre 14 y menos de 18 años con discapacidad psíquica y mental si deben tener un tratamiento diferenciado? o considera usted que la condición de discapacidad psíquica y mental debe probarse en el juicio y emitirse la respectiva medida de seguridad tal y como se realiza en el Sistema Penal Acusatorio? Reflexione sobre su respuesta."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "caso", "roles": {"titulo": "", "parrafos": [0, 1]}, "obj": "documento", "items": [], "encabezado": "Fase de experimentación activa", "nombre": "Pregunta orientadora:"}], "rotulo": null, "seccion": "Fase de experimentación activa", "grupo": "Pregunta orientadora:", "titulos_fuente": ["Pregunta orientadora:"], "encabezados": [], "mediacion": "Actividad de escritura: el caso, la consigna y el espacio para responder.", "rotulos": ["Pregunta orientadora:"], "titulo_genially": "Pregunta orientadora:", "complemento_genially": "", "apartado": "Fase de experimentación activa", "bloques_fuente": [157, 158]}, {"layout": "lamina", "segmentos": ["Al respecto la CSJ Penal sentencia SP3520-2022 Radicación 60553, indicó que la mención del artículo 142 inciso 2 de la Ley 1098 de 2006, fue una confusión donde no se refería a las medidas de seguridad para inimputables del código penal sino a las medidas de protección del derogado código del menor decreto 2737 de 1989, y frente a la prueba de la condición de discapacidad en juicio ello riñe con la expresa redacción del artículo 142 conforme al cual tampoco serán juzgadas, declaradas penalmente responsables ni sometidas a sanciones penales las personas mayores de catorce (14) y menores de dieciocho (18) años con discapacidad psíquico o mental."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Fase de
