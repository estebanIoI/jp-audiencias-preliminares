<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-srpa", "paleta": {"marino": "#07415C", "teal": "#2E6377", "oxido": "#B55D41", "coral": "#FF6936", "crema": "#FFE1D7", "niebla": "#CAE9E4", "hielo": "#E9F6F4", "celeste": "#CAE9E4", "madera": "#B55D41", "piso": "#CAE9E4", "gris": "#CAE9E4", "amarillo": "#FF6936"}, "anclas": {"construccion-bloques.webp": {"r": 1.2712, "p": [[62, 53], [41, 63], [52, 76], [66, 89]]}, "rompecabezas.webp": {"r": 1.264, "p": [[42, 31], [66, 43], [40, 66], [62, 69]]}, "camino-proteccion.webp": {"r": 1.1335, "p": [[79, 26], [87, 58], [61, 86], [20, 72]]}, "circulo-dialogo.webp": {"r": 1.1524, "p": [[31, 13], [68, 9], [11, 62], [89, 66]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "srpa", "partirComas": true, "bitacora": true, "retro": {"reacciones": ["rompecabezas.webp", "construccion-bloques.webp", "circulo-dialogo.webp"], "frases": ["¿Seguro?", "¡Revisa de nuevo!", "¡Mira otra vez!", "¡Casi!", "¡Un momento!", "¡Vuelve a leer!"], "acierto": ["camino-proteccion.webp", "cuidado-familia.webp"], "rotulo": "Unidad 3 · Lección 2"}, "leccion_rotulo": "Lección 2", "unit": 3, "lesson": 2, "heading": "Lección 2. Prácticas restaurativas y el principio de oportunidad", "scenes": [{"layout": "esquema", "segmentos": ["Debe precisarse que se entiende por prácticas restaurativas, aclarando que la Justicia Restaurativa no debe limitarse a la definición contenida en el libro VI del Código de Procedimiento Penal, referente a los artículos 518 y subsiguientes, la Justicia Restaurativa va mucho más allá de esa definición normativa, se trata de: prácticas, programas, enfoques, destinados a la reconstrucción de las relaciones sociales y familiares afectadas con el conflicto, en búsqueda de alcanzar la responsabilización del ofensor, la reparación de los perjuicios ocasionados a las víctimas de acuerdo a sus necesidades y la reintegración del ofensor en la comunidad. Definición que va de la mano con aquella establecida por la Organización de las Naciones Unidas en el Manual Sobre Programas de Justicia Restaurativa de 2006.", "Para definir la Justicia Restaurativa, puede tomarse como fundamento la obra de Howard Zher, referente a los componentes de Responsabilización, Reparación, y Reintegración, así es como Zehr (2010: 18), ya indicaba que con visiones alternativas como la Justicia Restaurativa se busca incluir no sólo al Estado y al ofensor sino también a la víctima y a los miembros de la comunidad, tomando como punto de partida las necesidades y obligaciones de las partes, y en especial de las víctimas, procurando restaurar el daño, garantizando la participación de todos los actores en la resolución del conflicto teniendo como base las causas del mismo. Concordante con lo anterior, para Flórez y Peña (2025: 18), la justicia restaurativa tiene una serie de elementos esenciales dentro de los que se destaca el reencuentro, el reconocimiento, la responsabilidad, la reparación o restauración, la reconstrucción y la reintegración.", "Así, la Justicia Restaurativa se desarrolla mediante programas, procesos y prácticas de Justicia Restaurativa, y frente a los programas de Justicia Restaurativa, el autor entiende que este puede ser definido como todo aquel que integra procesos y prácticas restaurativas, entre ofensores y víctimas para atender las consecuencias negativas del delito con la participación de las familias y la comunidad. Este tipo de programas podrán ser ofrecidos por el estado central o territorial, así como por organizaciones de la sociedad civil, tales programas deberán contar con facilitadores o personal de apoyo especializado en el acompañamiento a las partes, con el objetivo de facilitar el cumplimiento de los objetivos de Responsabilización, Reparación, y Reintegración.", "Por práctica restaurativa, el autor entiende que se trata de una actividad que puede adelantarse en desarrollo de un proceso o programa o sin programa o proceso alguno, que implica desarrollar con el ofensor la víctima y la comunidad, unos mínimos contenidos de responsabilización, reparación a las víctimas, reintegración en la comunidad."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Debe precisarse que se entiende", "segs": [0], "obj": "libros"}, {"label": "Para definir la Justicia Restaurativa, puede", "segs": [1], "obj": "escudo"}, {"label": "la Justicia Restaurativa se desarrolla mediante", "segs": [2], "obj": "documento"}, {"label": "Por práctica restaurativa, el autor entiende", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Fase de conceptualización abstracta", "grupo": null, "titulos_fuente": ["Fase de conceptualización abstracta"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Debe precisarse que se entiende", "Para definir la Justicia Restaurativa, puede", "la Justicia Restaurativa se desarrolla mediante", "Por práctica restaurativa, el autor entiende"], "titulo_genially": "Fase de conceptualización abstracta (1 de 4)", "complemento_genially": "", "apartado": "Fase de conceptualización abstracta", "ilustracion": "circulo-dialogo.webp", "arte": {"img": "circulo-dialogo.webp", "pos": "fondo"}, "relleno": "rompecabezas.webp", "bloques_fuente": [116, 119]}, {"layout": "giro", "segmentos": ["Para tal efecto los programas se articulan con las políticas públicas, y con prácticas restaurativas formales y no formales ofertadas no solo por las autoridades u organizaciones legalmente reconocidas que pueden ser utilizadas como espacio de remisión del asunto, esto es dentro de las obligaciones del procesado para el momento de la suspensión del procedimiento a prueba, están aquellas relacionadas con la remisión a un programa o práctica restaurativa. Por práctica restaurativa, el autor entiende que se trata de una actividad o evento especifico que implica desarrollar con el ofensor la víctima y la comunidad, unos mínimos contenidos de responsabilización, reparación a las víctimas, reintegración en la comunidad.", "Por resultado restaurativo; se encuentra que, es el producto del programa o la práctica restaurativa, y puede ser totalmente restaurativo cuando se alcanzan la totalidad de los objetivos de responsabilización del ofensor, reparación a las víctimas y reintegración en la comunidad, así como garantías de no repetición del hecho para la sociedad. Así mismo es parcialmente restaurativo cuando no se alcanza la totalidad de objetivos de Responsabilización, Reparación, Reintegración.", "Frente al procedimiento restaurativo o parcialmente restaurativo, el SNCRPA (2018 directriz No.3), citando a Wachtel (2013) señaló que cuando las prácticas involucran solamente a una de las partes interesadas el procedimiento es parcialmente restaurativo, es principalmente restaurativo cuando incluye al ofensor y víctima pero excluye a sus comunidades afectivas y es totalmente restaurativo cuando todas las partes están involucradas activamente y esa participación se ve traducida en una satisfacción de las necesidades de las partes afectadas.", "Consideramos que la Justicia Restaurativa es un Modelo alternativo de Justicia que busca la solución integral del conflicto, garantizando la participación del ofensor, la víctima y la comunidad a través de la remisión del caso a programas extrajudiciales. En consecuencia, el fiscal debe asumir un rol dentro del enfoque de Justicia Restaurativa que lo obliga a sensibilizar y facilitar la remisión del caso a programas de Justicia Restaurativa y la Justicia terapéutica; así como incorporar al proceso los resultados de las prácticas restaurativas; promover una interpretación favorable de la Justicia Restaurativa en la interpretación y aplicación de la ley."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Para tal efecto los programas", "segs": [0], "obj": "expediente"}, {"label": "Por resultado restaurativo; se encuentra", "segs": [1], "obj": "escudo"}, {"label": "Frente al procedimiento restaurativo o parcialmente", "segs": [2], "obj": "escalones"}, {"label": "Consideramos", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "Fase de conceptualización abstracta", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Para tal efecto los programas", "Por resultado restaurativo; se encuentra", "Frente al procedimiento restaurativo o parcialmente", "Consideramos"], "titulo_genially": "Fase de conceptualización abstracta (2 de 4)", "complemento_genially": "", "apartado": "Fase de conceptualización abstracta", "ilustracion": "rompecabezas.webp", "arte": {"img": "rompecabezas.webp", "pos": "izq"}, "relleno": "cuidado-familia.webp", "bloques_fuente": [120, 123]}, {"layout": "fichas", "segmentos": ["Siguiendo a Flórez y Peña (2025: 17), por noción de Justicia Restaurativa debe entenderse que,", "“...la justicia restaurativa se materializa con la reconstrucción consensuada de las relaciones sociales o familiares destruidas con el conflicto, como consecuencia de un resultado restaurativo, derivado del acuerdo alcanzado entre ofendido y ofensor, previo procedimiento, facilitado por un mediador o conciliador en equidad, y desarrollado, generalmente, con el acompañamiento de la familia o la comunidad, donde el trasgresor reconoce al otro como víctima y viceversa, el infractor se entera del sufrimiento del ofendido, adquiere consciencia del daño que causó, experimenta una transformación positiva, asume su responsabilidad, repara o restaura, y los dos se reintegran a la colectividad.”", "Para la Fiscalía General de la Nación (2022: 7), la Justicia Restaurativa es un concepto que conlleva una visión alternativa del tratamiento del conflicto, con miras a superar las limitaciones propias del sistema de justicia formal, su incapacidad para resolver las causas subyacentes a la conflictividad, satisfacer los intereses de la víctima, lograr una verdadera reinserción del ofensor y dar tratamiento efectivo a todos los casos. El mismo documento menciona las finalidades del proceso restaurativo señalando que estas corresponden a que,", "“(...) las partes involucradas asumen de manera voluntaria e informada una participación activa en la solución de las consecuencias negativas de la conducta punible, con la finalidad de lograr que el autor asuma su responsabilidad y que la víctima sea restaurada, así como la reintegración del infractor, restableciendo los vínculos con la sociedad a la que también se ha dañado con la conducta punible.” -Fiscalía General de la Nación (2022: 8)-."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Siguiendo a Flórez y Peña (2025", "segs": [0], "obj": "documento"}, {"label": "“...la justicia restaurativa se materializa", "segs": [1], "obj": "escalones"}, {"label": "Justicia Restaurativa", "segs": [2], "obj": "escudo"}, {"label": "“(...) las partes involucradas asumen", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Fase de conceptualización abstracta", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Siguiendo a Flórez y Peña (2025", "“...la justicia restaurativa se materializa", "Justicia Restaurativa", "“(...) las partes involucradas asumen"], "titulo_genially": "Fase de conceptualización abstracta (3 de 4)", "complemento_genially": "", "apartado": "Fase de conceptualización abstracta", "ilustracion": "cuidado-familia.webp", "relleno": "construccion-bloques.webp", "bloques_fuente": [124, 127]}, {"layout": "puntos", "segmentos": ["Tal definición implica que los programas de Justicia Restaurativa deben desarrollar al menos los tres componentes clásicos de Responsabilización, Reparación y Reintegración, también implican que la Justicia Restaurativa no es un sinónimo de Principio de Oportunidad, se trata de un enfoque que puede ser utilizado en todos las etapas del proceso del sistema de responsabilidad penal para adolescentes, desde el inicio hasta el momento posterior a la sentencia durante la ejecución de la sanción del adolescente infractor, y que puede generar consecuencias jurídicas distintas dependiendo de la etapa procesal y la clase de delito.", "La definición de Justicia Restaurativa implica también que, en todos los procesos debe hacerse uso de este enfoque, véase que, conforme al artículo 140 del CIA, la Justicia Restaurativa es una de las finalidades del Sistema de Responsabilidad Penal para Adolescentes, de manera que, para todos los actores del sistema es obligatorio agotar la remisión de los asuntos a programas, o prácticas restaurativas, dándoles efectos jurídicos en sus actuaciones.", "Tratándose de Justicia Restaurativa, debe considerarse los intereses y necesidades de las víctimas haciendo énfasis en su reparación, así lo señala la CSJ Penal SP-1947-2025 Radicación 60423: “En lo que respecta a la finalidad restaurativa, la sanción en el sistema de responsabilidad penal para adolescentes debe poner su énfasis en reparar, simbólica o materialmente, el daño causado a la víctima y la sociedad esto es, lograr generar en el infractor acciones de compensación o resarcimiento, de ser posible, en un trabajo conjunto con la víctima.”", "Dentro de las herramientas existentes para dotar de efectos jurídicos a los programas de Justicia Juvenil Restaurativa, por parte de los fiscales se puede hacer uso de: Manual de Justicia Restaurativa de la Fiscalía General de la Nación (2022), los Protocolos de Justicia Restaurativa y Terapéutica de la Rama Judicial, Flórez y Peña (2025), El pequeño libro de la Justicia Restaurativa de Howard Zehr (2010), el decálogo iberoamericano sobre Justicia Juvenil Restaurativa, entre otras publicaciones relevantes."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "Tal definición implica que los programas", "segs": [0], "obj": "escalones"}, {"label": "La definición de Justicia Restaurativa implica", "segs": [1], "obj": "documento"}, {"label": "Justicia Restaurativa", "segs": [2], "obj": "reloj"}, {"label": "Dentro de las herramientas existentes para dotar", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Fase de conceptualización abstracta", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["Tal definición implica que los programas", "La definición de Justicia Restaurativa implica", "Justicia Restaurativa", "Dentro de las herramientas existentes para dotar"], "titulo_genially": "Fase de conceptualización abstracta (4 de 4)", "complemento_genially": "", "apartado": "Fase de conceptualización abstracta", "ilustracion": "construccion-bloques.webp", "relleno": "circulo-dialogo.webp", "bloques_fuente": [128, 131]}, {"layout": "esquema", "segmentos": ["Retomemos el caso de ARLEY y SUSANA, ¿Cuál sería la actuación que debe adelantar el fiscal cuando una vez aplicado el Principio de Oportunidad por el fiscal y sometido a control de legalidad por parte del Juez de Control de Garantías, se recibe el primer informe de resultados de prácticas restaurativas, en el cual se señala como conclusiones que, se presenta un cierre del programa restaurativo por desinterés del procesado?.", "En este escenario la práctica restaurativa desarrollada fue parte de un programa restaurativo el cual tiene unas fases y objetivos durante el tiempo de suspensión de procedimiento a prueba, de manera que, si se presenta un primer resultado negativo con la primera intervención o practica restaurativa realizada no por ello se puede declarar fracasado el programa restaurativo. Frente a ello le corresponde al fiscal delegado, insistir y persistir ante el programa de justicia restaurativa para que se continue con el proceso de intervención en el ofensor y si ello no es suficiente se cuenta con la posibilidad de solicitar audiencias de seguimiento ante el Juez de Control de Garantías para que sea este el que insista con el infractor sobre los compromisos asumidos en el marco de la suspensión de procedimiento a prueba.", "Véase que, las finalidades del programa restaurativo de responsabilización, reparación y reintegración se alcanzaran como consecuencia de la totalidad del programa y no siempre en la primera practica restaurativa."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Retomemos el caso de ARLEY y SUSANA", "segs": [0], "obj": "escudo"}, {"label": "En este escenario la práctica restaurativa", "segs": [1, 2], "obj": "expediente"}]}], "rotulo": null, "seccion": "Fase de experimentación activa", "grupo": "Actividad evaluativa", "titulos_fuente": ["Fase de experimentación activa", "Actividad evaluativa"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Retomemos el caso de ARLEY y SUSANA", "En este escenario la práctica restaurativa"], "titulo_genially": "Actividad evaluativa", "complemento_genially": "", "apartado": "Fase de experimentación activa", "ilustracion": "circulo-dialogo.webp", "arte": {"img": "circulo-dialogo.webp", "pos": "der"}, "relleno": "camino-proteccion.webp", "bloques_fuente": [134, 135]}]}</script>
