<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-srpa", "paleta": {"marino": "#07415C", "teal": "#2E6377", "oxido": "#B55D41", "coral": "#FF6936", "crema": "#FFE1D7", "niebla": "#CAE9E4", "hielo": "#E9F6F4", "celeste": "#CAE9E4", "madera": "#B55D41", "piso": "#CAE9E4", "gris": "#CAE9E4", "amarillo": "#FF6936"}, "anclas": {"construccion-bloques.webp": {"r": 1.2712, "p": [[62, 53], [41, 63], [52, 76], [66, 89]]}, "rompecabezas.webp": {"r": 1.264, "p": [[42, 31], [66, 43], [40, 66], [62, 69]]}, "camino-proteccion.webp": {"r": 1.1335, "p": [[79, 26], [87, 58], [61, 86], [20, 72]]}, "circulo-dialogo.webp": {"r": 1.1524, "p": [[31, 13], [68, 9], [11, 62], [89, 66]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "srpa", "partirComas": true, "bitacora": true, "retro": {"reacciones": ["rompecabezas.webp", "construccion-bloques.webp", "circulo-dialogo.webp"], "frases": ["¿Seguro?", "¡Revisa de nuevo!", "¡Mira otra vez!", "¡Casi!", "¡Un momento!", "¡Vuelve a leer!"], "acierto": ["camino-proteccion.webp", "cuidado-familia.webp"], "rotulo": "Unidad 2 · Lección 2"}, "leccion_rotulo": "Lección 2", "unit": 2, "lesson": 2, "heading": "Lección 2. Presunción de minoría de edad", "scenes": [{"layout": "esquema", "segmentos": ["Para abordar los elementos propios de la minoría de edad como un criterio básico para resolver los conflictos que se presenten en el sistema de responsabilidad para adolescentes, debemos hacer relación por lo menos a tres escenarios entre los cuales se encuentran ubicados los menores de 18 años. Estos escenarios han sido abordados y analizados por las ciencias pedagógicas, neurológicas y neuropsicológicas y para efectos del tema que nos interesa, es decir para determinar la capacidad que tienen los menores de edad para responder por sus transgresiones a la ley penal y la respuesta que el Estado debe brindarles, los presentamos como elementos orientadores:", "El primer escenario es el de la imputabilidad general por falta de edad y por falta de discernimiento o por falta de conciencia, edad que para muchas culturas y según lo expresado por diferentes doctrinantes se extiende hasta los siete años, periodo en el cual el niño o niña, no responden de manera penal por sus hechos y son sujetos de una reconvención, o corrección paterna y materna, basada en la orientación y crianza que debe ofrecer la familia como espacio de socialización y en algunos casos derivando hacia una responsabilidad civil o económica por parte de sus padres o representantes.", "En el segundo escenario, que para muchos se inicia desde ocho años se plantea que el niño o la niña ya tienen capacidad de hacerse un juicio de reproche sobre sus acciones transgresoras de las normas y por tanto debe haber una respuesta, la cual se recomienda que sea de tipo pedagógico, formativa, de acompañamiento y enmarcada por supuesto en los límites que plantean las normas sobre los derechos humanos. Excepcionalmente algunos estados ubican en estas edades el inicio de la posibilidad de ser vinculados a los sistemas de Justicia Juvenil.", "Aparece el tercer escenario que es el propuesto por la Convención internacional sobre los derechos del niño, que de acuerdo a sus observaciones generales, sugiere que sea a partir de los catorce años cuando a los menores de edad se les endilgue responsabilidad frente a sus transgresiones a la ley penal y conforme a todas las garantías propias del derecho penal y de los sistemas de Justicia juvenil, puedan ser llevados ante una instancia de Justicia para que respondan por el hecho transgresor y respondan por sus consecuencias."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Para abordar los elementos propios", "segs": [0], "obj": "reloj"}, {"label": "El primer escenario", "segs": [1], "obj": "libros"}, {"label": "En el segundo escenario", "segs": [2], "obj": "documento"}, {"label": "Aparece el tercer escenario", "segs": [3], "obj": "escudo"}]}], "siluetas": true, "rotulo": null, "seccion": "Lección 2. Presunción de minoría de edad", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Para abordar los elementos propios", "El primer escenario", "En el segundo escenario", "Aparece el tercer escenario"], "titulo_genially": "Presunción de minoría de edad", "complemento_genially": "", "apartado": "", "objeto_raiz": "reloj", "bloques_fuente": [152, 155]}, {"layout": "giro", "segmentos": ["Este espacio temporal denominado adolescencia, ubicado dentro del escenario general de la niñez, que como bien sabemos, la Convención Internacional sobre los derechos del niño la contempla hasta los 18 años se entiende como un periodo de en el cual se dan grandes cambios y evoluciones tanto morfológicos como mentales en el individuo, relacionados con su desarrollo físico y mental y claves en la conformación de su personalidad. Al respecto pueden observarse recientes textos como el “cerebro del adolescente” de la profesora Amy Elen Jensen publicado en el año 2015 y otras publicaciones que se han dado al respecto.", "Es de gran importancia tener en cuenta que en este periodo se producen graves crisis y cambios en el imaginario del individuo, muchos de los cuales se dirigen al proceso de ruptura con los referentes de autoridad y la búsqueda de una identidad propia y autónoma, pero que también es una época de gran sensibilidad y por tanto algunos de los elementos propios del derecho penal, como sus escenarios y lenguajes utilizados cotidianamente como los adultos, les pueden causar daño y generar falta de disposición y aislamiento lo que dificultaría el proceso que se pretende realizar.", "Es en ese sentido que la respuesta que se dé a estos adolescentes deben estar regidos por los elementos propios de los sistemas de Justicia juvenil como lo son la especialidad, la protección, la pedagogía, la especificidad y la finalidad restaurativa.", "La observación general número 24 del comité de los derechos del niño, emitida en el año 2019 y que complementa la observación general 10 del año 2007, insta a los estados para que se ubiquen en una edad mínima de 14 años. por debajo de la cual los adolescentes no sean allegados al sistema de justicia y a partir de la promulgación de Convención internacional sobre los derechos del niño en 1989, los estados fueron ubicándose en los 14 años como edad de inicio de las posibilidades de vinculación al sistema de responsabilidad penal."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Espacio temporal denominado adolescencia", "segs": [0], "obj": "reloj"}, {"label": "Una época de gran sensibilidad", "segs": [1], "obj": "lupa"}, {"label": "Los sistemas de Justicia juvenil", "segs": [2], "obj": "escudo"}, {"label": "La observación general número 24", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 2. Presunción de minoría de edad", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Espacio temporal denominado adolescencia", "Una época de gran sensibilidad", "Los sistemas de Justicia juvenil", "La observación general número 24"], "titulo_genially": "Adolescencia y edad mínima de 14 años", "complemento_genially": "", "apartado": "", "bloques_fuente": [156, 159]}, {"layout": "fichas", "segmentos": ["Aunque hoy asistimos a unas propuestas de tipo regresivo, según las cuales se debe bajar esa edad, no se considera conveniente esa propuesta ya que no hay evidencia que demuestre la eficacia de esta decisión, por el contrario las estadísticas indican que no hay un número significativo de niños menores de 14 años que incurran en transgresiones graves a la ley y tampoco hay evidencias claras que afirmen que esta medida sirva, ya sea para disuadir a los mismos menores de edad de la comisión de los delitos o a los adultos que pretenden utilizarlos y por el contrario, lo que sí se ha demostrado, es que rebajar la edad de responsabilidad penal, coloca en riesgo inminente a la franja etárea inmediatamente anterior o sea a los menores de 12 años o la edad de inicio del sistema de justicia juvenil.", "Otro elemento que debemos tener en cuenta, es la condición de sujeto de doble protección o protección especial, por el hecho de estar cobijado por la Convención Internacional sobre los derechos del niño al no haber alcanzado la mayoría de edad y por el hecho de haber incurrido en acciones violentas o delincuenciales de donde se puede inferir que no ha estado protegido de forma efectiva, tal y como lo mandan las normas nacionales e internacionales.", "De acuerdo a lo anterior afirmamos que los adolescentes, hombres y mujeres a partir de los 14 años son sujetos de la denominada “imputabilidad atenuada” es decir, se les reconoce la capacidad de responder por sus acciones transgresoras frente a la ley penal ya que se les considera ciudadanos plenos, pero van a", "responder de manera diferente a cómo responden los adultos, lo cual marca una diferencia grande de este sistema especial no solo frente al sistema de adultos, si no frente a la tarea de diseñar las políticas de prevención y atención del fenómeno que en el estado colombiano se entiende como parte de la política criminal pero también de las políticas sociales."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Propuestas de tipo regresivo", "segs": [0], "obj": "reloj"}, {"label": "Sujeto de doble protección", "segs": [1], "obj": "escudo"}, {"label": "Capacidad de responder por sus acciones", "segs": [2], "obj": "personas"}, {"label": "Responder de manera diferente", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 2. Presunción de minoría de edad", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Propuestas de tipo regresivo", "Sujeto de doble protección", "Capacidad de responder por sus acciones", "Responder de manera diferente"], "titulo_genially": "Imputabilidad atenuada y doble protección", "complemento_genially": "", "apartado": "", "bloques_fuente": [160, 163]}, {"layout": "puntos", "segmentos": ["Para efectos de este trabajo y como resultado delas tareas que enfrenta la fiscalía y demás instituciones que abren la puerta de entrada al sistema de responsabilidad penal para adolescentes nos encontramos al menos ante dos situaciones de gran importancia: cómo actuar cuando existen dudas respecto a la edad del individuo tanto para vincularlo al sistema especial por ser menor de 18 años al momento dela comisión del hecho trasgresor o excluirlo del mismo por ser menor de 14 años y ser beneficiario de otro tipo de procesos.", "En el caso de presentarse la plena prueba documental y no haber controversia sobre la misma la actuación de las autoridades debe cumplir la ruta ya estipulada de acogerlo en el sistema o remitirlo a las instancias indicadas: fiscalía general de la nación en el caso de ser mayores de los 18 años y defensorías o comisarías de familia en el caso de ser menores de 14 años, pero cuando esta situación no es clara, entramos en el campo del manejo de las presunciones.", "Acordé a la Real Academia de la lengua española la presunción es la acción y el acto de considerar algo como cierto y probable a partir de indicios o hechos indicativos. En el campo del derecho podemos afirmar que las presunciones se clasifican de manera general en dos tipos: la apreciación de derecho la cual no admite prueba en contrario y la presunción legal que si admite discusión y argumentándolo de manera suficientemente se podría desvirtuar.", "Por otro lado, en nuestro caso particular, existen una presunción que se deriva del derecho al debido proceso y debe regir siempre las actuaciones de los operadores de las normas, ella es la presunción de inocencia. que en conjunto con el principio general de la buena fe, debe ser tenida en cuenta y desde ellas debemos considerar a toda persona como inocente mientras no se muestra lo contrario y considerar como ciertas sus afirmaciones. En Colombia, la presunción de minoría de edad se encuentra regulada en el Artículo 149 del Código de la Infancia y la Adolescencia (Ley 1098 de 2006):", "Presunción de edad. Cuando exista duda en relación con la edad del adolescente y mientras la autoridad pericial competente lo define, se presume que es menor de 18 años. En todo caso se presumirá la edad inferior."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "Dudas respecto a la edad del individuo", "segs": [0], "obj": "reloj"}, {"label": "La plena prueba documental", "segs": [1], "obj": "expediente"}, {"label": "Considerar algo como cierto y probable", "segs": [2], "obj": "lupa"}, {"label": "Artículo 149", "segs": [3, 4], "obj": "personas"}]}], "rotulo": null, "seccion": "Lección 2. Presunción de minoría de edad", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["Dudas respecto a la edad del individuo", "La plena prueba documental", "Considerar algo como cierto y probable", "Artículo 149"], "titulo_genially": "El manejo de las presunciones", "complemento_genially": "", "apartado": "", "ilustracion": "construccion-bloques.webp", "relleno": "camino-proteccion.webp", "bloques_fuente": [164, 168]}, {"layout": "esquema", "segmentos": ["Según se desprende del artículo ante la existencia de duda, es decir cuando no se cuenta con una prueba documental que certifique claramente la edad, o esta sea controvertida de manera seria, la ley ordena presumir que es menor de edad y por regla general siempre se presumirá que pertenece a la edad inferior, lo que traería consecuencias favorables para el individuo vinculado. Esta indiciación se deriva también de los principios de favorabilidad y del interés superior del adolescente.", "La ley y en especial el artículo 149 establece que esa presunción operara hasta que la autoridad competente lo defina y en tal sentido las autoridades judiciales o administrativas deben acudir al instituto nacional de medicina legal para que a partir de la práctica de pruebas técnicas y periciales determinen la edad de la persona en cuestión y una vez obtenida esta respuesta se confirmaran y continuaran o revocaran las medidas adoptadas, lo cual indica que el proceso debe avanzar en el escenario que se consideró más favorable para el individuo y en el que se ubicó de acuerdo a la presunción de su minoría de edad.", "En el caso colombiano de la presunción sobre La minoría de edad para los menores de 18 años se desprende claramente del parágrafo primero del artículo tercero de la ley 1098 del 2006 o código de infancia y adolescencia qué nos plantea explícitamente que en caso de duda sobre la mayoría o minoría de edad se entenderá que es menor de edad y se aplicarán las normas que le son favorables o sea las que están dispuestas en este código posteriormente el artículo 149 cuando está hablando al Porta de entrar a hablar de los procesos de restablecimiento de derechos plantea claramente que se presumirá La minoría de edad mientras la autoridad pericial competente Define a la edad de eso lleva a que antes de que esto suceda se le trate precisamente como a una persona menor de edad y establece una ruta para acceder a esas autoridades periciales que van a determinar la edad.", "Ante la prevención de una persona que no tiene un documento que pueda certificar sobre su edad y aduce ser menor de edad de la legislación colombiana plantea precisamente de la ley 906 de 2004 que se debe conducir directamente al centro al centro de adolescentes al centro de atención al centro de adolescentes o allí donde se inicia la ruta del servicio de Justicia Juvenil y hay una prohibición expresa de recluirlo en instituciones donde sean personas adultas así sea de manera temporal o provisionalmente mientras se tramita otro traslado."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Presumir que es menor de edad", "segs": [0], "obj": "expediente"}, {"label": "Pruebas técnicas y periciales", "segs": [1], "obj": "personas"}, {"label": "Parágrafo primero del artículo tercero", "segs": [2], "obj": "libros"}, {"label": "Prohibición expresa de recluirlo", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 2. Presunción de minoría de edad", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Presumir que es menor de edad", "Pruebas técnicas y periciales", "Parágrafo primero del artículo tercero", "Prohibición expresa de recluirlo"], "titulo_genially": "Siempre se presumirá que pertenece a la edad inferior", "complemento_genially": "", "apartado": "", "ilustracion": "cuidado-familia.webp", "arte": {"img": "cuidado-familia.webp", "pos": "fondo"}, "bloques_fuente": [169, 172]}, {"layout": "giro", "segmentos": ["Igual que sucede con los menores de edad cuando son allegados a un proceso por restablecimiento de derechos el defensor de familia tiene la obligación de realizar las pesquisas previstas en el artículo 50 de la ley 1098 haciendo la verificación del estado de sus derechos.", "Como ayuda sobre su edad la persona es remitida de manera inmediata al Instituto Nacional de Medicina legal Y ciencias forenses donde los peritos idóneos médicos antropólogos a través de diferentes exámenes entre los que juega un papel muy importante el análisis de la carta dental o el análisis óseo determinen la edad biológica aproximada de esta persona Mientras tanto se le debe ser tratado conforme a las normas previstas para el grupo de menor edad y en este caso con los beneficios que se acudían para tal como la determinación de la edad no es de una manera exacta sino que plantea algunos rangos y en específico materiales plantea a veces un Rango que nos genera dificultades al decir que la persona se encuentra entre los 17 y 19 años entonces es necesario que se opten por todas las medidas beneficios y garantías que le corresponderían al rango de edad menor.", "Recordemos que entre los 14 y los 18 años entonces son sujetos a los que es posible vincular al sistema de responsabilidad penal para adolescentes se les concederán o reconocerán todas las garantías del debido proceso manual de garantía sus propias del derecho penal las garantías propias del sistema especializado de adolescentes teniendo en cuenta que este proceso es de carácter eminentemente pedagógico protector y restaurativo y tiene una limitaciones y asegura das si no encontramos frente a la situación de que la persona que no ha llegado un documento efectivo sobre su edad y el debate se da entre si es mayor de 14 años para entrar al sistema de responsabilidad penal o es menor de 14 para excluir lo de él se cumplen los mismos requisitos o los mismos.", "En el ítem anterior se entendería que por debajo de los 14 años no tienen responsabilidad penal por lo tanto quedan excluidos del sistema y deben ser entregados al ICBF para que inicie el proceso de restablecimiento de derechos el de anotar que si de manera posterior se certifica que el individuo hombre o mujer si era mayor de 14 años entonces célebre en librar o hacer los trámites necesarios con el umbral la voluntad de prevención para llegarlo al proceso de Justicia juvenil.", "[Otro elemento de gran importancia que habría que tener aquí en cuenta y que a veces se ha prestado para discusión y plantear diferentes posturas por parte de los fiscales en una policía es si se debe creer en el dicho del Adolescente que no está acompañado o en el dicho de sus padres el caso de acompañar si no hay en ese momento un documento que certifique la edad que efectivamente tiene la persona es necesario creer en esos dichos por el principio de la buena fe la presunción de la esencia y el induvio promino favor de los infancia si posteriormente se deduce o se prueba que han hecho incurrir en un error a los funcionarios pues sencillamente se reinician las acciones correspondientes desde el rango de edad al que sí está efectivamente vinculado el individuo y si es del caso se establecen las acciones administrativas o penales y necesarias para las personas que hicieron."], "parrafo": [0, 2, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "El defensor de familia", "segs": [0], "obj": "libros"}, {"label": "La edad biológica aproximada", "segs": [1], "obj": "lupa"}, {"label": "Entre los 14 y los 18 años", "segs": [2], "obj": "reloj"}, {"label": "Debajo de los 14 años", "segs": [3], "obj": "escalones"}, {"label": "El principio de la buena fe", "segs": [4], "obj": "personas"}]}], "rotulo": null, "seccion": "Lección 2. Presunción de minoría de edad", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["El defensor de familia", "La edad biológica aproximada", "Entre los 14 y los 18 años", "Debajo de los 14 años", "El principio de la buena fe"], "titulo_genially": "La determinación de la edad", "complemento_genially": "", "apartado": "", "bloques_fuente": [173, 175]}]}</script>
