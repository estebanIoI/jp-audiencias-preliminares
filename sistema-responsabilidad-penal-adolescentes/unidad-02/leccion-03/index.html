<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-srpa", "paleta": {"marino": "#07415C", "teal": "#2E6377", "oxido": "#B55D41", "coral": "#FF6936", "crema": "#FFE1D7", "niebla": "#CAE9E4", "hielo": "#E9F6F4", "celeste": "#CAE9E4", "madera": "#B55D41", "piso": "#CAE9E4", "gris": "#CAE9E4", "amarillo": "#FF6936"}, "anclas": {"construccion-bloques.webp": {"r": 1.2712, "p": [[62, 53], [41, 63], [52, 76], [66, 89]]}, "rompecabezas.webp": {"r": 1.264, "p": [[42, 31], [66, 43], [40, 66], [62, 69]]}, "camino-proteccion.webp": {"r": 1.1335, "p": [[79, 26], [87, 58], [61, 86], [20, 72]]}, "circulo-dialogo.webp": {"r": 1.1524, "p": [[31, 13], [68, 9], [11, 62], [89, 66]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "srpa", "partirComas": true, "bitacora": true, "retro": {"reacciones": ["rompecabezas.webp", "construccion-bloques.webp", "circulo-dialogo.webp"], "frases": ["¿Seguro?", "¡Revisa de nuevo!", "¡Mira otra vez!", "¡Casi!", "¡Un momento!", "¡Vuelve a leer!"], "acierto": ["camino-proteccion.webp", "cuidado-familia.webp"], "rotulo": "Unidad 2 · Lección 3"}, "leccion_rotulo": "Lección 3", "unit": 2, "lesson": 3, "heading": "Lección 3. Políticas públicas e Instituciones que conforman el sistema de responsabilidad penal para adolescentes", "scenes": [{"layout": "giro", "segmentos": ["Según el diccionario de la Real Academia Española (RAE), la palabra sistema tiene varias acepciones principales, de las cuales destacamos la siguiente:", "\"Un conjunto de cosas que, relacionadas entre sí ordenadamente, contribuyen a un determinado objeto o fin\" Definición que implica por lo menos tres elementos: partes o componentes, objetivo o fin propuesto y formas adecuadas de relación o funciones de cada una de las partes.”", "Según su origen los sistemas pueden ser: Naturales cuando son creados por la naturaleza (ej. el sistema solar o ecológico); artificiales: los que son fabricados o ideados por el ser humano (ej. una máquina); sociales: Compuestos por grupos de personas e interacciones entre ellas (ej. una empresa y conceptuales: los que se forman por ideas, números o símbolos abstractos.", "Cuando hacemos referencia al sistema de justicia juvenil estamos referenciando un sistema social compuesto por un grupo de instituciones que desarrolla una serie de acciones tendientes a atender el fenómeno de la incursión de los niños, niñas y adolescentes de manera temprana en la delincuencia.", "La definición de este sistema, denominado en Colombia Sistema de responsabilidad penal para adolescentes, la debemos deducir de los artículos 37 y 40 de la Convención sobre los derechos del Niño (CDN) y de los artículos 139 a 142 de la ley 1098 de 2006 que contiene el Código de infancia y adolescencia colombiano."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Según el diccionario de la Real", "segs": [0, 1], "obj": "reloj"}, {"label": "Según su origen los sistemas", "segs": [2], "obj": "personas"}, {"label": "Cuando hacemos referencia al sistema", "segs": [3], "obj": "documento"}, {"label": "La definición de este sistema, denominado", "segs": [4], "obj": "libros"}]}], "rotulo": null, "seccion": "Lección 3. Políticas públicas e Instituciones que conforman el sistema de responsabilidad penal para adolescentes", "grupo": "Definición, naturaleza y generalidades del Sistema penal para adolescentes", "titulos_fuente": ["Definición, naturaleza y generalidades del Sistema penal para adolescentes"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Según el diccionario de la Real", "Según su origen los sistemas", "Cuando hacemos referencia al sistema", "La definición de este sistema, denominado"], "titulo_genially": "Definición, naturaleza y generalidades del Sistema penal para adolescentes (1 de 4)", "complemento_genially": "", "apartado": "", "ilustracion": "rompecabezas.webp", "arte": {"img": "rompecabezas.webp", "pos": "izq"}, "relleno": "construccion-bloques.webp", "bloques_fuente": [178, 182]}, {"layout": "esquema", "segmentos": ["Naturaleza del sistema de justicia penal para adolescentes. Justicia penal juvenil.", "Teniendo en cuenta los debates que se dieron de manera previa a la Convención y la urgencia de conciliar varias posturas, entre ellas las que planteaban la inimputabilidad general de los menores de 18 años debido a la falta de legitimidad del Estado para hacerles un juicio de reproche, puesto que previamente el mismo Estado había incumplido con una de sus obligaciones esenciales como los es el de proporcionar un entorno seguro que garantice que los niños, niñas y adolescentes no incurrieran en la delincuencia, anotamos entonces que los sistemas de justicia juvenil surgen como una herramienta que permite garantizar a estos niños, niñas y adolescentes reciban una respuesta que les permita y facilite una inclusión integral a la sociedad y por tanto se plantea como un sistema de garantía de derechos y no como un sistema sancionatorio propio del derecho penal.", "Por otro lado, considerando la condición de estos adolescentes y jóvenes que han sido sujetos de vulneraciones y negaciones de derechos, situación que, entre otras, los ha hecho susceptibles de ser partícipes en actividades delictivas; el sistema de justicia juvenil se plantea como un escenario para el restablecimiento de derechos, situación que se traduce en la duda persistente acerca de la ubicación que debe dársele dentro del campo de las políticas públicas, oscilando entre los programas de atención social y los programas de administración de justicia.", "El Artículo 139 del Código de infancia y adolescencia, plantea el Sistema de responsabilidad penal para adolescentes como el “conjunto de principios, normas, procedimientos, autoridades judiciales especializadas y entes administrativos que rigen o intervienen en la investigación y juzgamiento de delitos cometidos por personas que tengan entre catorce (14) y dieciocho (18) años al momento de cometer el hecho punible”."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Naturaleza del sistema de justicia penal para adolescentes", "segs": [0], "obj": "documento"}, {"label": "Teniendo", "segs": [1], "obj": "reloj"}, {"label": "considerando la condición de estos adolescentes", "segs": [2], "obj": "personas"}, {"label": "El Artículo 139 del Código", "segs": [3], "obj": "libros"}]}], "rotulo": null, "seccion": "Lección 3. Políticas públicas e Instituciones que conforman el sistema de responsabilidad penal para adolescentes", "grupo": "Definición, naturaleza y generalidades del Sistema penal para adolescentes", "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Naturaleza del sistema de justicia penal para adolescentes", "Teniendo", "considerando la condición de estos adolescentes", "El Artículo 139 del Código"], "titulo_genially": "Definición, naturaleza y generalidades del Sistema penal para adolescentes (2 de 4)", "complemento_genially": "", "apartado": "", "objeto_raiz": "reloj", "bloques_fuente": [183, 186]}, {"layout": "fichas", "segmentos": ["De acuerdo con lo expuesto, esta definición contiene los elementos propios de un sistema socia ya que unos miembros o participes que son las “autoridades judiciales especializadas y los entres administrativos; unas herramientas expresadas en los principios, las normas y los procedimientos, que a su vez establecen una forma de relacionamiento y un objetivo que es precisamente el de dar respuesta o atender a los adolescentes y jóvenes menores de 18 y mayores de 14 que hayan cometido algún delito.", "Si bien está definición parece referirnos a un sistema derivado del derecho penal por hablarse de una infracción a este tipo de norma, debemos tener en cuenta que su naturaleza proviene de los derechos humanos garantizando a estos jóvenes una respuesta enmarcada dentro de los parámetros de la Convención sobre los derechos del niño y demás instrumentos que componen el cuerpo iuris internacional de los sistemas de justicia juvenil en especial Las Reglas de Beijín, las directrices de Riad, las reglas de la Habana, reglas de Tokio y las recomendaciones contenidas en las Observaciones Generales 10 y 24 emitidas por el Comité de los derechos del niño", "Aunque el artículo 140 anuncia plantear la finalidad del sistema, empieza determinando las características que este debe tener, siendo lo primero su carácter pedagógico, seguido de la especificidad y la diferenciación respecto del sistema de adultos, conforme a la protección integral; posteriormente plantea que el proceso tiene como fin garantizar la justicia restaurativa, la verdad y la reparación del daño siendo estos los elementos que podemos considerar como fines del sistema.", "Por su parte el artículo 141 establece como Principios del sistema de responsabilidad penal para adolescentes los mismos principios y definiciones consagrados en la Constitución Política, en los instrumentos internacionales de derechos humanos y en la presente ley los cuales deben ser aplicados en el Sistema de Responsabilidad para Adolescentes."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "De acuerdo con lo expuesto", "segs": [0], "obj": "escalones"}, {"label": "Si bien está definición parece referirnos", "segs": [1], "obj": "escudo"}, {"label": "el artículo 140 anuncia plantear", "segs": [2], "obj": "megafono"}, {"label": "el artículo 141 establece como Principios", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 3. Políticas públicas e Instituciones que conforman el sistema de responsabilidad penal para adolescentes", "grupo": "Definición, naturaleza y generalidades del Sistema penal para adolescentes", "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["De acuerdo con lo expuesto", "Si bien está definición parece referirnos", "el artículo 140 anuncia plantear", "el artículo 141 establece como Principios"], "titulo_genially": "Definición, naturaleza y generalidades del Sistema penal para adolescentes (3 de 4)", "complemento_genially": "", "apartado": "", "bloques_fuente": [187, 190]}, {"layout": "esquema", "segmentos": ["Este criterio integracionista que referencia otras normas y que de manera similar lo plantea el artículo 6 de la Ley 1098 de 2006, sobre la convención de los derechos del niño y los tratados internacionales de derechos humanos, hacen que el sistema de responsabilidad penal para adolescentes de adolescentes deba ser concebido como una norma que desarrolla y garantiza de derechos superando su carácter penal y punitivo.", "Por otro lado la ubicación de las normas correspondientes al sistema de responsabilidad penal para adolescentes de adolescentes, como una parte del Libro II del código de Infancia y adolescencia nos compele a entenderlo como parte de este estatuto y por tanto debe estar inspirado en sus principios propuestos en los primeros artículos y gozan para su efectividad de los elementos planteados en el Libro III que habla de las políticas públicas que deben garantizar los aspectos contenidos en el todo el estatuto normativo"], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Este criterio integracionista que referencia", "segs": [0], "obj": "libros"}, {"label": "La ubicación de las normas", "segs": [1], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 3. Políticas públicas e Instituciones que conforman el sistema de responsabilidad penal para adolescentes", "grupo": "Definición, naturaleza y generalidades del Sistema penal para adolescentes", "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Este criterio integracionista que referencia", "La ubicación de las normas"], "titulo_genially": "Definición, naturaleza y generalidades del Sistema penal para adolescentes (4 de 4)", "complemento_genially": "", "apartado": "", "relleno": "rompecabezas.webp", "objeto_raiz": "libros", "bloques_fuente": [191, 192]}, {"layout": "giro", "segmentos": ["El artículo 163 bajo el título de integración del sistema enuncian las entidades que lo conforman. En primer lugar, aparece la Fiscalía General de la Nación, un elemento gran novedad frente al anterior código del menor (Dto. 2737 de 1989) en el cuál no aparece esta institución.", "Su presencia se materializa a través de Los Fiscales delegados ante los Jueces Penales para adolescentes, quienes se ocuparán de la dirección de las investigaciones en las cuales se encuentren presuntamente comprometidos adolescentes, como autores o partícipes de conductas delictivas. Aunque la fiscalía ha venido cumpliendo con esta tarea la especialidad solo se ha logrado casi en todas las ciudades capitales que coinciden con cabeceras de distritos judiciales y en algunas ciudades intermedias, siendo necesario que en las demás zonas esta función sea ejercida por fiscales delegados ante juzgados promiscuos de familia y que por decisiones y necesidades administrativas comparten esta labor con otras funciones propias de la entidad.", "En segundo lugar, aparece la Rama Judicial, expresada en los numerales 2°, 3° y 4°, discriminando sus funciones de la siguiente forma: “2°) Los Jueces Penales para adolescentes, Promiscuos de Familia y los Municipales quienes adelantarán las actuaciones y funciones judiciales que les asigna la ley. 3°) Las Salas Penales y de Familia de los Tribunales Superiores de Distrito judicial que integrarán la Sala de Asuntos Penales para adolescentes en los mismos tribunales, ante quienes se surtirá la segunda instancia y 4°) La Corte Suprema de Justicia, Sala de Casación Penal, ante la cual se tramitará el recurso extraordinario de casación, y la acción de revisión”.", "Continua el citado artículo 63 en el numeral 5° incluyendo a la Policía Judicial y al Cuerpo Técnico Especializado adscrito a la Fiscalía delegada ante los jueces Penales para adolescentes y Promiscuos de Familia, en el cumplimiento de las tareas propias del ente investigador en el proceso de constatar la ocurrencia de los hechos, individualizar a los actores, ubicarlos, establecer sus arraigos y demás actividades necesarias para lograr el avance de la investigación en lo que al proceso judicial se refiere."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "El artículo 163 bajo el título", "segs": [0], "obj": "libros"}, {"label": "Su presencia se materializa a través", "segs": [1], "obj": "lupa"}, {"label": "En segundo lugar, aparece la Rama", "segs": [2], "obj": "tribunal"}, {"label": "Continua el citado artículo 63", "segs": [3], "obj": "personas"}]}], "rotulo": null, "seccion": "Lección 3. Políticas públicas e Instituciones que conforman el sistema de responsabilidad penal para adolescentes", "grupo": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes", "titulos_fuente": ["Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["El artículo 163 bajo el título", "Su presencia se materializa a través", "En segundo lugar, aparece la Rama", "Continua el citado artículo 63"], "titulo_genially": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes (1 de 13)", "complemento_genially": "", "apartado": "", "ilustracion": "rompecabezas.webp", "arte": {"img": "rompecabezas.webp", "pos": "der"}, "bloques_fuente": [194, 197]}, {"layout": "esquema", "segmentos": ["Es necesario advertir que está tarea no puede confundirse la que realizan los equipos interdisciplinarios de las defensorías de familia, tampoco con la labor que cumplen los equipos psicosociales de las entidades que operan las medidas, en el caso que el adolescente o joven haya sido afectado con el internamiento preventivo; ya que los fines de la intervención de cada equipo son diferentes, los miembros del equipo defensorial están encaminados a lograr la verificación de vulneraciones y el restablecimiento de los derechos del adolescente mientras que los equipos psicosociales de las organizaciones operadoras de medidas se enfocan a cumplir con los requisitos necesarios para un buen desarrollo del proceso de atención y la inclusión social integral del adolescente o joven transgresor de la ley y el cuerpo técnico de investigación de la fiscalía a identificar las circunstancias personales y sociales desde las que se produjo la acción delictiva y a determinar el grado de responsabilidad en la participación del adolescente o joven en los hechos investigados.", "Se destaca como una práctica positiva el hecho que, en el momento de la implementación del sistema en los diferentes distritos judiciales, algunas direcciones seccionales de fiscalía conformaron unidades del CTI destinadas al sistema, con un alto grado de capacitación, lo cual fue de gran provecho para la cualificación de sus actuaciones, en este aspecto se destacó entre otras la dirección seccional de fiscalías de Medellín. No obstante lo anterior, está práctica se fue reduciendo y en algunos casos los equipos fueron suprimidos dejando está tarea a cargo exclusivo de los miembros de la policía nacional a los que le han sido asignadas funciones de policía judicial lo cual significa una regresión rápida en los avances dados frente a la implementación del sistema.", "El numeral 6° asigna a la Policía Nacional con su personal especializado la función de apoyar las acciones de las autoridades judiciales y entidades del sistema, asignación que si bien es cierto atañe de manera directa a la policía de infancia y adolescencia, no exime a los demás miembros de la policía en cuanto a su responsabilidad frente a las acciones urgentes, tales como las aprehensiones en flagrancia, la vigilancia externa y perimetral de las sedes en las instituciones en las cuales se desarrollan los programas y la intervención para garantizar el orden y la seguridad en los programas cuando sea solicitado por la persona que haga las veces de coordinador de los mismos (ver reglas de la Habana).", "Otro elemento de gran importancia lo constituyen las acciones que puede y debe realizar la policía nacional con los jóvenes y adolescentes que hacen parte de los programas en materia de prevención del delito o de la reincidencia, promoción de los derechos humanos y sobre todo en la tarea de reconciliarlos con la institucionalidad publica. Al respecto pueden observarse programas que se desarrollan en otros países superando el mito erróneo de la prohibición a la policía de entrar en contacto con los adolescentes que están vinculados a las medidas tanto privativas como no privativas de la libertad."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Es necesario advertir que está tarea", "segs": [0], "obj": "carpetas"}, {"label": "Se destaca como una práctica positiva", "segs": [1], "obj": "escalones"}, {"label": "El numeral 6° asigna", "segs": [2], "obj": "puertaCerrada"}, {"label": "Otro elemento de gran importancia", "segs": [3], "obj": "personas"}]}], "rotulo": null, "seccion": "Lección 3. Políticas públicas e Instituciones que conforman el sistema de responsabilidad penal para adolescentes", "grupo": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes", "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Es necesario advertir que está tarea", "Se destaca como una práctica positiva", "El numeral 6° asigna", "Otro elemento de gran importancia"], "titulo_genially": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes (2 de 13)", "complemento_genially": "", "apartado": "", "ilustracion": "construccion-bloques.webp", "arte": {"img": "construccion-bloques.webp", "pos": "fondo"}, "relleno": "cuidado-familia.webp", "bloques_fuente": [198, 201]}, {"layout": "giro", "segmentos": ["La defensoría pública aparece en el numeral 7° del artículo 163, a través de los defensores del Sistema Nacional de Defensoría Pública de la Defensoría del Pueblo, quienes deben asumir la defensa técnica del proceso, cuando el niño, niña o adolescente carezca de apoderado.", "En la práctica la mayoría de los casos son asistidos desde la defensa pública y se han presentado debates interesantes en cuanto a la capacidad del adolescente para constituir apoderado, de manera especial, cuando se presume que está siendo instrumentalizado por parte de grupos ilegales que llegan hasta brindarle este servicio. Otro elemento que merece ser señalado se refiere al acompañamiento y asesoría por parte del defensor técnico, una vez impuesta la medida, solicitud que, a manera de reclamo, fue recibida en las entrevistas hechas durante el proceso de verificación de derechos humanos ordenado en el año 2015 por parte del congreso de la república (ver informes).", "Con ocasión de este seguimiento se ha venido recomendando a las instituciones del Ministerio Público, en especial a las encargadas de realizar misiones de verificación del cumplimiento y garantía de derechos y en este caso a las defensorías regionales, programar y realizar visitas de verificación, tanto anunciadas como no anunciadas y presentar los respectivos informes haciendo las recomendaciones del caso.", "El artículo 8° presenta como institución parte del sistema al Instituto Colombiano de Bienestar Familiar a través de las Defensorías de Familia en el desarrollo del proceso propio para la verificación de la garantía de derechos y la implementación de las medidas que deban adoptarse para su restablecimiento. En esta tarea las decisiones de la defensoría de familia y de sus equipos interdisciplinario deben respetar las decisiones de las autoridades judiciales y buscar la armonía, concordancia y coordinación con las mismas."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "La defensoría pública aparece", "segs": [0], "obj": "personas"}, {"label": "En la práctica la mayoría", "segs": [1], "obj": "documento"}, {"label": "Con ocasión de este seguimiento", "segs": [2], "obj": "camara"}, {"label": "El artículo 8° presenta como institución", "segs": [3], "obj": "escudo"}]}], "rotulo": null, "seccion": "Lección 3. Políticas públicas e Instituciones que conforman el sistema de responsabilidad penal para adolescentes", "grupo": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes", "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["La defensoría pública aparece", "En la práctica la mayoría", "Con ocasión de este seguimiento", "El artículo 8° presenta como institución"], "titulo_genially": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes (3 de 13)", "complemento_genially": "", "apartado": "", "ilustracion": "camino-proteccion.webp", "arte": {"img": "camino-proteccion.webp", "pos": "izq"}, "bloques_fuente": [202, 205]}, {"layout": "fichas", "segmentos": ["El Instituto Colombiano de Bienestar Familiar vuelve a ser mencionado en el numeral 9°, recordando la responsabilidad que le atañe de establecer los lineamientos técnicos para la ejecución de las medidas y aunque no lo menciona esta ley, le asiste la función de definir las contrataciones con las entidades que desarrollan las medidas (operadores), brindarles la asesoría técnica necesaria y supervisar los respectivos contratos para la administración de estos centros.", "A partir de este numeral se deduce la responsabilidad que tienen las entidades ejecutoras de las medidas, denominadas operadores, quienes sin ser mencionados por la ley entran a jugar un papel de alta importancia, pues son quienes deben desarrollar los procesos individuales y grupales tendientes a lograr los fines del sistema y el parágrafo 3º de este artículo plantean que “Los equipos que desarrollan programas especializados, brindarán a las autoridades judiciales apoyo y asesoría sobre el proceso de cada uno de los adolescentes que están vinculados a estos programas, informando los progresos y necesidades que presenten”.", "El numeral 8° involucra a las comisarías de familia y a los inspectores de policía, en aquellos casos en los cuales no se cuente con la disponibilidad de las defensorías de familia, delegación que de manera explícita les hace la ley 1098 para las acciones propias del proceso de verificación y restablecimiento de derechos. Las comisarías también se ven involucradas en el sistema cuando el artículo 190 de la ley 1098 de 2006 las faculta para investigar y sancionar las contravenciones de policía cometidas por adolescentes, llegando está competencia hasta los alcaldes Municipales, elemento que en la práctica parece ser utilizado en forma mínima. Igual estipulación existe para las contravenciones de tránsito cometidas por adolescentes entre los 15 y los 18 años.", "El numeral 10° involucra a un número plural de entidades, cuando afirma que hacen parte del sistema de responsabilidad penal para adolescentes \"Las demás Instituciones que formen parte del Sistema Nacional de Bienestar Familiar\", la cuales tienen a su cargo la prestación de los servicios que garantizan los derechos de los adolescentes y jóvenes vinculados al sistema de responsabilidad penal para adolescentes."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Instituto Colombiano de Bienestar Familiar vuelve", "segs": [0], "obj": "documento"}, {"label": "A partir de este numeral", "segs": [1], "obj": "carpetas"}, {"label": "El numeral 8° involucra", "segs": [2], "obj": "libros"}, {"label": "El numeral 10° involucra", "segs": [3], "obj": "escudo"}]}], "rotulo": null, "seccion": "Lección 3. Políticas públicas e Instituciones que conforman el sistema de responsabilidad penal para adolescentes", "grupo": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes", "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Instituto Colombiano de Bienestar Familiar vuelve", "A partir de este numeral", "El numeral 8° involucra", "El numeral 10° involucra"], "titulo_genially": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes (4 de 13)", "complemento_genially": "", "apartado": "", "relleno": "rompecabezas.webp", "bloques_fuente": [206, 209]}, {"layout": "esquema", "segmentos": ["Posteriormente a través de los parágrafos 1° y 2° que amplían este artículo se dan instrucciones precisas a los directivos de las entidades en cuanto a su responsabilidad de garantizar el recurso humano que se requiera para el buen funcionamiento del sistema y la responsabilidad de brindar la especialización al personal, así como la obligación de supervisar que los funcionarios adscritos al sistema de responsabilidad penal para adolescentes posean las calidades requeridas", "Como complemento de este artículo, encontramos que los artículos 164 165 y 166 plantean algunas exigencias para el consejo superior de la judicatura en el sentido de asignar los jueces necesarios para el cubrimiento del sistema de responsabilidad penal para adolescentes tanto en las cabeceras de distrito como posteriormente ir logrando una cobertura nacional, lo cual no se ha logrado cumplir y por el contrario hemos visto como en algunas regiones del país se han venido devolviendo las figuras de jueces especializados de infancia y adolescencia a jueces mixtos. Lo que implica un elemento regresivo frente a los logros obtenidos en el sistema de responsabilidad penal para adolescentes y sobre todo, perjudicial para la respuesta que se brinda a los niños niñas y adolescentes ya que estos funcionarios en muchos momentos carecen de la especialidad suficiente y por lo tanto no logran la diferenciación necesaria del sistema frente al sistema de adultos generando así algunas confusiones", "Conocidas las instituciones que se plantean en el artículo 163 de la ley 1098, nos encontramos que el numeral 10 propone una serie de entidades de una amplia gama al decir claramente que hacen parte del sistema de responsabilidad penal para adolescentes todas aquellas instituciones que conforman el Sistema Nacional de bienestar familiar. En este sentido que nos encontramos que la gran mayoría de ellas hacen parte de los entes territoriales tanto en el nivel departamental como en el municipal, pero aun así falta designar la entidad encarga de dirigir o coordinar a las demás instituciones, factor necesario para que desde su acción conjunta el sistema de responsabilidad penal para adolescentes pueda cumplir con sus propósitos.", "El Decreto 1885 de 2015 y su papel en la coordinación interinstitucional del sistema de responsabilidad penal para adolescentes."], "parrafo": [0, 1, 2, 3], "vineta": [3], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Posteriormente a través de los parágrafos 1°", "segs": [0], "obj": "escudo"}, {"label": "Como complemento de este artículo, encontramos", "segs": [1], "obj": "escalones"}, {"label": "Conocidas las instituciones", "segs": [2], "obj": "libros"}, {"label": "Decreto 1885 de 2015", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 3. Políticas públicas e Instituciones que conforman el sistema de responsabilidad penal para adolescentes", "grupo": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes", "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Posteriormente a través de los parágrafos 1°", "Como complemento de este artículo, encontramos", "Conocidas las instituciones", "Decreto 1885 de 2015"], "titulo_genially": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes (5 de 13)", "complemento_genially": "", "apartado": "", "ilustracion": "rompecabezas.webp", "arte": {"img": "rompecabezas.webp", "pos": "fondo"}, "bloques_fuente": [210, 213]}, {"layout": "giro", "segmentos": ["Ya desde las recomendaciones y observaciones al primer informe presentado por el Estado colombiano ante el comité internacional de los derechos del niño, se nos venía reclamando la tardanza en adoptar un sistema de Justicia juvenil conforme a los parámetros del artículo 37 y 40 de la convención internacional de los derechos del niño puesto que nos regíamos por el entonces denominado código del menor decreto 2737 / 89 que en su título quinto nos hablaba del menor en conflicto con la ley, estatuto basado en la entonces llamada doctrina de la situación irregular.", "El estado colombiano mediante la ley 1098 del 2006 logra dar respuesta a esta recomendación hecha por el comité internacional de los derechos del niño y presenta en la ley 1098 de 2006 “el sistema de responsabilidad penal para adolescentes”, forma en la que se denominó en Colombia el sistema de justicia juvenil pedido por la Convención, el cual es mucho más cercano a los parámetros planteados por la convención, avanzando así en el proceso de adecuación de la nuestra legislación a los parámetros del Estatuto internacional.", "Sin embargo, subsistía la falta de un ente rector que coordinara el sistema de responsabilidad penal para adolescentes y en el año 2015 el Estado colombiano atendiendo esta solicitud del comité de los derechos del niño, expide el Decreto 1885 en el cual crea un sistema para coordinar el sistema de responsabilidad penal para adolescentes.", "Esta respuesta que en un principio se vio como un poco de salida, puesto que lo que se pretendía era que el Estado designara y enunciara claramente cuál era el ente rector, no obstante la respuesta dada por el Estado colombiano, logra superar algunas dificultades de coordinación interinstitucional y genera un sistema creando el Comité Nacional de Coordinación del Sistema de responsabilidad penal para adolescentes, al cual concurren una serie de instituciones tanto de la rama judicial como de la ejecutiva, que deben cumplir con sus obligaciones para garantizar los derechos de los niños niñas y adolescentes vinculados al sistema de responsabilidad penal, encontramos entonces que el decreto recoge gran parte de las entidades que fueron anunciadas en el literal 10 del artículo 163 de la ley 1098, planteando la pertenencia a ese comité tanto en el orden nacional como en el orden departamental de instituciones que cumplen diferentes servicios propios del Sistema Nacional de Bienestar Familiar a través de las cuales se garantizan derechos cómo son los servicios de educación, salud, justicia y formación para el empleo."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Ya desde las recomendaciones y observaciones", "segs": [0], "obj": "libros"}, {"label": "El estado colombiano", "segs": [1], "obj": "documento"}, {"label": "subsistía la falta de un ente", "segs": [2], "obj": "reloj"}, {"label": "Esta respuesta que en un principio", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 3. Políticas públicas e Instituciones que conforman el sistema de responsabilidad penal para adolescentes", "grupo": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes", "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Ya desde las recomendaciones y observaciones", "El estado colombiano", "subsistía la falta de un ente", "Esta respuesta que en un principio"], "titulo_genially": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes (6 de 13)", "complemento_genially": "", "apartado": "", "bloques_fuente": [214, 217]}, {"layout": "esquema", "segmentos": ["Como complemento de este artículo encontramos que los artículos 164, 165 y 166 plantean algunas exigencias para el Consejo Superior de la Judicatura en el sentido de asignar los jueces necesarios para el cubrimiento del sistema de responsabilidad penal para adolescentes tanto en las cabeceras de los distritos judiciales para progresivamente ir logrando una cobertura nacional, propósito que hasta ahora no se ha logrado cumplir y por el contrario hemos visto como en algunas regiones del país, antes se han venido devolviendo las figuras de jueces especializados de infancia y adolescencia a la de jueces mixtos, lo que implica otro elemento regresivo dentro de los logros obtenidos en el sistema de responsabilidad penal para adolescentes y sobre todo perjudicial para la respuesta que se brinda a los niños niñas y adolescentes ya que estos funcionarios en muchos momentos carecen de la especialidad suficiente y por lo tanto no logran la diferenciación necesaria del sistema frente al sistema de adultos generando así confusiones en su aplicación.", "Vistas las instituciones que se plantean en el artículo 163 de la ley 1098, nos encontramos que el numeral 10° propone una serie de instituciones de una amplia gama al enunciar claramente que hacen parte del sistema de responsabilidad penal para adolescentes “todas aquellas instituciones que conforman el Sistema Nacional de bienestar familiar” en este sentido nos encontramos que de estas entidades, la gran mayoría de hacen parte de los entes territoriales tanto a nivel departamental como a nivel municipal. Pero a pesar de estos avances se percibe la falta de una directriz clara que designe que entidad debe ejercer la coordinación necesaria para que, definidas claramente las responsabilidades de cada entidad, el sistema pueda cumplir con sus objetivos.", "Ya desde las recomendaciones y observaciones hechas al primer informe presentado por el estado colombiano ante el comité internacional de los derechos del niño, se nos venía reclamando la tardanza en adoptar un sistema de Justicia juvenil conforme a los parámetros del artículo 37 y 40 de la Convención Internacional sobre los derechos del niño, puesto que nos regíamos por el entonces denominado código del menor decreto 2737/89, el cual en su título V nos hablaba del menor en conflicto con la ley.", "El estado colombiano mediante la ley 1098 del 2006 logra cumplir con este requisito o exigencia hecha por el comité internacional de los derechos del niño y presenta un sistema de responsabilidad penal, nombre con el que se designó en nuestro país el sistema de justicia juvenil, el cual es mucho más cercano a los parámetros de la convención internacional y con este instrumento y los avances contenidos en la ley 1098 de 2006 se denota el avance en el proceso de adecuación de nuestra legislación a la Convención, sin embargo subsistía la falta de designar un ente rector que coordinará el sistema y en el año 2015, el Estado colombiano, atendiendo esta solicitud del comité expide el decreto 1885 en el cual se crea un sistema para coordinar el sistema de responsabilidad penal para adolescentes; esta respuesta que en un principio se vio como un poco de salida, puesto que lo que se quería era que se enunciara claramente cuál era el ente rector, logra superar algunas dificultades en el manejo interinstitucional y crea un sistema a partir del Comité Nacional de coordinación del sistema de responsabilidad penal para adolescentes."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Como complemento de este artículo encontramos", "segs": [0], "obj": "documento"}, {"label": "Vistas las instituciones", "segs": [1], "obj": "libros"}, {"label": "Ya desde las recomendaciones y observaciones hechas", "segs": [2], "obj": "expediente"}, {"label": "El estado colombiano", "segs": [3], "obj": "escalones"}]}], "rotulo": null, "seccion": "Lección 3. Políticas públicas e Instituciones que conforman el sistema de responsabilidad penal para adolescentes", "grupo": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes", "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Como complemento de este artículo encontramos", "Vistas las instituciones", "Ya desde las recomendaciones y observaciones hechas", "El estado colombiano"], "titulo_genially": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes (7 de 13)", "complemento_genially": "", "apartado": "", "objeto_raiz": "documento", "bloques_fuente": [218, 221]}, {"layout": "giro", "segmentos": ["En dicho comité se vinculan una serie de instituciones tanto del orden judicial como del orden administrativo que deben cumplir cabalmente con sus obligaciones para garantizar los derechos de los niños niñas y adolescentes vinculados al sistema de responsabilidad penal. En esta tarea encontramos, como situación interesante que el decreto recoge gran parte de las entidades que fueron anunciadas en el literal 10° del artículo 163 de la ley 1098 y plantea la pertenencia a ese comité tanto en el orden nacional como en el orden departamental de instituciones que cumplen diferentes servicios propios del Sistema Nacional de Bienestar Familiar como son los servicios de educación, salud, justicia, seguridad, y formación para el empleo.", "Este decreto 1885 del 2015 tiene como consideraciones para su expedición el artículo 44 de la constitución nacional, en el cual se habla de las obligaciones del Estado para garantizar los derechos de los niños niñas y adolescentes, el artículo 45 de la misma Constitución que habla de la protección especial que se debe brindar a los adolescentes y plantea la necesidad de relacionarlo con el artículo 113 de la citada Norma superior, que prescribe que el Estado tiene unas funciones separadas pero debe colaborar entre sí y armónicamente sincronizarse para poder cumplir con sus fines. Estos elementos ya nos empiezan a plantear un esbozo de las políticas públicas de infancia y adolescencia frente al cumplimiento de la ley 1098", "Posteriormente los considerandos del decreto 1885 nos remiten al artículo 139 de la ley 1098 en el cual se crea el sistema de responsabilidad penal para adolescentes y enuncia que el numeral 4° del artículo 102 del libro tercero de la ley 1098, ya nos habla de las políticas públicas y se refiere a la necesidad de mantener como uno de los objetivos de las políticas de infancia adolescencia la colaboración y articulación armónica entre las instituciones responsables.", "Posteriormente se refiere al artículo 215 de la ley del 1098 en el que se estipula la necesidad de llegar a acuerdos frente al presupuesto para logra la financiación de las diferentes acciones que haya que llevar a cabo para garantizar estos derechos y en ese sentido el decreto 1885 a la vez que cumple la recomendación planteada por el comité de los derechos del niño de determinar un ente rector para la coordinación del sistema de responsabilidad penal nos va a brindar unos elementos más claros para el cumplimiento de las políticas públicas de infancia y adolescencia en cuanto a los sistemas de justicia juvenil se refiere."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "En dicho comité se vinculan", "segs": [0], "obj": "escudo"}, {"label": "Este decreto 1885 del 2015 tiene", "segs": [1], "obj": "documento"}, {"label": "Posteriormente los considerandos del decreto 1885", "segs": [2], "obj": "libros"}, {"label": "Posteriormente", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 3. Políticas públicas e Instituciones que conforman el sistema de responsabilidad penal para adolescentes", "grupo": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes", "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["En dicho comité se vinculan", "Este decreto 1885 del 2015 tiene", "Posteriormente los considerandos del decreto 1885", "Posteriormente"], "titulo_genially": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes (8 de 13)", "complemento_genially": "", "apartado": "", "relleno": "rompecabezas.webp", "bloques_fuente": [222, 225]}, {"layout": "esquema", "segmentos": ["Menciona también en sus consideraciones el decreto 1885, la ley 1450 del 2011 en la que se contempla en su artículo 201 la necesidad de desarrollar los principios de corresponsabilidad y protección integral de los niños niñas y adolescentes en las respuestas que se brinden desde el sistema de responsabilidad penal para adolescentes y plantea dos acciones de inmediato cumplimiento y especial urgencia como son la construcción de los centros de atención especializada y de internamiento preventivo según las necesidades que se presenten y menciona la necesidad que las entidades que hacen parte del sistema tanto de las diferentes ramas del poder público como entre los diferentes niveles administrativos sumen esfuerzos para contar con un sistema de información que sea fuente de información clara para el seguimiento y monitoreo del sistema de responsabilidad penal (parágrafo primero) y termina en el parágrafo segundo estableciendo que el gobierno nacional debe concebir como uno de sus ejes centrales, en su agenda de cooperación. los asuntos relativos al financiamiento del sistema de responsabilidad penal para adolescentes.", "De igual manera se refiere este decreto a la ley 489 del 98 aduciendo la facultad que tiene el gobierno para organizar sistemas administrativos con el fin de coordinar y eficientizar las actividades estatales y de los particulares. En igual forma se refiere a la ley 1622 de 2013, que plantea la necesidad de generar programas y políticas públicas que ofrezcan segundas oportunidades para los jóvenes infractores de la ley penal y en este caso no discrimina que sean solamente los vinculados al sistema de responsabilidad penal, pero de todas maneras los incluye.", "Luego volviendo a la ley 1450 del 2011 el decreto plantea que en desarrollo de los principios de coordinación, concurrencia y subsidiaridad crea la facultad para crear sistema nacionales de coordinación integrados por autoridades nacionales y territoriales y con base en esto plantea la necesidad de crear el Sistema Nacional de coordinación de responsabilidad penal en el nivel nacional y regional, para que sea una instancia de coordinación evaluación y articulación interinstitucional intersectorial e Inter sistémica, con el compromiso de todas las ramas del gobierno las entidades territoriales garantice el cumplimiento de los objetivos propios del sistema de responsabilidad penal para adolescentes, afirmaciones que nos plantean claramente que este Sistema Nacional de coordinación va a ser el ente rector de lo que serían las políticas públicas tendientes a desarrollar y cualificar el sistema de responsabilidad penal para adolescentes.", "Las funciones asignadas a este comité de coordinación del sistema de responsabilidad penal para adolescentes son precisamente las de coordinar y articular interinstitucional, intersectorial e Inter sistémicamente la fijación de parámetros técnicos para el desarrollo del sistema de responsabilidad penal y realizar el seguimiento y evaluación de lo que son las obligaciones que se derivan del sistema."], "parrafo": [0, 1, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Menciona también en sus consideraciones el decreto", "segs": [0], "obj": "libros"}, {"label": "La ley 489 del 98", "segs": [1], "obj": "documento"}, {"label": "Luego volviendo a la ley 1450", "segs": [2], "obj": "escalones"}, {"label": "Las funciones asignadas a este comité", "segs": [3], "obj": "camara"}]}], "rotulo": null, "seccion": "Lección 3. Políticas públicas e Instituciones que conforman el sistema de responsabilidad penal para adolescentes", "grupo": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes", "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Menciona también en sus consideraciones el decreto", "La ley 489 del 98", "Luego volviendo a la ley 1450", "Las funciones asignadas a este comité"], "titulo_genially": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes (9 de 13)", "complemento_genially": "", "apartado": "", "ilustracion": "rompecabezas.webp", "arte": {"img": "rompecabezas.webp", "pos": "der"}, "relleno": "camino-proteccion.webp", "bloques_fuente": [226, 228]}, {"layout": "giro", "segmentos": ["Este comité lo conforman las siguientes instituciones los literales a, b, c y d, enuncian a los Ministerios de Justicia, Salud, Educación y Cultura siendo el Ministro de Justicia quien preside el comité, posteriormente los literales e y f, vinculan al Presidente de la Sala Administrativa del Consejo Superior de la Judicatura y al Presidente de la Sala Penal de la Corte Suprema de Justicia; posteriormente en el literal g aparece el Fiscal General de la Nación o su delegado, en el literal h el director del Instituto Colombiano de Bienestar Familiar o su delegado, en el literal i aparece la Policía Nacional, en el k el director del SENA y en literal h el director del Sistema Nacional de Juventudes.", "Este artículo 10° en su parágrafo 1° coloca unos límites a la facultad delegatoria planteando que sólo se podrá delegar en sus directores generales o en funcionarios que tengan un alto nivel directivo y que puedan tomar decisiones.", "En el parágrafo 2° regula la posibilidad de invitar a las sesiones del Sistema de Nacional de Coordinación a otras entidades, como las que hacen parte del Sistema Nacional de Bienestar Familiar, conforme con el artículo 163 de la ley 1098/06. También plantea que se invite a un representante de los gobernadores de la federación Nacional de gobernaciones, a un representante a la federación colombiana de municipios, a la defensoría del pueblo o su delegado, al director nacional de la defensa pública y al procurador general de la nación o su delegado.", "El artículo 4 del precitado decreto, plantea los objetivos del sistema de coordinación y los enumera de la siguiente forma: en primer lugar, orientar coordinar y articular las políticas públicas de responsabilidad penal; en segundo lugar, desarrollar el principio de corresponsabilidad que tiende a garantizar los derechos de los niños y niñas y adolescentes vinculados al sistema y la articulación de otras entidades con este sistema; en tercer lugar articular acompañar y fijar los criterios para la implementación de un modelo de justicia restaurativa y en cuarto lugar, coordinar y dirigir las recomendaciones que se requieran para fortalecer el sistema de responsabilidad penal para adolescentes."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Las siguientes instituciones", "segs": [0], "obj": "libros"}, {"label": "Este artículo 10° en su parágrafo", "segs": [1], "obj": "personas"}, {"label": "En el parágrafo 2° regula", "segs": [2], "obj": "documento"}, {"label": "El artículo 4 del precitado decreto", "segs": [3], "obj": "escudo"}]}], "rotulo": null, "seccion": "Lección 3. Políticas públicas e Instituciones que conforman el sistema de responsabilidad penal para adolescentes", "grupo": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes", "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Las siguientes instituciones", "Este artículo 10° en su parágrafo", "En el parágrafo 2° regula", "El artículo 4 del precitado decreto"], "titulo_genially": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes (10 de 13)", "complemento_genially": "", "apartado": "", "bloques_fuente": [229, 232]}, {"layout": "fichas", "segmentos": ["El artículo quinto plantea una serie de funciones asignadas al Sistema Nacional de coordinación, otorgando a este comité la tarea de orientar, coordinar, formular y revisar las diferentes políticas públicas y en el literal 10 y lo faculta para hacer su propio reglamento.", "Asigna la presidencia del Sistema Nacional de Coordinación del sistema de responsabilidad penal, en forma permanente al Ministerio de Justicia en el artículo sexto, dando así respuesta al requerimiento de designar un ente rector para el sistema de responsabilidad penal para adolescentes. También establece que este comité de orden nacional debe realizar una reunión cada dos meses, ( artículo 7°) atribuyendo unas funciones de coordinador nacional al presidente del Sistema Nacional de coordinación.", "En el artículo décimo designa como secretaría técnica de este comité en forma permanente a la Subdirección de Responsabilidad Penal del Instituto Colombiano de Bienestar Familiar y le da las funciones de citar y realizar las convocatorias, elaborar las actas, verificar que se apliquen los mecanismos de coordinación, diseñar e implementar mecanismos de seguimiento, coordinar estudios y diagnósticos y orientar para su implementación del sistema de responsabilidad penal para adolescentes.", "El capítulo III es de gran importancia porque en él se plantea la necesidad de contar con un comité técnico, el cual estará conformado por aquellos funcionarios de alto nivel que son los que han venido orientando y coordinando el sistema y le asigna unas funciones muy claras en cuanto a la coordinación y dirección especifica del sistema de responsabilidad penal para adolescentes, superando la situación que se puede presentar en el sentido de no contar con los funcionarios que de manera cotidiana están en contacto con el sistema y conocen sus realidades y dificultades. (artículos 12 y 13)"], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "El artículo quinto plantea una serie", "segs": [0], "obj": "documento"}, {"label": "Asigna la presidencia del Sistema Nacional", "segs": [1], "obj": "carpetas"}, {"label": "En el artículo décimo designa", "segs": [2], "obj": "camara"}, {"label": "El capítulo III es de gran", "segs": [3], "obj": "personas"}]}], "rotulo": null, "seccion": "Lección 3. Políticas públicas e Instituciones que conforman el sistema de responsabilidad penal para adolescentes", "grupo": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes", "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["El artículo quinto plantea una serie", "Asigna la presidencia del Sistema Nacional", "En el artículo décimo designa", "El capítulo III es de gran"], "titulo_genially": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes (11 de 13)", "complemento_genially": "", "apartado": "", "bloques_fuente": [233, 236]}, {"layout": "esquema", "segmentos": ["En el capítulo cuarto del decreto 1885, entre los artículos 14 y 20 se plantea la existencia de un Comité departamental de coordinación del sistema de responsabilidad penal para adolescentes, donde se establecen los elementos para la reglamentación y actuación de este comité, prescribiendo que en él deben participar las diferentes autoridades que son homólogas de las autoridades que se prescriben para el comité nacional: el presidente de la sala de asuntos penales para adolescentes del tribunal o los tribunales superiores que existan en el distrito, el presidente de la sala administrativa del consejo seccional de la judicatura, el director(a) regional del ICBF, el director(a) seccional de fiscalías, el director(a) regional del SENA, el comandante del departamento de policía y de la policía metropolitana.", "Además, precisa la presencia de varias entidades del orden departamental y municipal como son los Gobernadores o como sus delegados los secretarios de gobierno. los alcaldes de los municipios cabecera de distrito o como sus delegados los secretarios de gobierno y los secretarios (as) de salud, educación, planeación y un representante del consejo departamental de juventudes. (artículo 15)", "Se ha cuestionado la ausencia en estos comités de los secretarios(a)s de asuntos sociales y de los alcaldes de los municipios sedes de los programas cuando estos no coincidan con las cabeceras de distrito judicial, aspecto que ha subsanado con la vinculación de estas autoridades como invitados permanentes.", "Anteriormente en el artículo 14 se ha planteado que este comité departamental debe articularse con los consejos departamentales y municipales de política social, lo que le brinda y lo ubica en un espacio privilegiado para que pueda desarrollar sus acciones de una manera articulada a las políticas sociales y garantizar los derechos de los jóvenes vinculados al sistema de responsabilidad penal."], "parrafo": [0, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "En el capítulo cuarto del decreto", "segs": [0], "obj": "documento"}, {"label": "precisa la presencia de varias entidades", "segs": [1], "obj": "corazon"}, {"label": "Se ha cuestionado la ausencia", "segs": [2], "obj": "carpetas"}, {"label": "Anteriormente en el artículo 14", "segs": [3], "obj": "escudo"}]}], "rotulo": null, "seccion": "Lección 3. Políticas públicas e Instituciones que conforman el sistema de responsabilidad penal para adolescentes", "grupo": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes", "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["En el capítulo cuarto del decreto", "precisa la presencia de varias entidades", "Se ha cuestionado la ausencia", "Anteriormente en el artículo 14"], "titulo_genially": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes (12 de 13)", "complemento_genially": "", "apartado": "", "relleno": "rompecabezas.webp", "objeto_raiz": "documento", "bloques_fuente": [237, 239]}, {"layout": "giro", "segmentos": ["Como funciones del comité departamental el artículo 16 le asigna las de implementar las directrices impartidas por el Sistema Nacional, elaborar un plan de acción articulado con el plan nacional, tener una agenda regional para ser presentada en las sesiones del comité, fortalecer los sistemas de información a nivel del departamento, donde vuelve a aparecer como elemento de gran importancia el diagnóstico sobre el comportamiento del sistema de responsabilidad penal para adolescentes a nivel local. El comité departamental también debe participar en la realización de los estudios y diagnósticos y propuestos por el comité técnico nacional, hacer las recomendaciones que se estimen convenientes y surjan de la dinámica territorial, realizar el seguimiento al cumplimiento de las decisiones tomadas.", "El numeral 8 del citado artículo 16 plantea concretamente la responsabilidad elaborar un diagnóstico del sistema de responsabilidad penal para adolescentes en el territorio, gestionar la inclusión de los asuntos propios del sistema de responsabilidad penal para adolescentes en la agenda de la política social, presentar informes de las reuniones realizadas y generar un informe anual, que sirva tanto para la elaboración de los diagnósticos sobre la situación de la niñez y la adolescencia como para la rendición publica de cuentas y darse su propio reglamento", "La presidencia de estos comités departamentales será ejercida por el gobernador previa aceptación de este y sin detrimento de su autonomía para delegar esta función o sea que el Gobernador tiene la potestad de delegar y posteriormente el decreto plantea que esta delegación se haga sobre la secretaría de gobierno, Prescribe además el decreto que este comité se debe reunir en forma bimestral al igual que el comité nacional y la secretaría técnica recae de manera permanente sobre la oficina regional del Instituto Colombiano de Bienestar Familiar.", "Este decreto 1885 de 2015 cumple con la función de dirigir y especificar la manera como se desarrollará la política pública del sistema de responsabilidad penal para adolescentes en cada uno de los departamentos, los cuales coinciden casi en su totalidad con los distritos judiciales y las direcciones seccionales de la fiscalía. Con las funciones asignadas, tenemos claro que los comités son un espacio clave para la coordinación de la política pública relacionada con el sistema de responsabilidad penal para adolescentes y en reciente consultoría hecha auspiciada por UNICEF se puede constatar cómo en la totalidad de los departamentos existen y en la mayoría de ellos funcionan de la forma prevista en el decreto con un grado de participación de diferente por parte de las instituciones vinculadas al mismo.", "Revisando algunas de las conclusiones de dicha consultoría se observa como los entes territoriales en su mayoría han venido participando, así como las entidades de la rama judicial incluyendo la fiscalía General de la Nación, pero si es claro que en muchos casos los funcionarios que asisten no son precisamente los que desarrollan las actividades propias del sistema de responsabilidad penal para adolescentes y ante la carencia de un comité técnico como el señalado para la instancia nacional, se recomienda suplir esta falencia invitando al comité a los jueces y fiscales con funciones dentro del sistema o manteniendo un alto grado de comunicación interna dentro de cada entidad para que las discusiones y comentarios lleguen hasta ellos."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Como funciones del comité departamental", "segs": [0], "obj": "carpetas"}, {"label": "El numeral 8 del citado artículo", "segs": [1], "obj": "expediente"}, {"label": "La presidencia de estos comités departamentales", "segs": [2], "obj": "documento"}, {"label": "Decreto 1885 de 2015", "segs": [3], "obj": "lupa"}, {"label": "Revisando algunas de las conclusiones", "segs": [4], "obj": "personas"}]}], "rotulo": null, "seccion": "Lección 3. Políticas públicas e Instituciones que conforman el sistema de responsabilidad penal para adolescentes", "grupo": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes", "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Como funciones del comité departamental", "El numeral 8 del citado artículo", "La presidencia de estos comités departamentales", "Decreto 1885 de 2015", "Revisando algunas de las conclusiones"], "titulo_genially": "Instituciones que hacen parte del sistema de responsabilidad penal para adolescentes (13 de 13)", "complemento_genially": "", "apartado": "", "ilustracion": "rompecabezas.webp", "arte": {"img": "rompecabezas.webp", "pos": "izq"}, "bloques_fuente": [240, 244]}, {"layout": "puntos", "segmentos": ["Existe un factor de especial importancia que debemos tener en cuenta y es que muchos Estados han optado por tener una legislación referida a la justicia juvenil, independiente del cuerpo jurídico de protección a la niñez, ese estilo lo podemos encontrar por ejemplo en Costa Rica o en Nicaragua, pero en otros países la legislación de Justicia juvenil se encuentra incorporada a los textos sustanciales de protección integral a la infancia o códigos de infancia y adolescencia, este es el caso del Estado Colombiano.", "Más allá de la simple ubicación dentro de los sistemas normativos, esto tiene un sentido muy importante y es que la legislación de Justicia juvenil se debe comprender e interpretar dentro del cuerpo jurídico de protección integral a la niñez y por lo tanto va a gozar de todos los principios, características y elementos que plantea la Convención internacional sobre los derechos del niño, además de las que establece ese cuerpo jurídico especial, en el caso colombiano llamado Código de infancia y adolescencia , expresado mediante la Ley 1098 del 2006.", "Entonces al ubicar el sistema de responsabilidad penal como el libro primero del título II de la ley 1098, su aplicación debe estar orientada por los “principios y definiciones” que aparecen en los 16 primeros artículos de esta ley, dentro de los cuales se destacan la finalidad (1), la naturaleza de normas (5), las reglas de interpretación (6), la protección integral (7), el interés superior (8), la prevalencia de derechos (9), la corresponsabilidad (10), la exigibilidad (11) la perspectiva de género (12), el trato diferencial (13) y la responsabilidad parental (14), todos ellos emanados de la Convención Internacional sobre los Derechos del niño, los cuales deben ser tenidos en cuenta para orientar y dirigir en forma íntegra la aplicación de este sistema.", "También tenemos que concluir que el libro III de la Ley 1098, que nos habla de las políticas públicas y de la obligatoriedad del cumplimiento de esas políticas para la realización de los derechos de los niños, niñas y adolescentes, también van a ser las herramientas necesarias en la tarea de cumplir en forma integral con los propósitos del sistema de Responsabilidad Penal para adolescentes."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "Existe un factor de especial importancia", "segs": [0], "obj": "escudo"}, {"label": "Más allá de la simple ubicación dentro", "segs": [1], "obj": "corazon"}, {"label": "Entonces al ubicar el sistema de responsabilidad", "segs": [2], "obj": "libros"}, {"label": "tenemos que concluir que el libro", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 3. Políticas públicas e Instituciones que conforman el sistema de responsabilidad penal para adolescentes", "grupo": "Políticas públicas para el desarrollo del sistema penal para adolescentes", "titulos_fuente": ["Políticas públicas para el desarrollo del sistema penal para adolescentes"], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["Existe un factor de especial importancia", "Más allá de la simple ubicación dentro", "Entonces al ubicar el sistema de responsabilidad", "tenemos que concluir que el libro"], "titulo_genially": "Políticas públicas para el desarrollo del sistema penal para adolescentes (1 de 3)", "complemento_genially": "", "apartado": "", "ilustracion": "camino-proteccion.webp", "bloques_fuente": [246, 249]}, {"layout": "esquema", "segmentos": ["De esta manera entonces debemos afirmar que el sistema de responsabilidad penal para adolescentes garantiza su realización precisamente en las regulaciones planteadas en los articulo comprendidos entre el 201 y el 214 de la ley 1098, los que contienen en primer lugar una definición de las políticas públicas, definiéndolas como el conjunto de acciones que adelanta el estado con la participación de la sociedad y la familia para garantizar la protección integral de los niños niñas y adolescentes.", "En esta definición se adopta el principio de corresponsabilidad planteado en la Convención Internacional sobre los derechos del niño, frente al cual podemos observar que la convención designa como responsable de la garantía y realización de estos derechos en primera instancia a la familia en segundo lugar a la sociedad y dado que la sociedad puede volverse un término etéreo, se habla más del entorno comunitario o la comunidad que rodea al niño niña o adolescente y en últimas el garante es el Estado quién debe velar por el cumplimiento de estos derechos, desde los componentes propios de ese principio como son la corresponsabilidad subsidiaria y la corresponsabilidad supletoria.", "Por su parte el artículo 202 establece cuatro objetivos generales de las políticas públicas de infancia adolescencia: el primero es orientar la ejecución de los recursos hacia el logro de unas mejores condiciones de los niños, niñas y adolescentes incrementando sus capacidades y brindándoles oportunidades para el ejercicio efectivo de sus derechos, haciendo que estos recursos sean utilizados de una manera eficiente. El segundo objetivo plantea la necesidad de mantener actualizados los sistemas y la información necesarios para poder fundamentar las decisiones que se toman, caracterizando dichas políticas públicas como políticas basadas en la evidencia.", "En tercer lugar, diseñar y poner en marcha acciones que se encaminen a lograr la inclusión social plena de la niñez la adolescencia y la juventud en especial la más desprotegida, vulnerable y vulnerada, donde debemos anotar que uno de los sectores más olvidados son precisamente estos jóvenes y adolescentes que de una manera temprana han entrado o los han instrumentalizado en el mundo de la delincuencia y en cuarto lugar, fortalecer la articulación interinstitucional e intersectorial, como fin de la política pública."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "entonces debemos afirmar que el sistema", "segs": [0], "obj": "libros"}, {"label": "En esta definición se adopta", "segs": [1], "obj": "reloj"}, {"label": "el artículo 202 establece cuatro objetivos", "segs": [2], "obj": "documento"}, {"label": "En tercer lugar, diseñar y poner", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 3. Políticas públicas e Instituciones que conforman el sistema de responsabilidad penal para adolescentes", "grupo": "Políticas públicas para el desarrollo del sistema penal para adolescentes", "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["entonces debemos afirmar que el sistema", "En esta definición se adopta", "el artículo 202 establece cuatro objetivos", "En tercer lugar, diseñar y poner"], "titulo_genially": "Políticas públicas para el desarrollo del sistema penal para adolescentes (2 de 3)", "complemento_genially": "", "apartado": "", "ilustracion": "circulo-dialogo.webp", "arte": {"img": "circulo-dialogo.webp", "pos": "fondo"}, "relleno": "cuidado-familia.webp", "bloques_fuente": [250, 252]}, {"layout": "giro", "segmentos": ["El artículo 203 plantea los principios rectores de la política pública y habla que el primer principio sería el interés superior del niño, niña o adolescente, el segundo la prevalencia de derechos, el tercero la protección integral, el cuarto la equidad, el quinto la integralidad y la articulación de las políticas, el sexto la solidaridad, el séptimo la participación social, el octavo la prioridad que deben tener estas políticas, el noveno la complementariedad, el décimo la prioridad de la inversión dirigida a la infancia para poder garantizar estas políticas, el undécimo la eficiencia en el gasto y la inversión pública y el duodécimo la perspectiva de género. Estos principios en forma general se refieren a los principios rectores que trae la Convención y por lo tanto deben ser aplicados tanto en las decisiones como en los planes, programas y estrategias que se implementen para atender a los y las adolescentes vinculados al sistema de responsabilidad penal para adolescentes.", "Cierra este acápite el artículo 204 en el cual se nos habla de los responsables de estas políticas públicas determinando que la responsabilidad de las mismas recae en el órgano ejecutivo quien tiene a su haber garantizar el cumplimiento de los derechos de los niños niñas y adolescentes. Debe resaltarse aquí que el artículo 204 le indica a los gobernadores y alcaldes que en los primeros tres meses de sus mandatos deben elaborar un diagnóstico de infancia de la situación de la niñez y la adolescencia en su departamento y municipio posteriormente mediante indicaciones muy claras las procuraduría general de la nación orientó a los entes administrativos en el sentido que este diagnóstico debe incluir el aparte correspondiente al comportamiento del sistema de responsabilidad penal para adolescentes en el municipio o departamento.", "Es necesario tener en cuenta la importancia que tiene el diagnóstico sobre el comportamiento del sistema de responsabilidad penal, ya que nos va a permitir observar el comportamiento que tiene este fenómeno en cada una de las regiones y a partir de este comportamiento formular las políticas públicas desde la evidencia que arroja la información en el consignada. Esta política pública tiene como objetivo incidir en las tres esferas planteadas para la política criminal como son la prevención, la atención y la inclusión de los jóvenes y adolescentes vinculados al Sistema Penal y haría parte esencial de la política criminal del Estado.", "De igual manera, una política pública integral tendría que revisar las circunstancias en las cuales los adolescentes y jóvenes incurren en la delictividad para que determinando las formas de instrumentalización actúe de manera conjunta en el fortalecimiento de las acciones que contengan en forma efectiva este fenómeno."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "El artículo 203 plantea los principios", "segs": [0], "obj": "escudo"}, {"label": "Cierra este acápite el artículo 204", "segs": [1], "obj": "documento"}, {"label": "Es necesario tener en cuenta", "segs": [2], "obj": "expediente"}, {"label": "una política pública integral tendría", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 3. Políticas públicas e Instituciones que conforman el sistema de responsabilidad penal para adolescentes", "grupo": "Políticas públicas para el desarrollo del sistema penal para adolescentes", "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["El artículo 203 plantea los principios", "Cierra este acápite el artículo 204", "Es necesario tener en cuenta", "una política pública integral tendría"], "titulo_genially": "Políticas públicas para el desarrollo del sistema penal para adolescentes (3 de 3)", "complemento_genially": "", "apartado": "", "ilustracion": "cuidado-familia.webp", "arte": {"img": "cuidado-familia.webp", "pos": "der"}, "relleno": "rompecabezas.webp", "bloques_fuente": [253, 256]}, {"layout": "caso", "segmentos": ["¿Considera usted oportuna la labor que realiza esta fiscal?", "¿Como la relacionaría con los principios de desjudicialización, desinstitucionalización y aplicación mínima del derecho penal? ¿es posible aplicarl
