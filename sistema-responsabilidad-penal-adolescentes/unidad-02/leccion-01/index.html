<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-srpa", "paleta": {"marino": "#07415C", "teal": "#2E6377", "oxido": "#B55D41", "coral": "#FF6936", "crema": "#FFE1D7", "niebla": "#CAE9E4", "hielo": "#E9F6F4", "celeste": "#CAE9E4", "madera": "#B55D41", "piso": "#CAE9E4", "gris": "#CAE9E4", "amarillo": "#FF6936"}, "anclas": {"construccion-bloques.webp": {"r": 1.2712, "p": [[62, 53], [41, 63], [52, 76], [66, 89]]}, "rompecabezas.webp": {"r": 1.264, "p": [[42, 31], [66, 43], [40, 66], [62, 69]]}, "camino-proteccion.webp": {"r": 1.1335, "p": [[79, 26], [87, 58], [61, 86], [20, 72]]}, "circulo-dialogo.webp": {"r": 1.1524, "p": [[31, 13], [68, 9], [11, 62], [89, 66]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "srpa", "partirComas": true, "bitacora": true, "retro": {"reacciones": ["rompecabezas.webp", "construccion-bloques.webp", "circulo-dialogo.webp"], "frases": ["¿Seguro?", "¡Revisa de nuevo!", "¡Mira otra vez!", "¡Casi!", "¡Un momento!", "¡Vuelve a leer!"], "acierto": ["camino-proteccion.webp", "cuidado-familia.webp"], "rotulo": "Unidad 2 · Lección 1"}, "leccion_rotulo": "Lección 1", "unit": 2, "lesson": 1, "heading": "Lección 1. Sentido del enfoque diferencial en las instituciones y las autoridades", "scenes": [{"layout": "lamina", "segmentos": ["La aplicación del enfoque diferencial debe coincidir plenamente con las características propias del sistema de justicia juvenil que se desprenden de su carácter especializado, garante de derechos, protector, pedagógico y restaurativo."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Características del enfoque diferencial", "segs": [0], "obj": "escudo", "acomp": ["documento", "carpetas"]}]}], "rotulo": null, "seccion": "Lección 1. Sentido del enfoque diferencial en las instituciones y las autoridades", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Características del enfoque diferencial"], "titulo_genially": "Características del enfoque diferencial", "complemento_genially": "", "apartado": "", "ilustracion": "rompecabezas.webp", "relleno": "circulo-dialogo.webp", "bloques_fuente": [119, 119]}, {"layout": "esquema", "segmentos": ["Aplicar un enfoque diferencial tiene como resultado adoptar una serie de acciones orientadas a un grupo especifico debido a elementos como su diversidad cultural, edad, genero, condición u orientación entre otras. Olivar (2020).", "Para lograr la efectividad de estas acciones, el agente que la aplica debe conocer la información necesaria sobre el grupo hacia el cual va dirigida su acción, teniendo en cuenta sus características particulares: su edad o etapa del ciclo vital, género, orientación sexual, pertenencia étnica, y discapacidad, entre otras características; visibilizando sus situaciones y de esta manera orientar su toma de decisiones. (artículo 13 de la Ley 1448 de 2011)", "https://www.scielo.org.mx/scielo.php?pid=S2007-91762020000100139&script=sci_abstract.", "Olivar Rojas, Andrés Francisco. Políticas públicas y enfoques diferenciales: aproximaciones desde la interculturalidad y la democracia radical. Iztapalapa. Rev. cienc. soc. humanid., Jun 2020, vol.41, no.88, p.139-162. ISSN 2007-9176"], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Aplicar un enfoque diferencial", "segs": [0], "obj": "documento"}, {"label": "Para lograr la efectividad", "segs": [1], "obj": "escalones"}, {"label": "Enlace de la ficha", "segs": [2], "obj": "carpetas"}, {"label": "Olivar Rojas, Andrés Francisco", "segs": [3], "obj": "lupa"}]}], "rotulo": null, "seccion": "Lección 1. Sentido del enfoque diferencial en las instituciones y las autoridades", "grupo": "1. Especialidad", "titulos_fuente": ["1. Especialidad"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Aplicar un enfoque diferencial", "Para lograr la efectividad", "Enlace de la ficha", "Olivar Rojas, Andrés Francisco"], "titulo_genially": "Especialidad (1 de 5)", "complemento_genially": "", "apartado": "", "ilustracion": "construccion-bloques.webp", "arte": {"img": "construccion-bloques.webp", "pos": "fondo"}, "bloques_fuente": [121, 124]}, {"layout": "giro", "segmentos": ["https://www.dane.gov.co/files/investigaciones/genero/guia-inclusion-enfoque-difencias-intersecciones-produccion-estadistica-SEN-V2.pdf", "Guía para la Inclusión del Enfoque Diferencial e Interseccional. DANE 2026", "Para garantizar que efectivamente se aplique un enfoque diferencial favorable a los adolescentes y jóvenes vinculados al sistema de responsabilidad penal para adolescentes, dirigido a garantizar sus derechos teniendo en cuenta sus características específicas como lo son; proveniencia social, grado de estudio, capacidad cognitiva, elementos culturales, orientación sexual, es necesario por parte del funcionario, propiciar el acercamiento y dialogo directo con el joven o adolescente y con sus familias, garantizando plenamente el principio de la inmediación, esto en el nivel individual, así como el conocimiento de los informes que caracterizan a los y las adolescentes vinculados al sistema los cuales en muchas regiones se encuentran en los llamados diagnósticos socio situacionales o caracterizaciones de los adolescentes y jóvenes vinculados al sistema de responsabilidad penal para adolescentes.", "Un alejamiento de carácter más radical y peligroso, se produce cuando el funcionario esta influenciado por los estereotipos que los imaginarios culturales adulto céntricos se han asentado en nuestras mentalidades y determinan nuestra percepción sobre el comportamiento de este grupos social, tachándolo de presentar una rebeldía injustificada, falta de valores, apatía, y violencia, situación que nos lleva a afirmar que artículos como el de la profesora Verónica Navarro, referente a los mitos sobre la delincuencia juvenil deben ser analizados de manera permanente para poder interactuar con este sector poblacional de una desprevenida que permita lograr desde nuestro accionar los fines propuestos por el sistema en el cual nos encontramos."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Enlace de la ficha", "segs": [0], "obj": "lupa"}, {"label": "Guía para la Inclusión del Enfoque Diferencial", "segs": [1], "obj": "documento"}, {"label": "Para garantizar que efectivamente se aplique", "segs": [2], "obj": "escudo"}, {"label": "Un alejamiento de carácter más radical", "segs": [3], "obj": "personas"}]}], "rotulo": null, "seccion": "Lección 1. Sentido del enfoque diferencial en las instituciones y las autoridades", "grupo": "1. Especialidad", "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Enlace de la ficha", "Guía para la Inclusión del Enfoque Diferencial", "Para garantizar que efectivamente se aplique", "Un alejamiento de carácter más radical"], "titulo_genially": "Especialidad (2 de 5)", "complemento_genially": "", "apartado": "", "ilustracion": "cuidado-familia.webp", "arte": {"img": "cuidado-familia.webp", "pos": "izq"}, "relleno": "circulo-dialogo.webp", "bloques_fuente": [125, 128]}, {"layout": "fichas", "segmentos": ["Navarro, Verónica (2004). “Mitos sobre la delincuencia juvenil. Ángeles o demonios los jóvenes en el imaginario social”, en Reguillo, Rossana, et al. (coords.), Tiempo de híbridos. Entresiglos jóvenes México-Cataluña. México: Instituto Mexicano de la Juventud", "Teniendo en cuenta que para aplicar el enfoque diferencial se requiere un análisis, que parte de haber obtenido previamente información sobre las características propias del grupo frente al cual pretendemos actuar, buscando que tanto la actuación propia la de las demás autoridades o instancias, logren la visibilización de las circunstancias específicas y las vulneraciones que afectan dicho grupo con el ánimo de orientar la toma de decisiones. (DANE, 2020, p. 15)", "Al referirnos al enfoque diferencial en el sistema de responsabilidad penal para adolescentes, estamos frente a un enfoque basado en primer lugar en el ciclo de vida. Enfoque que de acuerdo con el DANE surge en virtud del reconocimiento de las particularidades que conlleva “cada etapa del ciclo de vida, desde el nacimiento hasta el final de la vida, se tienen diferentes necesidades vitales, expectativas sociales, capacidades y responsabilidades” (Enfoques: Ciclo de vida, 2022)", "“De esta manera, el ciclo vital configura un enfoque diferencial en la medida que desde un contexto cultural o social existen implicaciones de desigualdad, lo cual depende de las capacidades, vulnerabilidades u oportunidades de las que se goza en cada etapa de vida como la niñez, adolescencia o vejez, y que, pueden variar la experiencia de existencia entre cada persona que se encuentra en estos grupos etarios”."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Navarro, Verónica (2004)", "segs": [0], "obj": "documento"}, {"label": "Teniendo", "segs": [1], "obj": "lupa"}, {"label": "Al referirnos al enfoque diferencial", "segs": [2], "obj": "escalones"}, {"label": "“De esta manera, el ciclo", "segs": [3], "obj": "personas"}]}], "rotulo": null, "seccion": "Lección 1. Sentido del enfoque diferencial en las instituciones y las autoridades", "grupo": "1. Especialidad", "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Navarro, Verónica (2004)", "Teniendo", "Al referirnos al enfoque diferencial", "“De esta manera, el ciclo"], "titulo_genially": "Especialidad (3 de 5)", "complemento_genially": "", "apartado": "", "relleno": "rompecabezas.webp", "bloques_fuente": [129, 132]}, {"layout": "esquema", "segmentos": ["La justicia juvenil en Colombia, contenida en el sistema de responsabilidad penal para adolescentes, hace parte del código de infancia y adolescencia, Ley 1098 de 2006, que es un instrumento tendiente a aplicar la Convención sobre los derechos del niño, de 1989, que en si misma es la expresión de la invitación a aplicar un enfoque diferencial basado en la condición etaria, teniendo en cuenta que los niños, niñas y adolescentes viven en un mundo marcado por intereses adulto céntricos desde una gran exposición a la vulneración de sus derechos por asuntos sociales, económicos, familiares y de marginalidad sistemática.", "Por esta razón la Comisión Interamericana de Derechos Humanos –CIDH- en su informe justicia juvenil en las Américas (2011) plantea que la no existencia de trato diferenciado para el procesamiento de menores de edad, se estaría desconociendo el carácter especial de los niños y la obligación de protección que recae en los Estados haciéndose necesario generar procesos y procedimientos diferenciados del sistema de adultos, y se adapten a las condiciones de los adolescentes y jóvenes que van a ser sus destinatarios.", "La característica de diferenciado que se atribuye el sistema de responsabilidad penal para adolescentes, se refiere también a la necesidad de respetar las diferencias que tienen los menores de edad frente a los adultos y para tener en cuenta las características propias de cada individuo en el momento de ser vinculado al sistema y durante su permanecía en él.", "Teniendo en cuenta los elementos anteriores, basados en el conocimiento de las condiciones y situaciones especiales que viven los adolescentes y jóvenes, que requieren del funcionario no sólo un conocimiento especial sobre los factores comportamentales, psicológicos y neurológicos que los caracterizan, sino también de las circunstancias propias y específicas que rodean a los que son vinculados al sistema de responsabilidad penal para adolescentes: muchos de ellos afectados por trastornos y desordenes de personalidad, muchos de ellos originada en las precariedad de sus familias, en el consumo habitual de sustancias psicoactivas, o el haber sido víctimas de abusos, maltrato, abandono, explotación, reclutamiento o instrumentalización para la delincuencia, hacen necesario que el funcionario que les brinda atención y en específicamente el fiscal, que es una de las primeras autoridades con las que se encuentran, tenga unos conocimientos suficientes sobre su situación especial, los que seguramente servirán de base para la eficacia de las estrategias y medidas que se utilicen posteriormente."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "La justicia juvenil en Colombia, contenida", "segs": [0], "obj": "libros"}, {"label": "Por esta razón la Comisión Interamericana", "segs": [1], "obj": "escudo"}, {"label": "La característica de diferenciado", "segs": [2], "obj": "documento"}, {"label": "Teniendo en cuenta los elementos anteriores", "segs": [3], "obj": "personas"}]}], "rotulo": null, "seccion": "Lección 1. Sentido del enfoque diferencial en las instituciones y las autoridades", "grupo": "1. Especialidad", "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["La justicia juvenil en Colombia, contenida", "Por esta razón la Comisión Interamericana", "La característica de diferenciado", "Teniendo en cuenta los elementos anteriores"], "titulo_genially": "Especialidad (4 de 5)", "complemento_genially": "", "apartado": "", "ilustracion": "rompecabezas.webp", "arte": {"img": "rompecabezas.webp", "pos": "der"}, "relleno": "construccion-bloques.webp", "bloques_fuente": [133, 136]}, {"layout": "giro", "segmentos": ["Características anotadas con gran profundidad por el profesor Alessandro Padovani, en el texto, “justicia de adolescentes. Perspectivas y programas de intervención” Escuela Judicial Rodrigo Lara Bonilla. 2010.", "https://www.oas.org/es/cidh/infancia/docs/pdf/JusticiaJuvenil.pdf", "https://escuelajudicial.ramajudicial.gov.co/sites/default/files/biblioteca/m18-4.pdf"], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Características anotadas con gran profundidad", "segs": [0], "obj": "documento"}, {"label": "Enlace de la ficha", "segs": [1], "obj": "carpetas"}, {"label": "Enlace de la ficha", "segs": [2], "obj": "lupa"}]}], "rotulo": null, "seccion": "Lección 1. Sentido del enfoque diferencial en las instituciones y las autoridades", "grupo": "1. Especialidad", "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Características anotadas con gran profundidad", "Enlace de la ficha", "Enlace de la ficha"], "titulo_genially": "Especialidad (5 de 5)", "complemento_genially": "", "apartado": "", "bloques_fuente": [137, 139]}, {"layout": "fichas", "segmentos": ["El sistema de responsabilidad penal para adolescentes debe gozar de todas las garantías propias de los sistemas penales, esta era una de los requerimientos no previstos en el anterior código del menor, decreto 2737 del 89, en el cual partiendo de la teoría de la situación irregular, se consideró que no era necesario asistir al adolescente mediante la defensa técnica, puesto que se daba por hecho que todas las autoridades que participaban de este proceso tenían como último interés la protección del niño o adolescente vinculado.", "Al respecto se presentaron varias situaciones que cuestionaron la eficacia y los resultados de esos procedimientos basados en la doctrina de la situación irregular, muchos de ellos se expresaron en diferentes textos y documentos como la película norteamericana “el valor de una promesa” (1987) dirigida por David Greene, en la cual se plantea como, precisamente la intervención de las autoridades termina por causar de graves daños a una familia o el film “el pequeño salvaje” dirigida por Francoise Truffaut en 1970, en la cual podemos observar cómo se termina abusando de ellos en aras de su protección y supuesta socialización.", "Uno de los grandes de la ley 1098 del 2006, fue precisamente el incluir un verdadero proceso de administración de Justicia, con los procedimientos propios del derecho penal en el sentido de brindarle al adolescente todas las garantías necesarias para poder determinar con la mayor claridad y precisión posibles sin en verdad ha incurrido y es responsable de la comisión de un delito.", "Estas garantías se expresan entre otros puntos en la presencia de la fiscalía como ente investigador de la comisión del delito, que reemplaza el proceso que anteriormente realizaban los denominados jueces de menores, presencia que junto con la de la asistencia técnica para responder a la acusación penal encomendada a la defensoría pública, se constituyen en un gran avance para estos procesos."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "El sistema de responsabilidad penal", "segs": [0], "obj": "libros"}, {"label": "Al respecto se presentaron varias situaciones", "segs": [1], "obj": "escalones"}, {"label": "Uno de los grandes", "segs": [2], "obj": "escudo"}, {"label": "Estas garantías se expresan", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 1. Sentido del enfoque diferencial en las instituciones y las autoridades", "grupo": "2. Garante de derechos y protector", "titulos_fuente": ["2. Garante de derechos y protector"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["El sistema de responsabilidad penal", "Al respecto se presentaron varias situaciones", "Uno de los grandes", "Estas garantías se expresan"], "titulo_genially": "Garante de derechos y protector (1 de 3)", "complemento_genially": "", "apartado": "", "ilustracion": "camino-proteccion.webp", "bloques_fuente": [141, 144]}, {"layout": "esquema", "segmentos": ["Como consecuencia de los cambios que introdujo el sistema de responsabilidad penal para adolescentes, todas las garantías propias del derecho penal deben ser tenidas en cuenta y cumplirse en todo su rigor, para garantizar un debido proceso en favor de los y las adolescentes que sean vinculados a los procesos propios del sistema de justicia juvenil. Es de anotar que esté fue uno de los propósitos de las reglas de Beijing, cuando procuraba establecer unas normas básicas para que el juzgamiento de los menores de edad tuviera garantías y fuera respetuoso de sus derechos.", "Dentro de esas garantías que van a decirnos si el proceso se llevó a cabo de una manera rigurosa tenemos en primer lugar el principio “pro homine” desde el cual entendemos el derecho penal como una garantía para la persona acusada de la comisión de un delito, garantizándole el respeto de todos sus derechos y además que de manera imparcial y ecuánime se va a determinar es responsable de la comisión del mismo y si esa acción merece o no una reacción por parte del Estado. Ese ese principio pro homine va a procurar la defensa de la dignidad del ser humano y en el caso de los adolescentes debe ser conjugado con el principio “pro infans” que debe ser aplicado de los criterios de la especialidad y nos lleva a decir concluir que los menores de edad vinculados a procesos judiciales en calidad de supuestos responsables gozan de una prelación especial por su calidad de ser niños y niñas o adolescentes.", "Otro principio de especial importancia que rige el derecho penal es “el principio de menor aflictividad” que surge del entender que los sistemas penales en últimas van a generar consecuencias que puede causar algún daño o aflicción a quienes con sus acciones transgredieron los derechos y causaron, a su vez, daño a otros. Esta acción- reacción propia de la característica retributiva de la justicia penal, debe ser moderada tanto para las personas adultas, pero de manera especial para los menores de edad, procurando que las medidas que se le asignen causen el menor daño posible a su salud física y mental.", "El principio de favorabilidad o “indubio pro reo” se constituye en un elemento clave al cual debemos prestarle mucha atención, ya que en el caso de los menores de edad debe ser conjugado no solo con el principio pro infans, que los asiste y favorece, sino con la obligación de garantizar el interés superior y la prevalencia de derechos, estipulados tanto por la ley como por la convención y en caso de presentarse alguna duda frente a su interpretación y aplicación debemos acudir siempre a ejecutar aquella actuación que sea más favorable para los intereses del o la adolescente."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Como consecuencia de los cambios", "segs": [0], "obj": "escudo"}, {"label": "Dentro de esas garantías", "segs": [1], "obj": "personas"}, {"label": "Otro principio de especial importancia", "segs": [2], "obj": "reloj"}, {"label": "El principio de favorabilidad", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 1. Sentido del enfoque diferencial en las instituciones y las autoridades", "grupo": "2. Garante de derechos y protector", "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Como consecuencia de los cambios", "Dentro de esas garantías", "Otro principio de especial importancia", "El principio de favorabilidad"], "titulo_genially": "Garante de derechos y protector (2 de 3)", "complemento_genially": "", "apartado": "", "relleno": "rompecabezas.webp", "objeto_raiz": "escudo", "bloques_fuente": [145, 148]}, {"layout": "puntos", "segmentos": ["También es de gran importancia aplicar el principio de inmediación en estos casos, ya que conforme lo hemos venido afirmando al hablar de la especialidad propia del sistema, el acercamiento del funcionario y en este caso del fiscal, al adolescente que transgredió la norma y a su familia a través de un diálogo horizontal, basado en la comprensión, el acompañamiento y el apoyo es de gran utilidad para conocer mejor la realidad de ese sujeto transgresor y poder tomar las medidas más adecuadas en su favor.", "Es necesario para alcanzar los fines del sistema contar con la participación del adolescente, pero esa participación hay que promoverla, permitiendo espacios en los cuales se sienta en confianza, venza los temores propios del temor a estar ante las autoridades y logren expresarse de una manera clara y espontánea que permita conocer ampliamente las circunstancias que rodearon los hechos y llegue incluso a proponer estrategias que permitan afrontar y si es posible superar las consecuencias adversas de su acción transgresora que es en últimas lo que plantea el carácter restaurativo del sistema."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "El principio de inmediación", "segs": [0], "obj": "personas"}, {"label": "Es necesario para alcanzar los fines", "segs": [1], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 1. Sentido del enfoque diferencial en las instituciones y las autoridades", "grupo": "2. Garante de derechos y protector", "titulos_fuente": [], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["El principio de inmediación", "Es necesario para alcanzar los fines"], "titulo_genially": "Garante de derechos y protector (3 de 3)", "complemento_genially": "", "apartado": "", "ilustracion": "circulo-dialogo.webp", "relleno": "cuidado-familia.webp", "bloques_fuente": [149, 150]}]}</script>
