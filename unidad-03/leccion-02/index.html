, [2, 11]]]}, {"label": "Medios", "label_seg": 12, "obj": "carpetas", "segs": [13, 14], "filas": [[[1, 13], [2, 14]]]}, {"label": "Delitos habilitadores", "label_seg": 15, "obj": "lupa", "segs": [16, 17], "filas": [[[1, 16], [2, 17]]]}, {"label": "Acciones", "label_seg": 18, "obj": "expediente", "segs": [19, 20], "filas": [[[1, 19], [2, 20]]]}, {"label": "Término de la actuación", "label_seg": 21, "obj": "reloj", "segs": [22, 23], "filas": [[[1, 22], [2, 23]]]}], "titulo": [0]}], "rotulo": null, "seccion": "2.14.2 Agente encubierto informático (TEI típica emergente)", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Tabla de la fuente explorada por pestañas.", "rotulos": ["Reserva legal", "Reserva judicial", "Rol de agente encubierto informático", "Medios", "Delitos habilitadores", "Acciones", "Término de la actuación"], "titulo_genially": "Agente encubierto informático (TEI típica emergente)"}, {"layout": "giro", "segmentos": ["La complejidad estructural y relacional de la criminalidad organizada en la contemporaneidad ha puesto de manifiesto las limitaciones de los modelos tradicionales de investigación penal centrados en la reconstrucción aislada de hechos jurídicamente relevantes y en la determinación individual de la responsabilidad penal. Ante las dificultades a las que se ha enfrentado la investigación, se ha optado por emplear alternativas metodológicas de investigación y de gestión de la información, más allá de las TEI, y de la investigación de delitos comunes, que permitan aproximarse a condiciones contextuales diversas.", "De acuerdo con lo anterior, en vista de la necesidad de introducir perspectivas sistémicas e incluso, de orientación organizacional, con el fin de comprender el fenómeno delictivo en su amplitud; se ha considerado pertinente la implementación de metodologías investigativas como el análisis en contexto y la priorización de casos. Pese a que las fuentes normativas del análisis de contexto se ubican en el rango de normas de tipo administrativo —en tanto no se han regulado estos fenómenos a nivel legal—, no es menos cierto que estas mismas cobran especial trascendencia como quiera que involucran presupuestos constitucionales en la actividad acusatoria.", "Al respecto, son de obligatoria consultar las directivas núm.01 de 2012, “Por medio de la cual se adoptan unos criterios de priorización de situaciones y casos, y se crea un nuevo sistema de investigación penal y de gestión de aquellos en la Fiscalía General de la Nación”, y la directiva núm.02 de 2015, “Por medio de la cual se amplía y modifica la Directiva 01 de 2012, se desarrolla el alcance de los criterios de priorización de situaciones y casos, y se establecen lineamientos para la planificación y gestión estratégica de la investigación penal en la Fiscalía General de la Nación”.", "Se ha atribuido a estos actos el alcance de TEI, por tratarse de una técnica cuyos fundamentos surgen en la justificación político criminal de lucha eficiente contra la DOT. Esta misma fue diseñada para investigar delitos graves ejecutados de manera articulada y sistemática por este tipo de organizaciones, en donde concurren investigaciones por delitos pasados y delitos que se siguen cometiendo, precisamente, por la proyección de permanencia de la criminalidad organizada. Además, su utilización implica el uso y la gestión de información pública y privada de los miembros de las organizaciones, de las víctimas y de otros factores sociales y económicos que implican relaciones necesarias con los derechos fundamentales."], "parrafo": [0, 1, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "complejidad estructural y relacional", "segs": [0], "obj": "lupa"}, {"label": "perspectivas sistémicas", "segs": [1], "obj": "documento"}, {"label": "son de obligatoria consultar las directivas núm.01", "segs": [2], "obj": "carpetas"}, {"label": "alcance de TEI", "segs": [3], "obj": "expediente"}]}], "rotulo": null, "seccion": "2.14.3 Análisis en contexto y priorización de casos (TEI atípica o innominada)", "grupo": null, "titulos_fuente": ["2.14.3 Análisis en contexto y priorización de casos (TEI atípica o innominada)"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["complejidad estructural y relacional", "perspectivas sistémicas", "son de obligatoria consultar las directivas núm.01", "alcance de TEI"], "titulo_genially": "Análisis en contexto y priorización de casos (TEI atípica o innominada)"}, {"layout": "mapa", "segmentos": ["En este contexto, desde el punto de vista normativo, las dos son técnicas de investigación articuladas y que se desarrollan a partir de criterios metodológicos en concreto. De acuerdo con la FGN, la estrategia de priorización de casos implica la implementación y el desarrollo de estrategias de investigación criminal en contexto. En conjunto, estas dos estrategias tienen como finalidad encontrar “relaciones entre diferentes casos para resolver conjuntos de hechos delictuales concretos”, de manera que se optimicen recursos humanos, físicos y se haga más eficiente la investigación, también con la idea de asociar casos, reconstruir situaciones, investigar aparatos, máquinas o redes de criminalidad que actúan en contextos complejos.", "Así como las demás TEI, se pretende la judicialización de responsables, comprendiendo su participación o su rol en la estructura o red que se investiga, al tiempo que busca la posibilidad de focalizar la investigación en aquellos delitos más graves y los individuos de mayor responsabilidad en la organización.", "Por un lado, la priorización es una política cuya finalidad es el diseño e implementación de una técnica de gestión estratégica de las cargas laborales dentro de la institución. De igual manera, a nivel estratégico, gestiona el flujo de casos penales que conoce la FGN, para optimizar el análisis investigativo, el ejercicio de la acción penal y, también, el ejercicio de la acción de extinción de dominio. En un primer momento, se entendió el criterio de priorización como un parámetro lógico útil para enfocar las actividades de investigación hacia determinadas situaciones y casos con la finalidad de asegurar un mayor impacto en la lucha contra este tipo de delincuencia; cumpliendo criterios objetivos estratégicos para racionalizar el ejercicio de la labor investigativa.", "Por otro lado, la investigación y análisis de contexto implica una metodología de aproximación a la realidad social del delito. Este enfoque es netamente sistémico, por cuanto busca identificar, comprender e investigar la organización en su composición totalizante, sus nodos, su capital social, sus redes de apoyo, sus actividades estratégicas, sus complejas relaciones políticas, económicas, comerciales o corporativas, entre otras características. No se acude, entonces, a casos singulares que puedan dar cuenta de estas características; sino a un modelo investigativo omnicomprensivo del fenómeno criminal soportado sobre el análisis criminal y la construcción del contexto.", "Como se trata de una TEI implementada en el marco de la justicia transicional en Colombia y posteriormente orientada a la lucha contra la criminalidad organizada, el análisis de contexto y la priorización de casos no está prevista en la legislación española. En Colombia por su parte, en el marco jurídico para la paz establecido en el acto legislativo número 01 de 2012 se implementó un sistema de Justicia transicional que atribuyó a la Fiscalía General de la Nación la competencia de determinar criterios de priorización para el ejercicio de la acción penal. Con base en esta disposición normativa es la Fiscalía la que puede dar énfasis y focalizar la investigación sobre ciertos delitos de mayor importancia o gravedad. Es en este contexto que el marco normativo se ha venido desarrollando a través de actos administrativos proferidos por la Fiscalía.", "En la Resolución 1810 de 2012, la Fiscalía colombiana se refiere a esta modalidad de como un nuevo paradigma de investigación de delitos graves y un modelo de gestión judicial de la investigación penal, con base en la cual se busca permitir la indagación de las conductas delictivas, no como hechos aislados o inconexos, sino como el resultado del accionar de organizaciones delictivas dentro de un determinado contexto, enmarcado específicamente en el conflicto armado colombiano."], "parrafo": [0, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mapa", "items": [{"label": "técnicas de investigación articuladas", "segs": [0, 1], "obj": "lupa", "centro": true}, {"label": "política cuya finalidad", "segs": [2], "obj": "documento"}, {"label": "investigación y análisis de contexto", "segs": [3], "obj": "carpetas"}, {"label": "justicia transicional", "segs": [4], "obj": "reloj"}, {"label": "Fiscalía colombiana", "segs": [5], "obj": "expediente"}]}], "rotulo": null, "seccion": "2.14.3 Análisis en contexto y priorización de casos (TEI atípica o innominada)", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: el primer contenido en el centro y las ramas se exploran una a una.", "rotulos": ["técnicas de investigación articuladas", "política cuya finalidad", "investigación y análisis de contexto", "justicia transicional", "Fiscalía colombiana"], "titulo_genially": "Análisis en contexto y priorización de casos (TEI atípica o innominada)"}, {"layout": "caso", "segmentos": ["Aplicación al expediente del curso", "En el caso de Sara Velásquez, analice y determine si puede proceder alguna de las técnicas de investigación enunciadas en la lección 2 para obtener evidencia digital y rastrear el origen de las amenazas. Identifique el control judicial procedente."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "caso", "roles": {"titulo": 0, "parrafos": [1]}, "obj": "expediente", "items": []}], "rotulo": null, "seccion": "Aplicación al expediente del curso", "grupo": null, "titulos_fuente": ["Aplicación al expediente del curso"], "encabezados": [0], "mediacion": "Expediente del caso con espacio de respuesta.", "rotulos": ["Aplicación al expediente del curso"], "titulo_genially": "Aplicación al expediente del curso"}]}</script>
