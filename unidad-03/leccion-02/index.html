<script type="application/json" id="contenido">{"unit": 3, "lesson": 2, "heading": "Lección 2. Comprensión, práctica y control judicial de técnicas habituales de investigación y nuevas técnicas de investigación (registro y allanamiento, búsqueda selectiva en bases de datos, interceptación de comunicaciones, agentes encubiertos, entregas vigiladas, entre otras)", "scenes": [{"layout": "mapa", "segmentos": ["El artículo 250 de la CN consagra como regla general que la práctica de medidas que afecten derechos y garantías constitucionales, con el fin de obtener elementos materiales probatorios u otro tipo de información, debe ser autorizada previamente por el JCG. No obstante, la diligencia de allanamiento y registro —al igual que las de interceptación de comunicaciones, interceptación de correspondencia y recuperación de información dejada al navegar por la Internet— constituyen la excepción.", "En ese orden de ideas, la Ley 906 de 2004 regula ampliamente la práctica de la técnica de investigación de los registros y allanamientos, cuyo cumplimiento debe estar sujeto a estrictos requisitos constitucionales y legales. Como es lógica, por tratarse de una medida con incidencia sobre preceptos constitucionales —como lo son el derecho a la intimidad y, específicamente, el mandato de inviolabilidad del domicilio, de acuerdo con el artículo 28 superior—, se exige un control judicial por parte del JCG. Así, puede anticiparse que la legalidad de la diligencia depende de la existencia de motivos fundados y del cumplimiento de requisitos esenciales para la expedición de la orden por parte del fiscal competente, so pena de la invalidez de la diligencia, así como de la exclusión de los elementos materiales probatorios y evidencia física recolectada a partir de ella (Art. 232).", "De hecho, en la Sentencia C-591/05, la Corte Constitucional (2005) estudia la constitucionalidad de un fragmento del artículo 232 del CPP, por cuanto se señala que “los elementos materiales probatorios y evidencia física que dependan directa y exclusivamente del registro carecerán de valor” (subrayado fuera de texto). En dicha providencia, la corporación referida indica que aquella disposición vulnera el derecho al debido proceso para los efectos de la diligencia de Registro y allanamiento, y concluye con la inexequibilidad de la expresión. Efectivamente, el hecho de que tan sólo los elementos probatorios y evidencia física que dependan de manera “directa y exclusiva” de la diligencia sean excluidos, quebranta el mandato contenido en el inciso último del artículo 29 constitucional, al limitar el alcance constitucional dado a la regla de exclusión probatoria."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mapa", "items": [{"label": "artículo 250 de la CN", "segs": [0], "obj": "telefono", "centro": true}, {"label": "Ley 906 de 2004", "segs": [1], "obj": "casa"}, {"label": "Corte Constitucional (2005)", "segs": [2], "obj": "libros"}]}], "rotulo": null, "seccion": "2.1. Registro y allanamiento", "grupo": "Fundamento", "titulos_fuente": ["2.1. Registro y allanamiento", "Fundamento"], "encabezados": [], "mediacion": "Mapa conceptual: el primer contenido en el centro y las ramas se exploran una a una.", "rotulos": ["artículo 250 de la CN", "Ley 906 de 2004", "Corte Constitucional (2005)"], "titulo_genially": "Fundamento"}, {"layout": "giro", "segmentos": ["La diligencia de Registro y allanamiento deberá practicar con los únicos fines de: (i) obtener elementos materiales probatorios y evidencia física o (ii) realizar la captura del indiciado, imputado o condenado. En este último escenario, el fiscal sólo podrá ordenar su práctica con relación a delitos susceptibles de imposición de medida de aseguramiento de detención preventiva, bajo control previo por parte del JCG. Sobre este asunto, la jurisprudencia ha sido enfática:", "“[...] la posibilidad de que la Fiscalía ordene adelantar una diligencia de registro y allanamiento, únicamente para procurar la captura de una persona, requiere de la autorización previa del juez de garantías tratándose del indiciado o imputado, quien deberá constatar tal como exige el artículo 219 analizado, no sólo que se esté en presencia de un delito de aquellos susceptibles de imposición de medida de aseguramiento de detención preventiva, sino de los demás presupuestos contenidos en la ley y decantados por la jurisprudencia. En los eventos de condenados, tal orden provendrá del juez de conocimiento o del juez de ejecución de penas y medidas de seguridad, según el caso” [Sentencia C-366/14, Apartado 6.10., (Corte Constitucional, 2014)]"], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "diligencia de Registro y allanamiento", "segs": [0], "obj": "puertaCerrada"}, {"label": "artículo 219", "segs": [1], "obj": "casa"}]}], "rotulo": null, "seccion": "2.1. Registro y allanamiento", "grupo": "Finalidades perseguidas", "titulos_fuente": ["2.1. Registro y allanamiento", "Finalidades perseguidas"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["diligencia de Registro y allanamiento", "artículo 219"], "titulo_genially": "Finalidades perseguidas"}, {"layout": "lamina", "segmentos": ["No basta con la finalidad perseguida por parte del Fiscal, puesto que la medida en comento debe aplicarse para aquellos casos en donde existan “motivos razonablemente fundados”, que permitan concluir que (i) la ocurrencia del delito investigado tiene como probable autor o partícipe al propietario, al simple tenedor del bien por registrar o al que transitoriamente se encontrare en él; o que (ii) en su interior se hallan “los instrumentos con los que se ha cometido la infracción, o los objetos producto del ilícito”. En consecuencia, la orden del fiscal no puede sustentarse en simples sospechas, intuiciones o conjeturas, sino en información objetiva que permita justificar constitucionalmente la injerencia en cuanto al derecho a la intimidad (la determinación de estos motivos razonablemente fundados y de los elementos que permiten establecer su existencia, será objeto de desarrollo posterior en la cuarta unidad del curso)."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Motivos razonablemente fundados", "segs": [0], "obj": "lupa"}]}], "rotulo": null, "seccion": "2.1. Registro y allanamiento", "grupo": null, "titulos_fuente": ["2.1. Registro y allanamiento"], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Motivos razonablemente fundados"], "titulo_genially": "Registro y allanamiento"}, {"layout": "mapa", "segmentos": ["De acuerdo con el artículo 221 del CPP, la motivación del acto deberá ser respaldada, como mínimo, en: (i) informe de policía judicial; (ii) declaración jurada de testigo o informante; o (iii) EMP y EF que permitan establecer, con verosimilitud, la vinculación del bien con el delito investigado. Cuando el respaldo provenga de testigos o informantes, deben observarse reglas específicas sobre su credibilidad, identificación y reserva de datos (inclusive para efectos de la audiencia ante el JCG). Si se sustenta en elementos materiales probatorios o evidencia física —como videos o fotografías—, el fiscal deberá verificar su cadena de custodia y contar con la certificación bajo juramento del funcionario de policía judicial sobre la corrección de su recolección, embalaje y conservación de los respectivos elementos.", "Frente a las reglas, es preciso evidenciar cómo el artículo 221 del CPP establece un tratamiento diferenciado entre el testigo y el informante. Mientras que el primero deberá estar presente ante el fiscal “con miras a un eventual interrogatorio que le permita apreciar mejor su credibilidad”; para el segundo, por el contrario, se establece que “la policía judicial deberá precisar al fiscal su identificación y explicar por qué razón le resulta confiable”. Según la Corte Constitucional, esta distinción es contraria a la Constitución, por cuanto la ley obliga al fiscal a interrogar directamente al testigo para evaluar su credibilidad, pero exime de ese contacto al informante, bastando con un informe policial sobre su confiabilidad. En sus consideraciones, la Corte estimó que los Fiscales no pueden delegar ciegamente la valoración de una fuente en cabeza de la policía judicial, en tanto que esta misma sustenta medidas restrictivas de derechos fundamentales.", "En consonancia con lo anterior, el precedente recordó algo sumamente importante: la declaración jurada de testigo o informante, al igual que los demás elementos materiales probatorios y la evidencia física, constituyen tan sólo instrumentos para direccionar y encauzar la actividad investigativa del Estado (apartado tercero, ejusdem). Ciertamente, estas declaraciones carecen de valor probatorio en cuanto a establecer la existencia del hecho punible y/o el grado de responsabilidad penal del imputado, debido a que no corresponden a la noción de “pruebas”; mismas que sólo se producen directamente en el curso de un juicio oral, público, concentrado y con todas las garantías. De allí que, dado el alto impacto que los informes pueden generar sobre las medidas restrictivas de derechos fundamentales, se exija un tratamiento de máxima rigurosidad institucional.", "En conclusión, la Corte Constitucional dirimió el conflicto referido, aplicando la siguiente subregla de Derecho: el fiscal debe tener la facultad de adelantar sus propias valoraciones, esto es, interrogar también de forma directa al informante, bajo juramento, para verificar su fiabilidad. Así pues, la corporación declara la constitucionalidad exequible del respectivo fragmento del artículo 221 del CPP."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mapa", "items": [{"label": "artículo 221 del CPP", "segs": [0], "obj": "expediente", "centro": true}, {"label": "preciso evidenciar cómo el artículo 221", "segs": [1], "obj": "personas"}, {"label": "algo sumamente importante", "segs": [2], "obj": "libros"}, {"label": "subregla de Derecho", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "2.1. Registro y allanamiento", "grupo": "Respaldo de los motivos razonablemente fundados", "titulos_fuente": ["2.1. Registro y allanamiento", "Respaldo de los motivos razonablemente fundados"], "encabezados": [], "mediacion": "Mapa conceptual: el primer contenido en el centro y las ramas se exploran una a una.", "rotulos": ["artículo 221 del CPP", "preciso evidenciar cómo el artículo 221", "algo sumamente importante", "subregla de Derecho"], "titulo_genially": "Respaldo de los motivos razonablemente fundados"}, {"layout": "fichas", "segmentos": ["En cuanto a su alcance (Art. 222), la orden de registro y allanamiento deberá individualizar con precisión el lugar sobre el cual recaerá dicha diligencia. Debe recordarse que, en ningún caso, podrán expedirse órdenes generales, indiscriminadas o imprecisas que permitan registrar lugares no determinados con suficiencia. Precisamente, cuando el inmueble, nave o aeronave cuente con varios apartamentos, oficinas, habitaciones o compartimentos independientes, la orden deberá señalar expresamente cuáles de ellos serán objeto del registro. Ello sin perjuicio de que, cuando no sea posible identificar con exactitud el espacio específico, el fiscal pueda proferir la orden justificando las razones que hacen necesaria la extensión de la diligencia a la totalidad del bien.", "Sobre esta cuestión, es importante remitirse a la Sentencia C-282/97 de la Corte Constitucional (1997). Mediante esta providencia se declara la exequibilidad del artículo 83 de la Ley 300 de 1996 (Ley General de Turismo), que modificó la Ley 23 de 1982, al disponer que \"las habitaciones de los establecimientos hoteleros y de hospedajes que se alquilan con fines de alojamiento se asimilan a un domicilio privado\". Dentro de la demanda de inconstitucionalidad, la recurrente alega que los hoteles tienen una naturaleza comercial y, por correspondencia, un ánimo de lucro, lo cual —en su concepto— no se asimila con la noción de “domicilio privado”; vulnerando el principio de igualdad.", "Al declarar la exequibilidad de la anterior norma, la Corte Constitucional (1997) precisó lo siguiente:", "“El derecho a la intimidad de toda persona y de toda familia, protegido por la Constitución, que las autoridades deben respetar y hacer respetar, comprende el ámbito reservado e inalienable al que aquéllas se acogen, con total independencia de la propiedad o administración del inmueble que las cobija, o del tiempo durante el cual permanezcan dentro de él, por lo cual no es menos susceptible de amparo constitucional la casa tomada en arriendo, la habitación de un inquilinato o el cuarto de un hotel, que la casa cuyo derecho de dominio puede demostrar quien la habita, o en la cual ha vivido por muchos años.", "Para los fines de la protección del núcleo esencial del derecho a la intimidad, resulta indiferente el vínculo contractual que exista entre el propietario, el arrendador o el hotelero y el inquilino o el huésped, ya que éstos, desde el momento mismo en que se les hace entrega material del inmueble o habitación, lo tienen como su domicilio, al menos temporal, y adquieren el derecho a su inviolabilidad.” (subrayado fuera del texto)", "Bajo ese entendido, consideró que las habitaciones de hotel gozaban del mismo amparo constitucional previsto para el domicilio, por cuanto la habitación —así fuera temporal— del espacio genera una expectativa de intimidad sobre él. Por tanto, ninguna persona ni autoridad puede, entonces, sin permiso del huésped, “ingresar ni penetrar en la intimidad de las mismas, invadirlas, registrarlas, requisarlas, espiar, fotografiar, filmar ni grabar lo que en su interior acontece, a menos que medie orden escrita de autoridad judicial competente”."], "parrafo": [0, 1, 2, 3, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "orden de registro y allanamiento", "segs": [0], "obj": "casa"}, {"label": "Sentencia C-282/97", "segs": [1], "obj": "libros"}, {"label": "Corte Constitucional (1997)", "segs": [2, 3], "obj": "escudo"}, {"label": "Para los fines de la protección", "segs": [4], "obj": "documento"}, {"label": "habitaciones de hotel", "segs": [5], "obj": "personas"}]}], "rotulo": null, "seccion": "2.1. Registro y allanamiento", "grupo": "Delimitación del acto investigativo", "titulos_fuente": ["2.1. Registro y allanamiento", "Delimitación del acto investigativo"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["orden de registro y allanamiento", "Sentencia C-282/97", "Corte Constitucional (1997)", "Para los fines de la protección", "habitaciones de hotel"], "titulo_genially": "Delimitación del acto investigativo"}, {"layout": "lamina", "segmentos": ["Con todo, la ley excluye de la diligencia de registro determinadas comunicaciones y documentos, en garantía del derecho a la intimidad y del secreto profesional. Tal es el caso de las comunicaciones entre el abogado y su defendido o entre el procesado y las personas amparadas por la prohibición de declarar, o de los archivos que contengan este tipo de información. Según el parágrafo único del artículo 223, estas prohibiciones no resultan aplicables cuando aquel privilegio desaparece, sea por su renuncia, por tratarse de personas vinculadas (como auxiliadores, partícipes o coautores del delito investigado o de uno conexo o que se encuentre en curso), o se trate de situaciones que constituyan una obstrucción a la justicia."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Objeto no susceptible de registro", "segs": [0], "obj": "telefono"}]}], "rotulo": null, "seccion": "2.1. Registro y allanamiento", "grupo": null, "titulos_fuente": ["2.1. Registro y allanamiento"], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Objeto no susceptible de registro"], "titulo_genially": "Registro y allanamiento"}, {"layout": "giro", "segmentos": ["Respecto a la orden de registro y allanamiento esta debe ser diligenciada en un término máximo de treinta (30) días durante la etapa de indagación y quince (15) días después de la formulación de imputación, habiendo la posibilidad de prórroga cuando existan razones que lo justifiquen (Art. 224). En casos excepcionales, como lo son las investigaciones contra miembros de Grupos Delictivos Organizados y Grupos Armados Organizados, la orden del fiscal podrá ser diligenciada en un plazo de seis (6) meses, si se trata de indagación, y tres (3) meses, cuando se expida con posterioridad a la formulación de imputación (Art. 224A).", "Así mismo, luego de la práctica, es bien sabido que se exige un control judicial posterior, por parte del JCG, con el fin de legalizar la práctica de la diligencia. El conteo del término de las treinta y seis (36) horas siguientes, correspondiente a este tipo control, ha sido objeto de múltiples interpretaciones. Sin embargo, una Sentencia reciente de la Corte Suprema de Justicia (2023, Sentencia STP13792-2023), concluyó que este término no incluye la culminación de la audiencia de control posterior. De tal suerte, el plazo máximo de treinta y seis (36) horas no implica que la diligencia de control deba concluir dentro de este mismo lapso."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Respecto a la orden de registro", "segs": [0], "obj": "casa"}, {"label": "STP13792-2023", "segs": [1], "obj": "libros"}]}], "rotulo": null, "seccion": "2.1. Registro y allanamiento", "grupo": "Plazos para la práctica y control posterior", "titulos_fuente": ["2.1. Registro y allanamiento", "Plazos para la práctica y control posterior"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Respecto a la orden de registro", "STP13792-2023"], "titulo_genially": "Plazos para la práctica y control posterior"}, {"layout": "fichas", "segmentos": ["Por otro lado, la ejecución de la orden de registro y allanamiento debe realizarse con estricto respeto por los principios de legalidad, necesidad y proporcionalidad, procurando minimizar la afectación de los derechos fundamentales de los involucrados. Sin embargo, el artículo 225 de la Ley 906 de 2004 traza una serie de reglas que orientan la actuación de la Policía Judicial durante la diligencia:", "El registro sólo se adelanta en los lugares autorizados y, de encontrarse nuevos medios de prueba, se podrá extenderse a otros lugares, incluidos los que puedan encuadrarse en las situaciones de flagrancia;", "La ocupación o incautación de bienes deberá limitarse a aquellos expresamente señalados en la orden, salvo que durante la diligencia se configuren circunstancias de flagrancia o aparezcan elementos materiales probatorios o evidencia física relacionados con un delito distinto al inicialmente investigado;", "La diligencia deberá documentarse mediante un acta en la que se consignen, de manera clara y detallada, los lugares registrados, los objetos ocupados o incautados, las personas capturadas, las medidas preventivas policivas y cualquier oposición presentada por los afectados. Los propietarios, poseedores o tenedores tendrán derecho a que se les expida copia del acta, si la solicitan (Art. 227);", "El contenido del acta debe ser leído a las personas que aleguen haber resultado afectadas con la diligencia, quienes podrán manifestar sus observaciones o solicitar las precisiones que consideren pertinentes antes de firmarla. En caso de que alguna se negase a suscribir el documento, el funcionario responsable dejará constancia expresa de dicha circunstancia bajo la gravedad del juramento.", "Se requiere el acompañamiento de la Procuraduría General de la Nación cuando el registro y allanamiento se practique entre las 6:00 p. m. y las 6:00 a. m.; sin que su ausencia sea una causal para suspender o impedir la práctica."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [1, 2, 3, 4, 5], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "ejecución de la orden de registro", "segs": [0, 1], "obj": "casa"}, {"label": "ocupación o incautación de bienes", "segs": [2], "obj": "expediente"}, {"label": "documentarse mediante un acta", "segs": [3], "obj": "puertaCerrada"}, {"label": "contenido del acta", "segs": [4], "obj": "personas"}, {"label": "acompañamiento de la Procuraduría General", "segs": [5], "obj": "documento"}]}], "rotulo": null, "seccion": "2.1. Registro y allanamiento", "grupo": "Reglas particulares de la práctica de la diligencia", "titulos_fuente": ["2.1. Registro y allanamiento", "Reglas particulares de la práctica de la diligencia"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["ejecución de la orden de registro", "ocupación o incautación de bienes", "documentarse mediante un acta", "contenido del acta", "acompañamiento de la Procuraduría General"], "titulo_genially": "Reglas particulares de la práctica de la diligencia"}, {"layout": "mapa", "segmentos": ["Ahora bien, con respecto a las reglas especiales de esta técnica de investigación, es preciso señalar que, cuando el allanamiento y el registro deba practicarse en inmuebles, naves, aeronaves o vehículos automotores que gocen de inmunidad diplomática o consular, el fiscal deberá solicitar previamente la autorización del respectivo agente diplomático o consular, el cual será remitido por conducto del Ministerio de Relaciones Exteriores (Art. 226).", "En las situaciones de flagrancia, la policía judicial podrá proceder al registro y allanamiento del inmueble, nave o aeronave del indiciado. En caso de refugiarse en un bien inmueble ajeno, no abierto al público, se solicitará el consentimiento del propietario o tenedor o en su defecto se obtendrá la orden correspondiente de la FGN, salvo que por voces de auxilio resulte necesaria la intervención inmediata o se establezca coacción del indiciado en contra del propietario o tenedor.", "El artículo 227 del CPP establece que, durante la diligencia de allanamiento y registro, la policía judicial debe elaborar un acta detallada. En ella se identificarán y describirán minuciosamente todos los objetos examinados o incautados, especificando el lugar exacto del inmueble donde fueron hallados. Igualmente, se incorporarán las constancias y observaciones solicitadas por las personas que en ella intervengan, de la cual se expedirá una copia para los propietarios, poseedores o tenedores, si la solicitan", "En igual sentido, una vez culminada la diligencia de Registro y allanamiento, la policía judicial cuenta con un término máximo de doce (12) horas para informar al fiscal los pormenores del operativo y remitir el inventario de los bienes ocupados o incautados, cuya custodia continuará bajo su responsabilidad. Asimismo, si se hubieren efectuado capturas, el aprehendido deberá ser puesto a disposición del fiscal de manera inmediata junto con su respectivo informe."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mapa", "items": [{"label": "Allanamiento especial", "segs": [0], "obj": "casa", "centro": true}, {"label": "Flagrancia", "segs": [1], "obj": "personas"}, {"label": "Acta de la diligencia, devolución de la orden y cadena de custodia", "segs": [2, 3], "obj": "documento"}]}], "rotulo": null, "seccion": "2.1. Registro y allanamiento", "grupo": null, "titulos_fuente": ["2.1. Registro y allanamiento"], "encabezados": [], "mediacion": "Mapa conceptual: el primer contenido en el centro y las ramas se exploran una a una.", "rotulos": ["Allanamiento especial", "Flagrancia", "Acta de la diligencia, devolución de la orden y cadena de custodia"], "titulo_genially": "Registro y allanamiento"}, {"layout": "giro", "segmentos": ["El artículo 230 del CPP contempla ciertas excepciones al requisito de orden escrita de la Fiscalía para proceder con el Registro y allanamiento. En estos casos, la Fiscalía deberá someter a control posterior de legalidad ante el JCG, dentro de las veinticuatro (24) horas siguientes al recibimiento del informe de Policía Judicial sobre las diligencias de las órdenes de registro y allanamiento (Art. 237 CPP).", "En particular, se podrá omitir la expedición de esta orden escrita cuando:", "Medie consentimiento expreso del propietario o simple tenedor del bien objeto del registro, o de quien tenga interés por ser afectado durante el procedimiento, sin considerar como suficiente la mera ausencia de objeciones por parte del interesado;", "No exista expectativa razonable de intimidad, como los objetos a campo abierto, a plena vista o cuando se encuentre abandonado;", "Situaciones de emergencia que pongan en peligro la vida o la propiedad, o en situaciones de riesgo inminente de la salud, la vida o integridad personal o sexual de un menor de edad.", "Ahora bien, cabe preguntarse si resulta ser suficiente la autorización de un único morador para efectos de realizar la diligencia de Registro y allanamiento sobre la totalidad del bien inmueble, incluyendo las habitaciones de quienes no emitieron su debido consentimiento. De manera pacífica, la jurisprudencia en materia penal (Corte Suprema de Justicia, 2017, Auto AP3311-2017; 2019, Sentencia SP1862-2019; 2023, Sentencia SP087-2023) ha sostenido que, cuando en una vivienda conviven diversas personas, en un ambiente de confianza, la autorización de una de ellas puede ser suficiente para practicar un Registro y allanamiento en áreas comunes. Sin embargo, de existir intereses contrapuestos con relación al derecho a la intimidad o condiciones de autonomía entre los moradores, como ocurre con los inquilinos o quienes habitan aposentos privados; el consentimiento de uno de ellos no se extiende automáticamente a los demás.", "En este último, no resulta suficiente para adelantar el registro de dichos espacios."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [2, 3, 4], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "artículo 230 del CPP", "segs": [0], "obj": "casa"}, {"label": "expedición de esta orden escrita cuando", "segs": [1, 2], "obj": "escalones"}, {"label": "encuentre abandonado", "segs": [3, 4], "obj": "escudo"}, {"label": "AP3311-2017", "segs": [5, 6], "obj": "libros"}]}], "rotulo": null, "seccion": "2.1. Registro y allanamiento", "grupo": "Casos en donde no se requiere orden escrita", "titulos_fuente": ["2.1. Registro y allanamiento", "Casos en donde no se requiere orden escrita"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["artículo 230 del CPP", "expedición de esta orden escrita cuando", "encuentre abandonado", "AP3311-2017"], "titulo_genially": "Casos en donde no se requiere orden escrita"}, {"layout": "lamina", "segmentos": ["Quien sea considerado como indiciado o imputado, o sea titular de un derecho de dominio, posesión o mera tenencia del bien objeto de la diligencia, así como —excepcionalmente— el visitante que acredite expectativa razonable de intimidad (Art. 231); únicamente podrá alegar la violación del debido proceso ante el JCG o de conocimiento, en aras de dar aplicación a la regla de exclusión probatoria.", "Al respecto, la Corte Suprema de Justicia (2021), en Sentencia STP12343-2021, indicó que, de conformidad con el artículo 231 del CPP, basta la condición de propietario de un bien incautado para que se pueda concurrir a la respectiva audiencia preliminar, así no se ostente la condición de imputado o indiciado. Por ello, el propietario de un celular incautado, durante una diligencia de Registro y allanamiento, se encuentra legitimado para intervenir en el desarrollo de la audiencia de control posterior de dicha técnica de investigación."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Personas legitimadas para reclamar la violación de la expectativa razonable de intimidad", "segs": [0, 1], "obj": "escudo"}]}], "rotulo": null, "seccion": "2.1. Registro y allanamiento", "grupo": null, "titulos_fuente": ["2.1. Registro y allanamiento"], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Personas legitimadas para reclamar la violación de la expectativa razonable de intimidad"], "titulo_genially": "Registro y allanamiento"}, {"layout": "lamina", "segmentos": ["La búsqueda selectiva en bases de datos, como técnica de investigación, responde a la creciente importancia de la información electrónica en las investigaciones penales y a la necesidad de contar con herramientas que permitan reconstruir vínculos, identificar personas o verificar circunstancias relevantes para el curso del proceso. Dicho acto investigativo permite a la Policía Judicial acceder a información almacenada en sistemas físicos o digitales con el propósito de obtener datos útiles para el esclarecimiento de los hechos investigados."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Noción y alcance", "segs": [0], "obj": "lupa"}]}], "rotulo": null, "seccion": "2.2. Búsqueda selectiva en bases de datos", "grupo": null, "titulos_fuente": ["2.2. Búsqueda selectiva en bases de datos"], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Noción y alcance"], "titulo_genially": "Búsqueda selectiva en bases de datos"}, {"layout": "fichas", "segmentos": ["No obstante, el acceso a esta información no siempre implica la misma intensidad de afectación de los derechos fundamentales. Por este motivo, anteriormente, la Ley 906 de 2004 distinguía dos escenarios claramente diferenciados (los cuales, como se verá adelante, se encuentran revaluados).", "Por un lado, se encuentran los casos relacionados con el simple cotejo de informaciones de acceso público, conforme a la cual se podrá realizar comparaciones de datos registrados en bases mecánicas, magnéticas u otros similares. Aquí, como la actividad investigativa se limita a comparar datos disponibles, sin acceder a información reservada o protegida bajo el derecho a la intimidad, no se requiere orden previa del fiscal ni control judicial.", "Por otro lado, cuando la investigación exige acceder a información confidencial relacionada con el indiciado o imputado, o cuando resulta necesario obtener nuevos datos mediante el análisis cruzado de diferentes bases de datos. En estos casos, será indispensable contar con una autorización previa del fiscal que dirige la investigación, así como un control posterior por parte del JCG, debido a la injerencia sobre derechos fundamentales"], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "acceso a esta información no siempre", "segs": [0], "obj": "libros"}, {"label": "casos relacionados con el simple cotejo", "segs": [1], "obj": "escudo"}, {"label": "información confidencial relacionada con el indiciado", "segs": [2], "obj": "lupa"}]}], "rotulo": null, "seccion": "2.2. Búsqueda selectiva en bases de datos", "grupo": "Modalidades legales de la diligencia y control judicial", "titulos_fuente": ["2.2. Búsqueda selectiva en bases de datos", "Modalidades legales de la diligencia y control judicial"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["acceso a esta información no siempre", "casos relacionados con el simple cotejo", "información confidencial relacionada con el indiciado"], "titulo_genially": "Modalidades legales de la diligencia y control judicial"}, {"layout": "linea", "segmentos": ["En la Sentencia C-336 de 2007, la Corte Constitucional (2007) transformó el paradigma bajo el cual se conciben las reglas del control judicial frente a la diligencia de Búsqueda selectiva en base de datos. Con exactitud, la corporación estableció que este tipo de actividades de investigación siempre debían contar con un control judicial previo. Esto lo expresó en los siguientes términos:", "“De conformidad con el numeral 3° del artículo 250 superior, la búsqueda selectiva en las bases de datos personales computarizadas, mecánicas o de cualquier índole, que realice la FGN, debe contar siempre con la autorización previa del JCG y referirse a la información que se acopia con fines legales, por instituciones o entidades públicas o privadas debidamente autorizadas para ello, por estar de por medio el derecho fundamental al habeas data. Sólo, en este sentido, los apartes acusados de los artículos 14 y 244 de la Ley 906 de 2004 resultan compatibles con la CN y por ende se declarará su exequibilidad condicionada.", "(...)", "Al establecer, en las normas impugnadas, la facultad para el órgano de investigación de acceder a información confidencial, reservada a la esfera personal del individuo, sin que medie la autorización judicial previa, está estableciendo una interferencia indebida en el ejercicio del derecho fundamental a la intimidad, que resulta efectivamente transgresora del artículos 14 C.P., así como del 250.3 ib. que establece los presupuestos bajo los cuales el Estado, en legítimo ejercicio de su potestad investigativa, puede realizar intervenciones en los derechos fundamentales.”", "Así las cosas, con independencia al contenido o al medio en que se encuentra la información, siempre que se practique Búsqueda selectiva en base de datos, deberán surtirse las instancias de control previo y control posterior, ante el JCG. Ello, atendiendo en gran medida al principio de reserva judicial: en un Estado Social de Derecho, cuyos poderes públicos se encuentran divididos para garantizar la independencia e imparcialidad, resulta inadmisible que la FGN, como entidad que actúa bajo un interés de parte, disponga de los derechos fundamentales —habeas data e intimidad, en este caso— con cierto grado de discrecionalidad."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "linea", "items": [{"label": "Corte Constitucional (2007)", "segs": [0], "obj": "libros"}, {"label": "artículo 250", "segs": [1, 2], "obj": "lupa"}, {"label": "facultad para el órgano de investigación", "segs": [3], "obj": "escudo"}, {"label": "con independencia al contenido o al medio", "segs": [4], "obj": "carpetas"}]}], "rotulo": null, "seccion": "2.2. Búsqueda selectiva en bases de datos", "grupo": "Concepción de la jurisprudencia constitucional con respecto al control judicial", "titulos_fuente": ["2.2. Búsqueda selectiva en bases de datos", "Concepción de la jurisprudencia constitucional con respecto al control judicial"], "encabezados": [], "mediacion": "Línea de tiempo: se avanza momento a momento.", "rotulos": ["Corte Constitucional (2007)", "artículo 250", "facultad para el órgano de investigación", "con independencia al contenido o al medio"], "titulo_genially": "Concepción de la jurisprudencia constitucional con respecto al control judicial"}, {"layout": "mapa", "segmentos": ["En cuanto a los términos procesales, es preciso señalar que existen dos “regímenes”: (i) actividades ordinarias de investigación y (ii) actividades de investigación relativas al crimen organizado. En cuanto al primer evento, el plazo máximo para la práctica del acto investigativo será de treinta (30) días, cuando se solicite en fase de indagación, y quince (15) días, si la solicitud se realiza en la fase de investigación. Para el segundo evento, correspondiente a las actividades de investigación en casos de criminalidad organizada, el plazo máximo para la práctica del acto investigativo se amplía a tres (3) meses, para la etapa de indagación, y seis (6) meses, para la fase de investigación.", "Todos los términos procesales vistos, cuentan con un común denominador: son prorrogables por una única ocasión. Sobre esto, la jurisprudencia de la Corte Suprema de Justicia (2020, STP1157-2020) ha sido enfática, en el sentido de que el artículo 244 —sobre Búsqueda Selectiva en Base de Datos— remite de forma expresa al artículo 224 del CPP, según el cual sólo es posible conceder una única prórroga para el Registro y Allanamiento. En ese orden de ideas, incluso, si ya un JCG concedió una segunda prórroga, el juez que conoce del control posterior se encuentra obligado a declarar la ilegalidad del procedimiento y sus resultados, con fundamento en lo expuesto.", "Cuando la investigación recaiga sobre organizaciones criminales, el JCG podrá autorizar el levantamiento de la reserva y el acceso a la totalidad de las bases de datos en las que razonablemente pueda encontrarse información relacionada con el indiciado o imputado. Esta autorización exige una motivación reforzada por parte de la Fiscalía, quien deberá demostrar que la gravedad de los hechos investigados y las particularidades del caso hacen indispensable una medida de tal alcance. Vencido el término de la autorización, la Fiscalía deberá comparecer nuevamente ante el JCG, dentro de las treinta y seis (36) horas siguientes al último acto de investigación, para que este examine la legalidad de todo el procedimiento.", "Cabe precisar, a su vez, que cuando se pretende someter a control judicial previo la práctica de la diligencia aludida, en el marco de la indagación, no es obligatorio que se cite a la defensa; mientras que, cuando se realiza en la etapa de investigación, se deberá citar a la defensa. Ocurre lo mismo cuando se trata de la audiencia preliminar de control judicial posterior: no es obligatorio que se cite a la defensa en indagación, pero sí en la fase de investigación."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mapa", "items": [{"label": "términos procesales", "segs": [0], "obj": "reloj", "centro": true}, {"label": "Todos los términos procesales vistos", "segs": [1], "obj": "libros"}, {"label": "Cuando la investigación recaiga sobre organizaciones criminales", "segs": [2], "obj": "escudo"}, {"label": "control judicial previo", "segs": [3], "obj": "tribunal"}]}], "rotulo": null, "seccion": "2.2. Búsqueda selectiva en bases de datos", "grupo": "Reglas específicas", "titulos_fuente": ["2.2. Búsqueda selectiva en bases de datos", "Reglas específicas"], "encabezados": [], "mediacion": "Mapa conceptual: el primer contenido en el centro y las ramas se exploran una a una.", "rotulos": ["términos procesales", "Todos los términos procesales vistos", "Cuando la investigación recaiga sobre organizaciones criminales", "control judicial previo"], "titulo_genially": "Reglas específicas"}, {"layout": "giro", "segmentos": ["No obstante, en atención a este último punto, es de obligatoria consulta la Sentencia C-025 de 2009 de la Corte Constitucional (2009), misma que declaró la exequibilidad condicionada del artículo 245, atinente a la técnica de Exámenes de adn que involucren al indiciado o al imputado. De acuerdo con este precedente, cuando la persona conozca que está siendo indagada, es decir, cuando esta sepa que le está investigando por su presunta autoría y/o participación en determinados hechos delictivos, pero todavía no se le haya imputación o trasladado escrito de acusación, según el régimen procesal aplicable; tendrá derecho a solicitar que se le cite a audiencia de control posterior. También, la persona que está siendo indagada, podrá exigir que se le cite a audiencia de control previo, sin embargo, no es obligatorio.", "En otras palabras, cuando el indagado solicite que se le cite a audiencia de control posterior —y no así a la de control previo—, la citación efectiva constituye un requisito sine qua non para la realización de esta misma. En estos escenarios, si la Fiscalía oculta información relativa a dicha solicitud, y el juez entiende por válida la información obtenida, esta adolecerá de vicios, en torno a los cuales resulta procedente la regla de exclusión probatoria.", "Con todo esto, aun cuando la norma no lo mencione expresamente, es posible que la defensa solicite la práctica de la diligencia de Búsqueda selectiva en base de datos, bajo dos argumentos primordiales; (i) no existe prohibición expresa y (ii) como expresión del principio de igualdad de armas. En contraste, a propósito de este último mandato, la jurisprudencia (Corte Suprema de Justicia, 2024, STP13966-2024) ha indicado que no es posible que el/la representante de víctimas solicite ante un JCG la autorización para realizar una búsqueda selectiva en bases de datos. De conformidad con el artículo 250 de la CN y el artículo 244 del CPP, la víctima no se encuentra legitimada para solicitar directamente esta diligencia, por su condición de interviniente especial. Esta facultad corresponde a la Fiscalía y, en ciertos eventos, a la defensa; de extenderse a las víctimas, habría un desequilibrio procesal en perjuicio de la defensa."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Sentencia C-025 de 2009", "segs": [0], "obj": "libros"}, {"label": "audiencia de control posterior", "segs": [1], "obj": "tribunal"}, {"label": "STP13966-2024", "segs": [2], "obj": "lupa"}]}], "rotulo": null, "seccion": "2.2. Búsqueda selectiva en bases de datos", "grupo": "Reglas específicas", "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Sentencia C-025 de 2009", "audiencia de control posterior", "STP13966-2024"], "titulo_genially": "Reglas específicas"}, {"layout": "fichas", "segmentos": ["Por último, es menester esclarecer la naturaleza de los días que componen los términos de práctica de esta diligencia. Es razonable pensar que, en estos asuntos, resultan aplicables las disposiciones del artículo 70 del Código Civil, subrogado por el artículo 62 del Código de Régimen Político y Municipal, según las cuales estos días deben interpretarse como hábiles. No obstante, conviene considerar que estos últimos términos rigen a los jueces de conocimiento [Sentencia C-042 de 2018 de la Corte Constitucional (2018)], y no así a los jueces de control de garantías. En efecto, es inherente a la función de control de garantías la ponderación del ejercicio de la acción estatal —verificación de la sospecha, búsqueda de la verdad y acopio del material probatorio— con relación a la preservación de los derechos y garantías constitucionales que le asisten al procesado.", "Esto evidencia una labor eminentemente constitucional, razón por la cual debe operar bajo la premisa legal de la prestación continua e ininterrumpida, donde todos los días y las horas son hábiles para garantizar la protección oportuna de los derechos fundamentales."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "artículo 70", "segs": [0], "obj": "libros"}, {"label": "razón por la cual", "segs": [1], "obj": "reloj"}]}], "rotulo": null, "seccion": "2.2. Búsqueda selectiva en bases de datos", "grupo": "Naturaleza de los términos procesales", "titulos_fuente": ["2.2. Búsqueda selectiva en bases de datos", "Naturaleza de los términos procesales"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["artículo 70", "razón por la cual"], "titulo_genially": "Naturaleza de los términos procesales"}, {"layout": "linea", "segmentos": ["A nivel jurisprudencial, se han identificado múltiples problemas jurídicos relevantes atinentes a esta medida ordenada por fiscales. A continuación, se presentan brevemente estas cuestiones jurídicas, así como las soluciones concretas brindadas por la jurisprudencia en materia de Derecho procesal penal.", "En un primer nivel, la providencia AP5288-2024 (Corte Suprema de Justicia, 2024) resulta ser un hito en torno a la concepción de los datos personales, a partir del desarrollo tecnológico. La Corte subraya que los datos biométricos, por su naturaleza sensible, requieren de un control previo por parte del JCG. El carácter sensible de estos datos, de acuerdo con el tercer apartado de la providencia, se extrae del artículo 5 de la Ley 1581 de 2012, la cual establece que este tipo de información no puede ser utilizada sin cumplir ciertos requisitos de protección de datos personales.", "Para el caso concreto, la Sala determinó que la obtención del registro biométrico de entrada y salida de una entidad, con independencia de su carácter público o privado, necesitaba de la autorización por parte de un JCG, en el marco de un acto investigativo de búsqueda selectiva en bases de datos, reglado en el artículo 244 del CPP y la sentencia C-336 de 2007 (Corte Constitucional, 2007).", "En un segundo nivel, un caso relativamente semejante al expuesto se presentó algunos años atrás al interior de la misma corporación. En la providencia AP4281-2019 (Corte Suprema de Justicia, 2019), se determinó que el registro de entradas y salidas a un condominio, que diligencia la administración de la respectiva propiedad, no podía catalogarse como una \"base de datos\". En concreto, se arribó a esta conclusión, al considerar que este tipo de información registrada corresponde a un archivo creado por un particular, el cual no ejerce la actividad de recolección y organización de información de manera técnica, habitual o institucional. En ese sentido, su obtención no requiere autorización por parte de un JCG [nótese la tensión jurisprudencial con respecto a la sentencia C-336 de 2007 de la Corte Constitucional (2007)]."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "linea", "items": [{"label": "problemas jurídicos relevantes", "segs": [0], "obj": "libros"}, {"label": "AP5288-2024", "segs": [1], "obj": "personas"}, {"label": "artículo 244 del CPP", "segs": [2], "obj": "lupa"}, {"label": "caso relativamente semejante al expuesto", "segs": [3], "obj": "reloj"}]}], "rotulo": null, "seccion": "2.2. Búsqueda selectiva en bases de datos", "grupo": "Subreglas de Derecho desarrolladas por la Corte Suprema de Justicia", "titulos_fuente": ["2.2. Búsqueda selectiva en bases de datos", "Subreglas de Derecho desarrolladas por la Corte Suprema de Justicia"], "encabezados": [], "mediacion": "Línea de tiempo: se avanza momento a momento.", "rotulos": ["problemas jurídicos relevantes", "AP5288-2024", "artículo 244 del CPP", "caso relativamente semejante al expuesto"], "titulo_genially": "Subreglas de Derecho desarrolladas por la Corte Suprema de Justicia"}, {"layout": "giro", "segmentos": ["En un tercer nivel, es preciso hacer mención a una providencia bastante importante en esta materia, como lo es la AP350-2022 (Corte Suprema de Justicia, 2022). En ella la Corte se encargó de decidir sobre la naturaleza del sistema de reparto de la rama judicial en tanto \"base de datos personales\". Al efecto, se dispuso que este sistema de gestión judicial correspondía a un sistema de información creado por usuarios que no ejercen esa actividad de acopio de información de manera profesional o institucional, lo cual dista fundamentalmente del concepto de base de datos personales, el cual consiste en un sistema de acopio de información administrado por entidades públicas o privadas, en el marco de una actividad profesional o institucional legítima, sometido a los principios jurídicos del derecho al habeas data.", "Así, un registro a los equipos de cómputo de la Rama Judicial por parte de la Policía Judicial, que permitió la recuperación de imágenes forenses del sistema de reparto, no habría afectado la intimidad ni el habeas data. Con todo, dicho registro corresponde, más bien, a un sistema de almacenamiento de información cuya finalidad es garantizar la transparencia e imparcialidad de la administración de justicia (demandantes, demandados, tipo de acción jurídica invocada, despacho judicial asignado, entre otros)."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "AP350-2022", "segs": [0], "obj": "libros"}, {"label": "registro a los equipos de cómputo", "segs": [1], "obj": "escudo"}]}], "rotulo": null, "seccion": "2.2. Búsqueda selectiva en bases de datos", "grupo": "Subreglas de Derecho desarrolladas por la Corte Suprema de Justicia", "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["AP350-2022", "registro a los equipos de cómputo"], "titulo_genially": "Subreglas de Derecho desarrolladas por la Corte Suprema de Justicia"}, {"layout": "mapa", "segmentos": ["La Interceptación de comunicaciones es una herramienta de investigación que permite acceder al contenido de las comunicaciones que se transmiten por cualquier red de comunicaciones, en donde curse información o haya interés para los fines de la actuación; siempre que se tenga por objetivo buscar elementos materiales probatorios y/o evidencia física, así como la búsqueda y ubicación de imputados, indiciados o condenado, a través de la grabación de estos medios.", "Este acto investigativo no requiere autorización judicial previa. Debido a que esta diligencia implica una restricción al derecho fundamental a la intimidad y al mandato del secreto de las comunicaciones, su práctica debe sujetarse estrictamente a los presupuestos establecidos en la ley. Con fundamento en el artículo 235 del CPP, en garantía de los derechos fundamentales, la orden de Interceptación de comunicaciones debe estar debidamente fundamentada por escrito, de manera que permita identificar las razones que justifican la medida.", "Desde esta perspectiva, únicamente procede el control posterior sobre la diligencia de Interceptación de comunicaciones. Así pues, una vez recibidas las diligencias, el fiscal debe solicitar, dentro de las veinticuatro (24) horas siguientes, la audiencia de revisión de legalidad de lo actuado ante los jueces de control de garantías, al tenor del artículo 337 de la Ley 906 de 2004.", "En vista de la injerencia, la orden de interceptación tendrá una vigencia máxima de seis (6) meses. No obstante, podrá ser prorrogada bajo control previo de legalidad por parte del JCG, quien verificará la subsistencia de los motivos fundados que dieron origen a la medida.", "En la práctica, debe indicarse que la ejecución material de la Interceptación de comunicaciones no corresponde a la Fiscalía, sino a las autoridades competentes, quienes serán las encargadas de realizar la operación técnica, procesar la información obtenida y dar cumplimiento inmediato a la orden impartida por el fiscal. Los costos que demande la ejecución de la diligencia serán asumidos por la autoridad responsable de su práctica.", "En igual sentido, los funcionarios de Policía Judicial deberán presentar informes parciales cuando de las comunicaciones interceptadas se obtenga información que haga necesaria una actuación inmediata para recaudar elementos materiales probatorios, evidencia física o impedir la comisión de una o varias conductas punibles.", "Por otro lado, todas las personas que intervengan en el desarrollo de la diligencia estarán obligadas a guardar la debida reserva con respecto a la información obtenida y la actuación, en general. Además, con base en este fundamento constitucional, no podrán interceptarse las comunicaciones sostenidas entre el procesado y su defensor, debido a que se encuentran amparadas por el secreto profesional y la confidencialidad propia de la relación abogado-cliente."], "parrafo": [0, 1, 2, 3, 4, 5, 6], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mapa", "items": [{"label": "Naturaleza y finalidad de la interceptación de comunicaciones", "segs": [0], "obj": "telefono", "centro": true}, {"label": "Requisitos legales y control judicial", "segs": [1, 2], "obj": "escudo"}, {"label": "Vigencia de la orden", "segs": [3], "obj": "reloj"}, {"label": "Ejecución material, costos e informes parciales", "segs": [4, 5], "obj": "expediente"}, {"label": "Reserva de información y restricciones", "segs": [6], "obj": "personas"}]}], "rotulo": null, "seccion": "2.3. Interceptación de comunicaciones", "grupo": null, "titulos_fuente": ["2.3. Interceptación de comunicaciones"], "encabezados": [], "mediacion": "Mapa conceptual: el primer contenido en el centro y las ramas se exploran una a una.", "rotulos": ["Naturaleza y finalidad de la interceptación de comunicaciones", "Requisitos legales y control judicial", "Vigencia de la orden", "Ejecución material, costos e informes parciales", "Reserva de información y restricciones"], "titulo_genially": "Interceptación de comunicaciones"}, {"layout": "fichas", "segmentos": ["La jurisprudencia de la Corte Suprema de Justicia ha identificado múltiples cuestiones jurídicas atinentes a esta técnica de investigación, al momento de la realización de las audiencias preliminares correspondientes. A continuación, se identifican ciertas controversias de alto impacto jurisprudencial.", "En primer término, es pacífico el carácter dispositivo de la asistencia de la Defensa en las audiencias preliminares de control posterior. Sin embargo, ¿qué ocurre con su asistencia cuando la Interceptación de comunicaciones culminó después de la imputación? La Sentencia AP2236-2024 (Corte Suprema de Justicia, 2024) se refiere al parágrafo del artículo 237, teniendo en cuenta que, cuando la orden de interceptación se cumple después de la imputación, deben citarse al imputado y a su defensor a la audiencia de control de legalidad. Aquello implica que: i) la Fiscalía debe informar al juez sobre la existencia de quien es imputado, su ubicación y los datos del defensor, y ii) el juez debe convocarlos; sin que su presencia sea obligatoria. Basta que se les haya citado correctamente, a fin de evitar una nulidad procesal.", "En segundo término, la jurisprudencia (Corte Suprema de Justicia, 2023, AP3424-2023) ha establecido que no procede la exclusión de la prueba, en aquellos eventos en donde la audiencia preliminar de control posterior de Interceptación de comunicaciones no se pudo llevar a cabo por inasistencia de la defensa. Tampoco es válido culpar a la contraparte o cuestionar el nombramiento de nuevos defensores si, en realidad, la demora pudo ser una estrategia para buscar la exclusión de la prueba. Esto tiene que ver, en gran medida, con que la génesis de la regla de exclusión probatoria obedece a una sanción al Estado, en cuanto a la mala praxis acusatoria.", "En tercer término, existe una línea jurisprudencial sólida (Corte Suprema de Justicia, 2023, Sentencia SP102-2023; 2024, Sentencia SP836-2024; 2025, Sentencia SP248-2025) en cuanto a los efectos de la ausencia de descubrimiento de acta de la audiencia de control posterior por parte de la Fiscalía. Sobre este asunto, se considera que este tipo de omisión no genera la exclusión de las interceptaciones, por cuanto las actas no constituyen un elemento material probatorio que deba ser descubierto, sino que hacen parte de la actividad preparatoria del proceso (artículo 345, numeral 3, del CPP). Por otra parte, no es menos cierto el hecho de que ninguna norma exige que el escrito de acusación mencione expresamente la diligencia de legalización, ni mucho menos que se adjunten sus actas. Tampoco resulta lógico estimar que, por no haberse incluido el acta, la audiencia no se haya realizado."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "jurisprudencia de la Corte Suprema", "segs": [0], "obj": "libros"}, {"label": "AP2236-2024", "segs": [1], "obj": "telefono"}, {"label": "AP3424-2023", "segs": [2], "obj": "reloj"}, {"label": "SP102-2023", "segs": [3], "obj": "tribunal"}]}], "rotulo": null, "seccion": "2.3. Interceptación de comunicaciones", "grupo": "Subreglas de Derecho desarrolladas por la Corte Suprema de Justicia", "titulos_fuente": ["2.3. Interceptación de comunicaciones", "Subreglas de Derecho desarrolladas por la Corte Suprema de Justicia"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["jurisprudencia de la Corte Suprema", "AP2236-2024", "AP3424-2023", "SP102-2023"], "titulo_genially": "Subreglas de Derecho desarrolladas por la Corte Suprema de Justicia"}, {"layout": "linea", "segmentos": ["En cuarto término, es importante precisar que existen supuestos en donde la víctima entrega voluntariamente medios a través de los cuales se pueden extraer conversaciones. De ser así, en los términos del Auto AP3439-2024 (Corte Suprema de Justicia, 2024), no es necesario que se efectúe un control judicial posterior. Sin duda, el Estado puede acceder al contenido de conversaciones privadas a través de un acto de liberalidad propio de uno o varios de los partícipes en el acto comunicativo, sin que pueda predicarse la vigencia de garantías de reserva legal y judicial.", "Algunos ejemplos de estos actos de liberalidad de la víctima o el testigo son: (i) la entrega de un documento físico que en principio tenía forma digital (imprime el correo o el chat); (ii) la puesta a disposición del aparato que contiene la información (el celular); (iii) la decisión de grabar una conversación en la cual se participó."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "linea", "items": [{"label": "AP3439-2024", "segs": [0], "obj": "libros"}, {"label": "Algunos ejemplos de estos actos de liberalidad", "segs": [1], "obj": "escudo"}]}], "rotulo": null, "seccion": "2.3. Interceptación de comunicaciones", "grupo": "Subreglas de Derecho desarrolladas por la Corte Suprema de Justicia", "titulos_fuente": [], "encabezados": [], "mediacion": "Línea de tiempo: se avanza momento a momento.", "rotulos": ["AP3439-2024", "Algunos ejemplos de estos actos de liberalidad"], "titulo_genially": "Subreglas de Derecho desarrolladas por la Corte Suprema de Justicia"}, {"layout": "lamina", "segmentos": ["La Recuperación de información producto de la transmisión de datos a través de las redes de comunicaciones, en los términos del artículo 236 del CPP, corresponde a una técnica de investigación que permite la obtención de información digital, en circunstancias donde existen motivos razonablemente fundados para considerar que el indiciado o imputado está transmitiendo, almacenando o manipulando datos a través de redes de telecomunicaciones. Como es previsible, su finalidad es facilitar el recaudo de elementos materiales probatorios y evidencia física, así como contribuir a la búsqueda y captura del indiciado, imputado o condenado", "Cuando concurran estos presupuestos, el fiscal podrá ordenar a la Policía Judicial la retención, aprehensión o recuperación de la información, así como de los equipos terminales, dispositivos, servidores o cualquier otro medio de almacenamiento físico, virtual, análogo o digital que haya sido utilizado para la transmisión o conservación de los datos de interés para la investigación. Una vez asegurados estos medios de almacenamiento, corresponderá a los expertos en informática forense identificar, descubrir, recolectar, analizar y custodiar la información recuperada, garantizando su integridad y preservación para su posterior incorporación al proceso penal.", "Dada la naturaleza de esta diligencia y la posible afectación de derechos fundamentales, el legislador dispuso que le sean aplicables, por analogía y en lo pertinente, los criterios que regulan los registros y allanamientos. En consecuencia, la orden fiscal deberá sustentarse en motivos razonablemente fundados y la actuación estará sometida a las garantías y al control judicial previsto para este tipo de medidas de investigación.", "La aprehensión de los equipos o dispositivos deberá limitarse exclusivamente al tiempo estrictamente necesario para obtener la información contenida en ellos. Cumplida esta finalidad, los equipos deberán ser devueltos inmediatamente a quien corresponda, siempre que no exista otra causa legal que justifique su retención."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Concepto y finalidad de la medida", "segs": [0], "obj": "telefono"}, {"label": "Orden del fiscal", "segs": [1], "obj": "puertaCerrada"}, {"label": "Disposiciones legales", "segs": [2, 3], "obj": "casa"}]}], "rotulo": null, "seccion": "2.4. Recuperación de información producto de la transmisión de datos a través de las redes de comunicaciones", "grupo": null, "titulos_fuente": ["2.4. Recuperación de información producto de la transmisión de datos a través de las redes de comunicaciones"], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Concepto y finalidad de la medida", "Orden del fiscal", "Disposiciones legales"], "titulo_genially": "Recuperación de información producto de la transmisión de datos a través de las redes de comunicaciones"}, {"layout": "giro", "segmentos": ["Uno de los pocos precedentes al respecto es la providencia STP2633-2025 (Corte Suprema de Justicia, 2025). En ella, la Sala de Decisión de Tutela n. ° 3 de la Sala de Casación Penal estudia un caso en que la Fiscalía 95 Especializada contra Organizaciones Criminales de Cali expidió una orden de Recuperación de información producto de la transmisión de datos a través de las redes de comunicaciones con una vigencia de treinta (30) días, pero al momento de expedirse esa orden ya se había formulado imputación contra los investigados. Durante la audiencia de control posterior de legalidad, el Juzgado Once Penal Municipal con Función de Control de Garantías de Cali advirtió esa circunstancia y la Fiscalía argumentó que el artículo 236 no establecía expresamente un plazo específico para la realización de dicha técnica investigativa.", "La Corte Suprema de Justicia, en esta ocasión, avaló la decisión del JCG, quien rechazó el argumento del ente acusador y declaró la ilegalidad formal y material de la orden. Dentro de las consideraciones, la alta corporación recordó que el artículo 236 del CPP, de manera expresa, dispone que analógicamente se aplicarán para ese acto investigativo las reglas del Registro y allanamiento. Bajo ese entendido, como quiera que el artículo 234 ejusdem indica que la Fiscalía cuenta con un plazo de quince (15) días para emitir la respectiva orden después de formulada la imputación, la Sala reconoce que lo procedente era declarar la ilegalidad formal y material de la orden. Además de lo anterior, el alto tribunal también sustenta su decisión en la medida en que los argumentos expuestos por parte del apelante no pueden controvertirse no pueden convertirse prácticamente en una tercera instancia."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "STP2633-2025", "segs": [0], "obj": "telefono"}, {"label": "artículo 236 del CPP", "segs": [1], "obj": "casa"}]}], "rotulo": null, "seccion": "2.4. Recuperación de información producto de la transmisión de datos a través de las redes de comunicaciones", "grupo": "Plazo para la práctica, según la jurisprudencia", "titulos_fuente": ["2.4. Recuperación de información producto de la transmisión de datos a través de las redes de comunicaciones", "Plazo para la práctica, según la jurisprudencia"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["STP2633-2025", "artículo 236 del CPP"], "titulo_genially": "Plazo para la práctica, según la jurisprudencia"}, {"layout": "mapa", "segmentos": ["La retención de correspondencia, contenida en el artículo 233 del CPP, es una técnica especial de investigación que permite acceder a información contenida en correspondencia privada (postal, telegráfica o de mensajería especializada o similar) enviadas o recibidas por el indiciado o imputado. Esta medida procede cuando existan motivos razonablemente fundados para considerar que su contenido puede aportar elementos materiales probatorios o evidencia física útil para la investigación. Dada su injerencia en los derechos fundamentales a la intimidad y al secreto de las comunicaciones, su ejecución exige el cumplimiento de estrictos presupuestos legales (González-Monguí, 2017, pp. 305-326).", "Por la naturaleza de esta actuación, el legislador dispuso que le sean aplicables por analogía, y en lo pertinente, los criterios que regulan los registros y allanamientos. En consecuencia, la orden no sólo deberá estar sustentada en motivos razonablemente fundados, sino que, por ejemplo, deberá ejecutarse con observancia de los términos y las reglas previstas en los artículos 224 y 225.", "Además de exigir una orden fiscal motivada, la Policía Judicial que ejecute la medida debe examinar la correspondencia retenida e informar al fiscal sobre los hallazgos de interés procesal en un plazo máximo de doce (12) horas (artículo 234 del CPP).", "La medida no se limita exclusivamente a la aprehensión del soporte físico original contentivo de la información. El fiscal puede disponer de:", "La retención del documento físico original en tránsito o custodia;", "La obtención de copias de los mensajes transmitidos o recibidos por el indiciado o imputado;", "La solicitud a las empresas de mensajería para que suministren la relación o permitan el acceso al historial de envíos realizados o recibidos por el investigado, siempre que dicha información se oriente a la contribución de la información y resulte relevante para la investigación.", "Finalmente, la ley establece un límite temporal para esta medida, al disponer que las actuaciones autorizadas en desarrollo de esta facultad no podrán extenderse por un período superior a 1 año. Este límite constituye una medida garantista de cara a posibles restricciones indefinidas en torno al derecho a la intimidad, exigiendo que la medida se mantenga únicamente durante el tiempo estrictamente necesario para cumplir los fines de la investigación penal.", "Asimismo, en garantía del debido proceso, dentro de las veinticuatro (24) horas siguientes a la culminación de la diligencia de retención, el fiscal debe comparecer ante el JCG para realizar la audiencia de revisión de legalidad posterior sobre todo lo actuado (artículo 237 del CPP)."], "parrafo": [0, 1, 2, 3, 4, 5, 6, 7, 8], "vineta": [4, 5, 6], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mapa", "items": [{"label": "Concepto y justificación constitucional de la medida", "segs": [0], "obj": "lupa", "centro": true}, {"label": "Marco normativo", "segs": [1, 2], "obj": "casa"}, {"label": "Modalidades de recaudo y acceso a información", "segs": [3, 4, 5, 6], "obj": "puertaCerrada"}, {"label": "Términos procesales", "segs": [7, 8], "obj": "reloj"}]}], "rotulo": null, "seccion": "2.5. Retención de correspondencia", "grupo": null, "titulos_fuente": ["2.5. Retención de correspondencia"], "encabezados": [], "mediacion": "Mapa conceptual: el primer contenido en el centro y las ramas se exploran una a una.", "rotulos": ["Concepto y justificación constitucional de la medida", "Marco normativo", "Modalidades de recaudo y acceso a información", "Términos procesales"], "titulo_genially": "Retención de correspondencia"}, {"layout": "fichas", "segmentos": ["La vigilancia y el seguimiento de personas constituyen una técnica de investigación que permite a la Policía Judicial observar de manera pasiva los desplazamientos, actividades y relaciones del indiciado o imputado, con el propósito de obtener información útil con respecto a la investigación. En principio, este seguimiento pasivo busca fortalecer la actividad investigativa sin mediar algún tipo de interferencia directa sobre la conducta de la persona vigilada.", "De acuerdo con el artículo 239 del CPP, cuando el fiscal cuente con motivos razonablemente fundados para inferir que el seguimiento del indiciado o imputado puede conducir a la obtención de información relevante para la investigación, podrá ordenar a la Policía Judicial que adelante una vigilancia pasiva durante un tiempo determinado. Durante la ejecución del seguimiento pasivo, la Policía Judicial podrá emplear los medios técnicos que resulten adecuados para documentar la actividad investigativa (fotografías o videos) u otros procedimientos similares (sin ser posible su extensión, de acuerdo con el parágrafo único de la norma) que permitan esclarecer cualquier circunstancia relevante para la investigación: identificar o individualizar a los autores o partícipes de la conducta punible, establecer las personas con quienes se relacionan, los lugares que frecuentan, entre otras.", "La orden de vigilancia, en concreto, tendrá una vigencia máxima de 1 año, y en caso de que no se obtenga información útil para la investigación, durante este periodo de tiempo, la orden de vigilancia deberá cancelarse. No obstante, ello de ninguna manera excluye la posibilidad de que el fiscal expida con posterioridad una nueva orden, siempre y cuando surjan nuevos motivos razonablemente fundados que justifiquen esta práctica.", "Sin embargo, el desarrollo de estas actividades debe respetar en todo momento la expectativa razonable de intimidad del indiciado o imputado y de los terceros que puedan verse involucrados. Para cumplir con estos fines, la orden expedida por el fiscal deberá someterse al control de legalidad formal y material del JCG dentro de las treinta y seis (36) horas siguientes a su expedición. De igual manera, una vez vencido el término de la orden de vigilancia u obtenida la información útil para la investigación, el fiscal comparecerá ante el JCG, para que realice la audiencia de revisión de legalidad sobre lo actuado.", "Finalmente, la ley prohíbe expresamente que la autoridad encargada de recaudar la información altere alguno de los medios técnicos descritos, ni tampoco haga interpretaciones de los mismos. Su función se limita a documentar objetivamente los hechos observados y preservar la autenticidad de los medios técnicos empleados, garantizando que la información pueda ser posteriormente valorada."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Concepto y finalidad de la medida", "segs": [0], "obj": "camara"}, {"label": "Presupuesto de procedencia", "segs": [1], "obj": "lupa"}, {"label": "Vigencia de la actividad", "segs": [2], "obj": "reloj"}, {"label": "Garantías constitucionales y control judicial", "segs": [3], "obj": "escudo"}, {"label": "Prohibición frente al recaudo", "segs": [4], "obj": "carpetas"}]}], "rotulo": null, "seccion": "2.6. Vigilancia y seguimiento", "grupo": null, "titulos_fuente": ["2.6. Vigilancia y seguimiento"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Concepto y finalidad de la medida", "Presupuesto de procedencia", "Vigencia de la actividad", "Garantías constitucionales y control judicial", "Prohibición frente al recaudo"], "titulo_genially": "Vigilancia y seguimiento"}, {"layout": "giro", "segmentos": ["En el marco de la Sentencia C-881/14, la Corte Constitucional (2014), estudió una demanda de inconstitucionalidad parcial del artículo 54 de la Ley 1453 de 2011, el cual contempló la posibilidad de que la Fiscalía ordene la vigilancia de una persona con fundamento en “motivos razonablemente fundados”. En el sentir del accionante, dicha posibilidad desconoce el derecho a la intimidad, pues permite que el fiscal vulnere este derecho de manera grave con base en indicios que señalan la mera posibilidad de que una persona haya incurrido o esté incurriendo en una conducta punible.", "La alta corporación explicó que la técnica de Vigilancia y seguimiento de personas constituye una herramienta fundamental para la investigación en el proceso penal colombiano, fundada en una finalidad legítima como es la persecución y sanción de las conductas que atentan contra los bienes jurídicos tutelados, a través de la obtención de información útil. Así pues, declaró la exequibilidad de la disposición, por considerar proporcional la medida de vigilancia y seguimiento.", "La Corte Constitucional (2014) expuso, en este contexto, cuatro argumentos claves. Primero, resulta idónea para alcanzar el fin de recaudar información sobre la comisión de la conducta punible. Segundo, constituye un medio mucho menos restrictivo para la obtención de pruebas que otros como el allanamiento, el registro y la interceptación de comunicaciones. Tercero, es proporcional en sentido estricto, pues no solamente no afecta el núcleo esencial del derecho a la intimidad, sino que también está sujeta a una serie de controles y restricciones, como lo es el deber de motivación, fundada en medios cognoscitivos; la limitación en el tiempo el control judicial posterior de legalidad formal y material. Cuarto, la expectativa razonable de la intimidad del indiciado o imputado o de terceros adiciona una limitación muy importante a las medidas realizadas en virtud de la vigilancia y el seguimiento que es coherente con la razonabilidad de toda restricción al derecho a la intimidad.", "Como parte de la Sentencia de Segunda Instancia No. 35186 (Corte Suprema de Justicia, 2011), la Corte Suprema de Justicia estudió la procedencia de una solicitud formulada por la defensa, con el objetivo de excluir pruebas recaudadas en actos de Vigilancia y seguimiento de personas, practicados por fuera del horario enunciado en el numeral primero del artículo 225 del CPP. Empero, la alta corte rechazó el cargo del apelante, aclarando que el límite horológico de 6:00 a.m. a 6:00 p.m. —propio de los registros y allanamientos— no aplica a las técnicas de vigilancia y seguimiento, ni a las actuaciones de agentes encubiertos, por no haber remisión expresa sobre este aspecto."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Sentencia C-881/14", "segs": [0], "obj": "camara"}, {"label": "técnica de Vigilancia y seguimiento", "segs": [1], "obj": "lupa"}, {"label": "cuatro argumentos claves", "segs": [2], "obj": "telefono"}, {"label": "artículo 225 del CPP", "segs": [3], "obj": "libros"}]}], "rotulo": null, "seccion": "2.6. Vigilancia y seguimiento", "grupo": "Jurisprudencia", "titulos_fuente": ["2.6. Vigilancia y seguimiento", "Jurisprudencia"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Sentencia C-881/14", "técnica de Vigilancia y seguimiento", "cuatro argumentos claves", "artículo 225 del CPP"], "titulo_genially": "Jurisprudencia"}, {"layout": "mapa", "segmentos": ["Según el artículo 240 del CPP, la vigilancia de cosas es una técnica de investigación que permite a la Policía Judicial observar de manera continua determinados bienes, siempre que existan motivos razonablemente fundados para considerar que estos mismos están siendo utilizados para la comisión de actividades delictivas o para ocultar objetos relacionados con ellas. Al igual que cualquier técnica, su finalidad se limita al recaudo de elementos materiales probatorios y evidencia física.", "En particular, esta aplica sobre inmuebles, naves, aeronaves, vehículos o cualquier otro bien mueble que esté siendo utilizado para almacenar sustancias estupefacientes, elementos destinados a su procesamiento, explosivos, armas, municiones, sustancias para fabricar explosivos o, en general, instrumentos empleados para la comisión de un delito o bienes provenientes de su ejecución. Así pues, la respectiva orden de vigilancia podrá mantenerse por un término máximo de 1 año. Si durante ese período no se obtiene información útil, la medida deberá cancelarse, sin que ello sea un impedimento para que el fiscal expida una nueva orden cuando surjan posteriormente nuevos motivos razonablemente fundados que justifiquen su práctica.", "Durante la ejecución de la diligencia, la Policía Judicial podrá utilizar cualquier medio técnicamente idóneo para desarrollar la vigilancia, siempre que su utilización no afecte la expectativa razonable de intimidad del indiciado, del imputado o de terceros. Esta limitación constituye una garantía frente a injerencias desproporcionadas en la esfera privada de las personas y exige que, con este motivo, las actividades de observación se ajusten a las previsiones del artículo 239 de la Ley 906 de 2004.", "Finalmente, la orden expedida por el fiscal deberá someterse al control de legalidad del JCG dentro de las treinta y seis (36) horas siguientes a su expedición, con el fin de verificar que la medida cumpla los requisitos formales y materiales exigidos por la normatividad procesal."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mapa", "items": [{"label": "Concepto y finalidad de la medida", "segs": [0], "obj": "camara", "centro": true}, {"label": "Delimitación temporal y espacial", "segs": [1], "obj": "casa"}, {"label": "Expectativa razonable de intimidad", "segs": [2], "obj": "escudo"}, {"label": "Control judicial de legalidad", "segs": [3], "obj": "reloj"}]}], "rotulo": null, "seccion": "2.7. Vigilancia de cosas", "grupo": null, "titulos_fuente": ["2.7. Vigilancia de cosas"], "encabezados": [], "mediacion": "Mapa conceptual: el primer contenido en el centro y las ramas se exploran una a una.", "rotulos": ["Concepto y finalidad de la medida", "Delimitación temporal y espacial", "Expectativa razonable de intimidad", "Control judicial de legalidad"], "titulo_genially": "Vigilancia de cosas"}, {"layout": "linea", "segmentos": ["La Sentencia C-881/14 de la Corte Constitucional (2014), anteriormente referida, que declaró exequible el artículo 54 de la Ley 1453 de 2011, relativo a la Vigilancia y seguimiento de personas; se refirió de manera sucinta a la Vigilancia de cosas. A este respecto, consideró que el artículo 240 permitía la práctica de la Vigilancia de cosas, empleando cualquier medio idóneo, siempre y cuando no se afecte la expectativa razonable de intimidad del indiciado, del imputado o de terceros, al igual que ocurre con aquella otra medida.", "El mismo precedente indica que el derecho a la intimidad hace parte de la esfera o espacio de vida privada no susceptible de la interferencia arbitraria por parte de las demás personas. En esa medida, el núcleo esencial del derecho a la intimidad supone la existencia y goce de una órbita reservada para cada persona, exenta del poder de intervención del Estado o de las intromisiones arbitrarias de la sociedad, que le permita a dicho individuo el pleno desarrollo de su vida personal, espiritual y cultural.", "Dependiendo del grado de cesión que, sobre su interioridad, realiza el individuo hacia el conocimiento público, se dispone de estadíos de intimidad: (i) intimidad personal, que obedece a la salvaguarda del derecho a ser dejado sólo y de poder guardar silencio; (ii) el secreto y la privacidad en el núcleo familiar; (iii) las relaciones del individuo en un entorno social determinado, como lo son las sujeciones propias de los vínculos labores o públicos y; (iv) la intimidad gremial, que se relaciona estrechamente con las libertades económicas e involucra la posibilidad de reserva frente a la explotación de cierta información.", "La Cort
